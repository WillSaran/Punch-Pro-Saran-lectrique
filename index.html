<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PunchPro — Saran Électrique</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#0f1117; --bg2:#171b26; --bg3:#1e2336;
  --border:rgba(255,255,255,0.08); --border2:rgba(255,255,255,0.15);
  --text:#f0f2f8; --muted:#8892aa;
  --accent:#4f8ef7; --accent2:#7c5cfc;
  --success:#3ecf8e; --warning:#f5a623; --danger:#e5484d;
  --font-head:'Syne',sans-serif; --font-body:'DM Sans',sans-serif;
  --r:12px; --r-sm:8px;
}
body { background:var(--bg); color:var(--text); font-family:var(--font-body); font-size:15px; line-height:1.6; min-height:100vh; }
#root { min-height:100vh; }

/* OVERLAY / MODAL */
.overlay { position:fixed; inset:0; background:rgba(0,0,0,0.88); display:flex; align-items:center; justify-content:center; z-index:1000; padding:1rem; }
.modal { background:var(--bg2); border:1px solid var(--border2); border-radius:20px; padding:2.5rem; max-width:540px; width:100%; }
.modal h1 { font-family:var(--font-head); font-size:2rem; font-weight:800; margin-bottom:0.5rem; background:linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.modal p { color:var(--muted); margin-bottom:2rem; font-size:14px; }
.fg { margin-bottom:1.25rem; }
.fg label { display:block; font-size:12px; font-weight:500; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:0.4rem; }
.fg input { width:100%; background:var(--bg3); border:1px solid var(--border); border-radius:var(--r-sm); padding:0.75rem 1rem; color:var(--text); font-family:var(--font-body); font-size:14px; outline:none; transition:border-color 0.2s; }
.fg input:focus { border-color:var(--accent); }
.fg small { display:block; margin-top:0.4rem; font-size:12px; color:var(--muted); }
.btn-p { width:100%; background:linear-gradient(135deg,var(--accent),var(--accent2)); border:none; border-radius:var(--r-sm); padding:0.85rem; color:#fff; font-family:var(--font-head); font-size:15px; font-weight:700; cursor:pointer; transition:opacity 0.2s; margin-top:0.5rem; }
.btn-p:hover { opacity:0.9; } .btn-p:disabled { opacity:0.5; cursor:not-allowed; }
.btn-s { background:transparent; border:1px solid var(--border2); border-radius:var(--r-sm); padding:0.7rem 1.25rem; color:var(--text); font-family:var(--font-body); font-size:14px; cursor:pointer; transition:background 0.2s; }
.btn-s:hover { background:var(--bg3); }

/* TOPBAR */
.app-wrap { min-height:100vh; display:flex; flex-direction:column; }
.topbar { background:var(--bg2); border-bottom:1px solid var(--border); padding:0.75rem 1.5rem; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; }
.logo { font-family:var(--font-head); font-size:1.2rem; font-weight:800; background:linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.topbar-right { display:flex; align-items:center; gap:0.6rem; flex-wrap:wrap; }
.view-toggle { display:flex; background:var(--bg3); border-radius:var(--r-sm); padding:3px; border:1px solid var(--border); }
.view-btn { padding:0.35rem 0.9rem; border-radius:6px; font-size:13px; font-weight:500; cursor:pointer; border:none; background:transparent; color:var(--muted); transition:all 0.2s; }
.view-btn.active { background:var(--accent); color:#fff; }
.view-btn.boss-btn { color:var(--warning); }
.view-btn.boss-btn.active { background:linear-gradient(135deg,var(--warning),#e8890a); color:#000; }
.status-dot { width:8px; height:8px; border-radius:50%; background:var(--success); box-shadow:0 0 6px var(--success); flex-shrink:0; }

/* SETTINGS */
.settings-wrap { position:relative; }
.settings-btn { background:var(--bg3); border:1px solid var(--border); border-radius:var(--r-sm); padding:0.4rem 0.8rem; color:var(--muted); cursor:pointer; font-size:15px; transition:all 0.2s; }
.settings-btn:hover { border-color:var(--border2); color:var(--text); }
.settings-menu { position:absolute; top:calc(100% + 8px); right:0; background:var(--bg2); border:1px solid var(--border2); border-radius:var(--r); padding:0.5rem; min-width:250px; box-shadow:0 8px 32px rgba(0,0,0,0.6); z-index:200; }
.si { display:flex; align-items:center; gap:0.75rem; padding:0.6rem 0.75rem; border-radius:var(--r-sm); cursor:pointer; font-size:13px; color:var(--text); transition:background 0.15s; white-space:nowrap; border:none; background:transparent; width:100%; text-align:left; }
.si:hover { background:var(--bg3); }
.si.danger:hover { background:rgba(229,72,77,0.1); color:var(--danger); }
.si .ico { font-size:15px; width:20px; text-align:center; }
.sdiv { height:1px; background:var(--border); margin:0.4rem 0; }
.ssec { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.07em; padding:0.4rem 0.75rem 0.2rem; }
.account-chip { background:var(--bg3); border:1px solid var(--border); border-radius:8px; padding:0.6rem 0.75rem; margin:0.4rem 0; }
.account-chip .email { font-size:12px; color:var(--text); font-weight:500; }
.account-chip .role { font-size:11px; color:var(--muted); margin-top:2px; }

/* CONTENT */
.content { flex:1; padding:1.5rem; max-width:1100px; margin:0 auto; width:100%; }
.card { background:var(--bg2); border:1px solid var(--border); border-radius:var(--r); padding:1.5rem; }
.card h2 { font-family:var(--font-head); font-size:1.1rem; font-weight:700; margin-bottom:1rem; }
.card h3 { font-family:var(--font-head); font-size:0.85rem; font-weight:600; text-transform:uppercase; letter-spacing:0.07em; color:var(--muted); margin-bottom:1rem; }

/* WELCOME SCREEN */
.welcome { min-height:calc(100vh - 60px); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:2rem; text-align:center; }
.welcome-logo { font-size:4rem; margin-bottom:1rem; }
.welcome-title { font-family:var(--font-head); font-size:2.5rem; font-weight:800; margin-bottom:0.25rem; background:linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.welcome-sub { font-size:1rem; color:var(--muted); margin-bottom:3rem; }
.welcome-time { font-family:var(--font-head); font-size:3.5rem; font-weight:800; letter-spacing:-2px; color:var(--text); margin-bottom:0.25rem; }
.welcome-date { font-size:14px; color:var(--muted); margin-bottom:2.5rem; }
.emp-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:0.75rem; max-width:700px; width:100%; margin-bottom:1rem; }
.emp-card { background:var(--bg2); border:1px solid var(--border); border-radius:var(--r); padding:1.25rem 0.75rem; cursor:pointer; transition:all 0.2s; text-align:center; }
.emp-card:hover { border-color:var(--border2); transform:translateY(-2px); box-shadow:0 4px 16px rgba(0,0,0,0.3); }
.emp-card.selected { border-width:2px; transform:translateY(-2px); }
.emp-card .av { width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16px; color:#fff; margin:0 auto 0.6rem; }
.emp-card .ename { font-size:13px; font-weight:600; }
.emp-card .estatus { font-size:11px; color:var(--muted); margin-top:2px; }

/* PIN SECTION */
.pin-section { background:var(--bg2); border:1px solid var(--border2); border-radius:var(--r); padding:1.5rem; max-width:320px; width:100%; }
.pin-section h3 { font-family:var(--font-head); font-size:1rem; font-weight:700; text-align:center; margin-bottom:1.25rem; }
.pin-display { background:var(--bg3); border:1px solid var(--border2); border-radius:var(--r-sm); padding:0.85rem 1.5rem; text-align:center; font-family:var(--font-head); font-size:2rem; letter-spacing:0.5rem; margin-bottom:1.25rem; min-height:60px; display:flex; align-items:center; justify-content:center; color:var(--accent); }
.pin-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:0.5rem; }
.pin-key { background:var(--bg3); border:1px solid var(--border); border-radius:var(--r-sm); padding:0.9rem; font-family:var(--font-head); font-size:1.2rem; font-weight:700; color:var(--text); cursor:pointer; text-align:center; transition:all 0.15s; user-select:none; }
.pin-key:hover { background:var(--bg); border-color:var(--accent); color:var(--accent); }
.pin-key:active { transform:scale(0.95); }
.pin-key.del { color:var(--danger); } .pin-key.zero { grid-column:2; }
.pin-back { background:none; border:none; color:var(--muted); font-size:13px; cursor:pointer; margin-top:0.75rem; text-align:center; width:100%; text-decoration:underline; }
.pin-back:hover { color:var(--text); }

/* PUNCH RESULT */
.punch-result { padding:1.5rem; border-radius:var(--r); text-align:center; max-width:320px; width:100%; animation:popIn 0.3s ease; }
.punch-result.ok { background:rgba(62,207,142,0.08); border:2px solid rgba(62,207,142,0.4); }
.punch-result.err { background:rgba(229,72,77,0.08); border:2px solid rgba(229,72,77,0.3); }
@keyframes popIn { from{transform:scale(0.9);opacity:0} to{transform:scale(1);opacity:1} }
.pbadge { display:inline-block; padding:0.35rem 1rem; border-radius:20px; font-size:13px; font-weight:700; margin:0.5rem 0; }
.pbadge.in { background:rgba(62,207,142,0.2); color:var(--success); }
.pbadge.out { background:rgba(229,72,77,0.15); color:var(--danger); }
.punch-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:0.5rem; margin-top:1rem; }
.ps-box { background:var(--bg3); border-radius:var(--r-sm); padding:0.6rem; text-align:center; }
.ps-box .v { font-family:var(--font-head); font-size:1.1rem; font-weight:800; color:var(--accent); }
.ps-box .l { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; }

/* EMP AVATAR (small) */
.emp-av { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; color:#fff; flex-shrink:0; }

/* JOBS */
.job-item { padding:0.75rem; background:var(--bg3); border-radius:var(--r-sm); margin-bottom:0.5rem; border-left:3px solid var(--accent); }
.assignees { display:flex; gap:4px; flex-wrap:wrap; margin-top:6px; }
.achip { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:600; }

/* STATUS GRID */
.status-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:0.75rem; }
.semp { background:var(--bg3); border:1px solid var(--border); border-radius:var(--r-sm); padding:0.75rem; display:flex; align-items:center; gap:0.6rem; }

/* STATS */
.stats-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:0.75rem; }
.stat-box { background:var(--bg3); border-radius:var(--r-sm); padding:1rem; text-align:center; }
.stat-box .val { font-family:var(--font-head); font-size:1.6rem; font-weight:800; color:var(--accent); }
.stat-box .lbl { font-size:11px; color:var(--muted); margin-top:2px; text-transform:uppercase; letter-spacing:0.06em; }

/* TABLE */
.htable { width:100%; border-collapse:collapse; font-size:13px; }
.htable th { text-align:left; padding:0.5rem 0.75rem; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:0.07em; border-bottom:1px solid var(--border); }
.htable td { padding:0.6rem 0.75rem; border-bottom:1px solid var(--border); vertical-align:middle; }
.htable tr:last-child td { border-bottom:none; }
.badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:600; }
.badge-in { background:rgba(62,207,142,0.15); color:var(--success); }
.badge-out { background:rgba(229,72,77,0.12); color:var(--danger); }
.badge-pend { background:rgba(245,166,35,0.15); color:var(--warning); }

/* TABS */
.tabs { display:flex; gap:0.25rem; margin-bottom:1.25rem; background:var(--bg3); border-radius:var(--r-sm); padding:4px; border:1px solid var(--border); width:fit-content; flex-wrap:wrap; }
.tab { padding:0.4rem 1rem; border-radius:6px; font-size:13px; font-weight:500; cursor:pointer; border:none; background:transparent; color:var(--muted); transition:all 0.2s; }
.tab.active { background:var(--accent); color:#fff; }

/* BANK */
.bank-row { display:flex; align-items:center; justify-content:space-between; padding:0.75rem; background:var(--bg3); border-radius:var(--r-sm); margin-bottom:0.5rem; border:1px solid var(--border); gap:0.5rem; flex-wrap:wrap; }
.btn-sm { padding:0.3rem 0.75rem; border-radius:6px; font-size:12px; font-weight:600; cursor:pointer; border:none; transition:opacity 0.2s; }
.btn-sm:hover { opacity:0.8; }
.btn-approve { background:rgba(62,207,142,0.2); color:var(--success); }
.btn-deny { background:rgba(229,72,77,0.15); color:var(--danger); }

/* BOSS GRID */
.boss-grid { display:grid; grid-template-columns:1fr 1fr; gap:1.5rem; }
@media(max-width:800px) { .boss-grid { grid-template-columns:1fr; } }
.full-w { grid-column:1/-1; }

/* EMP MGMT */
.emp-row { display:flex; align-items:center; padding:0.7rem 0.75rem; background:var(--bg3); border-radius:var(--r-sm); margin-bottom:0.4rem; gap:0.5rem; }
.btn-icon { background:transparent; border:1px solid var(--border); border-radius:6px; padding:4px 8px; color:var(--muted); cursor:pointer; font-size:12px; transition:all 0.2s; margin-left:auto; }
.btn-icon:hover { border-color:var(--danger); color:var(--danger); }
.add-form { background:var(--bg3); border-radius:var(--r-sm); padding:1rem; margin-top:0.75rem; border:1px solid var(--border2); }
.add-row { display:grid; grid-template-columns:2fr 1fr 1fr; gap:0.5rem; margin-bottom:0.75rem; }
.add-form input { width:100%; background:var(--bg2); border:1px solid var(--border); border-radius:6px; padding:0.5rem 0.75rem; color:var(--text); font-family:var(--font-body); font-size:13px; outline:none; }
.add-form input:focus { border-color:var(--accent); }
.fl { display:block; font-size:11px; color:var(--muted); margin-bottom:3px; }
.color-row { display:flex; gap:6px; flex-wrap:wrap; margin-top:4px; }
.cswatch { width:22px; height:22px; border-radius:50%; cursor:pointer; border:2px solid transparent; transition:transform 0.15s; }
.cswatch:hover { transform:scale(1.2); }

/* WEEK BAR */
.wbar-wrap { margin-bottom:1rem; }
.wbar-label { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-bottom:4px; align-items:center; }
.wbar { height:6px; background:var(--bg3); border-radius:3px; overflow:hidden; }
.wbar-fill { height:100%; border-radius:3px; transition:width 0.5s ease; }
.wbar-fill.ot { background:linear-gradient(90deg,var(--warning),var(--danger)) !important; }

/* NOTIF */
.notif { position:fixed; top:1rem; right:1rem; background:var(--bg2); border:1px solid var(--border2); border-radius:var(--r-sm); padding:0.75rem 1.25rem; font-size:14px; z-index:999; max-width:320px; box-shadow:0 4px 20px rgba(0,0,0,0.5); animation:slideIn 0.3s ease; cursor:pointer; }
.notif.success { border-color:rgba(62,207,142,0.4); }
.notif.warn { border-color:rgba(245,166,35,0.4); }
.notif.err { border-color:rgba(229,72,77,0.4); }
@keyframes slideIn { from{transform:translateX(20px);opacity:0} to{transform:translateX(0);opacity:1} }

/* SCROLL */
.scroll-area { max-height:280px; overflow-y:auto; }
.scroll-area::-webkit-scrollbar { width:4px; }
.scroll-area::-webkit-scrollbar-thumb { background:var(--border2); border-radius:2px; }

/* BOSS ACCESS GATE */
.boss-gate { text-align:center; padding:4rem 2rem; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const BOSS_EMAIL = 'info@saranelectrique.com';
const EMP_COLORS = ['#4f8ef7','#7c5cfc','#3ecf8e','#f5a623','#e5484d','#06b6d4','#f43f5e','#a855f7','#22c55e','#fb923c'];
const SCOPES = 'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/calendar.readonly https://www.googleapis.com/auth/userinfo.email';
const DISCOVERY = ['https://sheets.googleapis.com/$discovery/rest?version=v4','https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest'];
let tokenClient = null;

function loadScript(src) {
  return new Promise(res=>{ const s=document.createElement('script'); s.src=src; s.onload=res; document.head.appendChild(s); });
}
async function initLibs(cfg, onToken) {
  await loadScript('https://apis.google.com/js/api.js');
  await new Promise(res=>gapi.load('client',res));
  await gapi.client.init({ apiKey:cfg.apiKey, discoveryDocs:DISCOVERY });
  await loadScript('https://accounts.google.com/gsi/client');
  tokenClient = google.accounts.oauth2.initTokenClient({ client_id:cfg.clientId, scope:SCOPES, callback:onToken });
}
async function getUserEmail() {
  try { const r=await gapi.client.request({ path:'https://www.googleapis.com/oauth2/v2/userinfo' }); return r.result.email||''; } catch { return ''; }
}

// ── SHEETS ────────────────────────────────────────────────────────────────────
async function ensureStructure(sid) {
  try {
    const res=await gapi.client.sheets.spreadsheets.get({ spreadsheetId:sid });
    const ex=res.result.sheets.map(s=>s.properties.title);
    const needed=['Employés','Pointages','HeuresEnBanque'];
    const reqs=needed.filter(n=>!ex.includes(n)).map(n=>({ addSheet:{ properties:{ title:n } } }));
    if(reqs.length) await gapi.client.sheets.spreadsheets.batchUpdate({ spreadsheetId:sid, resource:{ requests:reqs } });
    const headers={
      'Employés':[['Nom','PIN','Statut','HeuresBanque','Couleur','Code']],
      'Pointages':[['Employé','Type','DateTime','DateStr','HeureStr','Semaine','Mois']],
      'HeuresEnBanque':[['Employé','Semaine','HeuresSupp','Statut','DateDemande']]
    };
    for(const [sheet,h] of Object.entries(headers)){
      const chk=await gapi.client.sheets.spreadsheets.values.get({ spreadsheetId:sid, range:`${sheet}!A1` });
      if(!chk.result.values) await gapi.client.sheets.spreadsheets.values.update({ spreadsheetId:sid, range:`${sheet}!A1`, valueInputOption:'RAW', resource:{ values:h } });
    }
  } catch(e){ console.error(e); }
}
async function getEmployees(sid) {
  try {
    const res=await gapi.client.sheets.spreadsheets.values.get({ spreadsheetId:sid, range:'Employés!A2:F' });
    return (res.result.values||[]).map((r,i)=>({ nom:r[0]||'', pin:r[1]||'', statut:r[2]||'out', heuresBanque:parseFloat(r[3])||0, couleur:r[4]||EMP_COLORS[i%EMP_COLORS.length], code:r[5]||(r[0]||'??').substring(0,2).toUpperCase(), row:i+2 }));
  } catch { return []; }
}
async function saveEmployee(sid,emp) {
  await gapi.client.sheets.spreadsheets.values.append({ spreadsheetId:sid, range:'Employés!A:F', valueInputOption:'RAW', resource:{ values:[[emp.nom,emp.pin,'out',0,emp.couleur,emp.code]] } });
}
async function deleteEmployee(sid,row) {
  const r=await gapi.client.sheets.spreadsheets.get({ spreadsheetId:sid });
  const sh=r.result.sheets.find(s=>s.properties.title==='Employés');
  await gapi.client.sheets.spreadsheets.batchUpdate({ spreadsheetId:sid, resource:{ requests:[{ deleteDimension:{ range:{ sheetId:sh?sh.properties.sheetId:0, dimension:'ROWS', startIndex:row-1, endIndex:row } } }] } });
}
async function updateStatus(sid,row,statut) {
  await gapi.client.sheets.spreadsheets.values.update({ spreadsheetId:sid, range:`Employés!C${row}`, valueInputOption:'RAW', resource:{ values:[[statut]] } });
}
async function addPointage(sid,emp,type) {
  const now=new Date();
  await gapi.client.sheets.spreadsheets.values.append({ spreadsheetId:sid, range:'Pointages!A:G', valueInputOption:'RAW', resource:{ values:[[emp.nom,type,now.toISOString(),now.toLocaleDateString('fr-CA'),now.toLocaleTimeString('fr-CA',{hour:'2-digit',minute:'2-digit'}),getWeek(now),`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`]] } });
}
async function getPointages(sid,filter={}) {
  try {
    const res=await gapi.client.sheets.spreadsheets.values.get({ spreadsheetId:sid, range:'Pointages!A2:G' });
    let rows=(res.result.values||[]).map(r=>({ nom:r[0],type:r[1],datetime:r[2],date:r[3],heure:r[4],semaine:r[5],mois:r[6] }));
    if(filter.nom) rows=rows.filter(r=>r.nom===filter.nom);
    if(filter.semaine) rows=rows.filter(r=>r.semaine===filter.semaine);
    if(filter.mois) rows=rows.filter(r=>r.mois===filter.mois);
    if(filter.date) rows=rows.filter(r=>r.date===filter.date);
    return rows;
  } catch { return []; }
}
async function getHeuresBanque(sid) {
  try {
    const res=await gapi.client.sheets.spreadsheets.values.get({ spreadsheetId:sid, range:'HeuresEnBanque!A2:E' });
    return (res.result.values||[]).map((r,i)=>({ nom:r[0],semaine:r[1],heures:parseFloat(r[2])||0,statut:r[3]||'pending',date:r[4],row:i+2 }));
  } catch { return []; }
}
async function addHeuresBanque(sid,nom,semaine,heures) {
  await gapi.client.sheets.spreadsheets.values.append({ spreadsheetId:sid, range:'HeuresEnBanque!A:E', valueInputOption:'RAW', resource:{ values:[[nom,semaine,heures,'pending',new Date().toLocaleDateString('fr-CA')]] } });
}
async function updateBanqueStatus(sid,row,statut) {
  await gapi.client.sheets.spreadsheets.values.update({ spreadsheetId:sid, range:`HeuresEnBanque!D${row}`, valueInputOption:'RAW', resource:{ values:[[statut]] } });
}
async function getCalendarJobs() {
  try {
    const now=new Date(), end=new Date(now); end.setDate(end.getDate()+7);
    const res=await gapi.client.calendar.events.list({ calendarId:'primary', timeMin:now.toISOString(), timeMax:end.toISOString(), singleEvents:true, orderBy:'startTime', maxResults:15 });
    return (res.result.items||[]).map(e=>({ id:e.id, title:e.summary||'Sans titre', start:e.start.dateTime||e.start.date, end:e.end.dateTime||e.end.date, location:e.location||'', description:e.description||'' }));
  } catch { return []; }
}

// ── UTILS ─────────────────────────────────────────────────────────────────────
function getWeek(d) {
  const date=new Date(d); date.setHours(0,0,0,0); date.setDate(date.getDate()+3-(date.getDay()+6)%7);
  const w1=new Date(date.getFullYear(),0,4);
  return `${date.getFullYear()}-S${String(1+Math.round(((date-w1)/86400000-3+(w1.getDay()+6)%7)/7)).padStart(2,'0')}`;
}
function calcH(pts) {
  let t=0,last=null;
  for(const p of pts){
    if(p.type==='in') last=new Date(p.datetime);
    else if(p.type==='out'&&last){ t+=(new Date(p.datetime)-last)/3600000; last=null; }
  }
  return Math.round(t*10)/10;
}
function rgba(hex,a=0.15) {
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
function useClock() {
  const [now,setNow]=useState(new Date());
  useEffect(()=>{ const t=setInterval(()=>setNow(new Date()),1000); return()=>clearInterval(t); },[]);
  return now;
}

// ── COMPONENTS ────────────────────────────────────────────────────────────────
function Notif({msg,type,onClose}) {
  useEffect(()=>{ const t=setTimeout(onClose,4500); return()=>clearTimeout(t); },[]);
  return <div className={`notif ${type}`} onClick={onClose}>{msg}</div>;
}

function PinPad({onSubmit,onCancel,empName,empCouleur,empCode}) {
  const [pin,setPin]=useState('');
  const handle=k=>{
    if(k==='←') setPin(p=>p.slice(0,-1));
    else if(k==='✓'){ if(pin.length>=4){onSubmit(pin);setPin('');} }
    else if(pin.length<6) setPin(p=>p+k);
  };
  const keys=['1','2','3','4','5','6','7','8','9','←','0','✓'];
  return (
    <div className="pin-section">
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:'1rem',justifyContent:'center'}}>
        <div className="emp-av" style={{background:empCouleur,width:40,height:40,fontSize:14}}>{empCode}</div>

      </div>
      <div className="pin-display">{pin?'●'.repeat(pin.length):<span style={{color:'var(--muted)',fontSize:'0.9rem'}}>Entrez votre PIN</span>}</div>
      <div className="pin-grid">
        {keys.map((k,i)=>(
          <div key={i} className={`pin-key${k==='←'?' del':''}${k==='0'?' zero':''}`}
            style={k==='✓'?{background:'linear-gradient(135deg,var(--accent),var(--accent2))',color:'#fff',border:'none'}:{}}
            onClick={()=>handle(k)}>{k}</div>
        ))}

      <button className="pin-back" onClick={onCancel}>← Changer d'employé</button>
    </div>
  );
}

// ── WELCOME / PUNCH SCREEN ────────────────────────────────────────────────────
function WelcomeScreen({emps, sid, notify, onRefresh}) {
  const now = useClock();
  const [selected, setSelected] = useState(null);
  const [result, setResult] = useState(null);
  const [empPts, setEmpPts] = useState([]);

  const pad=n=>String(n).padStart(2,'0');
  const days=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
  const months=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  const today=now.toLocaleDateString('fr-CA');
  const curWeek=getWeek(now);
  const curMois=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;

  async function handlePunch(pin) {
    const emp = emps.find(e=>e.nom===selected.nom);
    if(!emp||emp.pin!==pin) {
      setResult({err:true});
      setTimeout(()=>setResult(null),2500);
      return;
    }
    const type=emp.statut==='in'?'out':'in';
    await addPointage(sid,emp,type);
    await updateStatus(sid,emp.row,type);

    // Heures en banque
    const curW=getWeek(new Date());
    const semPts=await getPointages(sid,{nom:emp.nom,semaine:curW});
    const total=calcH(semPts);
    if(type==='out'&&total>40){
      const extra=Math.round((total-40)*10)/10;
      const bq=await getHeuresBanque(sid);
      if(!bq.some(b=>b.nom===emp.nom&&b.semaine===curW)){
        await addHeuresBanque(sid,emp.nom,curW,extra);
        notify(`🏦 ${emp.nom} — ${extra}h en banque! Demande envoyée au boss.`,'warn');
      }
    }

    const allPts=await getPointages(sid,{nom:emp.nom});
    setEmpPts(allPts);
    setResult({ok:true,nom:emp.nom,type,heure:now.toLocaleTimeString('fr-CA',{hour:'2-digit',minute:'2-digit'}),couleur:emp.couleur,code:emp.code,pts:allPts});
    setSelected(null);
    onRefresh();
    setTimeout(()=>{ setResult(null); setEmpPts([]); },6000);
  }

  if(result?.ok) {
    const pts=result.pts||[];
    return (
      <div className="welcome">
        <div className="punch-result ok" style={{maxWidth:360}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:12,marginBottom:8}}>
            <div className="emp-av" style={{background:result.couleur,width:48,height:48,fontSize:17}}>{result.code}</div>
            <div style={{fontFamily:'var(--font-head)',fontSize:'1.4rem',fontWeight:800}}>{result.nom}</div>
          </div>
          <span className={`pbadge ${result.type}`}>{result.type==='in'?'✅ Pointage IN':'🔴 Pointage OUT'}</span>
          <div style={{fontSize:1.1+'rem',fontFamily:'var(--font-head)',fontWeight:700,margin:'6px 0'}}>{result.heure}</div>
          <div className="punch-stats">
            <div className="ps-box"><div className="v">{calcH(pts.filter(p=>p.date===today))}h</div><div className="l">Auj.</div></div>
            <div className="ps-box"><div className="v">{calcH(pts.filter(p=>p.semaine===curWeek))}h</div><div className="l">Semaine</div></div>
            <div className="ps-box"><div className="v">{calcH(pts.filter(p=>p.mois===curMois))}h</div><div className="l">Mois</div></div>
          </div>
        </div>
      </div>
    );
  }

  if(result?.err) {
    return (
      <div className="welcome">
        <div className="punch-result err" style={{maxWidth:320}}>
          <div style={{fontSize:'2rem',marginBottom:8}}>❌</div>
          <div style={{fontFamily:'var(--font-head)',fontWeight:700}}>PIN incorrect</div>
          <div style={{fontSize:13,color:'var(--muted)',marginTop:4}}>Réessaie ou sélectionne ton nom</div>
          <button className="pin-back" style={{marginTop:12}} onClick={()=>setResult(null)}>← Retour</button>
        </div>
      </div>
    );
  }

  if(selected) {
    return (
      <div className="welcome">
        <div className="welcome-time">{pad(now.getHours())}:{pad(now.getMinutes())}</div>
        <div className="welcome-date">{days[now.getDay()]} {now.getDate()} {months[now.getMonth()]} {now.getFullYear()}</div>
        <PinPad onSubmit={handlePunch} onCancel={()=>setSelected(null)} empName={selected.nom} empCouleur={selected.couleur} empCode={selected.code}/>
      </div>
    );
  }

  return (
    <div className="welcome">
      <div className="welcome-time">{pad(now.getHours())}:{pad(now.getMinutes())}</div>
      <div className="welcome-date">{days[now.getDay()]} {now.getDate()} {months[now.getMonth()]} {now.getFullYear()}</div>
      {emps.length===0 ? (
        <div style={{color:'var(--muted)',textAlign:'center',maxWidth:400}}>
          <div style={{fontSize:'2rem',marginBottom:'1rem'}}>👷</div>
          <div style={{fontFamily:'var(--font-head)',fontSize:'1.1rem',fontWeight:700,marginBottom:'0.5rem'}}>Aucun employé configuré</div>
          <div style={{fontSize:14}}>Va dans la vue Boss pour ajouter des employés.</div>
        </div>
      ) : (
        <>
          <div style={{fontFamily:'var(--font-head)',fontSize:'1rem',color:'var(--muted)',marginBottom:'1.5rem',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.1em'}}>Sélectionne ton nom</div>
          <div className="emp-grid">
            {emps.map(emp=>(
              <div key={emp.nom} className={`emp-card${selected?.nom===emp.nom?' selected':''}`}
                style={selected?.nom===emp.nom?{borderColor:emp.couleur,boxShadow:`0 4px 20px ${rgba(emp.couleur,0.3)}`}:{}}
                onClick={()=>setSelected(emp)}>
                <div className="av" style={{background:emp.couleur}}>{emp.code}</div>
                <div className="ename">{emp.nom}</div>
                <div className="estatus" style={{color:emp.statut==='in'?emp.couleur:'var(--muted)'}}>
                  {emp.statut==='in'?'🟢 En cours':'⚪ Absent'}
                </div>
              </div>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

  useEffect(()=>{
    setLoading(true);

    await saveEmployee(sid,emp);
    notify(`✅ ${emp.nom} ajouté!`,'success');
    setNewEmp({nom:'',pin:'',code:'',couleur:EMP_COLORS[(emps.length+1)%EMP_COLORS.length]});
    setShowAdd(false);
    setEmps(await getEmployees(sid));

                <span className="fl">Couleur</span>
                <div className="color-row">
                  {EMP_COLORS.map(c=><div key={c} className="cswatch" style={{background:c,border:`2px solid ${newEmp.couleur===c?'#fff':'transparent'}`}} onClick={()=>setNewEmp(p=>({...p,couleur:c}))}/>)}
                </div>
              </div>
              <button className="btn-p" style={{marginTop:0}} onClick={handleAdd}>✓ Sauvegarder l'employé</button>
            </div>
          )}
          <div style={{marginTop:'1rem'}}>
            {emps.map(emp=>(
              <div key={emp.nom} className="emp-row">
                <div className="emp-av" style={{background:emp.couleur}}>{emp.code}</div>
                <div style={{flex:1,marginLeft:'0.75rem'}}>
                  <div style={{fontSize:13,fontWeight:500}}>{emp.nom}</div>
                  <div style={{fontSize:11,color:'var(--muted)',fontFamily:'monospace'}}>PIN: {emp.pin} · Code: {emp.code}</div>
                </div>
                <span className={`badge ${emp.statut==='in'?'badge-in':'badge-out'}`}>{emp.statut==='in'?'Présent':'Absent'}</span>
                <button className="btn-icon" onClick={()=>handleDel(emp)}>✕</button>
              </div>
            ))}
            {emps.length===0&&<div style={{color:'var(--muted)',textAlign:'center',padding:'1.5rem',fontSize:14}}>Aucun employé — clique "+ Ajouter" pour commencer</div>}
          </div>
        </div>
      )}

      {tab==='historique'&&(
        <div className="card">
          <div style={{display:'flex',gap:'1rem',alignItems:'center',flexWrap:'wrap',marginBottom:'1rem'}}>
            <select value={selEmp} onChange={e=>setSelEmp(e.target.value)} style={{background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:6,padding:'0.4rem 0.75rem',color:'var(--text)',fontSize:13}}>
              <option value="">Tous les employés</option>
              {emps.map(e=><option key={e.nom} value={e.nom}>{e.nom}</option>)}
            </select>
            <div className="tabs" style={{margin:0}}>
              {[['today',"Auj."],['semaine','Semaine'],['mois','Mois'],['all','Tout']].map(([k,l])=>(
                <div key={k} className={`tab${histTab===k?' active':''}`} onClick={()=>setHistTab(k)}>{l}</div>
              ))}
            </div>
          </div>
          <div className="scroll-area" style={{maxHeight:400}}>
            <table className="htable">
              <thead><tr><th>Employé</th><th>Type</th><th>Date</th><th>Heure</th><th>Semaine</th></tr></thead>
              <tbody>
                {getHist().map((p,i)=>{
                  const emp=eMap[p.nom];
                  return (
                    <tr key={i}>
                      <td><div style={{display:'flex',alignItems:'center',gap:8}}>{emp&&<div className="emp-av" style={{background:emp.couleur,width:24,height:24,fontSize:10}}>{emp.code}</div>}{p.nom}</div></td>
                      <td><span className={`badge ${p.type==='in'?'badge-in':'badge-out'}`}>{p.type==='in'?'Entrée':'Sortie'}</span></td>
                      <td>{p.date}</td><td>{p.heure}</td><td>{p.semaine}</td>
                    </tr>
                  );
                })}
                {getHist().length===0&&<tr><td colSpan={5} style={{textAlign:'center',color:'var(--muted)',padding:'1rem'}}>Aucun pointage pour cette période</td></tr>}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {tab==='banque'&&(
        <div>
          {pending.length>0&&(
            <div className="card" style={{marginBottom:'1rem',borderColor:'rgba(245,166,35,0.3)'}}>
              <h2>⚠️ Demandes en attente ({pending.length})</h2>
              {pending.map(b=>{
                const emp=eMap[b.nom];
                return (
                  <div key={b.row} className="bank-row">
                    <div style={{display:'flex',alignItems:'center',gap:10}}>
                      {emp&&<div className="emp-av" style={{background:emp.couleur}}>{emp.code}</div>}
                      <div><div style={{fontWeight:500}}>{b.nom}</div><div style={{fontSize:12,color:'var(--muted)'}}>Sem. {b.semaine} · {b.date}</div></div>
                    </div>
                    <div style={{fontFamily:'var(--font-head)',fontWeight:700,color:'var(--warning)',fontSize:'1.2rem'}}>+{b.heures}h</div>
                    <div style={{display:'flex',gap:6}}>
                      <button className="btn-sm btn-approve" onClick={()=>handleBanque(b,'approved')}>✓ Approuver</button>
                      <button className="btn-sm btn-deny" onClick={()=>handleBanque(b,'denied')}>✕ Refuser</button>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
          <div className="card">
            <h2>Historique complet</h2>
            <table className="htable">
              <thead><tr><th>Employé</th><th>Semaine</th><th>Heures</th><th>Statut</th><th>Date</th></tr></thead>
              <tbody>
                {banque.map((b,i)=>(
                  <tr key={i}>
                    <td>{b.nom}</td><td>{b.semaine}</td><td><strong>+{b.heures}h</strong></td>
                    <td><span className={`badge ${b.statut==='approved'?'badge-in':b.statut==='pending'?'badge-pend':'badge-out'}`}>{b.statut==='approved'?'Approuvé':b.statut==='pending'?'En attente':'Refusé'}</span></td>
                    <td>{b.date}</td>
                  </tr>
                ))}
                {banque.length===0&&<tr><td colSpan={5} style={{textAlign:'center',color:'var(--muted)',padding:'1rem'}}>Aucune heure en banque enregistrée</td></tr>}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {tab==='jobs'&&(
        <div className="card">
          <h2>Jobs — Google Agenda (7 prochains jours)</h2>
          <div style={{fontSize:12,color:'var(--muted)',marginBottom:'1rem'}}>Les employés sont détectés si leur nom ou code apparaît dans le titre ou la description de l'événement Google Agenda.</div>
          {jobs.length===0?<div style={{color:'var(--muted)',padding:'1rem 0'}}>Aucun événement cette semaine.</div>:
          jobs.map(j=>{
            const ass=getAssignees(j);
            return (
              <div key={j.id} className="job-item" style={{marginBottom:'0.75rem',borderLeftColor:ass[0]?.couleur||'var(--accent)'}}>
                <div style={{fontWeight:600,fontSize:15}}>{j.title}</div>
                <div style={{fontSize:12,color:'var(--muted)',marginTop:2}}>{new Date(j.start).toLocaleDateString('fr-CA',{weekday:'long',month:'short',day:'numeric'})} · {j.location||'Aucun lieu'}</div>
                {ass.length>0&&(
                  <div className="assignees" style={{marginTop:6}}>
                    {ass.map(a=><span key={a.nom} className="achip" style={{background:rgba(a.couleur,0.2),color:a.couleur}}><span style={{width:8,height:8,borderRadius:'50%',background:a.couleur,display:'inline-block'}}></span>{a.nom} ({a.code})</span>)}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ── MAIN APP ──────────────────────────────────────────────────────────────────
function App() {
  const [cfg,setCfg]=useState(()=>{ try{return JSON.parse(localStorage.getItem('pp_cfg')||'null');}catch{return null;} });
  const [showCfg,setShowCfg]=useState(!cfg);
  const [authed,setAuthed]=useState(false);
  const [userEmail,setUserEmail]=useState('');
  const [isBoss,setIsBoss]=useState(false);
  const [view,setView]=useState('employee');
  const [emps,setEmps]=useState([]);
  const [refreshKey,setRefreshKey]=useState(0);
  const [notif,setNotif]=useState(null);
  const [authLoading,setAuthLoading]=useState(false);
  const [libsReady,setLibsReady]=useState(false);

  function notify(msg,type='success'){ setNotif({msg,type,id:Date.now()}); }
  function onRefresh(){ setRefreshKey(k=>k+1); }

  async function onToken(resp) {
    if(resp.error){ setAuthLoading(false); notify('Erreur Google: '+resp.error,'err'); return; }
    const email=await getUserEmail();
    setUserEmail(email);
    const boss=email.toLowerCase()===BOSS_EMAIL.toLowerCase();
    setIsBoss(boss);
    setView('employee');
    await ensureStructure(cfg.spreadsheetId);
    setEmps(await getEmployees(cfg.spreadsheetId));
    setAuthed(true);
    setAuthLoading(false);
    notify(`✅ Connecté: ${email}${boss?' 👑 Boss':''}`,'success');
    onRefresh();
  }

  async function loadLibs(config) {
    try{ await initLibs(config,onToken); setLibsReady(true); }
    catch(e){ console.error(e); notify('Erreur chargement APIs Google','err'); }
  }

  useEffect(()=>{ if(cfg) loadLibs(cfg); },[cfg]);
  useEffect(()=>{ if(authed&&cfg) getEmployees(cfg.spreadsheetId).then(setEmps); },[refreshKey,authed]);

  function handleAuth(){
    if(!libsReady){ notify('APIs en cours de chargement, réessaie dans 2s...','warn'); return; }
    setAuthLoading(true);
    tokenClient.requestAccessToken({prompt:'select_account'});
  }
  function handleSaveCfg(config){
    localStorage.setItem('pp_cfg',JSON.stringify(config));
    setCfg(config); setShowCfg(false); setAuthed(false); setLibsReady(false); tokenClient=null;
    loadLibs(config);
  }
  function handleSwitch(){
    setAuthed(false); setUserEmail(''); setIsBoss(false); setAuthLoading(true);
    tokenClient.requestAccessToken({prompt:'select_account'});
  }
  function handleReset(){
    if(!confirm('Réinitialiser l\'app? Tes credentials seront effacés.')) return;
    localStorage.removeItem('pp_cfg');
    setCfg(null); setAuthed(false); setShowCfg(true); setLibsReady(false); tokenClient=null;
  }

  return (
    <div className="app-wrap">
      {showCfg&&<ConfigModal initial={cfg} onSave={handleSaveCfg}/>}
      {notif&&<Notif key={notif.id} msg={notif.msg} type={notif.type} onClose={()=>setNotif(null)}/>}

      <div className="topbar">
        <div className="logo">⚡ PunchPro</div>
        <div className="topbar-right">
          {authed?(
            <>
              <div className="status-dot"></div>
              <div className="view-toggle">
                <div className={`view-btn${view==='employee'?' active':''}`} onClick={()=>setView('employee')}>👷 Pointage</div>
                <div className={`view-btn boss-btn${view==='boss'?' active':''}`} onClick={()=>setView('boss')}>👑 Boss</div>
              </div>
              <button className="btn-s" style={{fontSize:12,padding:'0.35rem 0.6rem'}} onClick={onRefresh}>↻</button>
            </>
          ):(
            <button className="btn-p" style={{width:'auto',padding:'0.5rem 1.25rem',fontSize:13}} onClick={handleAuth} disabled={authLoading||!libsReady}>
              {authLoading?'⏳ Connexion...':'🔐 Connexion Google'}
            </button>
          )}
          <SettingsMenu userEmail={userEmail} isBoss={isBoss} onSwitch={handleSwitch} onEditCfg={()=>setShowCfg(true)} onReset={handleReset}/>
        </div>
      </div>

      <div className="content" style={{padding: view==='employee'&&authed?0:'1.5rem', maxWidth: view==='employee'&&authed?'100%':'1100px'}}>
        {!authed?(
          <div style={{textAlign:'center',padding:'4rem 2rem'}}>
            <div style={{fontSize:'3.5rem',marginBottom:'1rem'}}>⚡</div>
            <div style={{fontFamily:'var(--font-head)',fontSize:'2rem',fontWeight:800,marginBottom:'0.25rem'}}>PunchPro</div>
            <div style={{color:'var(--muted)',fontSize:'1rem',marginBottom:'2.5rem'}}>Saran Électrique</div>
            <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:12,padding:'1.5rem',maxWidth:420,margin:'0 auto 2rem',textAlign:'left'}}>
              <div style={{fontSize:13,color:'var(--muted)',marginBottom:'0.75rem',fontWeight:600}}>ACCÈS</div>
              <div style={{fontSize:14,marginBottom:'0.5rem'}}>👷 <strong>Employés</strong> — saranelectrique@gmail.com</div>
              <div style={{fontSize:14}}>👑 <strong>Boss (accès complet)</strong> — info@saranelectrique.com</div>
            </div>
            <button className="btn-p" style={{width:'auto',padding:'0.85rem 2.5rem',margin:'0 auto'}} onClick={handleAuth} disabled={authLoading||!libsReady}>
              {authLoading?'⏳ Connexion en cours...':'🔐 Se connecter avec Google'}
            </button>
            {!libsReady&&cfg&&<div style={{color:'var(--muted)',fontSize:12,marginTop:'1rem'}}>⏳ Chargement des APIs Google...</div>}
          </div>
        ):(
          <>
            {view==='employee'&&<WelcomeScreen emps={emps} sid={cfg.spreadsheetId} notify={notify} onRefresh={onRefresh}/>}
            {view==='boss'&&isBoss&&<div style={{padding:'1.5rem',maxWidth:1100,margin:'0 auto'}}><BossView sid={cfg.spreadsheetId} refreshKey={refreshKey} notify={notify}/></div>}
            {view==='boss'&&!isBoss&&(
              <div className="boss-gate">
                <div style={{fontSize:'3rem',marginBottom:'1rem'}}>🔒</div>
                <div style={{fontFamily:'var(--font-head)',fontSize:'1.3rem',fontWeight:700,marginBottom:'0.5rem'}}>Accès Boss requis</div>
                <div style={{color:'var(--muted)',marginBottom:'1.5rem'}}>Connecte-toi avec info@saranelectrique.com pour accéder au tableau de bord.</div>
                <button className="btn-p" style={{width:'auto',padding:'0.75rem 2rem',margin:'0 auto'}} onClick={handleSwitch}>🔄 Changer de compte</button>
              </div>
            )}
          </>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
