// ── ADDRESS INPUT with Google Places autocomplete ────────────────────────────
function AddressInput({value,onChange,placeholder,style}){
  const [suggestions,setSuggestions]=useState([]);
  const [showSugg,setShowSugg]=useState(false);
  const debounceRef=useRef(null);
  const wrapRef=useRef(null);
  const mouseDownRef=useRef(false);

  useEffect(()=>{
    const handler=e=>{if(wrapRef.current&&!wrapRef.current.contains(e.target))setShowSugg(false);};
    document.addEventListener('mousedown',handler);
    return()=>document.removeEventListener('mousedown',handler);
  },[]);

  function fetchSuggestions(text){
    if(!text||text.length<3){setSuggestions([]);setShowSugg(false);return;}
    if(window.google?.maps?.places){
      const service=new window.google.maps.places.AutocompleteService();
      service.getPlacePredictions(
        {input:text,componentRestrictions:{country:'ca'},types:['address']},
        (results,status)=>{
          if(status==='OK'&&results){setSuggestions(results.map(r=>r.description));setShowSugg(true);}
          else{setSuggestions([]);setShowSugg(false);}
        }
      );
    }
  }

  function handleChange(e){
    const v=e.target.value;onChange(v);
    clearTimeout(debounceRef.current);
    debounceRef.current=setTimeout(()=>fetchSuggestions(v),300);
  }

  function handleBlur(){
    setTimeout(()=>{if(!mouseDownRef.current)setShowSugg(false);mouseDownRef.current=false;},200);
  }

  return(
    <div ref={wrapRef} style={{position:'relative',width:'100%',...(style||{})}}>
      <input value={value} onChange={handleChange} onBlur={handleBlur}
        onFocus={()=>suggestions.length>0&&setShowSugg(true)}
        placeholder={placeholder||'Adresse...'} style={{width:'100%'}}/>
      {showSugg&&suggestions.length>0&&(
        <div style={{position:'absolute',top:'calc(100% + 2px)',left:0,right:0,zIndex:9999,
          background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:8,
          boxShadow:'0 6px 20px rgba(0,0,0,0.5)',maxHeight:200,overflowY:'auto'}}>
          {suggestions.map((s,i)=>(
            <div key={i}
              onMouseDown={e=>{e.preventDefault();mouseDownRef.current=true;onChange(s);setSuggestions([]);setShowSugg(false);}}
              style={{padding:'0.45rem 0.75rem',fontSize:12,cursor:'pointer',
                borderBottom:i<suggestions.length-1?'1px solid var(--border)':'none',
                color:'var(--text)',background:'transparent'}}
              onMouseEnter={e=>e.currentTarget.style.background='var(--bg3)'}
              onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
              📍 {s}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ── JOB SUMMARY ──────────────────────────────────────────────────────────────
function JobSummary({jobs,emp}){
  const [activeTab,setActiveTab]=useState('today');
  const today=localDateStr();
  const tomorrow=localDateStr(new Date(Date.now()+86400000));
  const dateRef=activeTab==='today'?today:tomorrow;
  const label=activeTab==='today'?"aujourd'hui":'demain';
  const jobsDuJour=(jobs||[]).filter(j=>(j.start||'').slice(0,10)===dateRef);

  // Séparer les jobs de l'employé vs les autres
  function isEmpJob(j){
    if(!emp)return false;
    const t=(j.title||'').toLowerCase();
    const code=(emp.code||'').toLowerCase();
    const nom=(emp.nom||'').toLowerCase();
    // Match si couleur correspond ou si code/nom dans le titre
    const colorMatch=emp.couleur&&j.gcalColor&&colorDist(j.gcalColor,emp.couleur)<80;
    const nameMatch=code&&t.includes(code)||nom.split(' ').some(n=>n.length>2&&t.includes(n.toLowerCase()));
    return colorMatch||nameMatch;
  }

  const mesJobs=jobsDuJour.filter(j=>isEmpJob(j));
  const autresJobs=jobsDuJour.filter(j=>!isEmpJob(j));

  if(!jobs||jobs.length===0)return(
    <div style={{maxWidth:360,width:'100%',marginTop:'1rem',fontSize:11,color:'var(--muted)',textAlign:'center'}}>Chargement de l'agenda...</div>
  );

  function JobCard({j}){
    return(
      <div style={{background:'var(--bg3)',borderRadius:10,padding:'0.6rem 0.75rem',marginBottom:'0.4rem',borderLeft:'3px solid '+(j.gcalColor||'var(--accent)')}}>
        <div style={{fontWeight:600,fontSize:12,color:'var(--text)',marginBottom:j.description||j.location?4:0}}>{j.title}</div>
        {j.description&&<div style={{fontSize:11,color:'var(--muted)',lineHeight:1.4,marginBottom:j.location?3:0}}>{j.description}</div>}
        {j.location&&(
          <div style={{display:'flex',alignItems:'center',gap:6,marginTop:3}}>
            <span style={{fontSize:11,color:'var(--muted)',flex:1}}>📍 {j.location}</span>
            <a href={'https://maps.google.com/?q='+encodeURIComponent(j.location)} target="_blank" rel="noreferrer"
              style={{background:'rgba(47,129,247,0.2)',color:'var(--accent)',borderRadius:6,padding:'0.18rem 0.5rem',fontSize:10,fontWeight:600,textDecoration:'none',flexShrink:0,touchAction:'manipulation'}}>
              🗺 Maps
            </a>
          </div>
        )}
      </div>
    );
  }

  return(
    <div style={{maxWidth:360,width:'100%',marginTop:'1rem'}}>
      <div style={{display:'flex',gap:'0.35rem',marginBottom:'0.6rem'}}>
        {[['today',"📅 Aujourd'hui"],['tomorrow','📅 Demain']].map(([k,l])=>(
          <div key={k} onClick={()=>setActiveTab(k)} style={{padding:'0.25rem 0.75rem',borderRadius:8,fontSize:11,cursor:'pointer',touchAction:'manipulation',fontWeight:activeTab===k?700:400,background:activeTab===k?'rgba(47,129,247,0.15)':'var(--bg3)',border:'1px solid '+(activeTab===k?'var(--accent)':'var(--border)'),color:activeTab===k?'var(--accent)':'var(--muted)'}}>
            {l}
          </div>
        ))}
      </div>
      {jobsDuJour.length===0?(
        <div style={{background:'var(--bg3)',borderRadius:10,padding:'0.6rem 0.75rem',fontSize:11,color:'var(--muted)',textAlign:'center'}}>Aucune job à l'agenda {label}</div>
      ):(
        <>
          {mesJobs.length>0&&(
            <>
              <div style={{fontSize:10,fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:'0.35rem'}}>
                Mes jobs
              </div>
              {mesJobs.map((j,i)=><JobCard key={i} j={j}/>)}
            </>
          )}
          {autresJobs.length>0&&(
            <>
              {mesJobs.length>0&&<div style={{borderTop:'1px solid var(--border)',margin:'0.5rem 0'}}/>}
              <div style={{fontSize:10,fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:'0.35rem'}}>
                {mesJobs.length>0?'Autres jobs':'Toutes les jobs'}
              </div>
              {autresJobs.map((j,i)=><JobCard key={i} j={j}/>)}
            </>
          )}
        </>
      )}
    </div>
  );
}

function WelcomeScreen({emps,sid,calendarIds,notify,onRefresh,setNavBack,folders}){
  const now=useClock();
  const [step,setStep]=useState('emps');
  // steps: emps > mode > job > punch-in > pin > result
  //                    > duration-out > pin-out > result
  //                    > confirm > pin-confirm > result
  //                    > history
  const [selEmp,setSelEmp]=useState(null);
  const [mode,setMode]=useState('in');
  const [selJob,setSelJob]=useState('');
  const [selJobColor,setSelJobColor]=useState('');
  const [selJobDate,setSelJobDate]=useState('');
  const [jobs,setJobs]=useState([]);
  const [allJobs,setAllJobs]=useState([]);
  const [result,setResult]=useState(null);
  const punchDataRef=useRef({});
  const ptsRef=useRef([]);
  const [ptsForOut,setPtsForOut]=useState([]);

  const pad=n=>String(n).padStart(2,'0');
  const days=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
  const months=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  const today=localDateStr(now);
  const curWeek=getWeek(now);
  const curMois=getMois(now);

  // Live statut from emps list (not stale copy)
  const liveEmp=selEmp?emps.find(e=>e.nom===selEmp.nom)||selEmp:null;
  const empStatut=liveEmp?liveEmp.statut:'out';

  useEffect(()=>{
    if(calendarIds&&calendarIds.length){
      getCalendarJobs(calendarIds).then(setJobs);
      getAllCalendarJobs(calendarIds).then(setAllJobs);
    }
  },[calendarIds?calendarIds.join(','):'']);

  useEffect(()=>{
    if(step==='emps')setNavBack(null);
    else setNavBack(()=>goBack);
  },[step]);

  function goBack(){
    if(step==='mode')setStep('emps');
    else if(step==='job')setStep('mode');
    else if(step==='punch-in'||step==='confirm')setStep('job');
    else if(step==='duration-out')setStep('mode');
    else if(step==='pin'||step==='pin-out'||step==='pin-confirm'){
      if(mode==='out')setStep('duration-out');
      else if(mode==='confirm')setStep('confirm');
      else setStep('punch-in');
    }
    else if(step==='history'||step==='projets'||step==='ordres-travail')setStep('mode');
    else setStep('emps');
  }

  function reset(){
    setStep('emps');setSelEmp(null);setSelJob('');
    setSelJobColor('');punchDataRef.current={};setMode('in');setResult(null);
  }

  async function handlePunch(pin,type){
    const emp=selEmp;
    if(!emp)return;
    if(String(emp.pin).trim()!==String(pin).trim()){
      setResult({err:true});
      setTimeout(()=>setResult(null),2500);
      return;
    }
    const data={...punchDataRef.current,job:selJob||'',jobColor:selJobColor||''};
    try{
      if(type==='confirm'){
        const confirmedData={
          ...data,
          note:(data.note||'')+(data.heureDebut&&data.heureFin?' ['+data.heureDebut+'→'+data.heureFin+']':''),
          jobDate:data.jobDate||null,
        };
        await addPointage(sid,emp,'confirm',confirmedData);
        // Enregistrer heures de banque prises
        if(data.heuresBanquePrises&&data.heuresBanquePrises>0){
          await addHeuresBanque(sid,emp.nom,getWeek(new Date()),-data.heuresBanquePrises);
          notify('🏦 -'+hToQuart(data.heuresBanquePrises)+' de la banque','success');
        }
        if(data.coeqHeures){
          for(const [nom,h] of Object.entries(data.coeqHeures)){
            const ce=emps.find(e=>e.nom===nom);
            if(ce&&h>0)await addPointage(sid,ce,'confirm',{
              ...confirmedData,
              heures:h,
              note:(data.note||'')+(data.heureDebut&&data.heureFin?' ['+data.heureDebut+'→'+data.heureFin+']':'')+' [via '+emp.nom+']',
              coequipiers:[emp.nom]
            });
          }
        }
      }else{
        await addPointage(sid,emp,type,data);
        await updateStatus(sid,emp.row,type);
        // Update coequipier statuses on punch IN
        if(type==='in'&&data.coequipiers&&data.coequipiers.length>0){
          for(const nom of data.coequipiers){
            const ce=emps.find(e=>e.nom===nom);
            if(ce)await updateStatus(sid,ce.row,'in');
          }
        }
        if(type==='out'){
          // Find the original punch IN (may belong to another employee if this is a coequipier punching out)
          const allPtsForJob=await getPointages(sid,{nom:emp.nom});
          const origIn=allPtsForJob.find(p=>
            p.type==='in' &&
            (p.job||'')===(data.job||'') &&
            (p.nom===emp.nom || (p.coequipiers&&p.coequipiers.includes(emp.nom)))
          );
          // Build full list of coequipiers for this punch OUT
          // If this employee was a coequipier on the original IN, the original puncher is now their coequipier
          let allCoeqs=[...(data.coequipiers||[])];
          if(origIn&&origIn.nom!==emp.nom&&!allCoeqs.includes(origIn.nom)){
            allCoeqs.push(origIn.nom);
          }
          // Record hours for all coequipiers
          const coeqHrs=data.coeqHeures||{};
          for(const nom of allCoeqs){
            const ce=emps.find(e=>e.nom===nom);
            if(!ce)continue;
            const h=coeqHrs[nom]!==undefined?coeqHrs[nom]:data.heures||0;
            if(h>0){
              await addPointage(sid,ce,'confirm',{
                job:data.job,jobColor:data.jobColor,
                heures:h,deplacement:data.deplacement||0,
                note:(data.note||'')+'[via '+emp.nom+']',
                fichiersURL:data.fichiersURL||[],
                coequipiers:[emp.nom]
              });
              await updateStatus(sid,ce.row,'out');
            }
          }
        }
        if(type==='out'){
          const curW=getWeek(new Date());
          const semPts=await getPointages(sid,{nom:emp.nom,semaine:curW});
          const total=calcH(semPts);
          if(total>40){
            const extra=Math.round((total-40)*10)/10;
            const bq=await getHeuresBanque(sid);
            if(!bq.some(b=>b.nom===emp.nom&&b.semaine===curW)){
              await addHeuresBanque(sid,emp.nom,curW,extra);
              notify('🏦 '+emp.nom+' — '+extra+'h en banque!','warn');
            }
          }
        }
      }
      // Load fresh pts - if fails, build from what we just wrote
      let allPts=[];
      try{allPts=await getPointages(sid,{nom:emp.nom});}catch(e){console.warn('Reload pts failed:',e);}
      // If reload failed or empty, inject the punch we just made so PunchOut can see it
      if(allPts.length===0&&type==='in'){
        const now3=new Date();
        const inDt=data.customTime?new Date(now3.getFullYear(),now3.getMonth(),now3.getDate(),parseInt((data.customTime.split(':')[0])||0),parseInt((data.customTime.split(':')[1])||0)):now3;
        allPts=[{nom:emp.nom,type:'in',datetime:inDt.toISOString(),date:localDateStr(inDt),heure:data.customTime||localDateStr(inDt),job:data.job||'',jobColor:data.jobColor||'',deplacement:0,heures:0,note:'',fichiersURL:[],coequipiers:[],row:999}];
      }
      ptsRef.current=allPts;
      setPtsForOut(allPts);
      const selJobInfo=jobs.find(j=>j.title===selJob)||null;
      setResult({ok:true,nom:emp.nom,type,
        heure:data.customTime||now.toLocaleTimeString('fr-CA',{hour:'2-digit',minute:'2-digit'}),
        couleur:emp.couleur,code:emp.code,pts:allPts,
        job:selJob,jobColor:selJobColor,
        dep:data.deplacement||0,heures:data.heures||0,
        coeqs:data.coequipiers||[],
        description:selJobInfo?.description||'',
        location:selJobInfo?.location||''});
      setStep('result');
      setNavBack(null);
      onRefresh();
    }catch(e){
      notify('Erreur punch: '+e.message,'err');
      console.error(e);
    }
  }

  const TimeHeader=()=>(
    <><div className="w-time">{pad(now.getHours())}:{pad(now.getMinutes())}</div>
    <div className="w-date">{days[now.getDay()]} {now.getDate()} {months[now.getMonth()]} {now.getFullYear()}</div></>

  // ── RESULT ──
  );
  if(step==='result'&&result&&result.ok){
    const rpts=result.pts||[];
    return(
      <div className="welcome">
        <div className="punch-result ok">
          <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:10,marginBottom:8}}>
            <div className="emp-av" style={{background:result.type==='in'&&result.jobColor?result.jobColor:result.couleur,width:38,height:38,fontSize:12}}>{result.code}</div>
            <div style={{fontFamily:'var(--font-head)',fontSize:'1.05rem',fontWeight:800}}>{result.nom}</div>
          </div>
          <span className={'pbadge '+(result.type==='confirm'?'confirm':result.type)}>{result.type==='in'?'✅ Punch IN':result.type==='out'?'🔴 Punch OUT':'✅ Job confirmée'}</span>
          <div style={{fontFamily:'var(--font-head)',fontWeight:700,fontSize:'1.1rem',margin:'4px 0'}}>{result.heure}</div>
          {result.job&&<div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:5,marginBottom:4}}><div style={{width:8,height:8,borderRadius:'50%',background:result.jobColor||'var(--accent)'}}></div><span style={{fontSize:11,color:'var(--muted)'}}>{result.job}</span></div>}
          {result.type==='in'&&result.description&&(
            <div style={{background:'rgba(255,255,255,0.05)',borderRadius:8,padding:'0.45rem 0.65rem',margin:'6px 0',textAlign:'left',fontSize:11,color:'var(--muted)',lineHeight:1.4}}>{result.description}</div>
          )}
          {result.type==='in'&&result.location&&(
            <div style={{display:'flex',alignItems:'center',gap:8,margin:'4px 0 8px',background:'rgba(255,255,255,0.05)',borderRadius:8,padding:'0.4rem 0.65rem'}}>
              <span style={{fontSize:11,color:'var(--muted)',flex:1,textAlign:'left'}}>📍 {result.location}</span>
              <a href={'https://maps.google.com/?q='+encodeURIComponent(result.location)}
                target="_blank" rel="noreferrer"
                style={{background:'rgba(47,129,247,0.2)',color:'var(--accent)',borderRadius:6,padding:'0.22rem 0.6rem',fontSize:11,fontWeight:600,textDecoration:'none',flexShrink:0,touchAction:'manipulation'}}>
                🗺 Maps
              </a>
            </div>
          )}
          {result.coeqs&&result.coeqs.length>0&&<div style={{fontSize:11,color:'var(--muted)',marginBottom:4}}>{'👥 '+result.coeqs.join(', ')}</div>}
          {result.dep>0&&<span className="pbadge travel">{'🚗 '+result.dep+'min'}</span>}
          {result.heures>0&&<span className="pbadge in">{'⏱ '+result.heures+'h'}</span>}
          <div className="punch-stats">
            <div className="ps"><div className="v">{calcH(rpts.filter(p=>p.date===today))}h</div><div className="l">Auj.</div></div>
            <div className="ps"><div className="v">{calcH(rpts.filter(p=>p.semaine===curWeek))}h</div><div className="l">Sem.</div></div>
            <div className="ps"><div className="v">{calcH(rpts.filter(p=>p.mois===curMois))}h</div><div className="l">Mois</div></div>
            <div className="ps"><div className="v">{Math.round(rpts.filter(p=>p.semaine===curWeek&&(p.type==='in'||p.type==='confirm')).reduce((s,p)=>s+(p.deplacement||0),0))}m</div><div className="l">Dépl.</div></div>
          </div>
          <button className="btn-s" style={{marginTop:'0.75rem',width:'100%'}} onClick={reset}>← Retour à l'accueil</button>
        </div>
      </div>
              );
  }
  if(step==='result'&&result&&result.err)return(<div className="welcome"><div className="punch-result err"><div style={{fontSize:'1.8rem',marginBottom:8}}>❌</div><div style={{fontFamily:'var(--font-head)',fontWeight:700}}>PIN incorrect</div><button style={{background:'none',border:'none',color:'var(--muted)',fontSize:11,cursor:'pointer',marginTop:'0.55rem',textDecoration:'underline'}} onClick={reset}>← Retour</button></div></div>);

  // ── PIN PADS ──
  if(step==='pin')return(<div className="welcome"><TimeHeader/><PinPad empName={selEmp&&selEmp.nom} empCouleur={selEmp&&selEmp.couleur} empCode={selEmp&&selEmp.code} label="Punch IN" onSubmit={pin=>handlePunch(pin,'in')} onCancel={goBack}/></div>);
  if(step==='pin-out')return(<div className="welcome"><TimeHeader/><PinPad empName={selEmp&&selEmp.nom} empCouleur={selEmp&&selEmp.couleur} empCode={selEmp&&selEmp.code} label="Punch OUT" onSubmit={pin=>handlePunch(pin,'out')} onCancel={goBack}/></div>);
  if(step==='pin-confirm')return(<div className="welcome"><TimeHeader/><PinPad empName={selEmp&&selEmp.nom} empCouleur={selEmp&&selEmp.couleur} empCode={selEmp&&selEmp.code} label="Confirmer la job" onSubmit={pin=>handlePunch(pin,'confirm')} onCancel={goBack}/></div>);

  // ── PUNCH IN ──
  if(step==='punch-in')return(
    <div className="welcome" style={{justifyContent:'flex-start',paddingTop:'1rem'}}>
      <TimeHeader/>
      <PunchInScreen emp={selEmp} allEmps={emps} selJob={selJob} selJobColor={selJobColor}
        selJobData={jobs.find(j=>j.title===selJob)||null}
        onConfirm={d=>{punchDataRef.current=d;setStep('pin');}} onBack={goBack}/>
    </div>

  // ── PUNCH OUT ──
  );
  if(step==='duration-out')return(
    <div className="welcome" style={{justifyContent:'flex-start',paddingTop:'1rem'}}>
      <TimeHeader/>
      <PunchOutScreen emp={selEmp} allEmps={emps} pts={ptsForOut} sid={sid}
        onConfirm={d=>{punchDataRef.current=d;setSelJob(d.job||'');setSelJobColor(d.jobColor||'');setStep('pin-out');}}
        onBack={goBack} notify={notify} folders={folders} calendarIds={calendarIds} calJobs={jobs}/>
    </div>

  // ── CONFIRM JOB ──
  );
  if(step==='confirm')return(
    <div className="welcome" style={{justifyContent:'flex-start',paddingTop:'1rem'}}>
      <TimeHeader/>
      <DurationForm emp={selEmp} allEmps={emps} jobName={selJob} jobColor={selJobColor}
        jobLocation={jobs.find(j=>j.title===selJob)?.location||''}
        jobDate={selJobDate}
        isOut={false}
        onConfirm={d=>{punchDataRef.current=d;setStep('pin-confirm');}}
        onBack={goBack} notify={notify} folders={folders} calendarIds={calendarIds}/>
    </div>

  // ── JOB SELECTOR ──
  );
  if(step==='job')return(
    <div className="welcome" style={{justifyContent:'flex-start',paddingTop:'1rem'}}>
      <TimeHeader/>
      <JobSelector jobs={jobs} emp={selEmp}
        onSelect={(t,c)=>{setSelJob(t);setSelJobColor(c);
          const jDate=(jobs.find(j=>j.title===t)?.start||'').slice(0,10);
          setSelJobDate(jDate);
          if(mode==='out')setStep('duration-out');
          else if(mode==='confirm')setStep('confirm');
          else setStep('punch-in');
        }}
        onCreateJob={async(nj)=>{
          const calId=calendarIds&&calendarIds[0]||'primary';
          const gcalColor=selEmp?selEmp.couleur:'#2f81f7';
          await createCalendarEvent(calId,nj.title,nj.date,gcalColor,nj.location||'');
          notify('✅ Job "'+nj.title+'" créé!','success');
          getCalendarJobs(calendarIds).then(setJobs);
          setSelJob(nj.title);setSelJobColor(gcalColor);
          if(mode==='out')setStep('duration-out');
          else if(mode==='confirm')setStep('confirm');
          else setStep('punch-in');
        }}
        onSkip={()=>{setSelJob('');setSelJobColor('');
          if(mode==='out')setStep('duration-out');
          else if(mode==='confirm')setStep('confirm');
          else setStep('punch-in');
        }}/>
    </div>

  // ── HISTORY ──
  );
  if(step==='history')return(
    <div className="welcome" style={{justifyContent:'flex-start',paddingTop:'1rem'}}>
      <EmployeeHistory emp={selEmp} sid={sid} notify={notify} folders={folders} calendarIds={calendarIds}/>
    </div>
  );
  if(step==='projets'){
    const allPts=ptsForOut.length?ptsForOut:ptsRef.current;
    return(
      <div className="welcome" style={{justifyContent:'flex-start',paddingTop:'1rem'}}>
        <ProjectsView sid={sid} pts={allPts} emps={emps} calJobs={allJobs.length>0?allJobs:jobs} isAdmin={false} notify={notify} calendarIds={calendarIds}/>
      </div>
    );
  }
  if(step==='ordres-travail'){
    // Charger les pts de cet employé pour trouver les OT
    const allPts=[...ptsForOut,...ptsRef.current];
    const otEntries=allPts.filter(p=>
      p.nom===selEmp.nom&&
      p.fichiersURL&&p.fichiersURL.some(u=>u&&u.includes('drive.google.com'))&&
      (p.job||p.note)
    );
    return(
      <div className="welcome" style={{justifyContent:'flex-start',paddingTop:'1rem'}}>
        <div style={{maxWidth:420,width:'100%'}}>
          <div style={{fontFamily:'var(--font-head)',fontWeight:700,fontSize:'1rem',marginBottom:'0.75rem'}}>
            🔧 Mes ordres de travail
          </div>
          {otEntries.length===0?(
            <div style={{background:'var(--bg3)',borderRadius:10,padding:'1rem',textAlign:'center',color:'var(--muted)',fontSize:12}}>
              Aucun ordre de travail trouvé.
            </div>
          ):(
            otEntries.map((p,i)=>(
              <div key={i} style={{background:'var(--bg3)',borderRadius:10,padding:'0.65rem 0.85rem',marginBottom:'0.5rem',borderLeft:'3px solid var(--accent)'}}>
                <div style={{fontWeight:600,fontSize:13,marginBottom:3}}>{p.job||'Sans job'}</div>
                <div style={{fontSize:11,color:'var(--muted)',marginBottom:4}}>{p.date} · {p.heure}</div>
                {p.fichiersURL.filter(u=>u).map((u,j)=>{
                  const urlClean=u.split('|')[0];
                  const isOT=u.toLowerCase().includes('ot_')||urlClean.toLowerCase().includes('ot_');
                  const isAP=u.toLowerCase().includes('ap_')||urlClean.toLowerCase().includes('ap_');
                  const nom=u.includes('|')?u.split('|')[1]:null;
                  const label=isOT?'🔧 '+(nom||'Ordre de travail'):isAP?'📋 '+(nom||'Appel de service'):'📎 '+(nom||'Fichier');
                  return(
                    <a key={j} href={urlClean} target="_blank" rel="noreferrer"
                      style={{display:'flex',alignItems:'center',gap:6,background:'rgba(47,129,247,0.1)',borderRadius:6,padding:'0.25rem 0.5rem',marginBottom:3,textDecoration:'none',color:'var(--accent)',fontSize:11}}>
                      {label}
                    </a>
                  );
                })}
              </div>
            ))
          )}
        </div>
      </div>
    );
  }

  // ── MODE SELECTION ──
  if(step==='mode'&&selEmp)return(
    <div className="welcome">
      <TimeHeader/>
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:'1.25rem'}}>
        <div className="emp-av" style={{background:selEmp.couleur,width:36,height:36,fontSize:12}}>{selEmp.code}</div>
        <div style={{fontFamily:'var(--font-head)',fontWeight:700}}>{selEmp.nom}</div>
        <span className={'badge '+(empStatut==='in'?'badge-in':'badge-out')} style={{marginLeft:'auto'}}>{empStatut==='in'?'En cours':'Absent'}</span>
      </div>
      <div className="mode-wrap">
        {empStatut==='in'?(
          <div className="mode-btn" onClick={async()=>{
            setMode('out');
            notify('⏳ Chargement...','warn');
            let p=[];
            try{p=await getPointages(sid,{nom:selEmp.nom,date:localDateStr()});}catch(e){console.error(e);}
            if(p.length===0&&ptsRef.current.length>0)p=ptsRef.current.filter(x=>x.date===localDateStr());
            ptsRef.current=p;
            setPtsForOut(p);
            setStep('duration-out');
          }}>
            <div className="mode-icon">🔴</div>
            <div><div className="mode-title">Punch OUT</div><div className="mode-desc">Terminer — heures, dépl., fichiers</div></div>
          </div>
        ):(
          <>
            <div className="mode-btn" onClick={()=>{setMode('in');setStep('job');}}>
              <div className="mode-icon">🟢</div>
              <div><div className="mode-title">Punch IN</div><div className="mode-desc">Choisir dans l'agenda</div></div>
            </div>
          </>
        )}
        <div className="mode-btn" onClick={()=>{setMode('confirm');setStep('job');}}>
          <div className="mode-icon">✅</div>
          <div><div className="mode-title">Confirmer une job</div><div className="mode-desc">Heures, dépl., coéquipiers, fichiers</div></div>

function AdminView({sid,calendarIds,refreshKey,notify,onRefresh}){
  const [tab,setTab]=useState('dashboard');
  const [emps,setEmps]=useState([]);
  const [pts,setPts]=useState([]);
  const [banque,setBanque]=useState([]);
  const [jobs,setJobs]=useState([]);
  const [msgs,setMsgs]=useState([]);
  const [loading,setLoading]=useState(true);
  const [showAdd,setShowAdd]=useState(false);
  const [editEmp,setEditEmp]=useState(null);
  const [newEmp,setNewEmp]=useState({nom:'',pin:'',code:'',couleur:EMP_COLORS[0],email:'',telephone:'',heuresBanque:0});
  const [selEmp,setSelEmp]=useState('');
  const [histTab,setHistTab]=useState('semaine');

  const today=localDateStr();
  const curWeek=getWeek(new Date());
  const curMois=getMois(new Date());

  useEffect(()=>{
    setLoading(true);
    Promise.all([getEmployees(sid),getPointages(sid,{}),getHeuresBanque(sid),getCalendarJobs(calendarIds),getMessages(sid)])
      .then(([e,p,b,j,m])=>{setEmps(e);setPts(p);setBanque(b);setJobs(j);setMsgs(m);setLoading(false);});
  },[refreshKey]);

  const pending=banque.filter(b=>b.statut==='pending');
  const unread=msgs.filter(m=>!m.lu);
  const eMap=Object.fromEntries(emps.map(e=>[e.nom,e]));

  async function handleAdd(){
    if(!newEmp.nom||!newEmp.pin){notify('Remplis le nom et le PIN!','err');return;}
    try{
      const emp={...newEmp,code:newEmp.code||newEmp.nom.substring(0,2).toUpperCase()};
      notify('⏳ Sauvegarde...','warn');
      await saveEmployee(sid,emp);
      const updated=await getEmployees(sid);setEmps(updated);
      setNewEmp({nom:'',pin:'',code:'',couleur:EMP_COLORS[updated.length%EMP_COLORS.length],email:'',telephone:'',heuresBanque:0});
      setShowAdd(false);notify('✅ '+emp.nom+' ajouté!','success');onRefresh();
    }catch(e){notify('Erreur: '+e.message,'err');}
  }

  async function handleUpdateEmp(){
    if(!editEmp||!editEmp.nom||!editEmp.pin){notify('Remplis tous les champs!','err');return;}
    try{
      await updateEmployee(sid,editEmp.row,editEmp);
      const updated=await getEmployees(sid);setEmps(updated);
      setEditEmp(null);notify('✅ Employé modifié!','success');onRefresh();
    }catch(e){notify('Erreur: '+e.message,'err');}
  }

  async function handleDel(emp){
    if(!confirm('Supprimer '+emp.nom+'?'))return;
    await deleteEmployee(sid,emp.row);notify('Supprimé','success');
    const u=await getEmployees(sid);setEmps(u);onRefresh();
  }

  async function handleBanque(b,statut){
    await updateBanqueStatus(sid,b.row,statut);
    notify(statut==='approved'?'✅ '+b.heures+'h approuvées':'Refusé','success');
    setBanque(await getHeuresBanque(sid));
  }

  async function handleMarkRead(msg){
    await markMessageRead(sid,msg.row);
    setMsgs(m=>m.map(x=>x.row===msg.row?{...x,lu:true}:x));
  }

  function getHist(){
    let p=selEmp?pts.filter(x=>x.nom===selEmp):pts;
    if(histTab==='today')p=p.filter(x=>x.date===today);
    else if(histTab==='semaine')p=p.filter(x=>x.semaine===curWeek);
    else if(histTab==='mois')p=p.filter(x=>x.mois===curMois);
    const empNames=[...new Set(p.map(x=>x.nom))];
    const lines=[];
    for(const nom of empNames){
      const combined=combinePts(p.filter(x=>x.nom===nom));
      combined.forEach(l=>lines.push({...l,nom}));
    }
    return lines.sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,80);
  }

  function getJobStats(){
    const map={};
    for(const p of pts){
      if(!p.job||(p.type!=='in'&&p.type!=='confirm'))continue;
      if(!map[p.job])map[p.job]={job:p.job,color:p.jobColor||'#2f81f7',heures:0,deplacement:0,count:0,fichiers:[]};
      if(p.type==='confirm')map[p.job].heures+=p.heures||0;
      else{const matchOut=pts.find(o=>o.nom===p.nom&&o.type==='out'&&new Date(o.datetime)>new Date(p.datetime));if(matchOut)map[p.job].heures+=Math.round((new Date(matchOut.datetime)-new Date(p.datetime))/360000)/10;}
      map[p.job].deplacement+=p.deplacement||0;map[p.job].count++;
      if(p.fichiersURL)p.fichiersURL.forEach(u=>map[p.job].fichiers.push(u));
    }
    return Object.values(map).map(x=>({...x,heures:Math.round(x.heures*10)/10})).sort((a,b)=>b.heures-a.heures);
  }

  function getAssignees(job){
    const txt=(job.title+' '+(job.description||'')).toLowerCase();
    return emps.filter(e=>txt.includes(e.nom.toLowerCase())||txt.includes(e.code.toLowerCase()));
  }

  if(loading)return <div style={{textAlign:'center',color:'var(--muted)',padding:'3rem',fontSize:13}}>⏳ Chargement...</div>;

  const totalToday=Math.round(emps.reduce((s,e)=>s+calcH(pts.filter(p=>p.nom===e.nom&&p.date===today)),0)*10)/10;
  const totalWeek=Math.round(emps.reduce((s,e)=>s+calcH(pts.filter(p=>p.nom===e.nom&&p.semaine===curWeek)),0)*10)/10;
  const totalDep=Math.round(pts.filter(p=>p.semaine===curWeek&&(p.type==='in'||p.type==='confirm')).reduce((s,p)=>s+(p.deplacement||0),0));

// ── EMP FORM — defined outside AdminView to prevent focus loss on keystroke ───
  return(
    <div>
      <div className="tabs">
        {[['dashboard','📊 Dashboard'],['employes','👷 Employés'],['projets','📁 Projets'],['historique','📋 Historique'],['jobs-stats','📍 Par job'],['banque','🏦 Banque'],['messages','💬 Messages'],['agenda','📅 Agenda'],['ot-admin','🔧 OT']].map(([k,l])=>(
          <div key={k} className={'tab'+(tab===k?' active':'')} onClick={()=>setTab(k)} style={{position:'relative'}}>
            {l}
            {k==='banque'&&pending.length>0&&<span className="nav-badge">{pending.length}</span>}
            {k==='messages'&&unread.length>0&&<span className="nav-badge">{unread.length}</span>}
          </div>
        ))}
      </div>

      {tab==='dashboard'&&(
        <div className="admin-grid">
          <div className="card">
            <div className="csec">Aperçu du jour</div>
            <div className="stats-grid" style={{marginBottom:'1rem'}}>
              <div className="stat-box"><div className="val" style={{color:'var(--success)'}}>{emps.filter(e=>e.statut==='in').length}</div><div className="lbl">Sur place</div></div>
              <div className="stat-box"><div className="val">{totalToday}h</div><div className="lbl">Auj.</div></div>
              <div className="stat-box"><div className="val">{totalWeek}h</div><div className="lbl">Sem.</div></div>
              <div className="stat-box"><div className="val">{totalDep}m</div><div className="lbl">Dépl.</div></div>
            </div>
            <div className="csec">Statut temps réel</div>
            <div className="status-grid">
              {emps.map(emp=>(
                <div key={emp.nom} className="semp">
                  <div style={{width:8,height:8,borderRadius:'50%',background:emp.statut==='in'?emp.couleur:'var(--muted)',boxShadow:emp.statut==='in'?'0 0 4px '+emp.couleur:'none',flexShrink:0}}></div>
                  <div>
                    <div style={{fontSize:11,fontWeight:500,display:'flex',alignItems:'center',gap:4}}>
                      <span style={{background:rgba(emp.couleur,0.2),color:emp.couleur,borderRadius:4,padding:'0 3px',fontSize:9,fontWeight:700}}>{emp.code}</span>{emp.nom}
                    </div>
                    <div style={{fontSize:10,color:'var(--muted)'}}>{emp.statut==='in'?'✓ Présent':'Absent'}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>
          <div className="card">
            <div className="csec">Heures semaine</div>
            {emps.map(emp=>{
              const h=calcH(pts.filter(p=>p.nom===emp.nom&&p.semaine===curWeek));
              const dep=Math.round(pts.filter(p=>p.nom===emp.nom&&p.semaine===curWeek&&(p.type==='in'||p.type==='confirm')).reduce((s,p)=>s+(p.deplacement||0),0));
              return(
                <div key={emp.nom} className="wbar-wrap">
                  <div className="wbar-label">
                    <span style={{display:'flex',alignItems:'center',gap:5}}>
                      <span style={{width:7,height:7,borderRadius:'50%',background:emp.couleur,display:'inline-block'}}></span>
                      {emp.nom} <span style={{fontSize:9,background:rgba(emp.couleur,0.2),color:emp.couleur,padding:'0 3px',borderRadius:3}}>{emp.code}</span>
                    </span>
                    <span style={{display:'flex',gap:6,color:h>40?'var(--warning)':'var(--muted)',fontSize:11}}>
                      <span>{hToQuart(h)}{h>40?' (+'+Math.round((h-40)*10)/10+'h)':''}</span>
                      {dep>0&&<span style={{color:'var(--warning)'}}>{'🚗'+dep+'m'}</span>}
                    </span>
                  </div>
                  <div className="wbar"><div className={'wbar-fill'+(h>40?' ot':'')} style={{width:Math.min(100,(h/40)*100)+'%',background:h>40?undefined:emp.couleur}}></div></div>
                </div>
                                  );
            })}
          </div>
        </div>
      )}

      {tab==='employes'&&(
        <div className="card" style={{maxWidth:580}}>
          <div className="section-head">
            <div className="card-title" style={{marginBottom:0}}>Employés ({emps.length})</div>
            <button className="btn-s" onClick={()=>{setShowAdd(!showAdd);setEditEmp(null);}}>+ Ajouter</button>
          </div>
          {showAdd&&!editEmp&&<EmpForm data={newEmp} setData={setNewEmp} onSave={handleAdd} isEdit={false}/>}
          {editEmp&&<EmpForm data={editEmp} setData={setEditEmp} onSave={handleUpdateEmp} onCancel={()=>setEditEmp(null)} isEdit={true}/>}
          <div style={{marginTop:'0.7rem'}}>
            {emps.map(emp=>(
              <div key={emp.nom} className="emp-row">
                <div className="emp-av" style={{background:emp.couleur}}>{emp.code}</div>
                <div style={{flex:1,marginLeft:'0.55rem'}}>
                  <div style={{fontSize:12,fontWeight:500}}>{emp.nom}</div>
                  <div style={{fontSize:10,color:'var(--muted)',fontFamily:'monospace'}}>
                    PIN: {emp.pin} · {emp.code}
                    {emp.email&&' · '+emp.email}
                    {emp.telephone&&' · '+emp.telephone}
                  </div>
                  {emp.heuresBanque>0&&<div style={{fontSize:10,color:'var(--warning)'}}>🏦 {hToQuart(emp.heuresBanque)} en banque</div>}
                </div>
                <span className={'badge '+(emp.statut==='in'?'badge-in':'badge-out')}>{emp.statut==='in'?'Présent':'Absent'}</span>
                <button className="btn-icon edit" onClick={()=>{setEditEmp({...emp});setShowAdd(false);}}>✏️</button>
                <button className="btn-icon" onClick={()=>handleDel(emp)}>✕</button>
              </div>
            ))}
            {emps.length===0&&<div style={{color:'var(--muted)',textAlign:'center',padding:'1.5rem',fontSize:13}}>Aucun employé — cliquez "+ Ajouter"</div>}
          </div>
        </div>
      )}

      {tab==='projets'&&(

      {tab==='historique'&&(

              <option value="">Tous</option>
              {emps.map(e=><option key={e.nom} value={e.nom}>{e.nom}</option>)}

            {unread.length>0&&<button className="btn-s" style={{fontSize:11}} onClick={async()=>{for(const m of unread)await markMessageRead(sid,m.row);setMsgs(ms=>ms.map(x=>({...x,lu:true})));notify('Tout lu','success');}}>Tout lire</button>}
          </div>
          {msgs.length===0?<div style={{color:'var(--muted)',fontSize:13}}>Aucun message.</div>:
          msgs.map((msg,i)=>(
            <div key={i} className={'msg-card'+(msg.lu?' read':'')}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:8}}>
                <div>
                  <div style={{fontSize:12,fontWeight:600}}>{msg.de} — <span style={{color:'var(--warning)'}}>{msg.action}</span></div>
                  <div style={{fontSize:11,color:'var(--muted)',marginTop:2}}>{msg.details}</div>
                  <div style={{fontSize:10,color:'var(--muted)',marginTop:3}}>{new Date(msg.datetime).toLocaleDateString('fr-CA')} {new Date(msg.datetime).toLocaleTimeString('fr-CA',{hour:'2-digit',minute:'2-digit'})}</div>
                </div>
                {!msg.lu&&<button className="btn-sm" style={{background:'var(--bg2)',border:'1px solid var(--border)',color:'var(--muted)',flexShrink:0}} onClick={()=>handleMarkRead(msg)}>✓</button>}

      )}

      {tab==='agenda'&&(
        <div className="card">
          <div className="card-title">Agenda — 14 prochains jours</div>

          jobs.map(j=>{
            const ass=getAssignees(j);
            return(
              <div key={j.id} className="job-item" style={{borderLeftColor:j.gcalColor}}>
                <div style={{display:'flex',alignItems:'center',gap:7}}><div style={{width:9,height:9,borderRadius:'50%',background:j.gcalColor,flexShrink:0}}></div><div style={{fontWeight:600,fontSize:13}}>{j.title}</div></div>
                <div style={{fontSize:11,color:'var(--muted)',marginTop:2,marginLeft:16}}>{new Date(j.start).toLocaleDateString('fr-CA',{weekday:'long',month:'long',day:'numeric'})} {j.location?' · '+j.location:''}</div>
                {ass.length>0&&<div style={{marginTop:4,marginLeft:16}}>{ass.map(a=><span key={a.nom} className="achip" style={{background:rgba(a.couleur,0.2),color:a.couleur}}><span style={{width:6,height:6,borderRadius:'50%',background:a.couleur,display:'inline-block'}}></span>{a.nom}</span>)}</div>}
              </div>
                              );
          })}
        </div>
      )}
      {tab==='ot-admin'&&(
        <div className="card">
          <div className="card-title">🔧 Ordres de travail & Appels de service</div>
          {loading?<div style={{color:'var(--muted)',fontSize:13}}>Chargement...</div>:(()=>{
            // Find all entries with AP_ or OT_ files
            const otEntries=pts.filter(p=>p.fichiersURL&&p.fichiersURL.some(u=>{
              const name=u.includes('|')?u.split('|')[1]:u;
              return name&&(name.startsWith('AP_')||name.startsWith('OT_'));
            }));
            if(otEntries.length===0)return <div style={{color:'var(--muted)',fontSize:12,textAlign:'center',padding:'1rem'}}>Aucun document trouvé.</div>;
            return otEntries.map((p,i)=>(
              <div key={i} style={{background:'var(--bg3)',borderRadius:10,padding:'0.65rem 0.85rem',marginBottom:'0.5rem',borderLeft:'3px solid var(--accent)'}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:8}}>
                  <div>
                    <div style={{fontWeight:600,fontSize:13}}>{p.job||'Sans job'}</div>
                    <div style={{fontSize:11,color:'var(--muted)'}}>{p.nom} · {p.date}</div>
                  </div>
                </div>
                <div style={{marginTop:'0.4rem',display:'flex',flexDirection:'column',gap:3}}>
                  {p.fichiersURL.filter(u=>{const n=u.includes('|')?u.split('|')[1]:u;return n&&(n.startsWith('AP_')||n.startsWith('OT_'));}).map((raw,j)=>{
                    const urlClean=raw.split('|')[0];
                    const nom=raw.includes('|')?raw.split('|')[1]:raw;
                    const isOT=nom.startsWith('OT_');
                    return(
                      <div key={j} style={{display:'flex',alignItems:'center',gap:6,background:isOT?'rgba(210,153,34,0.1)':'rgba(63,185,80,0.1)',borderRadius:6,padding:'0.25rem 0.5rem'}}>
                        <a href={urlClean} target="_blank" rel="noreferrer" style={{flex:1,fontSize:11,color:isOT?'var(--warning)':'var(--success)',textDecoration:'none',fontWeight:600}}>
                          {isOT?'🔧':'📋'} {nom}
                        </a>
                        <button style={{background:'none',border:'none',color:'var(--danger)',cursor:'pointer',fontSize:11,padding:'0 2px',touchAction:'manipulation'}}
                          onClick={async()=>{
                            if(!confirm('Supprimer "'+nom+'" ?'))return;
                            const newURLs=p.fichiersURL.filter((_,k)=>k!==j);
                            if(p.row){
                              await updatePointageFichiers(sid,p.row,newURLs.map(r=>r.split('|')[0]));
                              notify('Document supprimé','success');
                              // Reload
                              const fresh=await getPointages(sid);setPts(fresh);
                            }
                          }}>✕ Supprimer</button>
                      </div>
                    );
                  })}
                </div>
              </div>
            ));
          })()}
        </div>
      )}
    </div>
  );
}

// ── MAIN APP ──────────────────────────────────────────────────────────────────
function App(){
  const [cfg,setCfg]=useState(()=>{
    try{
      const saved=JSON.parse(localStorage.getItem('pp_cfg')||'null');
      if(saved&&saved.apiKey){
        return{
          ...saved,
          // Ces valeurs sont toujours hardcodées — jamais écrasées par localStorage
          driveFolders:DEFAULT_CFG.driveFolders,
          calendarIds:DEFAULT_CFG.calendarIds,
          spreadsheetId:DEFAULT_CFG.spreadsheetId,
          apiKey:DEFAULT_CFG.apiKey,
          clientId:DEFAULT_CFG.clientId,
        };
      }
      return DEFAULT_CFG;
    }catch{return DEFAULT_CFG;}
  });
  const [showCfg,setShowCfg]=useState(false);
  const [redirectLoading,setRedirectLoading]=useState(!!sessionStorage.getItem('_oauth_token'));
  const returningFromRedirect=!!sessionStorage.getItem('_oauth_token');
  const [authed,setAuthed]=useState(false);
  const [userEmail,setUserEmail]=useState('');
  const [isBoss,setIsBoss]=useState(false);
  const [view,setView]=useState('punch');
  const [emps,setEmps]=useState([]);
  const [notif,setNotif]=useState(null);
  const [libsReady,setLibsReady]=useState(false);
  const [authLoading,setAuthLoading]=useState(false);
  const [refreshKey,setRefreshKey]=useState(0);
  const [showSidebar,setShowSidebar]=useState(false);
  const [navBack,setNavBack]=useState(null);
  const [unreadCount,setUnreadCount]=useState(0);
  const notify=useMemo(()=>(msg,type='info')=>{setNotif({id:Date.now(),msg,type});},[]);
  function onRefresh(){setRefreshKey(k=>k+1);}

  function getCalendarIds(){
    if(!cfg||!cfg.calendarIds)return['primary'];
    const ids=cfg.calendarIds.split(',').map(e=>e.trim()).filter(Boolean);
    return ids.length?ids:['primary'];
  }

  function getDriveFolders(){
    return parseDriveFolders(cfg&&cfg.driveFolders||'');
  }
  const calendarIdsMemo=useMemo(()=>getCalendarIds(),[cfg]);
  const foldersMemo=useMemo(()=>getDriveFolders(),[cfg]);

  async function onToken(resp){
    if(resp.error){
      if(authLoading){setAuthLoading(false);notify('Erreur connexion — réessayez','err');}
      return;
    }
    if(authed){console.log('Token refreshed');return;}
    const accessToken=resp.access_token||(gapi.client.getToken()&&gapi.client.getToken().access_token);
    if(!accessToken)return;
    if(!gapi.client.getToken())gapi.client.setToken({access_token:accessToken});
    let email='';
    try{
      const r=await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{'Authorization':'Bearer '+accessToken}});
      const d=await r.json();
      email=(d.email||'').toLowerCase().trim();
    }catch(e){console.error(e);}
    const boss=BOSS_EMAILS.includes(email);
    setUserEmail(email||'connecté');setIsBoss(boss);setView('punch');
    let cur;
    try{cur=JSON.parse(localStorage.getItem('pp_cfg')||'null');}catch{cur=null;}
    if(!cur||!cur.spreadsheetId)cur=DEFAULT_CFG;
    // Run all post-auth calls in parallel for speed
    const [empsData,,msgsData]=await Promise.allSettled([
      getEmployees(cur.spreadsheetId),
      ensureStructure(cur.spreadsheetId),
      boss?getMessages(cur.spreadsheetId):Promise.resolve([])
    ]);
    if(empsData.status==='fulfilled')setEmps(empsData.value||[]);
    if(boss&&msgsData.status==='fulfilled')setUnreadCount((msgsData.value||[]).filter(x=>!x.lu).length);
    setAuthed(true);setAuthLoading(false);
    notify('✅ '+email+(boss?' 👑 Admin':''),'success');
    onRefresh();
  }

  async function loadLibs(config){
    try{
      await initLibs(config,onToken);
      setLibsReady(true);
      const savedToken=sessionStorage.getItem('_oauth_token');
      if(savedToken){
        sessionStorage.removeItem('_oauth_token');
        gapi.client.setToken({access_token:savedToken});
        onToken({access_token:savedToken});
      } else {
      }
    }
    catch(e){
      console.error(e);
      notify('Erreur APIs Google','err');
    }
  }

  useEffect(()=>{if(cfg)loadLibs(cfg);},[cfg]);
  useEffect(()=>{
    if(authed&&cfg){
      getEmployees(cfg.spreadsheetId).then(e=>{
        setEmps(e);
        setRedirectLoading(false); // employees loaded — safe to show app
      });
    }
  },[refreshKey,authed]);

  // Refresh OAuth token — toutes les 45 min ET quand l'app revient au premier plan
  useEffect(()=>{
    if(!authed||!tokenClient)return;

    function refreshToken(){
      try{
        tokenClient.requestAccessToken({prompt:''});
        console.log('Token refreshed silently');
      }catch(e){console.log('Token refresh skipped:',e);}
    }

    // Timer régulier toutes les 45 min
    const interval=setInterval(refreshToken, 45*60*1000);

    // Vérifier quand l'app revient au premier plan (tab visible, app ouverte)
    function onVisible(){
      if(document.visibilityState==='visible'){
        const token=gapi.client.getToken();
        // Si plus de token ou token qui date de plus de 50 min, rafraîchir
        if(!token||!token.access_token){
          refreshToken();
        }
      }
    }
    document.addEventListener('visibilitychange', onVisible);

    return()=>{clearInterval(interval);document.removeEventListener('visibilitychange',onVisible);};
  },[authed]);

  // Intercepter les erreurs 401 des appels API — reforcer auth si nécessaire
  useEffect(()=>{
    if(!authed)return;
    const origFetch=window.fetch;
    window.fetch=async function(...args){
      const res=await origFetch(...args);
      if(res.status===401){
        console.warn('401 detected — token expired, refreshing...');
        if(tokenClient)tokenClient.requestAccessToken({prompt:''});
      }
      return res;
    };
    return()=>{window.fetch=origFetch;};
  },[authed]);

  function handleAuth(){
    if(!libsReady){notify('APIs en chargement...','warn');return;}
    if(isIOS()||isPWA()){
      doRedirectAuth(cfg.clientId);
    }else{
      setAuthLoading(true);
      setTimeout(()=>setAuthLoading(false),120000);
      try{tokenClient.requestAccessToken({prompt:'select_account'});}
      catch(e){setAuthLoading(false);notify('Erreur connexion','err');}
    }
  }
  function handleSaveCfg(config){
    localStorage.setItem('pp_cfg',JSON.stringify(config));
    setCfg(config);setShowCfg(false);setAuthed(false);setLibsReady(false);tokenClient=null;loadLibs(config);
  }
  function handleSwitch(){
    setAuthed(false);setUserEmail('');setIsBoss(false);setAuthLoading(true);
    tokenClient.requestAccessToken({prompt:'select_account'});
  }
  function handleReset(){
    if(!confirm('Réinitialiser?'))return;
    localStorage.removeItem('pp_cfg');setCfg(null);setAuthed(false);setShowCfg(true);setLibsReady(false);tokenClient=null;
  }

  return(
    <div className="app-wrap">
      {showCfg&&<ConfigModal initial={cfg||DEFAULT_CFG} onSave={handleSaveCfg}/>}
      {notif&&<Notif key={notif.id} msg={notif.msg} type={notif.type} onClose={()=>setNotif(null)}/>}

      {/* Sidebar overlay */}
      {showSidebar&&<div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.5)',zIndex:200,touchAction:'manipulation'}} onClick={()=>setShowSidebar(false)}></div>}
      {/* Sidebar panel */}
      <div style={{position:'fixed',top:0,right:0,width:240,height:'100vh',background:'var(--bg2)',borderLeft:'1px solid var(--border)',zIndex:201,transform:showSidebar?'translateX(0)':'translateX(100%)',transition:'transform 0.25s ease',display:'flex',flexDirection:'column',padding:'1rem'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1.25rem'}}>
          <div style={{fontFamily:'var(--font-head)',fontWeight:700,fontSize:'0.9rem'}}>Menu</div>
          <button style={{background:'none',border:'none',color:'var(--muted)',fontSize:18,cursor:'pointer',touchAction:'manipulation'}} onClick={()=>setShowSidebar(false)}>✕</button>
        </div>
        {authed&&(
          <>
            <div style={{background:'var(--bg3)',borderRadius:8,padding:'0.6rem 0.75rem',marginBottom:'1rem'}}>
              <div style={{fontSize:11,color:'var(--muted)',marginBottom:2}}>Connecté</div>
              <div style={{fontSize:12,fontWeight:600,wordBreak:'break-all'}}>{userEmail}</div>
            </div>
            <div style={{display:'flex',gap:'0.4rem',marginBottom:'1rem'}}>
              <button className="btn-s" style={{flex:1,touchAction:'manipulation'}} onClick={()=>{setView('punch');setShowSidebar(false);}}>🕐 Punch</button>
              {isBoss&&<button className="btn-s" style={{flex:1,position:'relative',touchAction:'manipulation'}} onClick={()=>{setView('admin');setShowSidebar(false);}}>
                ⚙ Admin{unreadCount>0&&<span className="nav-badge">{unreadCount}</span>}
              </button>}
            </div>
            <button className="btn-s" style={{width:'100%',marginBottom:'0.5rem',touchAction:'manipulation'}} onClick={()=>{onRefresh();setShowSidebar(false);}}>↻ Rafraîchir</button>
            {isBoss&&<button className="btn-s" style={{width:'100%',marginBottom:'0.5rem',touchAction:'manipulation'}} onClick={()=>{setShowCfg(true);setShowSidebar(false);}}>⚙ Configuration</button>}
            <button className="btn-s" style={{width:'100%',marginTop:'auto',color:'var(--danger)',borderColor:'var(--danger)',touchAction:'manipulation'}} onClick={()=>{handleReset();setShowSidebar(false);}}>↩ Déconnexion</button>
          </>
        )}
        <div style={{fontSize:9,color:'var(--muted)',fontFamily:'monospace',marginTop:'auto',paddingTop:'0.5rem'}}>{APP_VERSION}</div>
      </div>

      {/* Écran de chargement complet pendant le redirect OAuth */}
      {redirectLoading&&(
        <div style={{position:'fixed',inset:0,background:'var(--bg)',zIndex:9999,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:'1.5rem'}}>
          <img src="logo.png" alt="" style={{width:120,opacity:0.9}} onError={e=>e.target.style.display='none'}/>
          <div style={{textAlign:'center'}}>
            <div style={{fontFamily:'var(--font-head)',fontWeight:800,fontSize:'1.2rem',marginBottom:'0.5rem'}}>Connexion en cours...</div>
            <div style={{color:'var(--muted)',fontSize:13}}>Veuillez patienter</div>
          </div>
          <div style={{display:'flex',gap:6}}>
            {[0,1,2].map(i=>(
              <div key={i} style={{width:8,height:8,borderRadius:'50%',background:'var(--accent)',animation:'pulse 1.2s ease-in-out '+(i*0.2)+'s infinite'}}/>
            ))}
          </div>
        </div>
      )}

      {/* Minimal topbar */}
      <div className="topbar">
        <div className="topbar-left">
          {navBack
            ?<button className="back-btn" onClick={navBack} style={{touchAction:'manipulation'}}>← Retour</button>
            :<div style={{display:'flex',alignItems:'center',gap:6,minWidth:0}}>
              <img src="logo.png" alt="" style={{width:28,height:28,objectFit:'contain',flexShrink:0}} onError={e=>e.target.style.display='none'}/>
              <div className="logo">Saran Électrique</div>
              <span style={{fontSize:8,color:'var(--muted)',fontFamily:'monospace',flexShrink:0}}>{APP_VERSION}</span>
            </div>
          }
        </div>
        <div className="topbar-right">
          {!authed&&(
            <button onClick={handleAuth} disabled={authLoading||!libsReady}
              style={{background:'#fff',border:'none',borderRadius:8,padding:'0.3rem',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',width:34,height:34,flexShrink:0,touchAction:'manipulation',opacity:authLoading?0.5:1}}>
              {authLoading
                ?<span style={{fontSize:14}}>⏳</span>
                :<svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/><path fill="none" d="M0 0h48v48H0z"/></svg>
              }
            </button>
          )}
          <button style={{background:'none',border:'1px solid var(--border)',borderRadius:8,padding:'0.3rem 0.6rem',color:'var(--text)',cursor:'pointer',fontSize:16,touchAction:'manipulation',display:'flex',alignItems:'center',justifyContent:'center',width:34,height:34,flexShrink:0}} onClick={()=>setShowSidebar(true)}>
            ☰
          </button>
        </div>
      </div>
      {!authed?(
        <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',flex:1,padding:'2.5rem 1.5rem',textAlign:'center',position:'relative',overflow:'hidden'}}>
          <div style={{position:'absolute',inset:0,backgroundImage:"url('bg-logo.png')",backgroundRepeat:'no-repeat',backgroundPosition:'center center',backgroundSize:'85%',opacity:0.25,pointerEvents:'none'}}></div>
          <img src="logo.png" alt="Saran Électrique" style={{width:160,height:'auto',objectFit:'contain',marginBottom:'1.25rem',position:'relative',zIndex:1}} onError={e=>e.target.style.display='none'}/>
          <div style={{fontFamily:'var(--font-head)',fontSize:'1.4rem',fontWeight:800,marginBottom:'0.25rem',position:'relative',zIndex:1}}>Saran Électrique</div>
          <div style={{color:'var(--muted)',fontSize:'0.85rem',marginBottom:'2rem',position:'relative',zIndex:1}}>Système de gestion du temps</div>
          <button className="btn-p" style={{width:'auto',padding:'0.75rem 2rem',marginTop:0,position:'relative',zIndex:1,fontSize:'0.95rem'}} onClick={handleAuth} disabled={authLoading||!libsReady||returningFromRedirect}>
            {authLoading||returningFromRedirect?'⏳ Connexion en cours...':'🔐 Se connecter avec Google'}
          </button>
          {(authLoading||returningFromRedirect)&&(
            <div style={{background:'rgba(47,129,247,0.1)',border:'1px solid var(--accent)',borderRadius:10,padding:'0.75rem 1rem',marginTop:'0.75rem',position:'relative',zIndex:1,maxWidth:280}}>
              <div style={{fontSize:13,fontWeight:600,color:'var(--accent)',marginBottom:4}}>⏳ Connexion en cours...</div>
              <div style={{fontSize:11,color:'var(--muted)'}}>Veuillez patienter quelques secondes. Ne réappuyez pas sur le bouton.</div>
            </div>
          )}
          {!libsReady&&!returningFromRedirect&&!authLoading&&<div style={{color:'var(--muted)',fontSize:11,marginTop:'0.75rem',position:'relative',zIndex:1}}>⏳ Chargement des APIs...</div>}
        </div>
      ):(
        <>
          {view==='punch'&&<WelcomeScreen emps={emps} sid={cfg.spreadsheetId} calendarIds={calendarIdsMemo} notify={notify} onRefresh={onRefresh} setNavBack={setNavBack} folders={foldersMemo}/>}
          {view==='admin'&&isBoss&&<div className="content"><AdminView sid={cfg.spreadsheetId} calendarIds={calendarIdsMemo} refreshKey={refreshKey} notify={notify} onRefresh={onRefresh}/></div>}
        </>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
