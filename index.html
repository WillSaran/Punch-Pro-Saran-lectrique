// ── ADMIN VIEW ────────────────────────────────────────────────────────────────
function AdminView({sid,calendarIds,refreshKey,notify,onRefresh}){
  const [tab,setTab]=useState('dashboard');
  const [emps,setEmps]=useState([]);
  const [pts,setPts]=useState([]);
  const [banque,setBanque]=useState([]);
  const [jobs,setJobs]=useState([]);
  const [msgs,setMsgs]=useState([]);
  const [loading,setLoading]=useState(true);
  const [showAdd,setShowAdd]=useState(false);
  const [newEmp,setNewEmp]=useState({nom:'',pin:'',code:'',couleur:EMP_COLORS[0]});
  const [selEmp,setSelEmp]=useState('');
  const [histTab,setHistTab]=useState('semaine');

  const today=new Date().toLocaleDateString('fr-CA');
  const curWeek=getWeek(new Date());
  const curMois=`${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}`;

  useEffect(()=>{
    setLoading(true);
    Promise.all([getEmployees(sid),getPointages(sid),getHeuresBanque(sid),getCalendarJobs(calendarIds),getMessages(sid)])
      .then(([e,p,b,j,m])=>{setEmps(e);setPts(p);setBanque(b);setJobs(j);setMsgs(m);setLoading(false);});
  },[refreshKey]);

  const pending=banque.filter(b=>b.statut==='pending');
  const unreadMsgs=msgs.filter(m=>!m.lu);
  const eMap=Object.fromEntries(emps.map(e=>[e.nom,e]));

  async function handleAdd(){
    if(!newEmp.nom||!newEmp.pin){notify('Remplis le nom et le PIN!','err');return;}
    try{
      const emp={...newEmp,code:newEmp.code||newEmp.nom.substring(0,2).toUpperCase()};
      notify('⏳ Sauvegarde...','warn');
      await saveEmployee(sid,emp);
      const updated=await getEmployees(sid);setEmps(updated);
      setNewEmp({nom:'',pin:'',code:'',couleur:EMP_COLORS[updated.length%EMP_COLORS.length]});
      setShowAdd(false);notify(`✅ ${emp.nom} ajouté!`,'success');onRefresh();
    }catch(e){notify('Erreur: '+e.message,'err');}
  }
  async function handleDel(emp){
    if(!confirm(`Supprimer ${emp.nom}?`))return;
    await deleteEmployee(sid,emp.row);notify('Supprimé','success');
    const u=await getEmployees(sid);setEmps(u);onRefresh();
  }
  async function handleBanque(b,statut){
    await updateBanqueStatus(sid,b.row,statut);
    notify(statut==='approved'?`✅ ${b.heures}h approuvées`:'Refusé','success');
    setBanque(await getHeuresBanque(sid));
  }
  async function handleMarkRead(msg){
    await markMessageRead(sid,msg.row);
    setMsgs(m=>m.map(x=>x.row===msg.row?{...x,lu:true}:x));
  }

  function getHist(){
    let p=selEmp?pts.filter(x=>x.nom===selEmp):pts;
    if(histTab==='today')p=p.filter(x=>x.date===today);
    else if(histTab==='semaine')p=p.filter(x=>x.semaine===curWeek);
    else if(histTab==='mois')p=p.filter(x=>x.mois===curMois);
    return p.slice().reverse().slice(0,80);
  }

  function getJobStats(){
    const map={};
    const ins=pts.filter(p=>p.type==='in'||p.type==='confirm');
    for(const pin of ins){
      const matchOut=pin.type==='confirm'?null:pts.find(po=>po.nom===pin.nom&&po.type==='out'&&new Date(po.datetime)>new Date(pin.datetime));
      const h=pin.type==='confirm'?(pin.heuresConf||pin.heuresEst||0):matchOut?Math.round((new Date(matchOut.datetime)-new Date(pin.datetime))/360000)/10:0;
      if(!pin.job)continue;
      if(!map[pin.job])map[pin.job]={job:pin.job,color:pin.jobColor||'#2f81f7',heures:0,heuresEst:0,deplacement:0,count:0,fichiers:[]};
      map[pin.job].heures+=h;map[pin.job].heuresEst+=pin.heuresEst||0;map[pin.job].deplacement+=pin.deplacement||0;map[pin.job].count++;
      if(pin.fichierURL)map[pin.job].fichiers.push(pin.fichierURL);
    }
    return Object.values(map).map(x=>({...x,heures:Math.round(x.heures*10)/10,heuresEst:Math.round(x.heuresEst*10)/10})).sort((a,b)=>b.heures-a.heures);
  }

  function getAssignees(job){
    const txt=(job.title+' '+(job.description||'')).toLowerCase();
    return emps.filter(e=>txt.includes(e.nom.toLowerCase())||txt.includes(e.code.toLowerCase()));
  }

  if(loading)return <div style={{textAlign:'center',color:'var(--muted)',padding:'3rem',fontSize:13}}>⏳ Chargement...</div>;

  const totalToday=Math.round(emps.reduce((s,e)=>s+calcH(pts.filter(p=>p.nom===e.nom&&p.date===today)),0)*10)/10;
  const totalWeek=Math.round(emps.reduce((s,e)=>s+calcH(pts.filter(p=>p.nom===e.nom&&p.semaine===curWeek)),0)*10)/10;
  const totalDep=Math.round(pts.filter(p=>p.semaine===curWeek&&(p.type==='in'||p.type==='confirm')).reduce((s,p)=>s+(p.deplacement||0),0));

  return(
    <div>
      <div className="tabs">
        {[['dashboard','📊 Dashboard'],['employes','👷 Employés'],['historique','📋 Historique'],['jobs-stats','📍 Par job'],['banque','🏦 Banque'],['messages','💬 Messages'],['agenda','📅 Agenda']].map(([k,l])=>(
          <div key={k} className={`tab${tab===k?' active':''}`} onClick={()=>setTab(k)} style={{position:'relative'}}>
            {l}
            {k==='banque'&&pending.length>0&&<span className="nav-badge">{pending.length}</span>}
            {k==='messages'&&unreadMsgs.length>0&&<span className="nav-badge">{unreadMsgs.length}</span>}
          </div>
        ))}
      </div>

      {tab==='dashboard'&&(
        <div className="admin-grid">
          <div className="card">
            <div className="csec">Aperçu du jour</div>
            <div className="stats-grid" style={{marginBottom:'1rem'}}>
              <div className="stat-box"><div className="val" style={{color:'var(--success)'}}>{emps.filter(e=>e.statut==='in').length}</div><div className="lbl">Sur place</div></div>
              <div className="stat-box"><div className="val">{totalToday}h</div><div className="lbl">Auj.</div></div>
              <div className="stat-box"><div className="val">{totalWeek}h</div><div className="lbl">Sem.</div></div>
              <div className="stat-box"><div className="val">{totalDep}m</div><div className="lbl">Dépl.</div></div>
            </div>
            <div className="csec">Statut temps réel</div>
            <div className="status-grid">
              {emps.map(emp=>(
                <div key={emp.nom} className="semp">
                  <div style={{width:8,height:8,borderRadius:'50%',background:emp.statut==='in'?emp.couleur:'var(--muted)',boxShadow:emp.statut==='in'?`0 0 4px ${emp.couleur}`:'none',flexShrink:0}}></div>
                  <div>
                    <div style={{fontSize:11,fontWeight:500,display:'flex',alignItems:'center',gap:4}}>
                      <span style={{background:rgba(emp.couleur,0.2),color:emp.couleur,borderRadius:4,padding:'0 3px',fontSize:9,fontWeight:700}}>{emp.code}</span>{emp.nom}
                    </div>
                    <div style={{fontSize:10,color:'var(--muted)'}}>{emp.statut==='in'?'✓ Présent':'Absent'}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>
          <div className="card">
            <div className="csec">Heures semaine</div>
            {emps.map(emp=>{
              const h=calcH(pts.filter(p=>p.nom===emp.nom&&p.semaine===curWeek));
              const dep=Math.round(pts.filter(p=>p.nom===emp.nom&&p.semaine===curWeek&&(p.type==='in'||p.type==='confirm')).reduce((s,p)=>s+(p.deplacement||0),0));
              return(
                <div key={emp.nom} className="wbar-wrap">
                  <div className="wbar-label">
                    <span style={{display:'flex',alignItems:'center',gap:5}}>
                      <span style={{width:7,height:7,borderRadius:'50%',background:emp.couleur,display:'inline-block'}}></span>
                      {emp.nom} <span style={{fontSize:9,background:rgba(emp.couleur,0.2),color:emp.couleur,padding:'0 3px',borderRadius:3}}>{emp.code}</span>
                    </span>
                    <span style={{display:'flex',gap:6,color:h>40?'var(--warning)':'var(--muted)',fontSize:11}}>
                      <span>{h}h{h>40?` (+${Math.round((h-40)*10)/10}h)`:''}</span>
                      {dep>0&&<span style={{color:'var(--warning)'}}>🚗{dep}m</span>}
                    </span>
                  </div>
                  <div className="wbar"><div className={`wbar-fill${h>40?' ot':''}`} style={{width:`${Math.min(100,(h/40)*100)}%`,background:h>40?undefined:emp.couleur}}></div></div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {tab==='employes'&&(
        <div className="card" style={{maxWidth:540}}>
          <div className="section-head">
            <div className="card-title" style={{marginBottom:0}}>Employés ({emps.length})</div>
            <button className="btn-s" onClick={()=>setShowAdd(!showAdd)}>+ Ajouter</button>
          </div>
          {showAdd&&(
            <div className="add-form">
              <div className="add-row">
                <div><span className="fl">Nom complet</span><input placeholder="Jean Tremblay" value={newEmp.nom} onChange={e=>setNewEmp(p=>({...p,nom:e.target.value}))}/></div>
                <div><span className="fl">Code</span><input placeholder="JT" maxLength={3} value={newEmp.code} onChange={e=>setNewEmp(p=>({...p,code:e.target.value.toUpperCase()}))}/></div>
                <div><span className="fl">PIN</span><input placeholder="1234" maxLength={6} value={newEmp.pin} onChange={e=>setNewEmp(p=>({...p,pin:e.target.value}))}/></div>
              </div>
              <div style={{marginBottom:'0.55rem'}}>
                <span className="fl">Couleur</span>
                <div className="color-row">{EMP_COLORS.map(c=><div key={c} className="cswatch" style={{background:c,border:`2px solid ${newEmp.couleur===c?'#fff':'transparent'}`}} onClick={()=>setNewEmp(p=>({...p,couleur:c}))}/>)}</div>
              </div>
              <button className="btn-p" style={{marginTop:0}} onClick={handleAdd}>✓ Sauvegarder</button>
            </div>
          )}
          <div style={{marginTop:'0.7rem'}}>
            {emps.map(emp=>(
              <div key={emp.nom} className="emp-row">
                <div className="emp-av" style={{background:emp.couleur}}>{emp.code}</div>
                <div style={{flex:1,marginLeft:'0.55rem'}}>
                  <div style={{fontSize:12,fontWeight:500}}>{emp.nom}</div>
                  <div style={{fontSize:10,color:'var(--muted)',fontFamily:'monospace'}}>PIN: {emp.pin} · {emp.code}</div>
                </div>
                <span className={`badge ${emp.statut==='in'?'badge-in':'badge-out'}`}>{emp.statut==='in'?'Présent':'Absent'}</span>
                <button className="btn-icon" onClick={()=>handleDel(emp)}>✕</button>
              </div>
            ))}
            {emps.length===0&&<div style={{color:'var(--muted)',textAlign:'center',padding:'1.5rem',fontSize:13}}>Aucun employé — cliquez "+ Ajouter"</div>}
          </div>
        </div>
      )}

      {tab==='historique'&&(
        <div className="card">
          <div style={{display:'flex',gap:'0.55rem',alignItems:'center',flexWrap:'wrap',marginBottom:'0.75rem'}}>
            <select value={selEmp} onChange={e=>setSelEmp(e.target.value)} style={{background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:6,padding:'0.3rem 0.55rem',color:'var(--text)',fontSize:12}}>
              <option value="">Tous</option>
              {emps.map(e=><option key={e.nom} value={e.nom}>{e.nom}</option>)}
            </select>
            <div className="tabs" style={{margin:0}}>
              {[['today',"Auj."],['semaine','Semaine'],['mois','Mois'],['all','Tout']].map(([k,l])=>(
                <div key={k} className={`tab${histTab===k?' active':''}`} onClick={()=>setHistTab(k)}>{l}</div>
              ))}
            </div>
          </div>
          <div style={{overflowX:'auto'}}>
            <table className="htable" style={{minWidth:650}}>
              <thead><tr><th>Employé</th><th>Type</th><th>Date</th><th>Heure</th><th>Job</th><th>Dépl.</th><th>H.Est</th><th>H.Conf</th><th>Note</th><th>Fichier</th></tr></thead>
              <tbody>
                {getHist().map((p,i)=>{
                  const emp=eMap[p.nom];
                  return(
                    <tr key={i}>
                      <td><div style={{display:'flex',alignItems:'center',gap:5}}>{emp&&<div className="emp-av" style={{background:emp.couleur,width:18,height:18,fontSize:7}}>{emp.code}</div>}{p.nom}</div></td>
                      <td><span className={`badge ${p.type==='in'?'badge-in':p.type==='out'?'badge-out':'badge-conf'}`}>{p.type==='in'?'IN':p.type==='out'?'OUT':'CONF'}</span></td>
                      <td style={{whiteSpace:'nowrap'}}>{p.date}</td><td>{p.heure}</td>
                      <td><div style={{display:'flex',alignItems:'center',gap:4}}>{p.jobColor&&<div style={{width:7,height:7,borderRadius:'50%',background:p.jobColor,flexShrink:0}}></div>}<span style={{fontSize:11,maxWidth:90,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.job||'—'}</span></div></td>
                      <td style={{fontSize:11}}>{p.deplacement>0?`🚗${p.deplacement}m`:'—'}</td>
                      <td style={{fontSize:11}}>{p.heuresEst>0?`${p.heuresEst}h`:'—'}</td>
                      <td style={{fontSize:11}}>{p.heuresConf>0?`${p.heuresConf}h`:'—'}</td>
                      <td style={{fontSize:11,color:'var(--muted)',maxWidth:80,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.note||'—'}</td>
                      <td>{p.fichierURL?<a href={p.fichierURL} target="_blank" rel="noreferrer" style={{color:'var(--accent)',fontSize:11}}>📎</a>:'—'}</td>
                    </tr>
                  );
                })}
                {getHist().length===0&&<tr><td colSpan={10} style={{textAlign:'center',color:'var(--muted)',padding:'1rem'}}>Aucun pointage</td></tr>}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {tab==='jobs-stats'&&(
        <div className="card">
          <div className="card-title">Heures par job / chantier</div>
          <table className="htable">
            <thead><tr><th>Job</th><th>Heures réelles</th><th>H. estimées</th><th>Déplacements</th><th>Punchages</th><th>Fichiers</th></tr></thead>
            <tbody>
              {getJobStats().map((j,i)=>(
                <tr key={i}>
                  <td><div style={{display:'flex',alignItems:'center',gap:6}}><div style={{width:9,height:9,borderRadius:'50%',background:j.color,flexShrink:0}}></div><span style={{fontWeight:500}}>{j.job}</span></div></td>
                  <td><strong>{j.heures}h</strong></td>
                  <td style={{color:'var(--muted)'}}>{j.heuresEst>0?`${j.heuresEst}h`:'—'}</td>
                  <td>{j.deplacement>0?`🚗 ${j.deplacement}m`:'—'}</td>
                  <td>{j.count}</td>
                  <td>{j.fichiers.length>0?j.fichiers.map((url,fi)=><a key={fi} href={url} target="_blank" rel="noreferrer" style={{color:'var(--accent)',fontSize:11,marginRight:4}}>📎</a>):'—'}</td>
                </tr>
              ))}
              {getJobStats().length===0&&<tr><td colSpan={6} style={{textAlign:'center',color:'var(--muted)',padding:'1rem'}}>Aucune donnée par job</td></tr>}
            </tbody>
          </table>
        </div>
      )}

      {tab==='banque'&&(
        <div>
          {pending.length>0&&(
            <div className="card" style={{marginBottom:'0.85rem',borderColor:'rgba(210,153,34,0.3)'}}>
              <div className="card-title">⚠️ Approbations en attente ({pending.length})</div>
              {pending.map(b=>{
                const emp=eMap[b.nom];
                return(
                  <div key={b.row} className="bank-row">
                    <div style={{display:'flex',alignItems:'center',gap:7}}>
                      {emp&&<div className="emp-av" style={{background:emp.couleur}}>{emp.code}</div>}
                      <div><div style={{fontWeight:500,fontSize:12}}>{b.nom}</div><div style={{fontSize:10,color:'var(--muted)'}}>Sem. {b.semaine}</div></div>
                    </div>
                    <div style={{fontFamily:'var(--font-head)',fontWeight:700,color:'var(--warning)'}}>+{b.heures}h</div>
                    <div style={{display:'flex',gap:4}}>
                      <button className="btn-sm btn-approve" onClick={()=>handleBanque(b,'approved')}>✓</button>
                      <button className="btn-sm btn-deny" onClick={()=>handleBanque(b,'denied')}>✕</button>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
          <div className="card">
            <div className="card-title">Historique heures en banque</div>
            <table className="htable">
              <thead><tr><th>Employé</th><th>Semaine</th><th>Heures</th><th>Statut</th><th>Date</th></tr></thead>
              <tbody>
                {banque.map((b,i)=>(
                  <tr key={i}><td>{b.nom}</td><td>{b.semaine}</td><td>+{b.heures}h</td>
                    <td><span className={`badge ${b.statut==='approved'?'badge-in':b.statut==='pending'?'badge-pend':'badge-out'}`}>{b.statut==='approved'?'Approuvé':b.statut==='pending'?'En attente':'Refusé'}</span></td>
                    <td>{b.date}</td></tr>
                ))}
                {banque.length===0&&<tr><td colSpan={5} style={{textAlign:'center',color:'var(--muted)',padding:'1rem'}}>Aucune</td></tr>}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {tab==='messages'&&(
        <div className="card">
          <div className="section-head">
            <div className="card-title" style={{marginBottom:0}}>Messages employés {unreadMsgs.length>0&&<span style={{background:'var(--danger)',color:'#fff',borderRadius:8,padding:'1px 7px',fontSize:11,marginLeft:6}}>{unreadMsgs.length}</span>}</div>
            {unreadMsgs.length>0&&<button className="btn-s" style={{fontSize:11}} onClick={async()=>{for(const m of unreadMsgs)await markMessageRead(sid,m.row);setMsgs(ms=>ms.map(x=>({...x,lu:true})));notify('Tout marqué comme lu','success');}}>Tout lire</button>}
          </div>
          {msgs.length===0?<div style={{color:'var(--muted)',fontSize:13,padding:'1rem 0'}}>Aucun message.</div>:
          msgs.map((msg,i)=>(
            <div key={i} className={`msg-card${msg.lu?' read':''}`}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:8}}>
                <div>
                  <div style={{fontSize:12,fontWeight:600}}>{msg.de} — <span style={{color:'var(--warning)'}}>{msg.action}</span></div>
                  <div style={{fontSize:11,color:'var(--muted)',marginTop:2}}>{msg.details}</div>
                  <div style={{fontSize:10,color:'var(--muted)',marginTop:3}}>{new Date(msg.datetime).toLocaleDateString('fr-CA')} {new Date(msg.datetime).toLocaleTimeString('fr-CA',{hour:'2-digit',minute:'2-digit'})}</div>
                </div>
                {!msg.lu&&<button className="btn-sm" style={{background:'var(--bg2)',border:'1px solid var(--border)',color:'var(--muted)',flexShrink:0}} onClick={()=>handleMarkRead(msg)}>✓ Lu</button>}
              </div>
            </div>
          ))}
        </div>
      )}

      {tab==='agenda'&&(
        <div className="card">
          <div className="card-title">Agenda — 14 prochains jours</div>
          {jobs.length===0?<div style={{color:'var(--muted)',fontSize:13}}>Aucun événement.</div>:
          jobs.map(j=>{
            const ass=getAssignees(j);
            return(
              <div key={j.id} className="job-item" style={{borderLeftColor:j.gcalColor}}>
                <div style={{display:'flex',alignItems:'center',gap:7}}>
                  <div style={{width:9,height:9,borderRadius:'50%',background:j.gcalColor,flexShrink:0}}></div>
                  <div style={{fontWeight:600,fontSize:13}}>{j.title}</div>
                </div>
                <div style={{fontSize:11,color:'var(--muted)',marginTop:2,marginLeft:16}}>{new Date(j.start).toLocaleDateString('fr-CA',{weekday:'long',month:'long',day:'numeric'})} {j.location?`· ${j.location}`:''}</div>
                {ass.length>0&&<div style={{marginTop:4,marginLeft:16}}>{ass.map(a=><span key={a.nom} className="achip" style={{background:rgba(a.couleur,0.2),color:a.couleur}}><span style={{width:6,height:6,borderRadius:'50%',background:a.couleur,display:'inline-block'}}></span>{a.nom}</span>)}</div>}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ── MAIN APP ─────────────────────────────────────────────────────────────────
function App(){
  const [cfg,setCfg]=useState(()=>{try{return JSON.parse(localStorage.getItem('pp_cfg')||'null');}catch{return null;}});
  const [showCfg,setShowCfg]=useState(!cfg);
  const [authed,setAuthed]=useState(false);
  const [userEmail,setUserEmail]=useState('');
  const [isBoss,setIsBoss]=useState(false);
  const [view,setView]=useState('punch');
  const [emps,setEmps]=useState([]);
  const [refreshKey,setRefreshKey]=useState(0);
  const [notif,setNotif]=useState(null);
  const [authLoading,setAuthLoading]=useState(false);
  const [libsReady,setLibsReady]=useState(false);
  const [unreadCount,setUnreadCount]=useState(0);

  function notify(msg,type='success'){setNotif({msg,type,id:Date.now()});}
  function onRefresh(){setRefreshKey(k=>k+1);}

  function getCalendarIds(){
    if(!cfg?.calendarIds)return['primary'];
    const ids=cfg.calendarIds.split(',').map(e=>e.trim()).filter(Boolean);
    return ids.length?ids:['primary'];
  }

  async function onToken(resp){
    if(resp.error){setAuthLoading(false);notify('Erreur: '+resp.error,'err');return;}
    let email='';
    try{
      const token=gapi.client.getToken();
      if(token?.access_token){
        const r=await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{'Authorization':'Bearer '+token.access_token}});
        const d=await r.json();email=(d.email||'').toLowerCase().trim();
      }
    }catch(e){console.error(e);}
    const boss=BOSS_EMAILS.includes(email);
    setUserEmail(email||'connecté');setIsBoss(boss);setView('punch');
    let cur;try{cur=JSON.parse(localStorage.getItem('pp_cfg')||'null');}catch{cur=cfg;}
    await ensureStructure(cur.spreadsheetId);
    setEmps(await getEmployees(cur.spreadsheetId));
    if(boss){const m=await getMessages(cur.spreadsheetId);setUnreadCount(m.filter(x=>!x.lu).length);}
    setAuthed(true);setAuthLoading(false);
    notify(`✅ ${email}${boss?' 👑 Admin':''}`, 'success');onRefresh();
  }

  async function loadLibs(config){
    try{await initLibs(config,onToken);setLibsReady(true);}
    catch(e){console.error(e);notify('Erreur APIs Google','err');}
  }

  useEffect(()=>{if(cfg)loadLibs(cfg);},[cfg]);
  useEffect(()=>{if(authed&&cfg)getEmployees(cfg.spreadsheetId).then(setEmps);},[refreshKey,authed]);

  function handleAuth(){
    if(!libsReady){notify('APIs en chargement...','warn');return;}
    setAuthLoading(true);tokenClient.requestAccessToken({prompt:'select_account'});
  }
  function handleSaveCfg(config){
    localStorage.setItem('pp_cfg',JSON.stringify(config));
    setCfg(config);setShowCfg(false);setAuthed(false);setLibsReady(false);tokenClient=null;loadLibs(config);
  }
  function handleSwitch(){
    setAuthed(false);setUserEmail('');setIsBoss(false);setAuthLoading(true);
    tokenClient.requestAccessToken({prompt:'select_account'});
  }
  function handleReset(){
    if(!confirm('Réinitialiser?'))return;
    localStorage.removeItem('pp_cfg');setCfg(null);setAuthed(false);setShowCfg(true);setLibsReady(false);tokenClient=null;
  }

  return(
    <div className="app-wrap">
      {showCfg&&<ConfigModal initial={cfg} onSave={handleSaveCfg}/>}
      {notif&&<Notif key={notif.id} msg={notif.msg} type={notif.type} onClose={()=>setNotif(null)}/>}
      <div className="topbar">
        <div className="logo">⚡ Saran Électrique</div>
        <div className="topbar-right">
          {authed?(
            <>
              <div className="online-badge"><div className="online-dot"></div><span style={{maxWidth:80,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{userEmail.split('@')[0]}</span></div>
              <div className="nav-tabs">
                <div className={`nav-tab${view==='punch'?' active':''}`} onClick={()=>setView('punch')}>Punch</div>
                {isBoss&&(
                  <div className={`nav-tab admin${view==='admin'?' active':''}`} onClick={()=>setView('admin')} style={{position:'relative'}}>
                    Admin
                    {unreadCount>0&&<span className="nav-badge">{unreadCount}</span>}
                  </div>
                )}
              </div>
              <button className="btn-s" style={{fontSize:11,padding:'0.22rem 0.5rem'}} onClick={onRefresh}>↻</button>
            </>
          ):(
            <button className="btn-p" style={{width:'auto',padding:'0.38rem 0.9rem',fontSize:12,marginTop:0}} onClick={handleAuth} disabled={authLoading||!libsReady}>
              {authLoading?'⏳':'🔐 Connexion'}
            </button>
          )}
          <SettingsMenu userEmail={userEmail} isBoss={isBoss} onSwitch={handleSwitch} onEditCfg={()=>setShowCfg(true)} onReset={handleReset}/>
        </div>
      </div>
      {!authed?(
        <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',flex:1,padding:'2.5rem 1.5rem',textAlign:'center'}}>
          <div style={{fontSize:'2.8rem',marginBottom:'0.55rem'}}>⚡</div>
          <div style={{fontFamily:'var(--font-head)',fontSize:'1.5rem',fontWeight:800,marginBottom:'0.2rem'}}>Saran Électrique</div>
          <div style={{color:'var(--muted)',fontSize:'0.85rem',marginBottom:'1.75rem'}}>Système de gestion du temps</div>
          <button className="btn-p" style={{width:'auto',padding:'0.65rem 1.75rem',marginTop:0}} onClick={handleAuth} disabled={authLoading||!libsReady}>
            {authLoading?'⏳ Connexion...':'🔐 Se connecter avec Google'}
          </button>
          {!libsReady&&cfg&&<div style={{color:'var(--muted)',fontSize:11,marginTop:'0.75rem'}}>⏳ Chargement APIs...</div>}
        </div>
      ):(
        <>
          {view==='punch'&&<WelcomeScreen emps={emps} sid={cfg.spreadsheetId} calendarIds={getCalendarIds()} notify={notify} onRefresh={onRefresh}/>}
          {view==='admin'&&isBoss&&<div className="content"><AdminView sid={cfg.spreadsheetId} calendarIds={getCalendarIds()} refreshKey={refreshKey} notify={notify} onRefresh={onRefresh}/></div>}
        </>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
