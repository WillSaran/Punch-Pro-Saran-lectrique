<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>PunchPro — Saran Électrique</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--bg2:#161b22;--bg3:#1c2333;--bg4:#21262d;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#e6edf3;--muted:#7d8590;
  --accent:#2f81f7;--accent2:#6e40c9;
  --success:#3fb950;--warning:#d29922;--danger:#f85149;
  --font-head:'Syne',sans-serif;--font-body:'DM Sans',sans-serif;
  --topbar-h:50px;
}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:14px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased}
#root{min-height:100vh}
button{font-family:var(--font-body)}

/* OVERLAY */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.88);display:flex;align-items:center;justify-content:center;z-index:1000;padding:1rem;overflow-y:auto}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:16px;padding:1.75rem;max-width:500px;width:100%}
.modal-title{font-family:var(--font-head);font-size:1.4rem;font-weight:800;margin-bottom:0.2rem;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.modal-sub{color:var(--muted);font-size:12px;margin-bottom:1.25rem}
.fg{margin-bottom:0.85rem}
.fg label{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:0.3rem}
.fg input,.fg select,.fg textarea{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:0.55rem 0.75rem;color:var(--text);font-family:var(--font-body);font-size:13px;outline:none;transition:border-color 0.2s}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--accent)}
.fg small{display:block;margin-top:0.28rem;font-size:11px;color:var(--muted)}
.fg textarea{resize:vertical;min-height:55px}
.btn-p{width:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:8px;padding:0.7rem;color:#fff;font-family:var(--font-head);font-size:14px;font-weight:700;cursor:pointer;transition:opacity 0.2s;margin-top:0.4rem}
.btn-p:hover{opacity:0.88}.btn-p:disabled{opacity:0.4;cursor:not-allowed}
.btn-s{background:transparent;border:1px solid var(--border2);border-radius:8px;padding:0.5rem 0.9rem;color:var(--text);font-size:12px;cursor:pointer;transition:background 0.2s;white-space:nowrap}
.btn-s:hover{background:var(--bg3)}
.btn-danger{background:rgba(248,81,73,0.12);border:1px solid rgba(248,81,73,0.3);border-radius:8px;padding:0.5rem 0.9rem;color:var(--danger);font-size:12px;cursor:pointer;transition:background 0.2s}
.btn-danger:hover{background:rgba(248,81,73,0.2)}

/* TOPBAR */
.app-wrap{min-height:100vh;display:flex;flex-direction:column}
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 1rem;height:var(--topbar-h);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{font-family:var(--font-head);font-size:0.95rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}
.topbar-right{display:flex;align-items:center;gap:0.4rem}
.nav-tabs{display:flex;background:var(--bg3);border-radius:8px;padding:2px;border:1px solid var(--border)}
.nav-tab{padding:0.26rem 0.7rem;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--muted);transition:all 0.2s;white-space:nowrap;position:relative}
.nav-tab.active{background:var(--accent);color:#fff}
.nav-tab.admin.active{background:linear-gradient(135deg,#b7860b,var(--warning));color:#000}
.nav-badge{position:absolute;top:-5px;right:-5px;background:var(--danger);color:#fff;border-radius:10px;font-size:9px;font-weight:700;padding:1px 5px;min-width:16px;text-align:center}
.online-badge{display:flex;align-items:center;gap:4px;background:rgba(63,185,80,0.1);border:1px solid rgba(63,185,80,0.2);border-radius:20px;padding:0.2rem 0.55rem;font-size:11px;color:var(--success);white-space:nowrap}
.online-dot{width:5px;height:5px;border-radius:50%;background:var(--success);box-shadow:0 0 4px var(--success)}
.settings-wrap{position:relative}
.settings-btn{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:0.28rem 0.6rem;color:var(--muted);cursor:pointer;font-size:13px;transition:all 0.2s;line-height:1}
.settings-btn:hover{border-color:var(--border2);color:var(--text)}
.settings-menu{position:absolute;top:calc(100% + 6px);right:0;background:var(--bg2);border:1px solid var(--border2);border-radius:12px;padding:0.4rem;min-width:230px;box-shadow:0 8px 32px rgba(0,0,0,0.6);z-index:200}
.si{display:flex;align-items:center;gap:0.55rem;padding:0.45rem 0.6rem;border-radius:6px;cursor:pointer;font-size:12px;color:var(--text);transition:background 0.15s;white-space:nowrap;border:none;background:transparent;width:100%;text-align:left}
.si:hover{background:var(--bg3)}.si.danger:hover{background:rgba(248,81,73,0.1);color:var(--danger)}
.si .ico{font-size:13px;width:16px;text-align:center}
.sdiv{height:1px;background:var(--border);margin:0.28rem 0}
.ssec{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;padding:0.28rem 0.6rem 0.12rem}
.acct-card{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:0.5rem 0.6rem;margin:0.28rem 0}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:0.45rem 0.6rem;border-radius:6px}
.toggle{width:36px;height:20px;border-radius:10px;background:var(--bg3);border:1px solid var(--border2);position:relative;cursor:pointer;transition:background 0.2s}
.toggle.on{background:var(--accent)}
.toggle-knob{width:14px;height:14px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;transition:left 0.2s}
.toggle.on .toggle-knob{left:18px}

/* CONTENT */
.content{flex:1;padding:1.1rem;max-width:1080px;margin:0 auto;width:100%}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:1.1rem}
.card-title{font-family:var(--font-head);font-size:0.92rem;font-weight:700;margin-bottom:0.75rem}
.csec{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.09em;color:var(--muted);margin-bottom:0.55rem}

/* WELCOME — MOBILE FIRST */
.welcome{min-height:calc(100vh - var(--topbar-h));display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:1.25rem 1rem;text-align:center;overflow-y:auto}
.w-time{font-family:var(--font-head);font-size:3rem;font-weight:800;letter-spacing:-2px;line-height:1;margin-top:0.5rem}
.w-date{font-size:12px;color:var(--muted);margin:0.25rem 0 1.5rem}

/* EMP CARDS */
.emp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:0.45rem;max-width:600px;width:100%}
.emp-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:0.85rem 0.5rem;cursor:pointer;transition:all 0.18s;text-align:center;-webkit-tap-highlight-color:transparent}
.emp-card:active{transform:scale(0.96)}
.emp-card:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,0.35)}
.emp-av-lg{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;margin:0 auto 0.4rem}

/* MODE SELECT */
.mode-wrap{max-width:360px;width:100%;text-align:left}
.mode-btn{display:flex;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:1rem 1.1rem;cursor:pointer;transition:all 0.18s;width:100%;margin-bottom:0.5rem;-webkit-tap-highlight-color:transparent}
.mode-btn:hover,.mode-btn:active{border-color:var(--accent);background:rgba(47,129,247,0.06)}
.mode-icon{font-size:1.6rem;flex-shrink:0}
.mode-info .mode-title{font-family:var(--font-head);font-weight:700;font-size:0.9rem}
.mode-info .mode-desc{font-size:11px;color:var(--muted);margin-top:2px}

/* JOB SELECTOR */
.job-wrap{max-width:520px;width:100%;text-align:left}
.job-btn{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:0.65rem 0.85rem;cursor:pointer;transition:all 0.18s;width:100%;margin-bottom:0.32rem;-webkit-tap-highlight-color:transparent}
.job-btn:active{transform:scale(0.98)}
.job-color-bar{width:4px;min-height:34px;border-radius:2px;flex-shrink:0;align-self:stretch}

/* DURATION PICKER */
.dur-wrap{max-width:360px;width:100%;text-align:left}
.dur-section{background:var(--bg3);border-radius:10px;padding:0.8rem;margin-bottom:0.6rem}
.dur-row{display:flex;align-items:center;justify-content:center;gap:0.75rem;margin-top:0.4rem}
.dur-btn{width:36px;height:36px;border-radius:8px;background:var(--bg2);border:1px solid var(--border);color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.dur-btn:active{transform:scale(0.92);border-color:var(--accent)}
.dur-val{font-family:var(--font-head);font-size:1.6rem;font-weight:800;color:var(--accent);min-width:44px;text-align:center}
.travel-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:0.35rem;margin-top:0.4rem}
.travel-opt{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:0.45rem;cursor:pointer;text-align:center;transition:all 0.15s;-webkit-tap-highlight-color:transparent}
.travel-opt:active{transform:scale(0.94)}
.travel-opt.sel{border-color:var(--accent);background:rgba(47,129,247,0.12)}
.travel-opt .tv{font-family:var(--font-head);font-size:0.95rem;font-weight:800;color:var(--accent)}
.travel-opt .tl{font-size:9px;color:var(--muted)}

/* FILE UPLOAD */
.file-zone{border:1px dashed var(--border2);border-radius:8px;padding:0.75rem;text-align:center;cursor:pointer;transition:all 0.2s;-webkit-tap-highlight-color:transparent}
.file-zone:active{border-color:var(--accent);background:rgba(47,129,247,0.05)}

/* PIN */
.pin-wrap{background:var(--bg2);border:1px solid var(--border2);border-radius:14px;padding:1.1rem;max-width:280px;width:100%}
.pin-display{background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:0.6rem 1rem;text-align:center;font-family:var(--font-head);font-size:1.6rem;letter-spacing:0.5rem;margin-bottom:0.75rem;min-height:50px;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0.38rem}
.pin-key{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:0.75rem;font-family:var(--font-head);font-size:1.1rem;font-weight:700;color:var(--text);cursor:pointer;text-align:center;transition:all 0.12s;user-select:none;-webkit-tap-highlight-color:transparent}
.pin-key:active{transform:scale(0.92);background:var(--bg4)}
.pin-key.del{color:var(--danger)}.pin-key.zero{grid-column:2}
.pin-back{background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer;margin-top:0.55rem;text-align:center;width:100%;text-decoration:underline;padding:0}

/* PUNCH RESULT */
.punch-result{padding:1.1rem;border-radius:14px;text-align:center;max-width:320px;width:100%;animation:popIn 0.25s ease}
.punch-result.ok{background:rgba(63,185,80,0.07);border:1px solid rgba(63,185,80,0.3)}
.punch-result.err{background:rgba(248,81,73,0.07);border:1px solid rgba(248,81,73,0.25)}
@keyframes popIn{from{transform:scale(0.92);opacity:0}to{transform:scale(1);opacity:1}}
.pbadge{display:inline-block;padding:0.25rem 0.75rem;border-radius:20px;font-size:11px;font-weight:700;margin:0.28rem 0.15rem}
.pbadge.in{background:rgba(63,185,80,0.18);color:var(--success)}
.pbadge.out{background:rgba(248,81,73,0.14);color:var(--danger)}
.pbadge.confirm{background:rgba(110,64,201,0.18);color:#a78bfa}
.pbadge.travel{background:rgba(210,153,34,0.18);color:var(--warning)}
.punch-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0.28rem;margin-top:0.65rem}
.ps{background:var(--bg3);border-radius:8px;padding:0.4rem;text-align:center}
.ps .v{font-family:var(--font-head);font-size:0.85rem;font-weight:800;color:var(--accent)}
.ps .l{font-size:9px;color:var(--muted);text-transform:uppercase;margin-top:1px}

/* EMPLOYEE HISTORY */
.hist-line{background:var(--bg3);border-radius:10px;padding:0.7rem 0.85rem;margin-bottom:0.4rem;border-left:3px solid var(--border2)}
.hist-line.has-ot{border-left-color:var(--warning)}
.hist-header{display:flex;align-items:center;justify-content:space-between;gap:0.5rem;flex-wrap:wrap}
.hist-job{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:3px}
.hist-actions{display:flex;gap:0.35rem;margin-top:0.5rem}
.hist-edit-form{background:var(--bg2);border-radius:8px;padding:0.75rem;margin-top:0.5rem;border:1px solid var(--border2)}

/* COMMON */
.emp-av{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:9px;color:#fff;flex-shrink:0}
.job-item{padding:0.6rem 0.75rem;background:var(--bg3);border-radius:8px;margin-bottom:0.32rem;border-left:3px solid var(--accent)}
.achip{display:inline-flex;align-items:center;gap:3px;padding:2px 6px;border-radius:8px;font-size:10px;font-weight:600;margin-top:4px;margin-right:3px}
.status-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:0.4rem}
.semp{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:0.5rem 0.65rem;display:flex;align-items:center;gap:0.4rem}
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0.5rem}
@media(min-width:500px){.stats-grid{grid-template-columns:repeat(4,1fr)}}
.stat-box{background:var(--bg3);border-radius:8px;padding:0.7rem;text-align:center}
.stat-box .val{font-family:var(--font-head);font-size:1.2rem;font-weight:800;color:var(--accent)}
.stat-box .lbl{font-size:10px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:0.05em}
.htable{width:100%;border-collapse:collapse;font-size:12px}
.htable th{text-align:left;padding:0.38rem 0.55rem;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:0.07em;border-bottom:1px solid var(--border)}
.htable td{padding:0.42rem 0.55rem;border-bottom:1px solid var(--border);vertical-align:middle}
.htable tr:last-child td{border-bottom:none}
.badge{display:inline-block;padding:2px 6px;border-radius:7px;font-size:10px;font-weight:600}
.badge-in{background:rgba(63,185,80,0.15);color:var(--success)}
.badge-out{background:rgba(248,81,73,0.12);color:var(--danger)}
.badge-pend{background:rgba(210,153,34,0.15);color:var(--warning)}
.badge-conf{background:rgba(110,64,201,0.15);color:#a78bfa}
.tabs{display:flex;gap:0.18rem;margin-bottom:0.75rem;background:var(--bg3);border-radius:8px;padding:3px;border:1px solid var(--border);width:fit-content;flex-wrap:wrap}
.tab{padding:0.28rem 0.72rem;border-radius:6px;font-size:11px;font-weight:500;cursor:pointer;border:none;background:transparent;color:var(--muted);transition:all 0.2s}
.tab.active{background:var(--accent);color:#fff}
.bank-row{display:flex;align-items:center;justify-content:space-between;padding:0.55rem 0.65rem;background:var(--bg3);border-radius:8px;margin-bottom:0.32rem;border:1px solid var(--border);gap:0.45rem;flex-wrap:wrap}
.btn-sm{padding:0.2rem 0.55rem;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;border:none;transition:opacity 0.2s}
.btn-sm:hover{opacity:0.8}
.btn-approve{background:rgba(63,185,80,0.18);color:var(--success)}
.btn-deny{background:rgba(248,81,73,0.14);color:var(--danger)}
.admin-grid{display:grid;grid-template-columns:1fr;gap:1rem}
@media(min-width:700px){.admin-grid{grid-template-columns:1fr 1fr}}
.full-w{grid-column:1/-1}
.emp-row{display:flex;align-items:center;padding:0.5rem 0.6rem;background:var(--bg3);border-radius:8px;margin-bottom:0.28rem;gap:0.4rem}
.btn-icon{background:transparent;border:1px solid var(--border);border-radius:6px;padding:3px 6px;color:var(--muted);cursor:pointer;font-size:11px;transition:all 0.2s;margin-left:auto}
.btn-icon:hover{border-color:var(--danger);color:var(--danger)}
.add-form{background:var(--bg3);border-radius:8px;padding:0.75rem;margin-top:0.55rem;border:1px solid var(--border2)}
.add-row{display:grid;grid-template-columns:2fr 1fr 1fr;gap:0.38rem;margin-bottom:0.55rem}
.add-form input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:0.4rem 0.55rem;color:var(--text);font-family:var(--font-body);font-size:12px;outline:none}
.add-form input:focus{border-color:var(--accent)}
.fl{display:block;font-size:10px;color:var(--muted);margin-bottom:3px}
.color-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.cswatch{width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform 0.12s}
.cswatch:hover{transform:scale(1.25)}
.wbar-wrap{margin-bottom:0.72rem}
.wbar-label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:3px;align-items:center}
.wbar{height:5px;background:var(--bg3);border-radius:3px;overflow:hidden}
.wbar-fill{height:100%;border-radius:3px;transition:width 0.5s ease}
.wbar-fill.ot{background:linear-gradient(90deg,var(--warning),var(--danger)) !important}
.notif{position:fixed;top:1rem;right:1rem;background:var(--bg2);border:1px solid var(--border2);border-radius:8px;padding:0.55rem 0.9rem;font-size:12px;z-index:999;max-width:280px;box-shadow:0 4px 20px rgba(0,0,0,0.5);animation:slideIn 0.3s ease;cursor:pointer}
.notif.success{border-color:rgba(63,185,80,0.4)}.notif.warn{border-color:rgba(210,153,34,0.4)}.notif.err{border-color:rgba(248,81,73,0.4)}
@keyframes slideIn{from{transform:translateX(18px);opacity:0}to{transform:translateX(0);opacity:1}}
.scroll-area{overflow-y:auto}
.scroll-area::-webkit-scrollbar{width:3px}
.scroll-area::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.note-input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:0.48rem 0.65rem;color:var(--text);font-family:var(--font-body);font-size:12px;outline:none;resize:none}
.note-input:focus{border-color:var(--accent)}
.step-back{background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer;text-decoration:underline;padding:0;margin-bottom:0.75rem;display:block}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.75rem}

/* MSG CARD */
.msg-card{background:var(--bg3);border-radius:8px;padding:0.65rem 0.75rem;margin-bottom:0.38rem;border-left:3px solid var(--warning)}
.msg-card.read{border-left-color:var(--border);opacity:0.6}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const EMP_COLORS=['#2f81f7','#6e40c9','#3fb950','#d29922','#f85149','#0ea5e9','#ec4899','#a855f7','#22c55e','#f97316'];
const GCAL_COLORS={'1':'#7986cb','2':'#33b679','3':'#8e24aa','4':'#e67c73','5':'#f6c026','6':'#f5511d','7':'#039be5','8':'#616161','9':'#3f51b5','10':'#0b8043','11':'#d50000','':'#2f81f7'};
const BOSS_EMAILS=['info@saranelectrique.com'];
const SCOPES='https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/calendar https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.email';

function loadScript(src){return new Promise(res=>{const s=document.createElement('script');s.src=src;s.onload=res;document.head.appendChild(s);});}
async function initLibs(cfg,onToken){
  await loadScript('https://apis.google.com/js/api.js');
  await new Promise(res=>gapi.load('client',res));
  await gapi.client.init({apiKey:cfg.apiKey,discoveryDocs:DISCOVERY});
  await loadScript('https://accounts.google.com/gsi/client');
  tokenClient=google.accounts.oauth2.initTokenClient({client_id:cfg.clientId,scope:SCOPES,callback:onToken});
}
async function getUserEmail(){
  try{
    const token=gapi.client.getToken();
    if(token?.access_token){
      const r=await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{'Authorization':'Bearer '+token.access_token}});
      const d=await r.json();
      if(d.email)return d.email.toLowerCase().trim();
    }
  }catch(e){console.error(e);}
  return '';
}

// ── SHEETS ────────────────────────────────────────────────────────────────────
async function ensureStructure(sid){
  try{
    const res=await gapi.client.sheets.spreadsheets.get({spreadsheetId:sid});
    const ex=res.result.sheets.map(s=>s.properties.title);
    const needed=['Employés','Pointages','HeuresEnBanque','Messages'];
    const reqs=needed.filter(n=>!ex.includes(n)).map(n=>({addSheet:{properties:{title:n}}}));
    if(reqs.length)await gapi.client.sheets.spreadsheets.batchUpdate({spreadsheetId:sid,resource:{requests:reqs}});
    const headers={
      'Employés':[['Nom','PIN','Statut','HeuresBanque','Couleur','Code']],
      'Pointages':[['Employé','Type','DateTime','DateStr','HeureStr','Semaine','Mois','Job','CouleurJob','DéplacementMin','HeuresEstimées','HeuresConfirmées','Note','FichierURL']],
      'HeuresEnBanque':[['Employé','Semaine','HeuresSupp','Statut','DateDemande']],
      'Messages':[['De','Action','Détails','DateTime','Lu']]
    };
    for(const [sheet,h] of Object.entries(headers)){
      const chk=await gapi.client.sheets.spreadsheets.values.get({spreadsheetId:sid,range:`${sheet}!A1`});
      if(!chk.result.values)await gapi.client.sheets.spreadsheets.values.update({spreadsheetId:sid,range:`${sheet}!A1`,valueInputOption:'RAW',resource:{values:h}});
    }
  }catch(e){console.error(e);}
}

async function getEmployees(sid){

    const res=await gapi.client.sheets.spreadsheets.values.get({spreadsheetId:sid,range:'Employés!A2:F'});
    return (res.result.values||[]).map((r,i)=>({nom:r[0]||'',pin:r[1]||'',statut:r[2]||'out',heuresBanque:parseFloat(r[3])||0,couleur:r[4]||EMP_COLORS[i%EMP_COLORS.length],code:r[5]||(r[0]||'??').substring(0,2).toUpperCase(),row:i+2}));

async function getPointages(sid,filter={}){
  try{
    const res=await gapi.client.sheets.spreadsheets.values.get({spreadsheetId:sid,range:'Pointages!A2:N'});
    let rows=(res.result.values||[]).map((r,i)=>({nom:r[0],type:r[1],datetime:r[2],date:r[3],heure:r[4],semaine:r[5],mois:r[6],job:r[7]||'',jobColor:r[8]||'',deplacement:parseFloat(r[9])||0,heuresEst:parseFloat(r[10])||0,heuresConf:parseFloat(r[11])||0,note:r[12]||'',fichierURL:r[13]||'',row:i+2}));

// ── DRIVE ────────────────────────────────────────────────────────────────────
async function uploadToDrive(file,empName,jobName){
  try{
    const token=gapi.client.getToken();
    if(!token?.access_token)return'';
    const metadata={name:`${empName}_${jobName||'punch'}_${new Date().toLocaleDateString('fr-CA')}_${file.name}`,mimeType:file.type};
    const form=new FormData();
    form.append('metadata',new Blob([JSON.stringify(metadata)],{type:'application/json'}));
    form.append('file',file);
    const res=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink',{method:'POST',headers:{'Authorization':'Bearer '+token.access_token},body:form});
    const data=await res.json();
    return data.webViewLink||`https://drive.google.com/file/d/${data.id}/view`;
  }catch(e){console.error(e);return'';}
}

// ── CALENDAR ────────────────────────────────────────────────────────────────
async function getCalendarJobs(calendarIds){
  const now=new Date(),end=new Date(now);end.setDate(end.getDate()+14);
  const all=[];
  for(const calId of (calendarIds||['primary'])){
    try{
      const res=await gapi.client.calendar.events.list({calendarId:calId,timeMin:now.toISOString(),timeMax:end.toISOString(),singleEvents:true,orderBy:'startTime',maxResults:30});
      (res.result.items||[]).forEach(e=>{
        if(!all.find(x=>x.id===e.id))all.push({id:e.id,title:e.summary||'Sans titre',start:e.start.dateTime||e.start.date,end:e.end.dateTime||e.end.date,location:e.location||'',description:e.description||'',colorId:e.colorId||'',gcalColor:GCAL_COLORS[e.colorId||'']||'#2f81f7'});
      });
    }catch(e){console.error(e);}
  }
  return all.sort((a,b)=>new Date(a.start)-new Date(b.start));
}
async function createCalendarEvent(calendarId,title,date){
  try{
    const start=new Date(date+'T07:00:00'),end=new Date(date+'T17:00:00');
    const res=await gapi.client.calendar.events.insert({calendarId:calendarId||'primary',resource:{summary:title,start:{dateTime:start.toISOString()},end:{dateTime:end.toISOString()}}});
    return res.result;
  }catch(e){console.error(e);return null;}
}

// ── UTILS ────────────────────────────────────────────────────────────────────
function getWeek(d){
  const date=new Date(d);date.setHours(0,0,0,0);date.setDate(date.getDate()+3-(date.getDay()+6)%7);
  const w1=new Date(date.getFullYear(),0,4);
  return `${date.getFullYear()}-S${String(1+Math.round(((date-w1)/86400000-3+(w1.getDay()+6)%7)/7)).padStart(2,'0')}`;
}
function calcH(pts){
  let t=0,last=null;
  for(const p of pts){if(p.type==='in')last=new Date(p.datetime);else if(p.type==='out'&&last){t+=(new Date(p.datetime)-last)/3600000;last=null;}}
  return Math.round(t*10)/10;
}
// Combine IN/OUT pairs into single day lines
function combinePts(pts){
  const lines=[];
  const inPts=pts.filter(p=>p.type==='in'||p.type==='confirm');
  for(const pin of inPts){
    if(pin.type==='confirm'){lines.push({date:pin.date,job:pin.job,jobColor:pin.jobColor,heures:pin.heuresConf||pin.heuresEst||0,deplacement:pin.deplacement,note:pin.note,fichierURL:pin.fichierURL,type:'confirm',inRow:pin.row,outRow:null,semaine:pin.semaine});continue;}
    const matchOut=pts.find(po=>po.type==='out'&&po.nom===pin.nom&&new Date(po.datetime)>new Date(pin.datetime)&&po.date===pin.date);
    const h=matchOut?Math.round((new Date(matchOut.datetime)-new Date(pin.datetime))/360000)/10:null;
    const ot=h?Math.max(0,Math.round((h-8)*10)/10):0;
    lines.push({date:pin.date,heure:pin.heure,heureOut:matchOut?.heure||'',job:pin.job,jobColor:pin.jobColor,heures:h,heuresEst:pin.heuresEst,deplacement:pin.deplacement,note:pin.note,fichierURL:pin.fichierURL,overtime:ot,type:'pair',inRow:pin.row,outRow:matchOut?.row||null,semaine:pin.semaine});
  }
  return lines.sort((a,b)=>new Date(b.date)-new Date(a.date));
}
function rgba(hex,a=0.15){
  try{const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return `rgba(${r},${g},${b},${a})`;}catch{return `rgba(47,129,247,${a})`;}
}
function colorDist(c1,c2){
  try{const r1=parseInt(c1.slice(1,3),16),g1=parseInt(c1.slice(3,5),16),b1=parseInt(c1.slice(5,7),16),r2=parseInt(c2.slice(1,3),16),g2=parseInt(c2.slice(3,5),16),b2=parseInt(c2.slice(5,7),16);return Math.sqrt((r1-r2)**2+(g1-g2)**2+(b1-b2)**2);}catch{return 999;}
}
function useClock(){
  const [now,setNow]=useState(new Date());
  useEffect(()=>{const t=setInterval(()=>setNow(new Date()),1000);return()=>clearInterval(t);},[]);
  return now;
}

function Notif({msg,type,onClose}){
  useEffect(()=>{const t=setTimeout(onClose,4500);return()=>clearTimeout(t);},[]);
  return <div className={`notif ${type}`} onClick={onClose}>{msg}</div>;
}

// ── PIN PAD ──────────────────────────────────────────────────────────────────
function PinPad({empName,empCouleur,empCode,onSubmit,onCancel,label}){
  const [pin,setPin]=useState('');
  const keys=['1','2','3','4','5','6','7','8','9','←','0','✓'];
  const handle=k=>{
    if(k==='←')setPin(p=>p.slice(0,-1));
    else if(k==='✓'){if(pin.length>=4){onSubmit(pin);setPin('');}}
    else if(pin.length<6)setPin(p=>p+k);
  };
  return(
    <div className="pin-wrap">
      <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:10,marginBottom:'0.75rem'}}>
        <div className="emp-av" style={{background:empCouleur,width:34,height:34,fontSize:11}}>{empCode}</div>
        <div>
          <div style={{fontFamily:'var(--font-head)',fontWeight:700,fontSize:'0.9rem'}}>{empName}</div>
          {label&&<div style={{fontSize:11,color:'var(--muted)'}}>{label}</div>}
        </div>
      </div>
      <div className="pin-display">{pin?'●'.repeat(pin.length):<span style={{color:'var(--muted)',fontSize:'0.75rem'}}>Entrez votre PIN</span>}</div>
      <div className="pin-grid">
        {keys.map((k,i)=>(
          <div key={i} className={`pin-key${k==='←'?' del':''}${k==='0'?' zero':''}`}
            style={k==='✓'?{background:'linear-gradient(135deg,var(--accent),var(--accent2))',color:'#fff',border:'none'}:{}}
            onClick={()=>handle(k)}>{k}</div>
        ))}
      </div>
      <button className="pin-back" onClick={onCancel}>← Retour</button>
    </div>
  );
}

// ── EMPLOYEE HISTORY ─────────────────────────────────────────────────────────
function EmployeeHistory({emp,sid,notify,onBack}){
  const [pts,setPts]=useState([]);
  const [tab,setTab]=useState('semaine');
  const [loading,setLoading]=useState(true);
  const [editLine,setEditLine]=useState(null);
  const [editData,setEditData]=useState({});

  const today=new Date().toLocaleDateString('fr-CA');
  const curWeek=getWeek(new Date());
  const curMois=`${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}`;

  useEffect(()=>{load();},[]);

  async function load(){
    setLoading(true);
    const p=await getPointages(sid,{nom:emp.nom});
    setPts(p);setLoading(false);
  }

  function getFiltered(){
    if(tab==='today')return pts.filter(p=>p.date===today);
    if(tab==='semaine')return pts.filter(p=>p.semaine===curWeek);
    if(tab==='mois')return pts.filter(p=>p.mois===curMois);
    return pts;
  }

  const lines=combinePts(getFiltered());
  const totalH=calcH(getFiltered());
  const totalDep=Math.round(getFiltered().filter(p=>p.type==='in'||p.type==='confirm').reduce((s,p)=>s+(p.deplacement||0),0));
  const totalOT=Math.round(lines.reduce((s,l)=>s+(l.overtime||0),0)*10)/10;

  async function handleEdit(line){
    setEditLine(line);
    setEditData({job:line.job||'',heures:line.heures||0,deplacement:line.deplacement||0,note:line.note||''});
  }

  async function handleSaveEdit(){
    if(!editLine)return;
    try{
      if(editLine.inRow)await updatePointage(sid,editLine.inRow,{job:editData.job,jobColor:editLine.jobColor,deplacement:editData.deplacement,heuresEst:editData.heures,heuresConf:editData.heures,note:editData.note});
      await addMessage(sid,emp.nom,'Modification',`${editLine.date} — Job: ${editData.job}, ${editData.heures}h, ${editData.deplacement}min dépl.`);
      notify('✅ Modifié — Admin notifié','success');
      setEditLine(null);await load();
    }catch(e){notify('Erreur: '+e.message,'err');}
  }

  async function handleDelete(line){
    if(!confirm('Supprimer cette entrée?'))return;
    try{
      if(line.outRow)await deletePointageRow(sid,line.outRow);
      if(line.inRow)await deletePointageRow(sid,line.inRow);
      await addMessage(sid,emp.nom,'Suppression',`${line.date} — Job: ${line.job||'—'}, ${line.heures||'?'}h`);
      notify('Supprimé — Admin notifié','success');
      await load();
    }catch(e){notify('Erreur: '+e.message,'err');}
  }

  return(
    <div style={{maxWidth:560,width:'100%',textAlign:'left'}}>
      <button className="step-back" onClick={onBack}>← Retour</button>
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:'1rem'}}>
        <div className="emp-av" style={{background:emp.couleur,width:36,height:36,fontSize:12}}>{emp.code}</div>
        <div style={{fontFamily:'var(--font-head)',fontWeight:700,fontSize:'1rem'}}>{emp.nom} — Mes heures</div>
      </div>
      <div className="stats-grid" style={{marginBottom:'1rem'}}>
        <div className="stat-box"><div className="val">{totalH}h</div><div className="lbl">Heures</div></div>
        <div className="stat-box"><div className="val" style={{color:'var(--warning)'}}>{totalOT}h</div><div className="lbl">Overtime</div></div>
        <div className="stat-box"><div className="val">{totalDep}m</div><div className="lbl">Dépl.</div></div>
        <div className="stat-box"><div className="val">{lines.length}</div><div className="lbl">Journées</div></div>
      </div>
      <div className="tabs">
        {[['today',"Auj."],['semaine','Semaine'],['mois','Mois'],['all','Tout']].map(([k,l])=>(
          <div key={k} className={`tab${tab===k?' active':''}`} onClick={()=>setTab(k)}>{l}</div>
        ))}
      </div>
      {loading?<div style={{color:'var(--muted)',textAlign:'center',padding:'2rem'}}>⏳</div>:
      <div className="scroll-area" style={{maxHeight:'calc(100vh - 360px)'}}>
        {lines.map((line,i)=>(
          <div key={i} className={`hist-line${line.overtime>0?' has-ot':''}`} style={{borderLeftColor:line.jobColor||'var(--border2)'}}>
            {editLine===line?(
              <div className="hist-edit-form">
                <div className="fg" style={{marginBottom:'0.5rem'}}><label>Job</label><input value={editData.job} onChange={e=>setEditData(p=>({...p,job:e.target.value}))}/></div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0.5rem',marginBottom:'0.5rem'}}>
                  <div className="fg" style={{marginBottom:0}}>
                    <label>Heures</label>
                    <input type="number" step={0.25} value={editData.heures} onChange={e=>{const v=parseFloat(e.target.value)||0;setEditData(p=>({...p,heures:v}));}}/>
                  </div>
                  <div className="fg" style={{marginBottom:0}}>
                    <label>Dépl. (min)</label>
                    <input type="number" value={editData.deplacement} onChange={e=>{const v=parseInt(e.target.value)||0;setEditData(p=>({...p,deplacement:v}));}}/>
                  </div>
                </div>
                <div className="fg" style={{marginBottom:'0.5rem'}}><label>Note</label><textarea className="note-input" rows={2} value={editData.note} onChange={e=>setEditData(p=>({...p,note:e.target.value}))}/></div>
                <div style={{display:'flex',gap:'0.4rem'}}>
                  <button className="btn-p" style={{marginTop:0,flex:1}} onClick={handleSaveEdit}>✓ Sauvegarder</button>
                  <button className="btn-s" onClick={()=>setEditLine(null)}>Annuler</button>
                </div>
              </div>
            ):(
              <>
                <div className="hist-header">
                  <div>
                    <div style={{fontSize:13,fontWeight:600,display:'flex',alignItems:'center',gap:8}}>
                      {line.date}
                      {line.type==='confirm'?<span className="badge badge-conf">Confirmé</span>:
                        line.heures!==null?<span className="badge badge-in">{line.heures}h</span>:<span className="badge badge-pend">En cours</span>}
                      {line.overtime>0&&<span className="badge" style={{background:'rgba(210,153,34,0.15)',color:'var(--warning)'}}>+{line.overtime}h OT</span>}
                    </div>
                    {line.heure&&<div style={{fontSize:11,color:'var(--muted)',marginTop:2}}>{line.heure}{line.heureOut?` → ${line.heureOut}`:''}</div>}
                  </div>
                  <div style={{display:'flex',gap:4,flexShrink:0}}>
                    {line.deplacement>0&&<span style={{fontSize:10,color:'var(--warning)'}}>🚗{line.deplacement}m</span>}
                    {line.fichierURL&&<a href={line.fichierURL} target="_blank" rel="noreferrer" style={{fontSize:10,color:'var(--accent)'}}>📎</a>}
                  </div>
                </div>
                {line.job&&(
                  <div className="hist-job">
                    {line.jobColor&&<div style={{width:8,height:8,borderRadius:'50%',background:line.jobColor,flexShrink:0}}></div>}
                    <span>{line.job}</span>
                  </div>
                )}
                {line.note&&<div style={{fontSize:11,color:'var(--muted)',marginTop:3,fontStyle:'italic'}}>"{line.note}"</div>}
                <div className="hist-actions">
                  <button className="btn-sm" style={{background:'var(--bg2)',border:'1px solid var(--border)',color:'var(--muted)'}} onClick={()=>handleEdit(line)}>✏️ Modifier</button>
                  <button className="btn-sm btn-deny" onClick={()=>handleDelete(line)}>🗑 Supprimer</button>
                </div>
              </>
            )}
          </div>
        ))}
        {lines.length===0&&<div style={{color:'var(--muted)',textAlign:'center',padding:'2rem',fontSize:13}}>Aucune entrée pour cette période</div>}
      </div>}
    </div>
  );
}

function JobSelector({jobs,emp,onSelect,onCreateJob,onSkip}){
  const [showCreate,setShowCreate]=useState(false);
  const [newJob,setNewJob]=useState({title:'',date:new Date().toISOString().split('T')[0]});
  const today=new Date().toLocaleDateString('fr-CA');

  const sorted=[...jobs].sort((a,b)=>{
    const txtA=(a.title+' '+(a.description||'')).toLowerCase();
    const txtB=(b.title+' '+(b.description||'')).toLowerCase();
    const code=emp.code.toLowerCase(),nom=emp.nom.toLowerCase();
    const aM=txtA.includes(code)||txtA.includes(nom);
    const bM=txtB.includes(code)||txtB.includes(nom);
    if(aM&&!bM)return -1;if(!aM&&bM)return 1;
    return colorDist(a.gcalColor,emp.couleur)-colorDist(b.gcalColor,emp.couleur);
  });

  function jobMatchesEmp(job){
    const txt=(job.title+' '+(job.description||'')).toLowerCase();
    return txt.includes(emp.code.toLowerCase())||txt.includes(emp.nom.toLowerCase());
  }

  return(
    <div className="job-wrap">
      <div className="section-head">
        <div style={{fontFamily:'var(--font-head)',fontWeight:700,fontSize:'0.92rem'}}>Sélectionner un job</div>
        <div style={{display:'flex',gap:'0.35rem'}}>
          <button className="btn-s" style={{fontSize:11,padding:'0.22rem 0.6rem'}} onClick={()=>setShowCreate(!showCreate)}>+ Créer</button>
          <button className="btn-s" style={{fontSize:11,padding:'0.22rem 0.6rem'}} onClick={onSkip}>Sans job</button>
        </div>
      </div>
      {showCreate&&(
        <div style={{background:'var(--bg3)',borderRadius:10,padding:'0.75rem',marginBottom:'0.65rem',border:'1px solid var(--border2)'}}>
          <div className="fg" style={{marginBottom:'0.4rem'}}><label>Nom du job</label><input placeholder="Ex: Chantier St-Laurent" value={newJob.title} onChange={e=>setNewJob(p=>({...p,title:e.target.value}))}/></div>
          <div className="fg" style={{marginBottom:'0.55rem'}}><label>Date</label><input type="date" value={newJob.date} onChange={e=>setNewJob(p=>({...p,date:e.target.value}))}/></div>
          <button className="btn-p" style={{marginTop:0}} disabled={!newJob.title} onClick={()=>onCreateJob(newJob)}>Créer dans l'agenda</button>
        </div>
      )}
      <div className="scroll-area" style={{maxHeight:300}}>
        {sorted.map(job=>{
          const isToday=new Date(job.start).toLocaleDateString('fr-CA')===today;
          const isCodeMatch=jobMatchesEmp(job);
          const isColorMatch=!isCodeMatch&&colorDist(job.gcalColor,emp.couleur)<90;
          return(
            <div key={job.id} className="job-btn" style={{borderColor:isCodeMatch?emp.couleur:'var(--border)',borderWidth:isCodeMatch?2:1,borderLeftWidth:4,borderLeftColor:job.gcalColor,background:isCodeMatch?rgba(emp.couleur,0.06):'var(--bg2)'}} onClick={()=>onSelect(job.title,job.gcalColor)}>
              <div className="job-color-bar" style={{background:job.gcalColor}}></div>
              <div style={{flex:1}}>
                <div style={{fontSize:13,fontWeight:600,display:'flex',alignItems:'center',gap:5,flexWrap:'wrap'}}>
                  {job.title}
                  {isCodeMatch&&<span style={{background:rgba(emp.couleur,0.25),color:emp.couleur,fontSize:9,padding:'1px 4px',borderRadius:4,fontWeight:700}}>👤{emp.code}</span>}
                  {isColorMatch&&<span style={{background:rgba(job.gcalColor,0.2),color:job.gcalColor,fontSize:9,padding:'1px 4px',borderRadius:4,fontWeight:700}}>●</span>}
                </div>
                <div style={{fontSize:11,color:'var(--muted)',marginTop:1}}>{new Date(job.start).toLocaleDateString('fr-CA',{weekday:'short',month:'short',day:'numeric'})}{job.location?` · ${job.location}`:''}</div>
              </div>
              <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:2,flexShrink:0}}>
                {isToday&&<span style={{background:'rgba(63,185,80,0.15)',color:'var(--success)',fontSize:9,padding:'1px 5px',borderRadius:5,fontWeight:700}}>Auj.</span>}
                <div style={{width:10,height:10,borderRadius:'50%',background:job.gcalColor}}></div>
              </div>
            </div>
          );
        })}
        {sorted.length===0&&<div style={{color:'var(--muted)',textAlign:'center',padding:'1.5rem',fontSize:13}}>Aucun job dans les 14 prochains jours</div>}
      </div>
    </div>
  );
}

// ── DURATION / CONFIRM FORM ──────────────────────────────────────────────────
function DurationForm({emp,jobName,jobColor,isOut,isConfirm,onConfirm,onBack}){
  const [heures,setHeures]=useState(0);
  const [quarts,setQuarts]=useState(0);
  const [deplacement,setDeplacement]=useState(0);
  const [note,setNote]=useState('');
  const [file,setFile]=useState(null);
  const [filePreview,setFilePreview]=useState('');
  const [uploading,setUploading]=useState(false);
  const fileRef=useRef();const camRef=useRef();
  const travelOpts=[0,15,30,45,60,90];
  const totalH=heures+quarts*0.25;

  function handleFile(f){
    if(!f)return;setFile(f);
    if(f.type.startsWith('image/')){const r=new FileReader();r.onload=e=>setFilePreview(e.target.result);r.readAsDataURL(f);}
    else setFilePreview('');
  }
  async function handleConfirm(){
    setUploading(true);
    let url='';if(file){url=await uploadToDrive(file,emp.nom,jobName);}
    setUploading(false);
    onConfirm({heures:totalH,deplacement,note,fichierURL:url});
  }

  return(
    <div className="dur-wrap">
      <button className="step-back" onClick={onBack}>← Retour</button>
      {jobName&&(
        <div style={{display:'flex',alignItems:'center',gap:8,background:'var(--bg3)',borderRadius:8,padding:'0.45rem 0.7rem',marginBottom:'0.65rem'}}>
          <div style={{width:10,height:10,borderRadius:'50%',background:jobColor||'var(--accent)',flexShrink:0}}></div>
          <div style={{fontSize:13,fontWeight:600}}>{jobName}</div>
        </div>
      )}
      <div className="dur-section">
        <div className="csec">{isOut?'Heures réelles travaillées':isConfirm?'Heures de la journée':'Heures estimées'}</div>
        <div style={{display:'flex',gap:'0.75rem',alignItems:'center',justifyContent:'center',flexWrap:'wrap'}}>
          <div style={{textAlign:'center'}}>
            <div style={{fontSize:10,color:'var(--muted)',marginBottom:4}}>Heures</div>
            <div className="dur-row">
              <button className="dur-btn" onClick={()=>setHeures(h=>Math.max(0,h-1))}>−</button>
              <div className="dur-val">{heures}</div>
              <button className="dur-btn" onClick={()=>setHeures(h=>Math.min(24,h+1))}>+</button>
            </div>
          </div>
          <div style={{color:'var(--muted)',fontSize:'1.4rem',fontWeight:200,paddingTop:14}}>:</div>
          <div style={{textAlign:'center'}}>
            <div style={{fontSize:10,color:'var(--muted)',marginBottom:4}}>Quarts (15min)</div>
            <div className="dur-row">
              <button className="dur-btn" onClick={()=>setQuarts(q=>Math.max(0,q-1))}>−</button>
              <div className="dur-val">{quarts}</div>
              <button className="dur-btn" onClick={()=>setQuarts(q=>Math.min(3,q+1))}>+</button>
            </div>
          </div>
          <div style={{textAlign:'center',paddingTop:14}}>
            <div style={{fontSize:10,color:'var(--muted)'}}>Total</div>
            <div style={{fontFamily:'var(--font-head)',fontWeight:800,fontSize:'1.1rem',color:'var(--success)'}}>{totalH}h</div>
            {totalH>8&&<div style={{fontSize:9,color:'var(--warning)'}}>+{Math.round((totalH-8)*10)/10}h OT</div>}
          </div>
        </div>
      </div>
      {!isOut&&(
        <div className="dur-section">
          <div className="csec">Déplacement (minutes)</div>
          <div className="travel-opts">
            {travelOpts.map(v=><div key={v} className={`travel-opt${deplacement===v?' sel':''}`} onClick={()=>setDeplacement(v)}><div className="tv">{v}</div><div className="tl">min</div></div>)}
          </div>
        </div>
      )}
      <div style={{marginBottom:'0.6rem'}}>
        <div className="csec">Note (optionnel)</div>
        <textarea className="note-input" rows={2} placeholder="Ex: matériel manquant..." value={note} onChange={e=>setNote(e.target.value)}/>
      </div>
      <div style={{marginBottom:'0.75rem'}}>
        <div className="csec">Photo / Fichier (optionnel)</div>
        {filePreview&&<img src={filePreview} alt="preview" style={{width:'100%',maxHeight:100,objectFit:'cover',borderRadius:8,marginBottom:5}}/>}
        {file&&!filePreview&&<div style={{fontSize:11,color:'var(--muted)',marginBottom:5}}>📄 {file.name}</div>}
        <div style={{display:'flex',gap:'0.4rem'}}>
          <div className="file-zone" style={{flex:1}} onClick={()=>fileRef.current?.click()}>
            <div style={{fontSize:'1.1rem'}}>📎</div><div style={{fontSize:10,color:'var(--muted)'}}>Fichier</div>
            <input ref={fileRef} type="file" accept="image/*,application/pdf,.doc,.docx" style={{display:'none'}} onChange={e=>handleFile(e.target.files[0])}/>
          </div>
          <div className="file-zone" style={{flex:1}} onClick={()=>camRef.current?.click()}>
            <div style={{fontSize:'1.1rem'}}>📷</div><div style={{fontSize:10,color:'var(--muted)'}}>Photo</div>
            <input ref={camRef} type="file" accept="image/*" capture="environment" style={{display:'none'}} onChange={e=>handleFile(e.target.files[0])}/>
          </div>
        </div>
      </div>
      <button className="btn-p" style={{marginTop:0}} disabled={uploading||totalH===0} onClick={handleConfirm}>
        {uploading?'⏳ Upload...':isOut?'✓ Punch OUT':isConfirm?'✓ Confirmer la journée':'✓ Punch IN'}
      </button>
    </div>
  );
}

// ── WELCOME SCREEN ───────────────────────────────────────────────────────────
function WelcomeScreen({emps,sid,calendarIds,notify,onRefresh}){
  const now=useClock();
  const [step,setStep]=useState('emps'); // emps|mode|job|duration-in|duration-out|confirm|pin|result|history
  const [selEmp,setSelEmp]=useState(null);
  const [selJob,setSelJob]=useState('');
  const [selJobColor,setSelJobColor]=useState('');
  const [jobs,setJobs]=useState([]);
  const [result,setResult]=useState(null);
  const [punchData,setPunchData]=useState({});
  const [mode,setMode]=useState('in'); // 'in'|'out'|'confirm'

  useEffect(()=>{if(calendarIds?.length)getCalendarJobs(calendarIds).then(setJobs);},[calendarIds?.join(',')]);

  const pad=n=>String(n).padStart(2,'0');
  const days=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
  const months=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  const today=now.toLocaleDateString('fr-CA');
  const curWeek=getWeek(now);
  const curMois=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;

  function reset(){setStep('emps');setSelEmp(null);setSelJob('');setSelJobColor('');setPunchData({});}

  function handleEmpSelect(emp){setSelEmp(emp);setStep('mode');}

  async function handleCreateJob(newJob){
    const calId=calendarIds?.[0]||'primary';
    await createCalendarEvent(calId,newJob.title,newJob.date);
    notify(`✅ Job "${newJob.title}" créé!`,'success');
    getCalendarJobs(calendarIds).then(setJobs);
    setSelJob(newJob.title);setSelJobColor('#2f81f7');setStep('duration-in');
  }

  async function handlePunch(pin,type){
    const emp=emps.find(e=>e.nom===selEmp.nom);
    if(!emp||emp.pin!==pin){setResult({err:true});setTimeout(()=>{setResult(null);},2500);return;}
    const data={...punchData,job:selJob,jobColor:selJobColor};
    if(type==='confirm'){
      await addPointage(sid,emp,'confirm',{...data,heuresConf:data.heures});
    }else{
      await addPointage(sid,emp,type,data);
      await updateStatus(sid,emp.row,type);
      if(type==='out'){
        const curW=getWeek(new Date());
        const semPts=await getPointages(sid,{nom:emp.nom,semaine:curW});
        const total=calcH(semPts);
        if(total>40){
          const extra=Math.round((total-40)*10)/10;
          const bq=await getHeuresBanque(sid);
          if(!bq.some(b=>b.nom===emp.nom&&b.semaine===curW)){await addHeuresBanque(sid,emp.nom,curW,extra);notify(`🏦 ${emp.nom} — ${extra}h en banque!`,'warn');}
        }
      }
    }
    const allPts=await getPointages(sid,{nom:emp.nom});
    setResult({ok:true,nom:emp.nom,type,heure:now.toLocaleTimeString('fr-CA',{hour:'2-digit',minute:'2-digit'}),couleur:emp.couleur,code:emp.code,pts:allPts,job:selJob,jobColor:selJobColor,dep:data.deplacement||0,heures:data.heures||0});
    setStep('result');
    onRefresh();
    setTimeout(()=>{reset();setResult(null);},7000);
  }

  const TimeHeader=()=>(
    <><div className="w-time">{pad(now.getHours())}:{pad(now.getMinutes())}</div>
    <div className="w-date">{days[now.getDay()]} {now.getDate()} {months[now.getMonth()]} {now.getFullYear()}</div></>
  );

  if(step==='history'&&selEmp)return(
    <div className="welcome" style={{justifyContent:'flex-start',paddingTop:'1rem'}}>
      <EmployeeHistory emp={selEmp} sid={sid} notify={notify} onBack={reset}/>
    </div>
  );

  if(step==='result'&&result?.ok){
    const pts=result.pts||[];
    return(
      <div className="welcome">
        <div className="punch-result ok">
          <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:10,marginBottom:8}}>
            <div className="emp-av" style={{background:result.couleur,width:38,height:38,fontSize:12}}>{result.code}</div>
            <div style={{fontFamily:'var(--font-head)',fontSize:'1.05rem',fontWeight:800}}>{result.nom}</div>
          </div>
          <span className={`pbadge ${result.type==='confirm'?'confirm':result.type}`}>{result.type==='in'?'✅ Punch IN':result.type==='out'?'🔴 Punch OUT':'✅ Journée confirmée'}</span>
          <div style={{fontFamily:'var(--font-head)',fontWeight:700,fontSize:'1.1rem',margin:'4px 0'}}>{result.heure}</div>
          {result.job&&<div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:5,marginBottom:4}}><div style={{width:8,height:8,borderRadius:'50%',background:result.jobColor||'var(--accent)'}}></div><span style={{fontSize:11,color:'var(--muted)'}}>{result.job}</span></div>}
          {result.dep>0&&<span className="pbadge travel">🚗 {result.dep}min</span>}
          {result.heures>0&&<span className="pbadge in">⏱ {result.heures}h</span>}
          <div className="punch-stats">
            <div className="ps"><div className="v">{calcH(pts.filter(p=>p.date===today))}h</div><div className="l">Auj.</div></div>
            <div className="ps"><div className="v">{calcH(pts.filter(p=>p.semaine===curWeek))}h</div><div className="l">Sem.</div></div>
            <div className="ps"><div className="v">{calcH(pts.filter(p=>p.mois===curMois))}h</div><div className="l">Mois</div></div>
            <div className="ps"><div className="v">{Math.round(pts.filter(p=>p.semaine===curWeek&&(p.type==='in'||p.type==='confirm')).reduce((s,p)=>s+(p.deplacement||0),0))}m</div><div className="l">Dépl.</div></div>
          </div>
        </div>
      </div>
    );
  }
  if(step==='result'&&result?.err)return(<div className="welcome"><div className="punch-result err"><div style={{fontSize:'1.8rem',marginBottom:8}}>❌</div><div style={{fontFamily:'var(--font-head)',fontWeight:700}}>PIN incorrect</div><button className="pin-back" style={{marginTop:12}} onClick={reset}>← Retour</button></div></div>);

  if(step==='pin')return(<div className="welcome"><TimeHeader/><PinPad empName={selEmp?.nom} empCouleur={selEmp?.couleur} empCode={selEmp?.code} label="Punch IN" onSubmit={pin=>handlePunch(pin,'in')} onCancel={()=>setStep('duration-in')}/></div>);
  if(step==='pin-out')return(<div className="welcome"><TimeHeader/><PinPad empName={selEmp?.nom} empCouleur={selEmp?.couleur} empCode={selEmp?.code} label="Punch OUT" onSubmit={pin=>handlePunch(pin,'out')} onCancel={()=>setStep('duration-out')}/></div>);
  if(step==='pin-confirm')return(<div className="welcome"><TimeHeader/><PinPad empName={selEmp?.nom} empCouleur={selEmp?.couleur} empCode={selEmp?.code} label="Confirmer journée" onSubmit={pin=>handlePunch(pin,'confirm')} onCancel={()=>setStep('confirm')}/></div>);

  if(step==='duration-in')return(<div className="welcome" style={{justifyContent:'flex-start',paddingTop:'1rem'}}><TimeHeader/><DurationForm emp={selEmp} jobName={selJob} jobColor={selJobColor} isOut={false} isConfirm={false} onConfirm={d=>{setPunchData(d);setStep('pin');}} onBack={()=>setStep('job')}/></div>);
  if(step==='duration-out')return(<div className="welcome" style={{justifyContent:'flex-start',paddingTop:'1rem'}}><TimeHeader/><DurationForm emp={selEmp} jobName={selJob} jobColor={selJobColor} isOut={true} isConfirm={false} onConfirm={d=>{setPunchData(d);setStep('pin-out');}} onBack={reset}/></div>);
  if(step==='confirm')return(<div className="welcome" style={{justifyContent:'flex-start',paddingTop:'1rem'}}><TimeHeader/><DurationForm emp={selEmp} jobName={selJob} jobColor={selJobColor} isOut={false} isConfirm={true} onConfirm={d=>{setPunchData(d);setStep('pin-confirm');}} onBack={()=>setStep('job')}/></div>);

  if(step==='job')return(
    <div className="welcome" style={{justifyContent:'flex-start',paddingTop:'1rem'}}>
      <TimeHeader/>
      <JobSelector jobs={jobs} emp={selEmp} onSelect={(t,c)=>{setSelJob(t);setSelJobColor(c);if(mode==='out')setStep('duration-out');else if(mode==='confirm')setStep('confirm');else setStep('duration-in');}} onCreateJob={handleCreateJob} onSkip={()=>{if(mode==='out')setStep('duration-out');else if(mode==='confirm')setStep('confirm');else setStep('duration-in');}}/>
    </div>
  );

  if(step==='mode'&&selEmp)return(
    <div className="welcome">
      <TimeHeader/>
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:'1.5rem'}}>
        <div className="emp-av" style={{background:selEmp.couleur,width:36,height:36,fontSize:12}}>{selEmp.code}</div>
        <div style={{fontFamily:'var(--font-head)',fontWeight:700}}>{selEmp.nom}</div>
        <span className={`badge ${selEmp.statut==='in'?'badge-in':'badge-out'}`} style={{marginLeft:'auto'}}>{selEmp.statut==='in'?'En cours':'Absent'}</span>
      </div>
      <div className="mode-wrap">
        {selEmp.statut==='in'?(
          <div className="mode-btn" onClick={()=>{setMode('out');setStep('job');}}>
            <div className="mode-icon">🔴</div>
            <div className="mode-info"><div className="mode-title">Punch OUT</div><div className="mode-desc">Terminer la journée, confirmer les heures</div></div>
          </div>
        ):(
          <div className="mode-btn" onClick={()=>{setMode('in');setStep('job');}}>
            <div className="mode-icon">🟢</div>
            <div className="mode-info"><div className="mode-title">Punch IN</div><div className="mode-desc">Commencer la journée sur un job</div></div>
          </div>
        )}
        <div className="mode-btn" onClick={()=>{setMode('confirm');setStep('job');}}>
          <div className="mode-icon">✅</div>
          <div className="mode-info"><div className="mode-title">Confirmer une journée</div><div className="mode-desc">Entrer directement les heures et le job sans IN/OUT</div></div>
        </div>
        <div className="mode-btn" onClick={()=>setStep('history')}>
          <div className="mode-icon">📋</div>
          <div className="mode-info"><div className="mode-title">Mes heures</div><div className="mode-desc">Consulter, modifier ou supprimer mes entrées</div></div>
        </div>
      </div>
      <button className="step-back" style={{marginTop:'0.75rem'}} onClick={reset}>← Changer d'employé</button>
    </div>
  );

  return(
    <div className="welcome">
      <TimeHeader/>
      {emps.length===0?(
        <div style={{color:'var(--muted)',textAlign:'center',maxWidth:320}}>
          <div style={{fontSize:'1.8rem',marginBottom:'0.55rem'}}>👷</div>
          <div style={{fontFamily:'var(--font-head)',fontWeight:700,marginBottom:'0.3rem'}}>Aucun employé</div>
          <div style={{fontSize:13}}>Connectez-vous en tant qu'administrateur.</div>
        </div>
      ):(
        <>
          <div style={{fontSize:10,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.1em',color:'var(--muted)',marginBottom:'0.85rem'}}>Sélectionnez votre nom</div>
          <div className="emp-grid">
            {emps.map(emp=>(
              <div key={emp.nom} className="emp-card" style={{borderColor:emp.statut==='in'?emp.couleur:'var(--border)',boxShadow:emp.statut==='in'?`0 0 0 1px ${emp.couleur}`:''}} onClick={()=>handleEmpSelect(emp)}>
                <div className="emp-av-lg" style={{background:emp.couleur}}>{emp.code}</div>
                <div style={{fontSize:12,fontWeight:600}}>{emp.nom}</div>
                <div style={{fontSize:10,color:emp.statut==='in'?emp.couleur:'var(--muted)',marginTop:2}}>{emp.statut==='in'?'● En cours':'○ Absent'}</div>
              </div>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

// ── SETTINGS MENU ────────────────────────────────────────────────────────────
function SettingsMenu({userEmail,isBoss,onSwitch,onEditCfg,onReset}){
  const [open,setOpen]=useState(false);
  const [settings,setSettings]=useState(()=>{try{return JSON.parse(localStorage.getItem('pp_settings')||'{}');}catch{return{};}});
  const ref=useRef();
  useEffect(()=>{const h=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);};document.addEventListener('mousedown',h);return()=>document.removeEventListener('mousedown',h);},[]);

  function toggleSetting(key){
    const next={...settings,[key]:!settings[key]};
    setSettings(next);localStorage.setItem('pp_settings',JSON.stringify(next));
  }

  return(
    <div className="settings-wrap" ref={ref}>
      <button className="settings-btn" onClick={()=>setOpen(o=>!o)}>⚙</button>
      {open&&(
        <div className="settings-menu">
          <div className="ssec">Compte</div>
          <div className="acct-card">
            <div style={{fontSize:11,color:'var(--text)',fontWeight:500,display:'flex',alignItems:'center',gap:5}}>
              <span style={{width:6,height:6,borderRadius:'50%',background:userEmail?'var(--success)':'var(--muted)',display:'inline-block'}}></span>
              {userEmail||'Non connecté'}
            </div>
            <div style={{fontSize:10,color:'var(--muted)',marginTop:1}}>{userEmail?(isBoss?'🔐 Administrateur':'👷 Employés'):'—'}</div>
          </div>
          <button className="si" onClick={()=>{setOpen(false);onSwitch();}}><span className="ico">🔄</span>Changer de compte</button>
          <div className="sdiv"/>
          <div className="ssec">Application</div>
          <button className="si" onClick={()=>{setOpen(false);onEditCfg();}}><span className="ico">🔑</span>Paramètres API</button>
          <button className="si" onClick={()=>{setOpen(false);window.open('https://docs.google.com/spreadsheets','_blank');}}><span className="ico">📊</span>Google Sheets</button>
          <button className="si" onClick={()=>{setOpen(false);window.open('https://calendar.google.com','_blank');}}><span className="ico">📅</span>Google Agenda</button>
          <button className="si" onClick={()=>{setOpen(false);window.open('https://drive.google.com','_blank');}}><span className="ico">🗂️</span>Google Drive</button>
          <div className="sdiv"/>
          <div className="ssec">Fonctionnalités (à venir)</div>
          <div className="toggle-row">
            <span style={{fontSize:12,color:'var(--muted)'}}>📴 Mode offline</span>
            <div className={`toggle${settings.offline?' on':''}`} onClick={()=>toggleSetting('offline')}><div className="toggle-knob"></div></div>
          </div>
          <div style={{fontSize:10,color:'var(--muted)',padding:'0 0.6rem 0.4rem',fontStyle:'italic'}}>Sync automatique quand reconnecté</div>
          <div className="toggle-row">
            <span style={{fontSize:12,color:'var(--muted)'}}>📧 Rapport hebdo</span>
            <div className={`toggle${settings.rapportHebdo?' on':''}`} onClick={()=>toggleSetting('rapportHebdo')}><div className="toggle-knob"></div></div>
          </div>
          <div style={{fontSize:10,color:'var(--muted)',padding:'0 0.6rem 0.4rem',fontStyle:'italic'}}>Email automatique le vendredi</div>
          <div className="sdiv"/>
          <button className="si danger" onClick={()=>{setOpen(false);onReset();}}><span className="ico">🗑️</span>Réinitialiser</button>
        </div>
      )}
    </div>
  );
}

  return(
    <div className="overlay">
      <div className="modal">
        <div className="modal-title">⚡ PunchPro</div>
        <div className="modal-sub">Configuration — Saran Électrique</div>

        <div className="fg"><label>OAuth 2.0 Client ID</label><input placeholder="123...apps.googleusercontent.com" value={cfg.clientId} onChange={e=>setCfg(p=>({...p,clientId:e.target.value}))}/></div>
        <div className="fg"><label>Google Spreadsheet ID</label><input placeholder="144Ub45GKP6bvMEd2Zda9JIhfwYpkKMNm" value={cfg.spreadsheetId} onChange={e=>setCfg(p=>({...p,spreadsheetId:e.target.value}))}/></div>
        <div className="fg"><label>Calendriers (séparés par virgules)</label><input placeholder="saranelectrique@gmail.com, info@saranelectrique.com" value={cfg.calendarIds} onChange={e=>setCfg(p=>({...p,calendarIds:e.target.value}))}/><small>Emails des comptes Google Agenda</small></div>
