function CommandeRapide({job,adresse,emp,notify,onClose,jobId,calendarIds}){
  const [materiaux,setMateriaux]=useState({});
  const [remarques,setRemarques]=useState('');
  const [sending,setSending]=useState(false);
  const [expandedCat,setExpandedCat]=useState(null);

  function setQty(key,desc,unite,delta){
    setMateriaux(prev=>{
      const cur=prev[key]?.qty||0;
      const next=Math.max(0,roundedQtyAdd(cur,delta));
      if(next===0){const u={...prev};delete u[key];return u;}
      return {...prev,[key]:{qty:next,unite,desc}};
    });
  }
  const totalItems=Object.values(materiaux).reduce((s,v)=>s+v.qty,0);
  const selectedItems=Object.entries(materiaux).filter(([,v])=>v.qty>0);

  // Écrire la commande dans la description de l'événement Google Agenda
  async function ajouterCommandeAgenda(jobId,lignes,remarques){
    if(!jobId)return;
    try{
      const calIds=(typeof calendarIds!=='undefined'?calendarIds:'saranelectrique@gmail.com').split(',');
      for(const calId of calIds){
        try{
          const evtRes=await withTokenCheck(()=>gapi.client.calendar.events.get({calendarId:calId.trim(),eventId:jobId}));
          const evt=evtRes.result;
          const now=new Date().toLocaleString('fr-CA');
          const commandeTxt='\n\n--- COMMANDE '+(emp?.nom||'')+' '+now+' ---\n'+lignes.join('\n')+(remarques?'\nRemarques: '+remarques:'');
          const newDesc=(evt.description||'')+commandeTxt;
          await withTokenCheck(()=>gapi.client.calendar.events.patch({
            calendarId:calId.trim(),eventId:jobId,
            resource:{description:newDesc}
          }));
          return;
        }catch(e){}
      }
    }catch(e){console.log('Agenda update skipped:',e.message);}
  }

  function encodeEmail(to,subject,body){
    // subject: strip accents to keep ASCII only
    const safeSub=subject.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^\x20-\x7E]/g,"?");
    const hdr="To: "+to+"\r\nSubject: "+safeSub+"\r\nContent-Type: text/plain; charset=UTF-8\r\nContent-Transfer-Encoding: base64\r\n\r\n";
    // Encode body as UTF-8 base64
    const bodyBytes=new TextEncoder().encode(body);
    let b64="";
    for(let i=0;i<bodyBytes.length;i+=57){
      const chunk=bodyBytes.slice(i,i+57);
      let bin="";chunk.forEach(b=>bin+=String.fromCharCode(b));
      b64+=btoa(bin)+"\r\n";
    }
    // Encode full message: header is ASCII so safe for btoa
    const full=hdr+b64;
    const fullBytes=new Uint8Array(full.length);
    for(let i=0;i<full.length;i++) fullBytes[i]=full.charCodeAt(i)&0xff;
    let fullBin="";fullBytes.forEach(b=>fullBin+=String.fromCharCode(b));
    return btoa(fullBin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  }

  async function envoyer(){
    if(totalItems===0&&!remarques.trim()){notify("Ajoutez des items ou une remarque","err");return;}
    setSending(true);
    try{
      const token=gapi.client.getToken()?.access_token;
      if(!token){notify("Pas de token Google","err");setSending(false);return;}
      const lignes=selectedItems.map(([k,v])=>"  "+v.desc.padEnd(30)+" x "+v.qty+" "+v.unite);
      const body="Bonjour,\n\n"+(emp?.nom||"Un employe")+" passe une commande pour :\n"+
        (job||"---")+(adresse?"\nAdresse : "+adresse:"")+"\n\n"+
        (lignes.length>0?"MATERIAUX REQUIS :\n"+lignes.join("\n")+"\n\n":"")+
        (remarques?"REMARQUES :\n"+remarques+"\n\n":"")+
        "Date : "+localDateStr()+"\nEnvoye depuis PunchPro - Saran Electrique";
      const encoded=encodeEmail("info@saranelectrique.com",(job||"Commande")+" - Commande de materiaux",body);
      const res=await fetch("https://gmail.googleapis.com/gmail/v1/users/me/messages/send",{
        method:"POST",
        headers:{"Authorization":"Bearer "+token,"Content-Type":"application/json"},
        body:JSON.stringify({raw:encoded})
      });
      if(res.ok){
        notify("✅ Commande envoyee!","success");
        // Ajouter la commande dans la description de l'événement
        if(jobId)await ajouterCommandeAgenda(jobId,lignes,remarques);
        onClose();
      }
      else{const e=await res.json();notify("Erreur: "+(e?.error?.message||res.status),"err");}
    }catch(e){notify("Erreur: "+e.message,"err");}
    setSending(false);
  }

  return(
    <div style={{background:"var(--bg)",borderRadius:14,padding:"1rem",maxWidth:480,width:"100%"}}>
      <div style={{background:"linear-gradient(135deg,#e65100,#f57c00)",borderRadius:10,padding:"0.65rem 0.85rem",marginBottom:"0.75rem",display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:8}}>
        <div style={{flex:1}}>
          <div style={{fontSize:10,color:"rgba(255,255,255,0.8)",marginBottom:2}}>COMMANDE DE MATÉRIAUX</div>
          <div style={{fontWeight:700,fontSize:13,color:"white"}}>{job||"—"}</div>
          {adresse&&<div style={{fontSize:10,color:"rgba(255,255,255,0.75)",marginTop:2}}>📍 {adresse}</div>}
        </div>
        {totalItems>0&&<div style={{background:"rgba(255,255,255,0.2)",borderRadius:20,padding:"2px 8px",fontSize:11,fontWeight:700,color:"white",flexShrink:0}}>{totalItems} items</div>}
      </div>
      <div style={{marginBottom:"0.5rem"}}>
        {Object.entries(CATALOGUE).map(([cat,items])=>{
          const catQty=items.reduce((s,item)=>{
            const keys=item.options?item.options.map(o=>item.code+"|"+o):[item.code];
            return s+keys.reduce((ss,k)=>ss+(materiaux[k]?.qty||0),0);
          },0);
          const isOpen=expandedCat===cat;
          return(
            <div key={cat} style={{marginBottom:"0.3rem",border:"1px solid var(--border)",borderRadius:9,overflow:"hidden"}}>
              <div onClick={()=>setExpandedCat(isOpen?null:cat)}
                style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0.45rem 0.65rem",background:"var(--bg3)",cursor:"pointer",touchAction:"manipulation"}}>
                <span style={{fontWeight:600,fontSize:12}}>{cat}</span>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  {catQty>0&&<span style={{background:"#f57c00",color:"white",borderRadius:10,fontSize:9,padding:"1px 6px",fontWeight:700}}>{catQty}</span>}
                  <span style={{color:"var(--muted)",fontSize:11}}>{isOpen?"▼":"▶"}</span>
                </div>
              </div>
              {isOpen&&(
                <div style={{background:"var(--bg2)"}}>
                  {items.map((item,ii)=>{
                    if(item.options||item.sizes){
                      const opts=item.options||item.sizes;
                      return(
                        <div key={ii} style={{borderTop:"1px solid var(--border)",padding:"0.4rem 0.65rem"}}>
                          <div style={{fontSize:11,fontWeight:600,color:"var(--text)",marginBottom:5}}>{item.code} — {item.desc}</div>
                          {opts.map(opt=>{
                            const key=item.code+"|"+opt;const qty=materiaux[key]?.qty||0;
                            return(
                              <div key={opt} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0.2rem 0",borderBottom:"1px solid var(--border)"}}>
                                <span style={{fontSize:11,color:"var(--muted)",flex:1}}>{opt}</span>
                                <div style={{display:"flex",alignItems:"center",gap:3}}>
                                  <button className="dur-btn" style={{width:26,height:26,fontSize:13}} onClick={()=>setQty(key,item.desc+" "+opt,item.unite,-1)}>−</button>
                                  <div style={{fontFamily:"var(--font-head)",fontWeight:700,fontSize:"1rem",color:qty>0?"#f57c00":"var(--muted)",minWidth:26,textAlign:"center"}}>{qty||"—"}</div>
                                  <button className="dur-btn" style={{width:26,height:26,fontSize:12}} onClick={()=>setQty(key,item.desc+" "+opt,item.unite,1)}>+1</button>
                                  <button className="dur-btn" style={{width:30,height:26,fontSize:11}} onClick={()=>setQty(key,item.desc+" "+opt,item.unite,10)}>+10</button>
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      );
                    }
                    const key=item.code;const qty=materiaux[key]?.qty||0;
                    return(
                      <div key={ii} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0.35rem 0.65rem",borderTop:"1px solid var(--border)"}}>
                        <div style={{flex:1}}>
                          <div style={{fontSize:11,fontWeight:500,color:"var(--text)"}}>{item.code}</div>
                          <div style={{fontSize:9,color:"var(--muted)"}}>{item.desc}</div>
                        </div>
                        <div style={{display:"flex",alignItems:"center",gap:3}}>
                          <button className="dur-btn" style={{width:26,height:26,fontSize:13}} onClick={()=>setQty(key,item.desc,item.unite,-1)}>−</button>
                          <div style={{fontFamily:"var(--font-head)",fontWeight:700,fontSize:"1rem",color:qty>0?"#f57c00":"var(--muted)",minWidth:30,textAlign:"center"}}>{qty||"—"}</div>
                          <button className="dur-btn" style={{width:28,height:26,fontSize:12}} onClick={()=>setQty(key,item.desc,item.unite,1)}>+1</button>
                          <button className="dur-btn" style={{width:30,height:26,fontSize:11}} onClick={()=>setQty(key,item.desc,item.unite,10)}>+10</button>
                          {cat==='Fils'&&<button className="dur-btn" style={{width:32,height:26,fontSize:10,color:'var(--warning)'}} onClick={()=>setQty(key,item.desc,item.unite,50)}>+50</button>}
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          );
        })}
      </div>
      {selectedItems.length>0&&(
        <div style={{background:"rgba(245,124,0,0.08)",border:"1px solid rgba(245,124,0,0.3)",borderRadius:9,padding:"0.6rem 0.75rem",marginBottom:"0.5rem"}}>
          <div style={{fontSize:10,fontWeight:700,color:"#f57c00",marginBottom:4,textTransform:"uppercase"}}>Résumé commande</div>
          {selectedItems.map(([k,v])=>(
            <div key={k} style={{display:"flex",justifyContent:"space-between",fontSize:11,padding:"0.1rem 0"}}>
              <span style={{color:"var(--text)"}}>{v.desc||k}</span>
              <span style={{color:"#f57c00",fontWeight:700}}>×{v.qty}</span>
            </div>
          ))}
        </div>
      )}
      <div className="fg" style={{marginBottom:"0.65rem"}}>
        <label>Remarques / Livraison</label>
        <textarea className="note-input" rows={2} value={remarques} onChange={e=>setRemarques(e.target.value)} placeholder="ex: Besoin pour demain 7h"/>
      </div>
      <div style={{display:"flex",gap:"0.4rem"}}>
        <button className="btn-p" style={{marginTop:0,flex:1,background:"linear-gradient(135deg,#e65100,#f57c00)",fontSize:12}}
          disabled={sending||(totalItems===0&&!remarques.trim())} onClick={envoyer}>
          {sending?"⏳ Envoi...":"📧 Envoyer la commande"}
        </button>
        <button className="btn-s" style={{flexShrink:0,padding:"0 0.65rem"}} onClick={onClose}>✕</button>
      </div>
    </div>
  );
}

// ── JOB SUMMARY (accueil) ─────────────────────────────────────────────────────
function JobSummary({jobs,allJobs,emp,notify,calendarIds,sid,allEmps,onJobsRefresh}){
  const [dayTab,setDayTab]=useState('today');
  const [commandeJob,setCommandeJob]=useState(null);
  const today=localDateStr();
  const tomorrow=localDateStr(new Date(Date.now()+86400000));

  // Bornes de la semaine courante (lundi → vendredi seulement — même
  // convention que la vue Semaine de l'Agenda, pas de samedi/dimanche)
  const weekDates=useMemo(()=>{
    const d=new Date();d.setHours(0,0,0,0);
    const dow=d.getDay(); // 0=dim..6=sam
    const diffToMonday=(dow+6)%7;
    const monday=new Date(d);monday.setDate(d.getDate()-diffToMonday);
    const arr=[];
    for(let i=0;i<5;i++){const dd=new Date(monday);dd.setDate(monday.getDate()+i);arr.push(localDateStr(dd));}
    return arr;
  },[]);
  // Vérifier si une job est assignée à l'employé connecté — même logique
  // partagée (texte + repli couleur) que partout ailleurs dans l'app.
  function isAssignedToMe(job){
    if(!emp||!emp.nom)return true; // si pas d'employé, ne pas filtrer
    return isJobForEmployee(job,emp,allEmps);
  }

  const myJobs=jobs.filter(isAssignedToMe);
  const otherJobs=jobs.filter(j=>!isAssignedToMe(j));

  const todayJobsMine=myJobs.filter(j=>jobCouvreDate(j,today))
    .sort((a,b)=>new Date(a.start)-new Date(b.start));
  const tomorrowJobsMine=myJobs.filter(j=>jobCouvreDate(j,tomorrow))
    .sort((a,b)=>new Date(a.start)-new Date(b.start));
  const todayJobsOther=otherJobs.filter(j=>jobCouvreDate(j,today))
    .sort((a,b)=>new Date(a.start)-new Date(b.start));
  const tomorrowJobsOther=otherJobs.filter(j=>jobCouvreDate(j,tomorrow))
    .sort((a,b)=>new Date(a.start)-new Date(b.start));

  const weekJobsMine=myJobs.filter(j=>weekDates.some(d=>jobCouvreDate(j,d)))
    .sort((a,b)=>new Date(a.start)-new Date(b.start));
  const weekJobsOther=otherJobs.filter(j=>weekDates.some(d=>jobCouvreDate(j,d)))
    .sort((a,b)=>new Date(a.start)-new Date(b.start));

  const todayJobs=todayJobsMine; // pour le compteur dans l'onglet
  const tomorrowJobs=tomorrowJobsMine;
  const shownMine=dayTab==='today'?todayJobsMine:dayTab==='tomorrow'?tomorrowJobsMine:weekJobsMine;
  const shownOther=dayTab==='today'?todayJobsOther:dayTab==='tomorrow'?tomorrowJobsOther:weekJobsOther;
  const dayLabel=dayTab==='today'?"aujourd'hui":dayTab==='tomorrow'?'demain':'cette semaine';

  if(commandeJob)return(
    <div style={{width:'100%',marginTop:'0.75rem'}}>
      <CommandeRapide
        job={commandeJob.title} adresse={commandeJob.location||''}
        jobId={commandeJob.id||null}
        calendarIds={calendarIds}
        emp={emp} notify={notify}
        onClose={()=>setCommandeJob(null)}/>
    </div>
  );

  // Carte d'une job "à moi" — extrait en fonction pour être réutilisable
  // telle quelle (liste plate pour Aujourd'hui/Demain, ou groupée par jour
  // pour Cette semaine).
  function MineCard({j,i}){
    return(
      <div key={'mine'+i} style={{background:'var(--bg3)',borderRadius:9,padding:'0.5rem 0.65rem',marginBottom:'0.4rem',
        borderLeft:'3px solid '+(emp?.couleur||j.gcalColor||'var(--accent)'),
        display:'flex',alignItems:'center',gap:8}}>
        <div style={{flex:1,minWidth:0}}>
          <div style={{display:'flex',alignItems:'center',gap:6}}>
            {emp&&<span style={{fontSize:9,fontWeight:700,color:'white',background:emp.couleur,borderRadius:4,padding:'1px 5px',flexShrink:0}}>{emp.code}</span>}
            <div style={{fontWeight:600,fontSize:12,color:'var(--text)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{j.title}</div>
          </div>
          {j.location&&<a href={mapsUrl(j.location)} target="_blank" rel="noopener noreferrer"
            style={{fontSize:10,color:'var(--accent)',marginTop:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',display:'block',textDecoration:'none'}}>📍 {j.location}</a>}
          <div style={{fontSize:10,color:'var(--muted)',marginTop:1}}>
            {new Date(j.start).toLocaleTimeString('fr-CA',{hour:'2-digit',minute:'2-digit'})}
            {j.end&&' → '+new Date(j.end).toLocaleTimeString('fr-CA',{hour:'2-digit',minute:'2-digit'})}
          </div>
        </div>
        <button onClick={()=>setCommandeJob(j)}
          style={{flexShrink:0,background:'rgba(230,81,0,0.12)',border:'1px solid rgba(230,81,0,0.3)',
            color:'#f57c00',borderRadius:8,padding:'0.3rem 0.55rem',fontSize:11,fontWeight:600,
            cursor:'pointer',touchAction:'manipulation',whiteSpace:'nowrap'}}>
          📦 Commander
        </button>
      </div>
    );
  }
  function OtherCard({j,i}){
    // Même repère de diagnostic que l'Agenda — montre le résultat RÉEL de
    // jobAssignees() et sa source (texte ou couleur), pour voir si un match
    // texte "vole" la job à un autre employé avant le repli couleur.
    let debugTag=null;
    if(allEmps&&allEmps.length){
      const txt=j.title+' '+(j.description||'');
      const textMatches=allEmps.filter(e=>mentionsEmployee(txt,e));
      if(textMatches.length>0){
        debugTag='📝'+textMatches.map(e=>e.code).join(',');
      }else if(j.gcalColor){
        let best=null,bestDist=Infinity;
        allEmps.forEach(e=>{if(!e.couleur)return;const d=colorDist(j.gcalColor,e.couleur);if(d<bestDist){bestDist=d;best=e;}});
        if(best)debugTag='🎨≈'+best.code;
      }
    }
    return(
      <div key={'other'+i} style={{background:'var(--bg2)',borderRadius:9,padding:'0.5rem 0.65rem',marginBottom:'0.4rem',
        borderLeft:'3px solid '+(j.gcalColor||'var(--muted)'),opacity:0.85,
        display:'flex',alignItems:'center',gap:8}}>
        <div style={{flex:1,minWidth:0}}>
          <div style={{display:'flex',alignItems:'center',gap:5}}>
            <div style={{fontWeight:600,fontSize:12,color:'var(--text)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{j.title}</div>
            {debugTag&&<span style={{fontSize:8,color:'var(--muted)',opacity:0.7,flexShrink:0}} title="Qui l'algorithme pense être assigné (📝=texte, 🎨=couleur)">{debugTag}</span>}
          </div>
          {j.location&&<a href={mapsUrl(j.location)} target="_blank" rel="noopener noreferrer"
            style={{fontSize:10,color:'var(--accent)',marginTop:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',display:'block',textDecoration:'none'}}>📍 {j.location}</a>}
          <div style={{fontSize:10,color:'var(--muted)',marginTop:1}}>
            {new Date(j.start).toLocaleTimeString('fr-CA',{hour:'2-digit',minute:'2-digit'})}
            {j.end&&' → '+new Date(j.end).toLocaleTimeString('fr-CA',{hour:'2-digit',minute:'2-digit'})}
          </div>
        </div>
      </div>
    );
  }

  return(
    <div style={{width:'100%',marginTop:'0.75rem'}}>
      <div className="tabs" style={{marginBottom:'0.5rem',flexWrap:'wrap'}}>
        <div className={'tab'+(dayTab==='today'?' active':'')} onClick={()=>setDayTab('today')}>
          Aujourd'hui {todayJobs.length>0&&<span style={{fontSize:9,marginLeft:3,opacity:0.8}}>({todayJobs.length})</span>}
        </div>
        <div className={'tab'+(dayTab==='tomorrow'?' active':'')} onClick={()=>setDayTab('tomorrow')}>
          Demain {tomorrowJobs.length>0&&<span style={{fontSize:9,marginLeft:3,opacity:0.8}}>({tomorrowJobs.length})</span>}
        </div>
        <div className={'tab'+(dayTab==='week'?' active':'')} onClick={()=>setDayTab('week')}>
          Cette semaine {weekJobsMine.length>0&&<span style={{fontSize:9,marginLeft:3,opacity:0.8}}>({weekJobsMine.length})</span>}
        </div>
        <div className={'tab'+(dayTab==='agenda'?' active':'')} onClick={()=>setDayTab('agenda')}>
          📅 Agenda
        </div>
      </div>
      {dayTab==='agenda'?(
        // Onglet Agenda = juste le mois (naviguer n'importe quel jour,
        // filtre mes jobs/toute l'équipe). La vue Semaine est maintenant
        // couverte par l'onglet "Cette semaine" ci-dessous — plus besoin du
        // sélecteur Mois/Semaine ici.
        <AgendaEmp jobs={allJobs&&allJobs.length>0?allJobs:jobs} emp={emp} notify={notify} calendarIds={calendarIds} sid={sid} allEmps={allEmps} onJobsRefresh={onJobsRefresh} onBack={()=>setDayTab('today')} initialViewMode="mois" lockViewMode={true}/>
      ):dayTab==='week'?(
        // Même affichage que la vue Semaine de l'Agenda (même style, mêmes
        // cartes) — scope "team" verrouillé dessus car il montre déjà mes
        // jobs en premier, suivies du reste de l'équipe, dans le même bloc.
        <AgendaEmp jobs={allJobs&&allJobs.length>0?allJobs:jobs} emp={emp} notify={notify} calendarIds={calendarIds} sid={sid} allEmps={allEmps} onJobsRefresh={onJobsRefresh} initialViewMode="semaine" lockViewMode={true} initialScope="team"/>
      ):shownMine.length===0&&shownOther.length===0?(
        <div style={{color:'var(--muted)',fontSize:12,textAlign:'center',padding:'0.75rem'}}>
          Aucune job {dayLabel}.
        </div>
      ):(
        <div>
          {shownMine.length===0&&(
            <div style={{color:'var(--muted)',fontSize:11,textAlign:'center',padding:'0.5rem'}}>
              Aucune job pour toi {dayLabel}.
            </div>
          )}
          {shownMine.map((j,i)=><MineCard key={'mine'+i} j={j} i={i}/>)}
          {shownOther.length>0&&(
            <>
              <div style={{display:'flex',alignItems:'center',gap:8,margin:'0.7rem 0 0.4rem'}}>
                <div style={{fontSize:10,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'0.05em',fontWeight:600}}>Autres équipes</div>
                <div style={{flex:1,height:1,background:'var(--border)'}}></div>
              </div>
              {shownOther.map((j,i)=><OtherCard key={'other'+i} j={j} i={i}/>)}
            </>
          )}
        </div>
      )}
    </div>
  );
}


function WelcomeScreen({emps,sid,calendarIds,notify,onRefresh,setNavBack,setMenuAction,folders,refreshKey,cfg}){
  const now=useClock();
  const [step,setStep]=useState('emps');
  const isSubmittingRef=useRef(false); // empêche double-soumission (double-clic / réseau lent)
  // steps: emps > mode > job > punch-in > pin > result
  //                    > duration-out > pin-out > result
  //                    > confirm > pin-confirm > result
  //                    > history
  const [selEmp,setSelEmp]=useState(null);
  const [mode,setMode]=useState('in');
  const [selJob,setSelJob]=useState('');
  const [selJobColor,setSelJobColor]=useState('');
  const [selJobDate,setSelJobDate]=useState('');
  const [jobs,setJobs]=useState([]);
  const [allJobs,setAllJobs]=useState([]);
  const [monDashTab,setMonDashTab]=useState('heures'); // 'heures' | 'projets' | 'ot' | 'config' — pour "Mon dashboard"
  const [geoPrefTick,setGeoPrefTick]=useState(0); // force le re-render du toggle Config après un changement
  const [allOrgPts,setAllOrgPts]=useState([]); // tous les pointages de TOUS les employés — chargé pour l'onglet Ordres de travail (pas juste ceux de l'employé connecté)
  const [loadingOT,setLoadingOT]=useState(false);
  const [result,setResult]=useState(null);
  const punchDataRef=useRef({});
  const ptsRef=useRef([]);
  const [ptsForOut,setPtsForOut]=useState([]);
  // Géo-alerte "punch out oublié" : coordonnées du punch IN actif + set des
  // punchs déjà notifiés (évite de spammer la même alerte en boucle).
  const activePunchRef=useRef(null);
  const geoNotifiedRef=useRef(new Set());

  const pad=n=>String(n).padStart(2,'0');
  const days=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
  const months=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  const today=localDateStr(now);
  const curWeek=getWeek(now);
  const curMois=getMois(now);

  // Live statut from emps list (not stale copy)
  const liveEmp=selEmp?emps.find(e=>e.nom===selEmp.nom)||selEmp:null;
  const empStatut=liveEmp?liveEmp.statut:'out';

  // Ordres de travail = liste org-wide (tous les employés), pas juste l'employé connecté
  useEffect(()=>{
    if(monDashTab==='ot'&&sid){
      setLoadingOT(true);
      getPointages(sid,{}).then(p=>{setAllOrgPts(p);setLoadingOT(false);}).catch(e=>{console.error(e);setLoadingOT(false);});
    }
  },[monDashTab,sid]);

  function refreshCalJobs(){
    if(calendarIds&&calendarIds.length){
      // IMPORTANT : un échec réseau/API transitoire (token expiré, quota, etc.)
      // fait retourner un tableau vide par getCalendarJobs/getAllCalendarJobs
      // (les erreurs par calendrier sont avalées en interne). Sans cette garde,
      // un rafraîchissement en arrière-plan qui échoue silencieusement EFFACE
      // les jobs déjà chargés (régression v183 : "les jobs d'aujourd'hui ont
      // disparu"). On ne remplace donc jamais une liste non vide par une liste
      // vide — seulement par une liste avec du contenu.
      getCalendarJobs(calendarIds).then(j=>{if(j&&j.length>0)setJobs(j);});
      getAllCalendarJobs(calendarIds).then(j=>{if(j&&j.length>0)setAllJobs(j);});
    }
  }
  useEffect(()=>{
    refreshCalJobs();
    // Les jobs Google Calendar peuvent être ajoutés/modifiés à tout moment par
    // n'importe qui — on rafraîchit donc automatiquement en plus du montage,
    // pour ne jamais rester sur une liste de jobs périmée.
    const t=setInterval(refreshCalJobs,90000);
    return()=>clearInterval(t);
  },[calendarIds?calendarIds.join(','):'',refreshKey]);

  // ── GÉO-ALERTE "PUNCH OUT OUBLIÉ" ──────────────────────────────────────
  // Pendant qu'un employé est punché IN, on vérifie périodiquement sa
  // position par rapport à celle captée au moment du punch IN. S'il s'en
  // est éloigné (>500m) sans avoir punché OUT, on l'avertit (toast +
  // notification native si permise). Ça ne fonctionne que pendant que
  // l'app reste ouverte sur son téléphone — pas de vrai suivi en arrière-
  // plan possible sans serveur (limite connue, surtout sur iPhone).
  useEffect(()=>{
    if(!selEmp||empStatut!=='in'||!isGeoEnabled(selEmp.nom)){activePunchRef.current=null;return;}
    let cancelled=false;
    // Si l'app est rouverte en plein quart (activePunchRef vide car remis à
    // zéro par un rechargement de page), on retrouve le punch IN ouvert et
    // ses coordonnées à partir des pointages déjà enregistrés.
    async function ensureActivePunch(){
      if(activePunchRef.current)return;
      try{
        const p=await getPointages(sid,{nom:selEmp.nom});
        const combined=combinePts(p.filter(r=>r.nom===selEmp.nom));
        const open=combined.find(l=>l.type==='pair'&&l.heures==null);
        if(open){
          const raw=p.find(r=>r.row===open.inRow);
          if(raw&&raw.lat!=null&&raw.lng!=null&&!cancelled){
            activePunchRef.current={job:open.job||'',lat:raw.lat,lng:raw.lng,key:selEmp.nom+'|'+raw.datetime};
          }
        }
      }catch(e){console.error('Géo-alerte (reconstruction):',e);}
    }
    ensureActivePunch();
    async function check(){
      const ap=activePunchRef.current;
      if(cancelled||!ap)return;
      const pos=await getGeoPos();
      if(!pos||cancelled)return;
      const d=distMeters(pos.lat,pos.lng,ap.lat,ap.lng);
      if(d>GEOFENCE_METERS&&!geoNotifiedRef.current.has(ap.key)){
        geoNotifiedRef.current.add(ap.key);
        const msg=selEmp.nom+' semble avoir quitté "'+(ap.job||'le chantier')+'" (~'+Math.round(d)+'m) sans punch out.';
        notify('📍 '+msg,'warn');
        if(typeof Notification!=='undefined'&&Notification.permission==='granted'){
          try{
            navigator.serviceWorker?.getRegistration().then(reg=>{
              if(reg)reg.showNotification('PunchPro — Punch out oublié?',{body:msg,icon:'icon-192.png'});
              else new Notification('PunchPro — Punch out oublié?',{body:msg,icon:'icon-192.png'});
            });
          }catch(e){/* silencieux — la notif in-app (toast) reste affichée de toute façon */}
        }
      }
    }
    const t=setInterval(check,GEOFENCE_CHECK_MS);
    return()=>{cancelled=true;clearInterval(t);};
  },[selEmp?.nom,empStatut,sid]);

  useEffect(()=>{
    if(step==='emps')setNavBack(null);
    else setNavBack(()=>goBack);
    if(setMenuAction){
      if(selEmp&&step!=='pin-entry')setMenuAction(()=>()=>setStep('mode'));
      else setMenuAction(null);
    }
  },[step]);

  function goBack(){
    if(step==='mode'){setSelEmp(null);setStep('emps');}
    else if(step==='pin-entry'){setSelEmp(null);setStep('emps');}
    else if(step==='job')setStep('mode');
    else if(step==='punch-in'||step==='confirm')setStep('job');
    else if(step==='duration-out')setStep('mode');
    else if(step==='history'||step==='projets'||step==='agenda-emp'||step==='mon-dashboard')setStep('mode');
    else if(step==='admin-team'||step==='config-emp')setStep('mode');
    else setStep('emps');
  }

  function reset(){
    setStep('emps');setSelEmp(null);setSelJob('');
    setSelJobColor('');punchDataRef.current={};setMode('in');setResult(null);
  }

  async function handlePunch(pin,type){
    if(isSubmittingRef.current)return; // déjà en cours — ignore le clic supplémentaire
    isSubmittingRef.current=true;
    const emp=selEmp;
    if(!emp){isSubmittingRef.current=false;return;}
    if(String(emp.pin).trim()!==String(pin).trim()){
      setResult({err:true});
      setTimeout(()=>setResult(null),2500);
      isSubmittingRef.current=false;
      return;
    }
    const data={job:selJob||'',jobColor:selJobColor||'',...punchDataRef.current};
    // Capter la position GPS au Punch IN (best-effort — ne bloque jamais le
    // punch si refusé/indisponible). Sert à l'alerte "punch out oublié".
    // Respecte le choix de l'employé dans Mon dashboard > Config.
    if(type==='in'&&isGeoEnabled(emp.nom)){
      const geo=await getGeoPos();
      if(geo){data.lat=geo.lat;data.lng=geo.lng;}
    }
    try{
      if(type==='confirm'){
        const confirmedData={
          ...data,
          note:(data.note||'')+(data.heureDebut&&data.heureFin?' ['+data.heureDebut+'→'+data.heureFin+']':''),
          jobDate:data.jobDate||null,
        };
        await addPointage(sid,emp,'confirm',confirmedData);
        // Enregistrer heures de banque prises
        if(data.heuresBanquePrises&&data.heuresBanquePrises>0){
          await addHeuresBanque(sid,emp.nom,getWeek(new Date()),-data.heuresBanquePrises);
          notify('🏦 -'+hToQuart(data.heuresBanquePrises)+' de la banque','success');
        }
        if(data.coeqHeures){
          for(const [nom,h] of Object.entries(data.coeqHeures)){
            const ce=emps.find(e=>e.nom===nom);
            if(ce&&h>0)await addPointage(sid,ce,'confirm',{
              ...confirmedData,
              heures:h,
              note:(data.note||'')+(data.heureDebut&&data.heureFin?' ['+data.heureDebut+'→'+data.heureFin+']':'')+' [via '+emp.nom+']',
              coequipiers:[emp.nom]
            });
          }
        }
      }else{
        await addPointage(sid,emp,type,data);
        await updateStatus(sid,emp.row,type);
        // Update coequipier statuses on punch IN
        if(type==='in'&&data.coequipiers&&data.coequipiers.length>0){
          for(const nom of data.coequipiers){
            const ce=emps.find(e=>e.nom===nom);
            if(ce)await updateStatus(sid,ce.row,'in');
          }
        }
        if(type==='out'){
          // Find the original punch IN (may belong to another employee if this is a coequipier punching out)
          const allPtsForJob=await getPointages(sid,{nom:emp.nom});
          // NOUVEAU — parmi tous les IN portant ce titre de job, on ne garde que
          // ceux ENCORE OUVERTS (aucun out/confirm plus récent pour le même job),
          // puis on prend le plus récent. Évite d'accrocher un vieux jour quand
          // le même titre de job revient (ex: contrat récurrent, événement répété).
          const candidatsIn=allPtsForJob.filter(p=>
            p.type==='in' &&
            (p.job||'')===(data.job||'') &&
            (p.nom===emp.nom || (p.coequipiers&&p.coequipiers.includes(emp.nom)))
          );
          const origIn=candidatsIn
            .filter(inRow=>!allPtsForJob.some(o=>
              (o.type==='out'||o.type==='confirm') &&
              (o.job||'')===(inRow.job||'') &&
              new Date(o.datetime)>new Date(inRow.datetime)
            ))
            .sort((a,b)=>new Date(b.datetime)-new Date(a.datetime))[0];
          // Build full list of coequipiers for this punch OUT
          // If this employee was a coequipier on the original IN, the original puncher is now their coequipier
          let allCoeqs=[...(data.coequipiers||[])];
          if(origIn&&origIn.nom!==emp.nom&&!allCoeqs.includes(origIn.nom)){
            allCoeqs.push(origIn.nom);
          }
          // Record hours for all coequipiers
          const coeqHrs=data.coeqHeures||{};
          // Charger TOUS les pointages une seule fois pour détecter les IN orphelins des coéquipiers
          const allPtsRaw=await getPointages(sid,{});
          for(const nom of allCoeqs){
            const ce=emps.find(e=>e.nom===nom);
            if(!ce)continue;
            const h=coeqHrs[nom]!==undefined?coeqHrs[nom]:data.heures||0;
            if(h>0){
              // Vérifier si ce coéquipier a déjà son propre punch IN ouvert pour cette job/date
              // (évite la création d'une 2e ligne en double — on ferme l'existant à la place)
              const todayStr=data.jobDate||localDateStr();
              const orphanIn=allPtsRaw.find(p=>
                p.nom===nom && p.type==='in' &&
                (p.job||'')===(data.job||'') &&
                p.date===todayStr
              );
              if(orphanIn){
                // Fermer le IN orphelin directement (écrire les heures + changer son statut)
                await updatePointageData(sid,orphanIn.row,{
                  job:data.job,jobColor:data.jobColor,
                  deplacement:data.deplacement||0,heures:h,
                  note:(data.note||'')+' [via '+emp.nom+']',
                  fichiersURL:data.fichiersURL||[],
                  coequipiers:[emp.nom]
                });
              }else{
                await addPointage(sid,ce,'confirm',{
                  job:data.job,jobColor:data.jobColor,
                  heures:h,deplacement:data.deplacement||0,
                  note:(data.note||'')+'[via '+emp.nom+']',
                  fichiersURL:data.fichiersURL||[],
                  coequipiers:[emp.nom]
                });
              }
              await updateStatus(sid,ce.row,'out');
            }
          }
        }
        if(type==='out'){
          const curW=getWeek(new Date());
          const semPts=await getPointages(sid,{nom:emp.nom,semaine:curW});
          const total=calcH(semPts);
          if(total>40){
            const extra=Math.round((total-40)*10)/10;
            const bq=await getHeuresBanque(sid);
            if(!bq.some(b=>b.nom===emp.nom&&b.semaine===curW)){
              await addHeuresBanque(sid,emp.nom,curW,extra);
              notify('🏦 '+emp.nom+' — '+extra+'h en banque!','warn');
            }
          }
        }
      }
      // Load fresh pts - if fails, build from what we just wrote
      let allPts=[];
      try{allPts=await getPointages(sid,{nom:emp.nom});}catch(e){console.warn('Reload pts failed:',e);}
      // If reload failed or empty, inject the punch we just made so PunchOut can see it
      if(allPts.length===0&&type==='in'){
        const now3=new Date();
        const inDt=data.customTime?new Date(now3.getFullYear(),now3.getMonth(),now3.getDate(),parseInt((data.customTime.split(':')[0])||0),parseInt((data.customTime.split(':')[1])||0)):now3;
        allPts=[{nom:emp.nom,type:'in',datetime:inDt.toISOString(),date:localDateStr(inDt),heure:data.customTime||localDateStr(inDt),job:data.job||'',jobColor:data.jobColor||'',deplacement:0,heures:0,note:'',fichiersURL:[],coequipiers:[],row:999}];
      }
      ptsRef.current=allPts;
      setPtsForOut(allPts);
      // Mettre à jour l'état de la géo-alerte : un punch IN avec coordonnées
      // devient le "punch actif" à surveiller ; un punch OUT l'annule.
      if(type==='in'&&data.lat!=null&&data.lng!=null){
        activePunchRef.current={job:data.job||'',lat:data.lat,lng:data.lng,key:emp.nom+'|'+Date.now()};
        geoNotifiedRef.current=new Set();
      }else if(type==='out'){
        activePunchRef.current=null;
      }
      const selJobInfo=jobs.find(j=>j.title===selJob)||null;
      setResult({ok:true,nom:emp.nom,type,
        heure:data.customTime||now.toLocaleTimeString('fr-CA',{hour:'2-digit',minute:'2-digit'}),
        couleur:emp.couleur,code:emp.code,pts:allPts,
        job:selJob,jobColor:selJobColor,
        dep:data.deplacement||0,heures:data.heures||0,
        coeqs:data.coequipiers||[],
        description:selJobInfo?.description||'',
        location:selJobInfo?.location||''});
      setStep('result');
      setNavBack(null);
      onRefresh();
    }catch(e){
      notify('Erreur punch: '+e.message,'err');
      console.error(e);
    }finally{
      isSubmittingRef.current=false;
    }
  }

  const TimeHeader=()=>(
    <><div className="w-time">{pad(now.getHours())}:{pad(now.getMinutes())}</div>
    <div className="w-date">{days[now.getDay()]} {now.getDate()} {months[now.getMonth()]} {now.getFullYear()}</div></>

  // ── RESULT ──
  );
  if(step==='result'&&result&&result.ok){
    const rpts=result.pts||[];
    return(
      <div className="welcome">
        <div className="punch-result ok">
          <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:10,marginBottom:8}}>
            <div className="emp-av" style={{background:result.type==='in'&&result.jobColor?result.jobColor:result.couleur,width:38,height:38,fontSize:12}}>{result.code}</div>
            <div style={{fontFamily:'var(--font-head)',fontSize:'1.05rem',fontWeight:800}}>{result.nom}</div>
          </div>
          <span className={'pbadge '+(result.type==='confirm'?'confirm':result.type)}>{result.type==='in'?'✅ Punch IN':result.type==='out'?'🔴 Punch OUT':'✅ Job confirmée'}</span>
          <div style={{fontFamily:'var(--font-head)',fontWeight:700,fontSize:'1.1rem',margin:'4px 0'}}>{result.heure}</div>
          {result.job&&<div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:5,marginBottom:4}}><div style={{width:8,height:8,borderRadius:'50%',background:result.jobColor||'var(--accent)'}}></div><span style={{fontSize:11,color:'var(--muted)'}}>{result.job}</span></div>}
          {result.type==='in'&&result.description&&(
            <div style={{background:'rgba(255,255,255,0.05)',borderRadius:8,padding:'0.45rem 0.65rem',margin:'6px 0',textAlign:'left',fontSize:11,color:'var(--muted)',lineHeight:1.4}}>{result.description}</div>
          )}
          {result.type==='in'&&result.location&&(
            <div style={{display:'flex',alignItems:'center',gap:8,margin:'4px 0 8px',background:'rgba(255,255,255,0.05)',borderRadius:8,padding:'0.4rem 0.65rem'}}>
              <span style={{fontSize:11,color:'var(--muted)',flex:1,textAlign:'left'}}>📍 {result.location}</span>
              <a href={'https://maps.google.com/?q='+encodeURIComponent(result.location)}
                target="_blank" rel="noreferrer"
                style={{background:'rgba(255,122,26,0.2)',color:'var(--accent)',borderRadius:6,padding:'0.22rem 0.6rem',fontSize:11,fontWeight:600,textDecoration:'none',flexShrink:0,touchAction:'manipulation'}}>
                🗺 Maps
              </a>
            </div>
          )}
          {result.coeqs&&result.coeqs.length>0&&<div style={{fontSize:11,color:'var(--muted)',marginBottom:4}}>{'👥 '+result.coeqs.join(', ')}</div>}
          {result.dep>0&&<span className="pbadge travel">{'🚗 '+result.dep+'min'}</span>}
          {result.heures>0&&<span className="pbadge in">{'⏱ '+result.heures+'h'}</span>}
          <div className="punch-stats">
            <div className="ps"><div className="v">{calcH(rpts.filter(p=>p.date===today))}h</div><div className="l">Auj.</div></div>
            <div className="ps"><div className="v">{calcH(rpts.filter(p=>p.semaine===curWeek))}h</div><div className="l">Sem.</div></div>
            <div className="ps"><div className="v">{calcH(rpts.filter(p=>p.mois===curMois))}h</div><div className="l">Mois</div></div>
            <div className="ps"><div className="v">{Math.round(rpts.filter(p=>p.semaine===curWeek&&(p.type==='in'||p.type==='confirm')).reduce((s,p)=>s+(p.deplacement||0),0))}m</div><div className="l">Dépl.</div></div>
          </div>
          {/* Opt-in alertes géo — demande de permission sur un vrai clic (Safari
              ignore Notification.requestPermission() appelé depuis un timer) */}
          {result.type==='in'&&typeof Notification!=='undefined'&&Notification.permission==='default'&&(
            <div style={{background:'rgba(255,122,26,0.08)',border:'1px solid rgba(255,122,26,0.3)',borderRadius:8,padding:'0.5rem 0.65rem',margin:'8px 0',textAlign:'left'}}>
              <div style={{fontSize:11,color:'var(--muted)',marginBottom:5}}>🔔 Recevoir une alerte si tu quittes le chantier sans punch out?</div>
              <button className="btn-s" style={{width:'100%',fontSize:11,padding:'0.35rem'}}
                onClick={()=>Notification.requestPermission().then(p=>{if(p==='granted')notify('🔔 Alertes activées','success');})}>
                Activer les alertes
              </button>
            </div>
          )}
          {/* Bouton appel de service après punch OUT ou confirm */}
          {(result.type==='out'||result.type==='confirm')&&(
            <button className="btn-s" style={{marginTop:'0.6rem',width:'100%',borderColor:'rgba(255,122,26,0.4)',color:'var(--accent)',fontSize:12}}
              onClick={()=>setStep('appel-service')}>
              📋 Créer un appel de service
            </button>
          )}
          <button className="btn-s" style={{marginTop:'0.4rem',width:'100%'}} onClick={reset}>← Retour à l'accueil</button>
        </div>
      </div>
              );
  }
  if(step==='result'&&result&&result.err)return(<div className="welcome"><div className="punch-result err"><div style={{fontSize:'1.8rem',marginBottom:8}}>❌</div><div style={{fontFamily:'var(--font-head)',fontWeight:700}}>PIN incorrect</div><button style={{background:'none',border:'none',color:'var(--muted)',fontSize:11,cursor:'pointer',marginTop:'0.55rem',textDecoration:'underline'}} onClick={reset}>← Retour</button></div></div>);

  // ── APPEL DE SERVICE ──
  if(step==='appel-service')return(
    <div className="welcome" style={{justifyContent:'flex-start',paddingTop:'1rem'}}>
      <AppelDeService
        emp={selEmp||{nom:'',couleur:'#ff7a1a',code:'??'}}
        job={selJob||result?.job||''}
        adresse={jobs.find(j=>j.title===(selJob||result?.job))?.location||result?.location||''}
        notify={notify}
        onClose={()=>{reset();}}
      />
    </div>
  );

  // ── AGENDA EMPLOYÉ ──
  if(step==='agenda-emp')return(
    <div className="welcome" style={{justifyContent:'flex-start',paddingTop:'0.75rem'}}>
      <TimeHeader/>
      <AgendaEmp jobs={allJobs.length>0?allJobs:jobs} emp={selEmp} notify={notify} calendarIds={calendarIds} sid={sid} allEmps={emps} onJobsRefresh={refreshCalJobs} onBack={()=>setStep('mode')}/>
    </div>
  );

  // ── PIN — une seule fois, à la sélection du nom ──
  if(step==='pin-entry')return(<div className="welcome"><TimeHeader/><PinPad empName={selEmp&&selEmp.nom} empCouleur={selEmp&&selEmp.couleur} empCode={selEmp&&selEmp.code} label="Entrer votre code" onSubmit={pin=>{
    if(selEmp&&String(selEmp.pin).trim()===String(pin).trim()){setStep('mode');}
    else{notify('Code incorrect','err');}
  }} onCancel={()=>{setSelEmp(null);setStep('emps');}}/></div>);
  if(step==='config-emp')return(
    <div className="welcome" style={{justifyContent:'flex-start',paddingTop:'0.75rem',width:'100%'}}>
      <TimeHeader/>
      <div style={{width:'100%'}}>
        <ConfigScreen cfg={cfg} sid={sid} notify={notify} onRefresh={onRefresh} onClose={()=>setStep('mode')}/>
      </div>
    </div>
  );
  if(step==='admin-team')return(
    <div className="welcome" style={{justifyContent:'flex-start',paddingTop:'0.75rem',width:'100%'}}>
      <TimeHeader/>
      <div style={{width:'100%'}}>
        <AdminView sid={sid} calendarIds={calendarIds} refreshKey={refreshKey} notify={notify} onRefresh={onRefresh} allowedTabs={(selEmp.permissions||[]).filter(p=>p!=='config')}/>
      </div>
    </div>
  );

  // ── PUNCH IN ──
  if(step==='punch-in')return(
    <div className="welcome" style={{justifyContent:'flex-start',paddingTop:'1rem'}}>
      <TimeHeader/>
      <PunchInScreen emp={selEmp} allEmps={emps} selJob={selJob} selJobColor={selJobColor}
        selJobData={jobs.find(j=>j.title===selJob)||null}
        onConfirm={d=>{punchDataRef.current=d;handlePunch(selEmp.pin,'in');}} onBack={goBack}/>
    </div>

  // ── PUNCH OUT ──
  );
  if(step==='duration-out')return(
    <div className="welcome" style={{justifyContent:'flex-start',paddingTop:'1rem'}}>
      <TimeHeader/>
      <PunchOutScreen emp={selEmp} allEmps={emps} pts={ptsForOut} sid={sid}
        onConfirm={d=>{punchDataRef.current=d;setSelJob(d.job||'');setSelJobColor(d.jobColor||'');handlePunch(selEmp.pin,'out');}}
        onBack={goBack} notify={notify} folders={folders} calendarIds={calendarIds} calJobs={jobs} allJobs={allJobs.length>0?allJobs:jobs}/>
    </div>

  // ── CONFIRM JOB ──
  );
  if(step==='confirm')return(
    <div className="welcome" style={{justifyContent:'flex-start',paddingTop:'1rem'}}>
      <TimeHeader/>
      <DurationForm emp={selEmp} allEmps={emps} jobName={selJob} jobColor={selJobColor}
        jobLocation={jobs.find(j=>j.title===selJob)?.location||''}
        jobDate={selJobDate}
        isOut={false}
        onConfirm={d=>{punchDataRef.current=d;handlePunch(selEmp.pin,'confirm');}}
        onBack={goBack} notify={notify} folders={folders} calendarIds={calendarIds}/>
    </div>

  // ── JOB SELECTOR ──
  );
  if(step==='job')return(
    <div className="welcome" style={{justifyContent:'flex-start',paddingTop:'1rem'}}>
      <TimeHeader/>
      <JobSelector jobs={allJobs.length>0?allJobs:jobs} emp={selEmp} mode={mode} allEmps={emps} sid={sid}
        onSelect={(t,c)=>{setSelJob(t);setSelJobColor(c);
          const jobObj=jobs.find(j=>j.title===t)||null;
          const todayStr=localDateStr();
          const jDate=jobObj?(jobCouvreDate(jobObj,todayStr)?todayStr:localDateStr(new Date(jobObj.start))):'';
          setSelJobDate(jDate);
          if(mode==='out')setStep('duration-out');
          else if(mode==='confirm')setStep('confirm');
          else setStep('punch-in');
        }}
        onCreateJob={async(nj)=>{
          const calId=calendarIds&&calendarIds[0]||'primary';
          // Couleur/description de l'événement = celles de l'employé assigné
          // (pas automatiquement celles de la personne qui crée le job — un
          // dispatcheur peut créer une job pour quelqu'un d'autre).
          const{gcalColor:autoColor,description}=buildJobEventFields(nj,emps);
          const gcalColor=autoColor||(selEmp?selEmp.couleur:'#ff7a1a');
          const created=await createCalendarEvent(calId,nj.title,nj.date,gcalColor,nj.location||'',description);
          if(created&&created.id&&(nj.driveFiles||[]).length>0){
            for(const f of nj.driveFiles)await attachFileToCalendarEvent(calId,created.id,f.id,f.name,f.mimeType);
          }
          notify('✅ Job "'+nj.title+'" créé!','success');
          getCalendarJobs(calendarIds).then(setJobs);
          setSelJob(nj.title);setSelJobColor(gcalColor);
          if(mode==='out')setStep('duration-out');
          else if(mode==='confirm')setStep('confirm');
          else setStep('punch-in');
        }}
        onSkip={()=>{setSelJob('');setSelJobColor('');
          if(mode==='out')setStep('duration-out');
          else if(mode==='confirm')setStep('confirm');
          else setStep('punch-in');
        }}/>
    </div>

  // ── MON DASHBOARD (perso : mes heures + projets + OT — distinct du Dashboard équipe) ──
  );
  if(step==='mon-dashboard'){
    const allPts=ptsForOut.length?ptsForOut:ptsRef.current;
    const refreshProjets=()=>{
      if(calendarIds&&calendarIds.length){
        getCalendarJobs(calendarIds).then(setJobs);
        getAllCalendarJobs(calendarIds).then(setAllJobs);
      }
    };
    // Ordres de travail : TOUS les employés (pas juste celui connecté), uniquement
    // les fichiers tagués OT_ (pas les appels de service AP_, pas les fichiers ordinaires)
    const otEntries=allOrgPts.map(p=>({
      ...p,
      otFiles:(p.fichiersURL||[]).filter(u=>u&&(u.toLowerCase().includes('ot_')))
    })).filter(p=>p.otFiles.length>0).sort((a,b)=>new Date(b.datetime||b.date)-new Date(a.datetime||a.date));
    return(
      <div className="welcome" style={{justifyContent:'flex-start',paddingTop:'1rem'}}>
        <div style={{width:'100%',maxWidth:640}}>
          <div className="tabs" style={{marginBottom:'0.75rem'}}>
            <div className={'tab'+(monDashTab==='heures'?' active':'')} onClick={()=>setMonDashTab('heures')}>📋 Mes heures</div>
            <div className={'tab'+(monDashTab==='factures'?' active':'')} onClick={()=>setMonDashTab('factures')}>🧾 Facture manquante</div>
            <div className={'tab'+(monDashTab==='projets'?' active':'')} onClick={()=>setMonDashTab('projets')}>📁 Projets</div>
            <div className={'tab'+(monDashTab==='ot'?' active':'')} onClick={()=>setMonDashTab('ot')}>🔧 Ordres de travail</div>
            <div className={'tab'+(monDashTab==='config'?' active':'')} onClick={()=>setMonDashTab('config')}>⚙️ Config</div>
          </div>
          {monDashTab==='heures'?(
            <EmployeeHistory emp={selEmp} sid={sid} notify={notify} folders={folders} calendarIds={calendarIds}/>
          ):monDashTab==='projets'?(
            <ProjectsView sid={sid} pts={allPts} emps={emps} calJobs={allJobs.length>0?allJobs:jobs} isAdmin={false} notify={notify} calendarIds={calendarIds} onRefresh={refreshProjets}/>
          ):monDashTab==='factures'?(
            <FacturesManquantesView emps={emps} jobsForLookup={allJobs.length>0?allJobs:jobs} meEmp={selEmp}/>
          ):monDashTab==='config'?(
            <div style={{background:'var(--bg3)',borderRadius:10,padding:'0.9rem'}}>
              <div style={{fontWeight:700,fontSize:13,marginBottom:4}}>📍 Localisation</div>
              <div style={{fontSize:11,color:'var(--muted)',marginBottom:'0.7rem',lineHeight:1.4}}>
                Quand c'est activé, l'app capte ta position au Punch IN et t'avertit si tu sembles avoir quitté le chantier sans avoir punché OUT. Tu peux désactiver ça ici en tout temps.
              </div>
              <button className="btn-s" style={{width:'100%',fontWeight:700,
                  borderColor:isGeoEnabled(selEmp.nom)?'var(--success)':'var(--border2)',
                  color:isGeoEnabled(selEmp.nom)?'var(--success)':'var(--muted)'}}
                onClick={()=>{setGeoEnabled(selEmp.nom,!isGeoEnabled(selEmp.nom));setGeoPrefTick(t=>t+1);}}>
                {isGeoEnabled(selEmp.nom)?'✅ Activée — appuyer pour désactiver':'⬜ Désactivée — appuyer pour activer'}
              </button>
              <div style={{borderTop:'1px solid var(--border)',margin:'0.75rem 0 0.6rem'}}></div>
              <div style={{fontSize:11,color:'var(--muted)',marginBottom:'0.5rem',lineHeight:1.4}}>
                Pour voir à quoi ressemble l'alerte sur ton téléphone (sans attendre un vrai déplacement) :
              </div>
              <button className="btn-s" style={{width:'100%',fontWeight:600}}
                onClick={async()=>{
                  if(typeof Notification==='undefined'){notify('Notifications non supportées sur cet appareil/navigateur.','warn');return;}
                  if(Notification.permission==='default'){
                    const p=await Notification.requestPermission();
                    if(p!=='granted'){notify('Permission de notification refusée.','warn');return;}
                  }
                  if(Notification.permission!=='granted'){notify('Notifications bloquées — active-les dans les réglages de ton navigateur/téléphone.','warn');return;}
                  const msg=selEmp.nom+' semble avoir quitté "Test — chantier" (~600m) sans punch out.';
                  notify('📍 '+msg,'warn');
                  try{
                    const reg=await navigator.serviceWorker?.getRegistration();
                    if(reg)reg.showNotification('PunchPro — Punch out oublié?',{body:msg,icon:'icon-192.png'});
                    else new Notification('PunchPro — Punch out oublié?',{body:msg,icon:'icon-192.png'});
                  }catch(e){notify('Erreur envoi notification: '+e.message,'warn');}
                }}>
                🔔 Tester la notification
              </button>
            </div>
          ):(
          loadingOT?(
            <div style={{textAlign:'center',color:'var(--muted)',padding:'1rem',fontSize:13}}>⏳ Chargement...</div>
          ):otEntries.length===0?(
            <div style={{background:'var(--bg3)',borderRadius:10,padding:'1rem',textAlign:'center',color:'var(--muted)',fontSize:12}}>
              Aucun ordre de travail trouvé. Les photos/fichiers tagués « OT » lors d'une confirmation de job ou d'une facture apparaîtront ici (tous employés confondus).
            </div>
          ):(
            otEntries.map((p,i)=>(
              <div key={i} style={{background:'var(--bg3)',borderRadius:10,padding:'0.65rem 0.85rem',marginBottom:'0.5rem',borderLeft:'3px solid var(--warning)'}}>
                <div style={{fontWeight:600,fontSize:13,marginBottom:3}}>{p.job||'Sans job'}</div>
                <div style={{fontSize:11,color:'var(--muted)',marginBottom:4}}>👷 {p.nom} · {p.date} · {p.heure}</div>
                {p.otFiles.map((u,j)=>{
                  const urlClean=u.split('|')[0];
                  const nom=u.includes('|')?u.split('|')[1]:null;
                  const label='🔧 '+(nom||'Ordre de travail');
                  return(
                    <a key={j} href={urlClean} target="_blank" rel="noreferrer"
                      style={{display:'flex',alignItems:'center',gap:6,background:'rgba(210,153,34,0.1)',borderRadius:6,padding:'0.25rem 0.5rem',marginBottom:3,textDecoration:'none',color:'var(--warning)',fontSize:11}}>
                      {label}
                    </a>
                  );
                })}
              </div>
            ))
          ))}
        </div>
      </div>
    );
  }

  // ── MODE SELECTION ──
  if(step==='mode'&&selEmp)return(
    <div className="welcome">
      <TimeHeader/>
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:'1.25rem'}}>
        <div className="emp-av" style={{background:selEmp.couleur,width:36,height:36,fontSize:12}}>{selEmp.code}</div>
        <div style={{fontFamily:'var(--font-head)',fontWeight:700}}>{selEmp.nom}</div>
        <span className={'badge '+(empStatut==='in'?'badge-in':'badge-out')} style={{marginLeft:'auto'}}>{empStatut==='in'?'En cours':'Absent'}</span>
      </div>
      <div className="mode-wrap">
        <div className="mode-btn" onClick={()=>{refreshCalJobs();setMonDashTab('heures');setStep('mon-dashboard');}}>
          <div className="mode-icon">📈</div>
          <div><div className="mode-title">Mon dashboard</div><div className="mode-desc">Mes heures et mes projets</div></div>
        </div>
        {empStatut==='in'?(
          <div className="mode-btn" onClick={async()=>{
            setMode('out');
            notify('⏳ Chargement...','warn');
            let p=[];
            try{p=await getPointages(sid,{nom:selEmp.nom,date:localDateStr()});}catch(e){console.error(e);}
            if(p.length===0&&ptsRef.current.length>0)p=ptsRef.current.filter(x=>x.date===localDateStr());
            ptsRef.current=p;
            setPtsForOut(p);
            setStep('duration-out');
          }}>
            <div className="mode-icon">🔴</div>
            <div><div className="mode-title">Punch OUT</div><div className="mode-desc">Terminer — heures, dépl., fichiers</div></div>
          </div>
        ):(
          <>
            <div className="mode-btn" onClick={()=>{refreshCalJobs();setMode('in');setStep('job');}}>
              <div className="mode-icon">🟢</div>
              <div><div className="mode-title">Punch IN</div><div className="mode-desc">Choisir dans l'agenda</div></div>
            </div>
          </>
        )}
        <div className="mode-btn" onClick={()=>{refreshCalJobs();setMode('confirm');setStep('job');}}>
          <div className="mode-icon">✅</div>
          <div><div className="mode-title">Confirmer une job</div><div className="mode-desc">Heures, dépl., coéquipiers, fichiers</div></div>
        </div>
        {selEmp.permissions&&selEmp.permissions.some(p=>p!=='config')&&(
          <div className="mode-btn" onClick={()=>setStep('admin-team')}>
            <div className="mode-icon">📊</div>
            <div><div className="mode-title">Dashboard équipe</div><div className="mode-desc">Vue d'ensemble, projets, agenda de l'équipe</div></div>
          </div>
        )}
        {selEmp.permissions&&selEmp.permissions.includes('config')&&(
          <div className="mode-btn" onClick={()=>setStep('config-emp')}>
            <div className="mode-icon">⚙</div>
            <div><div className="mode-title">Configuration</div><div className="mode-desc">Employés, réglages techniques</div></div>
          </div>
        )}
      </div>

      {/* Résumé jobs — onglets Aujourd'hui / Demain */}
      <JobSummary jobs={jobs} allJobs={allJobs} emp={selEmp} notify={notify} calendarIds={calendarIds} sid={sid} allEmps={emps} onJobsRefresh={refreshCalJobs}/>
    </div>

  // ── EMP GRID ──
  );
  return(
    <div className="welcome">
      <TimeHeader/>
      {emps.length===0?(
        <div style={{color:'var(--muted)',textAlign:'center',maxWidth:320}}>
          <div style={{fontSize:'1.8rem',marginBottom:'0.55rem'}}>👷</div>
          <div style={{fontFamily:'var(--font-head)',fontWeight:700,marginBottom:'0.3rem'}}>Aucun employé</div>
          <div style={{fontSize:13}}>Connectez-vous en tant qu'administrateur.</div>
        </div>
      ):(
        <>
          <div style={{fontSize:10,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.1em',color:'var(--muted)',marginBottom:'0.85rem'}}>Sélectionnez votre nom</div>
          <div className="emp-grid">
            {emps.map(emp=>(
              <div key={emp.nom} className="emp-card"
                style={{borderColor:emp.statut==='in'?emp.couleur:'var(--border)',boxShadow:emp.statut==='in'?'0 0 0 1px '+emp.couleur:''}}
                onClick={async()=>{
                  // Load pts FIRST, then navigate
                  let p=[];
                  try{p=await getPointages(sid,{nom:emp.nom});}catch(e){console.error(e);}
                  ptsRef.current=p;
                  setPtsForOut(p);
                  setSelEmp(emp);
                  setStep('pin-entry');
                }}>
                <div className="emp-av-lg" style={{background:emp.couleur}}>{emp.code}</div>
                <div style={{fontSize:12,fontWeight:600}}>{emp.nom}</div>
                <div style={{fontSize:10,color:emp.statut==='in'?emp.couleur:'var(--muted)',marginTop:2}}>{emp.statut==='in'?'● En cours':'○ Absent'}</div>
              </div>
            ))}
          </div>
          {/* Tableau de bord rapide — visible avant de sélectionner un profil */}
          <div style={{width:'100%',maxWidth:560,marginTop:'1rem'}}>
            <ConvertisseurPiedsMetres/>
            <StockCamions emp={null} notify={notify}/>
            <ReferencesRapides/>
          </div>
        </>
      )}
    </div>
  );
}

// ── SETTINGS MENU ─────────────────────────────────────────────────────────────
function SettingsMenu({userEmail,isBoss,onSwitch,onEditCfg,onReset}){
  const [open,setOpen]=useState(false);
  const [settings,setSettings]=useState(()=>{try{return JSON.parse(localStorage.getItem('pp_settings')||'{}');}catch{return{};}});
  const ref=useRef();
  useEffect(()=>{const h=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);};document.addEventListener('mousedown',h);return()=>document.removeEventListener('mousedown',h);},[]);
  function toggle(key){const n={...settings,[key]:!settings[key]};setSettings(n);localStorage.setItem('pp_settings',JSON.stringify(n));}
  return(
    <div className="settings-wrap" ref={ref}>
      <button className="settings-btn" onClick={()=>setOpen(o=>!o)}>⚙</button>
      {open&&(
        <div className="settings-menu">
          <div className="ssec">Compte</div>
          <div className="acct-card">
            <div style={{fontSize:11,color:'var(--text)',fontWeight:500,display:'flex',alignItems:'center',gap:5}}>
              <span style={{width:6,height:6,borderRadius:'50%',background:userEmail?'var(--success)':'var(--muted)',display:'inline-block'}}></span>
              {userEmail||'Non connecté'}
            </div>
            <div style={{fontSize:10,color:'var(--muted)',marginTop:1}}>{userEmail?(isBoss?'🔐 Administrateur':'👷 Employés'):'—'}</div>
          </div>
          <button className="si" onClick={()=>{setOpen(false);onSwitch();}}><span className="ico">🔄</span>Changer de compte</button>
          <div className="sdiv"/>
          <div className="ssec">Application</div>
          <button className="si" onClick={()=>{setOpen(false);onEditCfg();}}><span className="ico">🔑</span>Paramètres API</button>
          <button className="si" onClick={()=>{setOpen(false);window.open('https://docs.google.com/spreadsheets','_blank');}}><span className="ico">📊</span>Google Sheets</button>
          <button className="si" onClick={()=>{setOpen(false);window.open('https://calendar.google.com','_blank');}}><span className="ico">📅</span>Google Agenda</button>
          <button className="si" onClick={()=>{setOpen(false);window.open('https://drive.google.com','_blank');}}><span className="ico">🗂️</span>Google Drive</button>
          <div className="sdiv"/>
          <div className="ssec">Fonctionnalités (à venir)</div>
          <div className="toggle-row"><span style={{fontSize:12,color:'var(--muted)'}}>📴 Mode offline</span><div className={'toggle'+(settings.offline?' on':'')} onClick={()=>toggle('offline')}><div className="toggle-knob"></div></div></div>
          <div style={{fontSize:10,color:'var(--muted)',padding:'0 0.6rem 0.35rem',fontStyle:'italic'}}>Sync auto quand reconnecté</div>
          <div className="toggle-row"><span style={{fontSize:12,color:'var(--muted)'}}>📧 Rapport hebdo</span><div className={'toggle'+(settings.rapportHebdo?' on':'')} onClick={()=>toggle('rapportHebdo')}><div className="toggle-knob"></div></div></div>
          <div style={{fontSize:10,color:'var(--muted)',padding:'0 0.6rem 0.35rem',fontStyle:'italic'}}>Email auto le vendredi</div>
          <div className="sdiv"/>
          <button className="si danger" onClick={()=>{setOpen(false);onReset();}}><span className="ico">🗑️</span>Réinitialiser</button>
        </div>
      )}
    </div>
  );
}

// ── CONFIG MODAL ──────────────────────────────────────────────────────────────
function ConfigScreen({cfg,sid,notify,onRefresh,onClose}){
  const [tab,setTab]=useState('employes');
  const folders=parseDriveFolders(cfg&&cfg.driveFolders||'');
  const calendars=(cfg&&cfg.calendarIds||'').split(',').map(s=>s.trim()).filter(Boolean);
  return(
    <div style={{position:'fixed',inset:0,background:'var(--bg)',zIndex:300,display:'flex',flexDirection:'column'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0.85rem 1rem',borderBottom:'1px solid var(--border)',flexShrink:0}}>
        <div style={{fontFamily:'var(--font-head)',fontWeight:700,fontSize:'1.05rem'}}>⚙ Configuration</div>
        <button className="btn-s" onClick={onClose}>✕ Fermer</button>
      </div>
      <div className="tabs" style={{padding:'0.6rem 1rem 0'}}>
        {[['employes','👷 Employés'],['technique','🔧 Technique']].map(([k,l])=>(
          <div key={k} className={'tab'+(tab===k?' active':'')} onClick={()=>setTab(k)}>{l}</div>
        ))}
      </div>
      <div style={{flex:1,overflowY:'auto',padding:'1rem'}}>
        {tab==='employes'&&(
          <EmployeesManager sid={sid} notify={notify} onRefresh={onRefresh}/>
        )}
        {tab==='technique'&&(
          <div style={{maxWidth:560,display:'flex',flexDirection:'column',gap:'0.75rem'}}>
            <div style={{background:'rgba(255,122,26,0.08)',border:'1px solid rgba(255,122,26,0.25)',borderRadius:10,padding:'0.65rem 0.85rem',fontSize:11,color:'var(--muted)'}}>
              ℹ️ Ces valeurs techniques sont fixées directement dans le code de l'application.
              Elles sont affichées ici pour référence seulement — pour les changer, il faut modifier le code (contacte ton développeur).
            </div>
            <div className="card">
              <div className="csec">Connexion Google</div>
              <div style={{fontSize:11,color:'var(--muted)',marginBottom:2}}>Clé API</div>
              <div style={{fontFamily:'monospace',fontSize:12,marginBottom:8,wordBreak:'break-all'}}>{(cfg&&cfg.apiKey)?cfg.apiKey.slice(0,10)+'••••••••••':'—'}</div>
              <div style={{fontSize:11,color:'var(--muted)',marginBottom:2}}>OAuth Client ID</div>
              <div style={{fontFamily:'monospace',fontSize:12,wordBreak:'break-all'}}>{(cfg&&cfg.clientId)||'—'}</div>
            </div>
            <div className="card">
              <div className="csec">Données</div>
              <div style={{fontSize:11,color:'var(--muted)',marginBottom:2}}>Google Spreadsheet</div>
              <div style={{marginBottom:8}}>
                <a href={'https://docs.google.com/spreadsheets/d/'+(cfg&&cfg.spreadsheetId||'')} target="_blank" rel="noreferrer" style={{fontFamily:'monospace',fontSize:12,color:'var(--accent)',wordBreak:'break-all'}}>{(cfg&&cfg.spreadsheetId)||'—'} ↗</a>
              </div>
              <div style={{fontSize:11,color:'var(--muted)',marginBottom:4}}>Calendriers synchronisés</div>
              <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
                {calendars.length>0?calendars.map(c=><span key={c} style={{fontSize:11,background:'var(--bg3)',borderRadius:6,padding:'0.2rem 0.5rem'}}>📅 {c}</span>):<span style={{fontSize:12,color:'var(--muted)'}}>—</span>}
              </div>
            </div>
            <div className="card">
              <div className="csec">Dossiers Drive partagés</div>
              <div style={{display:'flex',flexDirection:'column',gap:6}}>
                {folders.length>0?folders.map(f=>(
                  <a key={f.id} href={'https://drive.google.com/drive/folders/'+f.id} target="_blank" rel="noreferrer"

function EmployeesManager({sid,notify,onRefresh}){
  const [emps,setEmps]=useState([]);
  const [loadingEmps,setLoadingEmps]=useState(true);
  const [showAdd,setShowAdd]=useState(false);
  const [editEmp,setEditEmp]=useState(null);
  const [newEmp,setNewEmp]=useState({nom:'',pin:'',code:'',couleur:EMP_COLORS[0],email:'',telephone:'',heuresBanque:0,permissions:[]});

  useEffect(()=>{
    setLoadingEmps(true);
    getEmployees(sid).then(e=>{setEmps(e);setLoadingEmps(false);});
  },[sid]);

  async function reloadEmps(){
    const u=await getEmployees(sid);setEmps(u);return u;
  }

  async function handleAdd(){
    if(!newEmp.nom||!newEmp.pin){notify('Remplis le nom et le PIN!','err');return;}
    try{
      const emp={...newEmp,code:newEmp.code||newEmp.nom.substring(0,2).toUpperCase()};
      notify('⏳ Sauvegarde...','warn');
      await saveEmployee(sid,emp);
      const updated=await reloadEmps();
      setNewEmp({nom:'',pin:'',code:'',couleur:EMP_COLORS[updated.length%EMP_COLORS.length],email:'',telephone:'',heuresBanque:0,permissions:[]});
      setShowAdd(false);notify('✅ '+emp.nom+' ajouté!','success');onRefresh();
    }catch(e){notify('Erreur: '+e.message,'err');}
  }

  async function handleUpdateEmp(){
    if(!editEmp||!editEmp.nom||!editEmp.pin){notify('Remplis tous les champs!','err');return;}
    try{
      await updateEmployee(sid,editEmp.row,editEmp);
      await reloadEmps();
      setEditEmp(null);notify('✅ Employé modifié!','success');onRefresh();
    }catch(e){notify('Erreur: '+e.message,'err');}
  }

  async function handleDel(emp){
    if(!confirm('Supprimer '+emp.nom+'?'))return;
    await deleteEmployee(sid,emp.row);notify('Supprimé','success');
    await reloadEmps();onRefresh();
  }

  if(loadingEmps)return <div style={{textAlign:'center',color:'var(--muted)',padding:'2rem',fontSize:13}}>⏳ Chargement...</div>;

  return(
    <div className="card" style={{maxWidth:580}}>
      <div className="section-head">
        <div className="card-title" style={{marginBottom:0}}>Employés ({emps.length})</div>
        <button className="btn-s" onClick={()=>{setShowAdd(!showAdd);setEditEmp(null);}}>+ Ajouter</button>
      </div>
      {showAdd&&!editEmp&&<EmpForm data={newEmp} setData={setNewEmp} onSave={handleAdd} isEdit={false}/>}
      {editEmp&&<EmpForm data={editEmp} setData={setEditEmp} onSave={handleUpdateEmp} onCancel={()=>setEditEmp(null)} isEdit={true}/>}
      <div style={{marginTop:'0.7rem'}}>
        {emps.map(emp=>(
          <div key={emp.nom} className="emp-row">
            <div className="emp-av" style={{background:emp.couleur}}>{emp.code}</div>
            <div style={{flex:1,marginLeft:'0.55rem'}}>
              <div style={{fontSize:12,fontWeight:500,display:'flex',alignItems:'center',gap:5,flexWrap:'wrap'}}>
                {emp.nom}
                {emp.permissions&&emp.permissions.some(p=>p!=='config')&&<span style={{fontSize:9,background:'rgba(255,122,26,0.15)',color:'var(--accent)',borderRadius:4,padding:'1px 5px',fontWeight:700}}>🗂️ Gestionnaire ({emp.permissions.filter(p=>p!=='config').length})</span>}
                {emp.permissions&&emp.permissions.includes('config')&&<span style={{fontSize:9,background:'rgba(210,153,34,0.15)',color:'var(--warning)',borderRadius:4,padding:'1px 5px',fontWeight:700}}>⚙ Configuration</span>}
              </div>
              <div style={{fontSize:10,color:'var(--muted)',fontFamily:'monospace'}}>
                PIN: {emp.pin} · {emp.code}
                {emp.email&&' · '+emp.email}
                {emp.telephone&&' · '+emp.telephone}
              </div>
              {emp.heuresBanque>0&&<div style={{fontSize:10,color:'var(--warning)'}}>🏦 {hToQuart(emp.heuresBanque)} en banque</div>}
            </div>
            <span className={'badge '+(emp.statut==='in'?'badge-in':'badge-out')}>{emp.statut==='in'?'Présent':'Absent'}</span>
            <button className="btn-icon edit" onClick={()=>{setEditEmp({...emp});setShowAdd(false);}}>✏️</button>
            <button className="btn-icon" onClick={()=>handleDel(emp)}>✕</button>
          </div>
        ))}
        {emps.length===0&&<div style={{color:'var(--muted)',textAlign:'center',padding:'1.5rem',fontSize:13}}>Aucun employé — cliquez "+ Ajouter"</div>}
      </div>
    </div>
  );
}

// même ID que Google Calendar) avec les jobs déjà chargés dans l'app.
function FacturesManquantesView({emps,jobsForLookup,meEmp}){
  const [facturesManquantes,setFacturesManquantes]=useState(null); // null = pas encore chargé
  const [loadingFactures,setLoadingFactures]=useState(false);
  const [viewMode,setViewMode]=useState('contracteur'); // 'contracteur' | 'date'
  const [scope,setScope]=useState('mine'); // 'mine' | 'all' — pertinent seulement si meEmp fourni

  function load(){
    setLoadingFactures(true);
    getFacturesManquantes().then(f=>{setFacturesManquantes(f);setLoadingFactures(false);});
  }
  useEffect(()=>{load();},[]);

  function getJobByEventId(id){
    if(!id)return null;
    return (jobsForLookup||[]).find(j=>j.id===id)||null;
  }
  // Assignés d'une job — logique partagée (jobAssignees), standard partout.
  function getAssignees(job){
    return jobAssignees(job,emps||[]);
  }

  let liste=(facturesManquantes||[]).map(t=>{
    const job=getJobByEventId(t.eventId);
    return{...t,assignees:job?getAssignees(job):[]};
  });
  if(meEmp&&scope==='mine')liste=liste.filter(t=>t.assignees.some(e=>e.nom===meEmp.nom));

  const manquantes=liste.filter(t=>t.statut==='manquante');
  const enTraitement=liste.filter(t=>t.statut==='en-traitement');

  function projetCell(t){
    const primary=t.assignees[0];
    return(
      <>
        <div style={{display:'flex',alignItems:'center',gap:6}}>
          {primary&&<span style={{width:8,height:8,borderRadius:'50%',background:primary.couleur,flexShrink:0}}></span>}
          <span>{t.projet}</span>
        </div>
        {t.assignees.length>0&&<div style={{fontSize:10,color:'var(--muted)',marginTop:1}}>{t.assignees.map(e=>e.nom).join(', ')}</div>}
      </>
    );
  }

  function bloc(titre,items,couleur){
    if(viewMode==='date')return(
      <div className="card" style={{marginBottom:'0.75rem'}}>
        <div className="card-title" style={{color:couleur}}>{titre} <span style={{fontWeight:400,fontSize:11,color:'var(--muted)'}}>({items.length})</span></div>
        {items.length===0?(
          <div style={{color:'var(--muted)',fontSize:12,padding:'0.5rem 0'}}>Aucune — tout est à jour.</div>
        ):(
          <div style={{overflowX:'auto'}}>
            <table className="htable" style={{minWidth:500}}>
              <thead><tr><th>Contracteur</th><th>Date</th><th>Projet</th><th>Appel de service</th></tr></thead>
              <tbody>
                {items.map((t,i)=>(
                  <tr key={i}>
                    <td style={{fontSize:11,fontWeight:600}}>{t.feuille}</td>
                    <td style={{fontSize:11,whiteSpace:'nowrap'}}>{t.date}</td>
                    <td style={{fontSize:12}}>{projetCell(t)}</td>
                    <td style={{fontSize:11}}>{t.appel||<span style={{color:'var(--muted)',fontStyle:'italic'}}>Aucun appel</span>}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>
    );
    // Vue "par contracteur" — groupé, feuille avec le plus de manquants en premier
    const groups={};
    items.forEach(t=>{(groups[t.feuille]=groups[t.feuille]||[]).push(t);});
    const order=Object.keys(groups).sort((a,b)=>groups[b].length-groups[a].length);
    return(
      <div className="card" style={{marginBottom:'0.75rem'}}>
        <div className="card-title" style={{color:couleur}}>{titre} <span style={{fontWeight:400,fontSize:11,color:'var(--muted)'}}>({items.length})</span></div>
        {items.length===0?(
          <div style={{color:'var(--muted)',fontSize:12,padding:'0.5rem 0'}}>Aucune — tout est à jour.</div>
        ):order.map(feuille=>(
          <div key={feuille} style={{marginBottom:'0.65rem'}}>
            <div style={{fontSize:11,fontWeight:700,color:'var(--accent)',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:4}}>📦 {feuille} <span style={{color:'var(--muted)',fontWeight:400}}>({groups[feuille].length})</span></div>
            <div style={{overflowX:'auto'}}>
              <table className="htable" style={{minWidth:400}}>
                <thead><tr><th>Date</th><th>Projet</th><th>Appel de service</th></tr></thead>
                <tbody>
                  {groups[feuille].map((t,i)=>(
                    <tr key={i}>
                      <td style={{fontSize:11,whiteSpace:'nowrap'}}>{t.date}</td>
                      <td style={{fontSize:12}}>{projetCell(t)}</td>
                      <td style={{fontSize:11}}>{t.appel||<span style={{color:'var(--muted)',fontStyle:'italic'}}>Aucun appel</span>}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        ))}
      </div>
    );
  }

  return(
    <div>
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:'0.75rem',flexWrap:'wrap'}}>
        <div style={{display:'flex',gap:6}}>
          {[['contracteur','📦 Par contracteur'],['date','📅 Par date']].map(([k,l])=>(
            <button key={k} onClick={()=>setViewMode(k)} className="btn-s" style={{fontSize:11,padding:'0.3rem 0.6rem',
