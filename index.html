<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PunchPro — Saran Électrique</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--bg2:#161b22;--bg3:#1c2333;--bg4:#21262d;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#e6edf3;--muted:#7d8590;--muted2:#9198a1;
  --accent:#2f81f7;--accent2:#6e40c9;
  --success:#3fb950;--warning:#d29922;--danger:#f85149;
  --font-head:'Syne',sans-serif;--font-body:'DM Sans',sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:14px;line-height:1.6;min-height:100vh}
#root{min-height:100vh}

/* OVERLAY */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:1000;padding:1rem}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:16px;padding:2rem;max-width:520px;width:100%}
.modal-title{font-family:var(--font-head);font-size:1.6rem;font-weight:800;margin-bottom:0.25rem;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.modal-sub{color:var(--muted);font-size:13px;margin-bottom:1.75rem}
.fg{margin-bottom:1rem}
.fg label{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:0.35rem}
.fg input,.fg textarea{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:0.65rem 0.85rem;color:var(--text);font-family:var(--font-body);font-size:13px;outline:none;transition:border-color 0.2s}
.fg input:focus,.fg textarea:focus{border-color:var(--accent)}
.fg small{display:block;margin-top:0.35rem;font-size:11px;color:var(--muted)}
.fg textarea{resize:vertical;min-height:70px;font-size:12px}
.btn-primary{width:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:8px;padding:0.75rem;color:#fff;font-family:var(--font-head);font-size:14px;font-weight:700;cursor:pointer;transition:opacity 0.2s;margin-top:0.5rem}
.btn-primary:hover{opacity:0.88}.btn-primary:disabled{opacity:0.45;cursor:not-allowed}
.btn-sec{background:transparent;border:1px solid var(--border2);border-radius:8px;padding:0.6rem 1.1rem;color:var(--text);font-size:13px;cursor:pointer;transition:background 0.2s}
.btn-sec:hover{background:var(--bg3)}

/* TOPBAR */
.app-wrap{min-height:100vh;display:flex;flex-direction:column}
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:0.6rem 1.25rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{font-family:var(--font-head);font-size:1.05rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:flex;align-items:center;gap:6px}
.topbar-right{display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap}
.nav-tabs{display:flex;background:var(--bg3);border-radius:8px;padding:3px;border:1px solid var(--border)}
.nav-tab{padding:0.3rem 0.85rem;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--muted);transition:all 0.2s;white-space:nowrap}
.nav-tab.active{background:var(--accent);color:#fff}
.nav-tab.admin{color:var(--warning)}
.nav-tab.admin.active{background:linear-gradient(135deg,#b7860b,var(--warning));color:#000}
.online-badge{display:flex;align-items:center;gap:5px;background:rgba(63,185,80,0.1);border:1px solid rgba(63,185,80,0.25);border-radius:20px;padding:0.25rem 0.65rem;font-size:11px;color:var(--success)}
.online-dot{width:6px;height:6px;border-radius:50%;background:var(--success);box-shadow:0 0 5px var(--success)}

/* SETTINGS */
.settings-wrap{position:relative}
.settings-btn{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:0.35rem 0.7rem;color:var(--muted);cursor:pointer;font-size:14px;transition:all 0.2s}
.settings-btn:hover{border-color:var(--border2);color:var(--text)}
.settings-menu{position:absolute;top:calc(100% + 6px);right:0;background:var(--bg2);border:1px solid var(--border2);border-radius:12px;padding:0.4rem;min-width:260px;box-shadow:0 8px 32px rgba(0,0,0,0.6);z-index:200}
.si{display:flex;align-items:center;gap:0.65rem;padding:0.55rem 0.7rem;border-radius:6px;cursor:pointer;font-size:12px;color:var(--text);transition:background 0.15s;white-space:nowrap;border:none;background:transparent;width:100%;text-align:left}
.si:hover{background:var(--bg3)}
.si.danger:hover{background:rgba(248,81,73,0.1);color:var(--danger)}
.si .ico{font-size:14px;width:18px;text-align:center}
.sdiv{height:1px;background:var(--border);margin:0.35rem 0}
.ssec{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;padding:0.35rem 0.7rem 0.15rem}
.account-card{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:0.6rem 0.7rem;margin:0.35rem 0}
.account-email{font-size:12px;color:var(--text);font-weight:500;display:flex;align-items:center;gap:6px}
.account-role{font-size:11px;color:var(--muted);margin-top:2px}

/* CONTENT */
.content{flex:1;padding:1.25rem;max-width:1080px;margin:0 auto;width:100%}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:1.25rem}
.card-title{font-family:var(--font-head);font-size:1rem;font-weight:700;margin-bottom:1rem}
.card-section{font-family:var(--font-head);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.09em;color:var(--muted);margin-bottom:0.75rem}

/* WELCOME / PUNCH */
.welcome{min-height:calc(100vh - 53px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center}
.w-time{font-family:var(--font-head);font-size:4rem;font-weight:800;letter-spacing:-3px;color:var(--text);line-height:1}
.w-date{font-size:13px;color:var(--muted);margin:0.4rem 0 2.5rem}
.w-hint{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);margin-bottom:1.25rem}
.emp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:0.6rem;max-width:680px;width:100%}
.emp-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:1.1rem 0.65rem;cursor:pointer;transition:all 0.18s;text-align:center}
.emp-card:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,0.35)}
.emp-card.sel{transform:translateY(-2px)}
.emp-av-lg{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;margin:0 auto 0.5rem}
.emp-card-name{font-size:12px;font-weight:600;color:var(--text)}
.emp-card-status{font-size:10px;color:var(--muted);margin-top:2px}

/* PIN */
.pin-wrap{background:var(--bg2);border:1px solid var(--border2);border-radius:14px;padding:1.5rem;max-width:300px;width:100%}
.pin-who{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:1.1rem}
.pin-display{background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:0.75rem 1.25rem;text-align:center;font-family:var(--font-head);font-size:1.8rem;letter-spacing:0.5rem;margin-bottom:1rem;min-height:56px;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0.45rem}
.pin-key{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:0.85rem;font-family:var(--font-head);font-size:1.1rem;font-weight:700;color:var(--text);cursor:pointer;text-align:center;transition:all 0.12s;user-select:none}
.pin-key:hover{background:var(--bg4);border-color:var(--accent);color:var(--accent)}
.pin-key:active{transform:scale(0.94)}
.pin-key.del{color:var(--danger)}.pin-key.zero{grid-column:2}
.pin-back{background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;margin-top:0.65rem;text-align:center;width:100%;text-decoration:underline;padding:0}
.pin-back:hover{color:var(--text)}

/* PUNCH RESULT */
.punch-result{padding:1.5rem;border-radius:14px;text-align:center;max-width:320px;width:100%;animation:popIn 0.25s ease}
.punch-result.ok{background:rgba(63,185,80,0.07);border:1px solid rgba(63,185,80,0.3)}
.punch-result.err{background:rgba(248,81,73,0.07);border:1px solid rgba(248,81,73,0.25)}
@keyframes popIn{from{transform:scale(0.92);opacity:0}to{transform:scale(1);opacity:1}}
.pbadge{display:inline-block;padding:0.3rem 0.9rem;border-radius:20px;font-size:12px;font-weight:700;margin:0.5rem 0}
.pbadge.in{background:rgba(63,185,80,0.18);color:var(--success)}
.pbadge.out{background:rgba(248,81,73,0.14);color:var(--danger)}
.punch-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0.4rem;margin-top:0.85rem}
.ps{background:var(--bg3);border-radius:8px;padding:0.55rem;text-align:center}
.ps .v{font-family:var(--font-head);font-size:1rem;font-weight:800;color:var(--accent)}
.ps .l{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;margin-top:1px}

/* EMP AVATAR small */
.emp-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10px;color:#fff;flex-shrink:0}

/* JOBS */
.job-item{padding:0.7rem 0.85rem;background:var(--bg3);border-radius:8px;margin-bottom:0.4rem;border-left:3px solid var(--accent)}
.achip{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600;margin-top:5px;margin-right:3px}

/* STATUS */
.status-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:0.5rem}
.semp{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:0.6rem 0.75rem;display:flex;align-items:center;gap:0.5rem}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0.6rem}
.stat-box{background:var(--bg3);border-radius:8px;padding:0.85rem;text-align:center}
.stat-box .val{font-family:var(--font-head);font-size:1.4rem;font-weight:800;color:var(--accent)}
.stat-box .lbl{font-size:10px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:0.06em}

/* TABLE */
.htable{width:100%;border-collapse:collapse;font-size:12px}
.htable th{text-align:left;padding:0.45rem 0.65rem;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:0.07em;border-bottom:1px solid var(--border)}
.htable td{padding:0.5rem 0.65rem;border-bottom:1px solid var(--border);vertical-align:middle}
.htable tr:last-child td{border-bottom:none}
.badge{display:inline-block;padding:2px 7px;border-radius:8px;font-size:10px;font-weight:600}
.badge-in{background:rgba(63,185,80,0.15);color:var(--success)}
.badge-out{background:rgba(248,81,73,0.12);color:var(--danger)}
.badge-pend{background:rgba(210,153,34,0.15);color:var(--warning)}

/* TABS */
.tabs{display:flex;gap:0.2rem;margin-bottom:1rem;background:var(--bg3);border-radius:8px;padding:3px;border:1px solid var(--border);width:fit-content;flex-wrap:wrap}
.tab{padding:0.35rem 0.85rem;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;border:none;background:transparent;color:var(--muted);transition:all 0.2s}
.tab.active{background:var(--accent);color:#fff}

/* BANK */
.bank-row{display:flex;align-items:center;justify-content:space-between;padding:0.65rem 0.75rem;background:var(--bg3);border-radius:8px;margin-bottom:0.4rem;border:1px solid var(--border);gap:0.5rem;flex-wrap:wrap}
.btn-sm{padding:0.25rem 0.65rem;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;border:none;transition:opacity 0.2s}
.btn-sm:hover{opacity:0.8}
.btn-approve{background:rgba(63,185,80,0.18);color:var(--success)}
.btn-deny{background:rgba(248,81,73,0.14);color:var(--danger)}

/* ADMIN GRID */
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem}
@media(max-width:780px){.admin-grid{grid-template-columns:1fr}}
.full-w{grid-column:1/-1}

/* EMP MGMT */
.emp-row{display:flex;align-items:center;padding:0.6rem 0.7rem;background:var(--bg3);border-radius:8px;margin-bottom:0.35rem;gap:0.45rem}
.btn-icon{background:transparent;border:1px solid var(--border);border-radius:6px;padding:3px 7px;color:var(--muted);cursor:pointer;font-size:11px;transition:all 0.2s;margin-left:auto}
.btn-icon:hover{border-color:var(--danger);color:var(--danger)}
.add-form{background:var(--bg3);border-radius:8px;padding:0.85rem;margin-top:0.65rem;border:1px solid var(--border2)}
.add-row{display:grid;grid-template-columns:2fr 1fr 1fr;gap:0.45rem;margin-bottom:0.65rem}
.add-form input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:0.45rem 0.65rem;color:var(--text);font-family:var(--font-body);font-size:12px;outline:none}
.add-form input:focus{border-color:var(--accent)}
.fl{display:block;font-size:10px;color:var(--muted);margin-bottom:3px}
.color-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.cswatch{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform 0.12s}
.cswatch:hover{transform:scale(1.25)}

/* WEEK BAR */
.wbar-wrap{margin-bottom:0.85rem}
.wbar-label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:3px;align-items:center}
.wbar{height:5px;background:var(--bg3);border-radius:3px;overflow:hidden}
.wbar-fill{height:100%;border-radius:3px;transition:width 0.5s ease}
.wbar-fill.ot{background:linear-gradient(90deg,var(--warning),var(--danger)) !important}

/* NOTIF */
.notif{position:fixed;top:1rem;right:1rem;background:var(--bg2);border:1px solid var(--border2);border-radius:8px;padding:0.65rem 1.1rem;font-size:13px;z-index:999;max-width:300px;box-shadow:0 4px 20px rgba(0,0,0,0.5);animation:slideIn 0.3s ease;cursor:pointer}
.notif.success{border-color:rgba(63,185,80,0.4)}
.notif.warn{border-color:rgba(210,153,34,0.4)}
.notif.err{border-color:rgba(248,81,73,0.4)}
@keyframes slideIn{from{transform:translateX(18px);opacity:0}to{transform:translateX(0);opacity:1}}

/* SCROLL */
.scroll-area{max-height:260px;overflow-y:auto}
.scroll-area::-webkit-scrollbar{width:3px}
.scroll-area::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* ACCESS GATE */
.access-gate{text-align:center;padding:4rem 2rem}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const EMP_COLORS = ['#2f81f7','#6e40c9','#3fb950','#d29922','#f85149','#0ea5e9','#ec4899','#a855f7','#22c55e','#f97316'];
const SCOPES = 'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/calendar.readonly https://www.googleapis.com/auth/userinfo.email';
const DISCOVERY = ['https://sheets.googleapis.com/$discovery/rest?version=v4','https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest'];
let tokenClient = null;

// ── GOOGLE API ────────────────────────────────────────────────────────────────
function loadScript(src) {
  return new Promise(res => { const s = document.createElement('script'); s.src = src; s.onload = res; document.head.appendChild(s); });
}
async function initLibs(cfg, onToken) {
  await loadScript('https://apis.google.com/js/api.js');
  await new Promise(res => gapi.load('client', res));
  await gapi.client.init({ apiKey: cfg.apiKey, discoveryDocs: DISCOVERY });
  await loadScript('https://accounts.google.com/gsi/client');
  tokenClient = google.accounts.oauth2.initTokenClient({ client_id: cfg.clientId, scope: SCOPES, callback: onToken });
}
async function getUserEmail() {
  try { const r = await gapi.client.request({ path: 'https://www.googleapis.com/oauth2/v2/userinfo' }); return (r.result.email || '').toLowerCase().trim(); } catch { return ''; }
}

// ── SHEETS ────────────────────────────────────────────────────────────────────
async function ensureStructure(sid) {
  try {
    const res = await gapi.client.sheets.spreadsheets.get({ spreadsheetId: sid });
    const ex = res.result.sheets.map(s => s.properties.title);
    const needed = ['Employés','Pointages','HeuresEnBanque'];
    const reqs = needed.filter(n => !ex.includes(n)).map(n => ({ addSheet: { properties: { title: n } } }));
    if (reqs.length) await gapi.client.sheets.spreadsheets.batchUpdate({ spreadsheetId: sid, resource: { requests: reqs } });
    const headers = {
      'Employés': [['Nom','PIN','Statut','HeuresBanque','Couleur','Code']],
      'Pointages': [['Employé','Type','DateTime','DateStr','HeureStr','Semaine','Mois']],
      'HeuresEnBanque': [['Employé','Semaine','HeuresSupp','Statut','DateDemande']]
    };
    for (const [sheet, h] of Object.entries(headers)) {
      const chk = await gapi.client.sheets.spreadsheets.values.get({ spreadsheetId: sid, range: `${sheet}!A1` });
      if (!chk.result.values) await gapi.client.sheets.spreadsheets.values.update({ spreadsheetId: sid, range: `${sheet}!A1`, valueInputOption: 'RAW', resource: { values: h } });
    }
  } catch(e) { console.error(e); }
}
async function getEmployees(sid) {
  try {
    const res = await gapi.client.sheets.spreadsheets.values.get({ spreadsheetId: sid, range: 'Employés!A2:F' });
    return (res.result.values || []).map((r, i) => ({ nom: r[0]||'', pin: r[1]||'', statut: r[2]||'out', heuresBanque: parseFloat(r[3])||0, couleur: r[4]||EMP_COLORS[i%EMP_COLORS.length], code: r[5]||(r[0]||'??').substring(0,2).toUpperCase(), row: i+2 }));
  } catch { return []; }
}
async function saveEmployee(sid, emp) {
  await gapi.client.sheets.spreadsheets.values.append({ spreadsheetId: sid, range: 'Employés!A:F', valueInputOption: 'RAW', resource: { values: [[emp.nom, emp.pin, 'out', 0, emp.couleur, emp.code]] } });
}
async function deleteEmployee(sid, row) {
  const r = await gapi.client.sheets.spreadsheets.get({ spreadsheetId: sid });
  const sh = r.result.sheets.find(s => s.properties.title === 'Employés');
  await gapi.client.sheets.spreadsheets.batchUpdate({ spreadsheetId: sid, resource: { requests: [{ deleteDimension: { range: { sheetId: sh ? sh.properties.sheetId : 0, dimension: 'ROWS', startIndex: row-1, endIndex: row } } }] } });
}
async function updateStatus(sid, row, statut) {
  await gapi.client.sheets.spreadsheets.values.update({ spreadsheetId: sid, range: `Employés!C${row}`, valueInputOption: 'RAW', resource: { values: [[statut]] } });
}
async function addPointage(sid, emp, type) {
  const now = new Date();
  await gapi.client.sheets.spreadsheets.values.append({ spreadsheetId: sid, range: 'Pointages!A:G', valueInputOption: 'RAW', resource: { values: [[emp.nom, type, now.toISOString(), now.toLocaleDateString('fr-CA'), now.toLocaleTimeString('fr-CA',{hour:'2-digit',minute:'2-digit'}), getWeek(now), `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`]] } });
}
async function getPointages(sid, filter={}) {
  try {
    const res = await gapi.client.sheets.spreadsheets.values.get({ spreadsheetId: sid, range: 'Pointages!A2:G' });
    let rows = (res.result.values||[]).map(r => ({ nom:r[0], type:r[1], datetime:r[2], date:r[3], heure:r[4], semaine:r[5], mois:r[6] }));
    if (filter.nom) rows = rows.filter(r => r.nom === filter.nom);
    if (filter.semaine) rows = rows.filter(r => r.semaine === filter.semaine);
    if (filter.mois) rows = rows.filter(r => r.mois === filter.mois);
    if (filter.date) rows = rows.filter(r => r.date === filter.date);
    return rows;
  } catch { return []; }
}
async function getHeuresBanque(sid) {
  try {
    const res = await gapi.client.sheets.spreadsheets.values.get({ spreadsheetId: sid, range: 'HeuresEnBanque!A2:E' });
    return (res.result.values||[]).map((r,i) => ({ nom:r[0], semaine:r[1], heures:parseFloat(r[2])||0, statut:r[3]||'pending', date:r[4], row:i+2 }));
  } catch { return []; }
}
async function addHeuresBanque(sid, nom, semaine, heures) {
  await gapi.client.sheets.spreadsheets.values.append({ spreadsheetId: sid, range: 'HeuresEnBanque!A:E', valueInputOption: 'RAW', resource: { values: [[nom, semaine, heures, 'pending', new Date().toLocaleDateString('fr-CA')]] } });
}
async function updateBanqueStatus(sid, row, statut) {
  await gapi.client.sheets.spreadsheets.values.update({ spreadsheetId: sid, range: `HeuresEnBanque!D${row}`, valueInputOption: 'RAW', resource: { values: [[statut]] } });
}

// ── CALENDAR ──────────────────────────────────────────────────────────────────
async function getCalendarJobs(calendarIds) {
  const now = new Date(), end = new Date(now);
  end.setDate(end.getDate() + 14);
  const allEvents = [];
  for (const calId of calendarIds) {
    try {
      const res = await gapi.client.calendar.events.list({ calendarId: calId, timeMin: now.toISOString(), timeMax: end.toISOString(), singleEvents: true, orderBy: 'startTime', maxResults: 20 });
      (res.result.items || []).forEach(e => {
        if (!allEvents.find(x => x.id === e.id)) {
          allEvents.push({ id:e.id, title:e.summary||'Sans titre', start:e.start.dateTime||e.start.date, end:e.end.dateTime||e.end.date, location:e.location||'', description:e.description||'' });
        }
      });
    } catch {}
  }
  return allEvents.sort((a,b) => new Date(a.start) - new Date(b.start));
}

// ── UTILS ─────────────────────────────────────────────────────────────────────
function getWeek(d) {
  const date = new Date(d); date.setHours(0,0,0,0); date.setDate(date.getDate()+3-(date.getDay()+6)%7);
  const w1 = new Date(date.getFullYear(),0,4);
  return `${date.getFullYear()}-S${String(1+Math.round(((date-w1)/86400000-3+(w1.getDay()+6)%7)/7)).padStart(2,'0')}`;
}
function calcH(pts) {
  let t=0, last=null;
  for (const p of pts) {
    if (p.type==='in') last = new Date(p.datetime);
    else if (p.type==='out' && last) { t += (new Date(p.datetime)-last)/3600000; last = null; }
  }
  return Math.round(t*10)/10;
}
function rgba(hex, a=0.15) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
function useClock() {
  const [now, setNow] = useState(new Date());
  useEffect(() => { const t = setInterval(() => setNow(new Date()), 1000); return () => clearInterval(t); }, []);
  return now;
}

// ── NOTIF ─────────────────────────────────────────────────────────────────────
function Notif({ msg, type, onClose }) {
  useEffect(() => { const t = setTimeout(onClose, 4500); return () => clearTimeout(t); }, []);
  return <div className={`notif ${type}`} onClick={onClose}>{msg}</div>;
}

// ── PIN PAD ────────────────────────────────────────────────────────────────────
function PinPad({ empName, empCouleur, empCode, onSubmit, onCancel }) {
  const [pin, setPin] = useState('');
  const keys = ['1','2','3','4','5','6','7','8','9','←','0','✓'];
  const handle = k => {
    if (k==='←') setPin(p => p.slice(0,-1));
    else if (k==='✓') { if (pin.length>=4) { onSubmit(pin); setPin(''); } }
    else if (pin.length<6) setPin(p => p+k);
  };
  return (
    <div className="pin-wrap">
      <div className="pin-who">
        <div className="emp-av" style={{background:empCouleur,width:38,height:38,fontSize:13}}>{empCode}</div>
        <div style={{fontFamily:'var(--font-head)',fontWeight:700,fontSize:'1rem'}}>{empName}</div>
      </div>
      <div className="pin-display">{pin ? '●'.repeat(pin.length) : <span style={{color:'var(--muted)',fontSize:'0.85rem'}}>Entrez votre PIN</span>}</div>
      <div className="pin-grid">
        {keys.map((k,i) => (
          <div key={i} className={`pin-key${k==='←'?' del':''}${k==='0'?' zero':''}`}
            style={k==='✓'?{background:'linear-gradient(135deg,var(--accent),var(--accent2))',color:'#fff',border:'none'}:{}}
            onClick={() => handle(k)}>{k}</div>
        ))}
      </div>
      <button className="pin-back" onClick={onCancel}>← Changer d'employé</button>
    </div>
  );
}

// ── WELCOME SCREEN ────────────────────────────────────────────────────────────
function WelcomeScreen({ emps, sid, calendarIds, notify, onRefresh }) {
  const now = useClock();
  const [selected, setSelected] = useState(null);
  const [result, setResult] = useState(null);
  const [jobs, setJobs] = useState([]);

  useEffect(() => { if (calendarIds.length) getCalendarJobs(calendarIds).then(setJobs); }, [calendarIds.join(',')]);

  const pad = n => String(n).padStart(2,'0');
  const days = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
  const months = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  const today = now.toLocaleDateString('fr-CA');
  const curWeek = getWeek(now);
  const curMois = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;

  // Today's jobs
  const todayJobs = jobs.filter(j => {
    const d = new Date(j.start).toLocaleDateString('fr-CA');
    return d === today;
  });

  async function handlePunch(pin) {
    const emp = emps.find(e => e.nom === selected.nom);
    if (!emp || emp.pin !== pin) { setResult({err:true}); setTimeout(()=>setResult(null),2500); return; }
    const type = emp.statut==='in' ? 'out' : 'in';
    await addPointage(sid, emp, type);
    await updateStatus(sid, emp.row, type);
    const curW = getWeek(new Date());
    const semPts = await getPointages(sid, {nom:emp.nom, semaine:curW});
    const total = calcH(semPts);
    if (type==='out' && total>40) {
      const extra = Math.round((total-40)*10)/10;
      const bq = await getHeuresBanque(sid);
      if (!bq.some(b => b.nom===emp.nom && b.semaine===curW)) {
        await addHeuresBanque(sid, emp.nom, curW, extra);
        notify(`🏦 ${emp.nom} — ${extra}h en banque cette semaine!`,'warn');
      }
    }
    const allPts = await getPointages(sid, {nom:emp.nom});
    setResult({ ok:true, nom:emp.nom, type, heure:now.toLocaleTimeString('fr-CA',{hour:'2-digit',minute:'2-digit'}), couleur:emp.couleur, code:emp.code, pts:allPts });
    setSelected(null);
    onRefresh();
    setTimeout(() => setResult(null), 6000);
  }

  if (result?.ok) {
    const pts = result.pts||[];
    return (
      <div className="welcome">
        <div className="punch-result ok">
          <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:10,marginBottom:8}}>
            <div className="emp-av" style={{background:result.couleur,width:44,height:44,fontSize:15}}>{result.code}</div>
            <div style={{fontFamily:'var(--font-head)',fontSize:'1.25rem',fontWeight:800}}>{result.nom}</div>
          </div>
          <span className={`pbadge ${result.type}`}>{result.type==='in'?'✅ Entrée enregistrée':'🔴 Sortie enregistrée'}</span>
          <div style={{fontFamily:'var(--font-head)',fontWeight:700,fontSize:'1.3rem',margin:'4px 0'}}>{result.heure}</div>
          <div className="punch-stats">
            <div className="ps"><div className="v">{calcH(pts.filter(p=>p.date===today))}h</div><div className="l">Aujourd'hui</div></div>
            <div className="ps"><div className="v">{calcH(pts.filter(p=>p.semaine===curWeek))}h</div><div className="l">Semaine</div></div>
            <div className="ps"><div className="v">{calcH(pts.filter(p=>p.mois===curMois))}h</div><div className="l">Mois</div></div>
          </div>
        </div>
      </div>
    );
  }

  if (result?.err) {
    return (
      <div className="welcome">
        <div className="punch-result err">
          <div style={{fontSize:'2rem',marginBottom:8}}>❌</div>
          <div style={{fontFamily:'var(--font-head)',fontWeight:700}}>PIN incorrect</div>
          <div style={{fontSize:12,color:'var(--muted)',marginTop:4}}>Réessaie ou sélectionne ton nom</div>
          <button className="pin-back" style={{marginTop:12}} onClick={()=>setResult(null)}>← Retour</button>
        </div>
      </div>
    );
  }

  if (selected) {
    return (
      <div className="welcome">
        <div className="w-time">{pad(now.getHours())}:{pad(now.getMinutes())}</div>
        <div className="w-date">{days[now.getDay()]} {now.getDate()} {months[now.getMonth()]} {now.getFullYear()}</div>
        <PinPad empName={selected.nom} empCouleur={selected.couleur} empCode={selected.code} onSubmit={handlePunch} onCancel={()=>setSelected(null)}/>
      </div>
    );
  }

  return (
    <div className="welcome">
      <div className="w-time">{pad(now.getHours())}:{pad(now.getMinutes())}</div>
      <div className="w-date">{days[now.getDay()]} {now.getDate()} {months[now.getMonth()]} {now.getFullYear()}</div>
      {todayJobs.length>0 && (
        <div style={{marginBottom:'1.5rem',maxWidth:680,width:'100%'}}>
          {todayJobs.map(j=>(
            <div key={j.id} style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:8,padding:'0.5rem 0.85rem',marginBottom:'0.35rem',display:'flex',alignItems:'center',gap:10,textAlign:'left'}}>
              <span style={{fontSize:'1rem'}}>📍</span>
              <div>
                <div style={{fontWeight:600,fontSize:13}}>{j.title}</div>
                {j.location && <div style={{fontSize:11,color:'var(--muted)'}}>{j.location}</div>}
              </div>
            </div>
          ))}
        </div>
      )}
      {emps.length===0 ? (
        <div style={{color:'var(--muted)',textAlign:'center',maxWidth:380}}>
          <div style={{fontSize:'2rem',marginBottom:'0.75rem'}}>👷</div>
          <div style={{fontFamily:'var(--font-head)',fontSize:'1rem',fontWeight:700,marginBottom:'0.4rem'}}>Aucun employé configuré</div>
          <div style={{fontSize:13}}>Connectez-vous en tant qu'administrateur pour ajouter des employés.</div>
        </div>
      ) : (
        <>
          <div className="w-hint">Sélectionnez votre nom</div>
          <div className="emp-grid">
            {emps.map(emp=>(
              <div key={emp.nom} className="emp-card" style={{borderColor:emp.statut==='in'?emp.couleur:'var(--border)',boxShadow:emp.statut==='in'?`0 0 0 1px ${emp.couleur}`:''}} onClick={()=>setSelected(emp)}>
                <div className="emp-av-lg" style={{background:emp.couleur}}>{emp.code}</div>
                <div className="emp-card-name">{emp.nom}</div>
                <div className="emp-card-status" style={{color:emp.statut==='in'?emp.couleur:'var(--muted)'}}>{emp.statut==='in'?'● En cours':'○ Absent'}</div>

  );
}

          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1rem'}}>
            <div className="card-title">Employés ({emps.length})</div>
            <button className="btn-sec" onClick={()=>setShowAdd(!showAdd)}>+ Ajouter</button>
          </div>
          {showAdd && (
            <div className="add-form">
              <div className="add-row">
                <div><span className="fl">Nom complet</span><input placeholder="Jean Tremblay" value={newEmp.nom} onChange={e=>setNewEmp(p=>({...p,nom:e.target.value}))}/></div>
                <div><span className="fl">Code (2-3 lettres)</span><input placeholder="JT" maxLength={3} value={newEmp.code} onChange={e=>setNewEmp(p=>({...p,code:e.target.value.toUpperCase()}))}/></div>
                <div><span className="fl">PIN (4-6 chiffres)</span><input placeholder="1234" maxLength={6} value={newEmp.pin} onChange={e=>setNewEmp(p=>({...p,pin:e.target.value}))}/></div>
              </div>
              <div style={{marginBottom:'0.65rem'}}>
                <span className="fl">Couleur</span>
                <div className="color-row">{EMP_COLORS.map(c=><div key={c} className="cswatch" style={{background:c,border:`2px solid ${newEmp.couleur===c?'#fff':'transparent'}`}} onClick={()=>setNewEmp(p=>({...p,couleur:c}))}/>)}</div>
              </div>
              <button className="btn-primary" style={{marginTop:0}} onClick={handleAdd}>✓ Sauvegarder</button>
            </div>
          )}
          <div style={{marginTop:'0.85rem'}}>
            {emps.map(emp=>(
              <div key={emp.nom} className="emp-row">
                <div className="emp-av" style={{background:emp.couleur}}>{emp.code}</div>
                <div style={{flex:1,marginLeft:'0.65rem'}}>
                  <div style={{fontSize:13,fontWeight:500}}>{emp.nom}</div>
                  <div style={{fontSize:10,color:'var(--muted)',fontFamily:'monospace'}}>PIN: {emp.pin} · Code: {emp.code}</div>
                </div>
                <span className={`badge ${emp.statut==='in'?'badge-in':'badge-out'}`}>{emp.statut==='in'?'Présent':'Absent'}</span>
                <button className="btn-icon" onClick={()=>handleDel(emp)}>✕</button>
              </div>
            ))}
            {emps.length===0&&<div style={{color:'var(--muted)',textAlign:'center',padding:'1.5rem',fontSize:13}}>Aucun employé — cliquez "+ Ajouter" pour commencer</div>}
          </div>
        </div>
      )}

      {tab==='historique' && (
        <div className="card">
          <div style={{display:'flex',gap:'0.75rem',alignItems:'center',flexWrap:'wrap',marginBottom:'1rem'}}>
            <select value={selEmp} onChange={e=>setSelEmp(e.target.value)} style={{background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:6,padding:'0.35rem 0.65rem',color:'var(--text)',fontSize:12}}>
              <option value="">Tous les employés</option>
              {emps.map(e=><option key={e.nom} value={e.nom}>{e.nom}</option>)}
            </select>
            <div className="tabs" style={{margin:0}}>
              {[['today',"Auj."],['semaine','Semaine'],['mois','Mois'],['all','Tout']].map(([k,l])=>(
                <div key={k} className={`tab${histTab===k?' active':''}`} onClick={()=>setHistTab(k)}>{l}</div>
              ))}
            </div>
          </div>
          <div className="scroll-area" style={{maxHeight:380}}>
            <table className="htable">
              <thead><tr><th>Employé</th><th>Type</th><th>Date</th><th>Heure</th><th>Semaine</th></tr></thead>
              <tbody>
                {getHist().map((p,i)=>{
                  const emp=eMap[p.nom];
                  return (
                    <tr key={i}>
                      <td><div style={{display:'flex',alignItems:'center',gap:7}}>{emp&&<div className="emp-av" style={{background:emp.couleur,width:22,height:22,fontSize:9}}>{emp.code}</div>}{p.nom}</div></td>
                      <td><span className={`badge ${p.type==='in'?'badge-in':'badge-out'}`}>{p.type==='in'?'Entrée':'Sortie'}</span></td>
                      <td>{p.date}</td><td>{p.heure}</td><td>{p.semaine}</td>
                    </tr>
                  );
                })}
                {getHist().length===0&&<tr><td colSpan={5} style={{textAlign:'center',color:'var(--muted)',padding:'1rem'}}>Aucun pointage pour cette période</td></tr>}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {tab==='banque' && (
        <div>
          {pending.length>0&&(
            <div className="card" style={{marginBottom:'1rem',borderColor:'rgba(210,153,34,0.3)'}}>
              <div className="card-title">⚠️ Demandes en attente ({pending.length})</div>
              {pending.map(b=>{
                const emp=eMap[b.nom];
                return (
                  <div key={b.row} className="bank-row">
                    <div style={{display:'flex',alignItems:'center',gap:8}}>
                      {emp&&<div className="emp-av" style={{background:emp.couleur}}>{emp.code}</div>}
                      <div><div style={{fontWeight:500,fontSize:13}}>{b.nom}</div><div style={{fontSize:11,color:'var(--muted)'}}>Sem. {b.semaine} · {b.date}</div></div>
                    </div>
                    <div style={{fontFamily:'var(--font-head)',fontWeight:700,color:'var(--warning)',fontSize:'1.1rem'}}>+{b.heures}h</div>
                    <div style={{display:'flex',gap:5}}>
                      <button className="btn-sm btn-approve" onClick={()=>handleBanque(b,'approved')}>✓ Approuver</button>
                      <button className="btn-sm btn-deny" onClick={()=>handleBanque(b,'denied')}>✕ Refuser</button>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
          <div className="card">
            <div className="card-title">Historique complet</div>
            <table className="htable">
              <thead><tr><th>Employé</th><th>Semaine</th><th>Heures</th><th>Statut</th><th>Date</th></tr></thead>
              <tbody>
                {banque.map((b,i)=>(
                  <tr key={i}>
                    <td>{b.nom}</td><td>{b.semaine}</td><td><strong>+{b.heures}h</strong></td>
                    <td><span className={`badge ${b.statut==='approved'?'badge-in':b.statut==='pending'?'badge-pend':'badge-out'}`}>{b.statut==='approved'?'Approuvé':b.statut==='pending'?'En attente':'Refusé'}</span></td>
                    <td>{b.date}</td>
                  </tr>
                ))}
                {banque.length===0&&<tr><td colSpan={5} style={{textAlign:'center',color:'var(--muted)',padding:'1rem'}}>Aucune heure en banque enregistrée</td></tr>}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {tab==='jobs' && (
        <div className="card">
          <div className="card-title">Jobs — Google Agenda (14 prochains jours)</div>
          <div style={{fontSize:11,color:'var(--muted)',marginBottom:'1rem'}}>Les employés sont détectés automatiquement si leur nom ou code apparaît dans le titre ou la description de l'événement.</div>
          {jobs.length===0?<div style={{color:'var(--muted)',padding:'0.5rem 0',fontSize:13}}>Aucun événement à venir.</div>:
          jobs.map(j=>{
            const ass=getAssignees(j);
            return (
              <div key={j.id} className="job-item" style={{marginBottom:'0.5rem',borderLeftColor:ass[0]?.couleur||'var(--accent)'}}>
                <div style={{fontWeight:600,fontSize:14}}>{j.title}</div>
                <div style={{fontSize:11,color:'var(--muted)',marginTop:2}}>{new Date(j.start).toLocaleDateString('fr-CA',{weekday:'long',month:'long',day:'numeric'})} {j.location?`· ${j.location}`:''}</div>
                {ass.length>0&&<div style={{marginTop:5}}>{ass.map(a=><span key={a.nom} className="achip" style={{background:rgba(a.couleur,0.2),color:a.couleur}}><span style={{width:7,height:7,borderRadius:'50%',background:a.couleur,display:'inline-block'}}></span>{a.nom} ({a.code})</span>)}</div>}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ── MAIN APP ──────────────────────────────────────────────────────────────────
function App() {
  const [cfg, setCfg] = useState(() => { try { return JSON.parse(localStorage.getItem('pp_cfg')||'null'); } catch { return null; } });
  const [showCfg, setShowCfg] = useState(!cfg);
  const [authed, setAuthed] = useState(false);
  const [userEmail, setUserEmail] = useState('');
  const [isBoss, setIsBoss] = useState(false);
  const [view, setView] = useState('pointage');
  const [emps, setEmps] = useState([]);
  const [refreshKey, setRefreshKey] = useState(0);
  const [notif, setNotif] = useState(null);
  const [authLoading, setAuthLoading] = useState(false);
  const [libsReady, setLibsReady] = useState(false);

  function notify(msg, type='success') { setNotif({msg, type, id:Date.now()}); }
  function onRefresh() { setRefreshKey(k=>k+1); }

  function getBossEmails() {
    if (!cfg?.bossEmails) return [];
    return cfg.bossEmails.split('\n').map(e=>e.trim().toLowerCase()).filter(Boolean);
  }

  function getCalendarIds() {
    if (!cfg?.calendarIds) return ['primary'];
    const ids = cfg.calendarIds.split('\n').map(e=>e.trim()).filter(Boolean);
    return ids.length ? ids : ['primary'];
  }

  async function onToken(resp) {
    if (resp.error) { setAuthLoading(false); notify('Erreur Google: '+resp.error,'err'); return; }
    const email = await getUserEmail();
    setUserEmail(email);
    const bossEmails = getBossEmails();
    const boss = bossEmails.length ? bossEmails.includes(email) : true; // si aucun email configuré, tous sont boss
    setIsBoss(boss);
    setView('pointage');
    await ensureStructure(cfg.spreadsheetId);
    setEmps(await getEmployees(cfg.spreadsheetId));
    setAuthed(true);
    setAuthLoading(false);
    notify(`✅ ${email}${boss?' — Accès administrateur':''}`, 'success');
    onRefresh();
  }

  async function loadLibs(config) {
    try { await initLibs(config, onToken); setLibsReady(true); }
    catch(e) { console.error(e); notify('Erreur chargement APIs Google','err'); }
  }

  useEffect(() => { if (cfg) loadLibs(cfg); }, [cfg]);
  useEffect(() => { if (authed && cfg) getEmployees(cfg.spreadsheetId).then(setEmps); }, [refreshKey, authed]);

  function handleAuth() {
    if (!libsReady) { notify('APIs en cours de chargement, réessaie dans 2s...','warn'); return; }
    setAuthLoading(true);
    tokenClient.requestAccessToken({prompt:'select_account'});
  }
  function handleSaveCfg(config) {
    localStorage.setItem('pp_cfg', JSON.stringify(config));
    setCfg(config); setShowCfg(false); setAuthed(false); setLibsReady(false); tokenClient=null;
    loadLibs(config);
  }
  function handleSwitch() {
    setAuthed(false); setUserEmail(''); setIsBoss(false); setAuthLoading(true);
    tokenClient.requestAccessToken({prompt:'select_account'});
  }
  function handleReset() {
    if (!confirm('Réinitialiser l\'application?')) return;
    localStorage.removeItem('pp_cfg');
    setCfg(null); setAuthed(false); setShowCfg(true); setLibsReady(false); tokenClient=null;
  }

  return (
    <div className="app-wrap">
      {showCfg && <ConfigModal initial={cfg} onSave={handleSaveCfg}/>}
      {notif && <Notif key={notif.id} msg={notif.msg} type={notif.type} onClose={()=>setNotif(null)}/>}

      <div className="topbar">
        <div className="logo">⚡ Saran Électrique</div>
        <div className="topbar-right">
          {authed ? (
            <>
              <div className="online-badge"><div className="online-dot"></div>{userEmail.split('@')[0]}</div>
              <div className="nav-tabs">
                <div className={`nav-tab${view==='pointage'?' active':''}`} onClick={()=>setView('pointage')}>Pointage</div>
                {isBoss && <div className={`nav-tab admin${view==='admin'?' active':''}`} onClick={()=>setView('admin')}>Administration</div>}
              </div>
              <button className="btn-sec" style={{fontSize:11,padding:'0.3rem 0.55rem'}} onClick={onRefresh}>↻</button>
            </>
          ) : (
            <button className="btn-primary" style={{width:'auto',padding:'0.45rem 1.1rem',fontSize:12,marginTop:0}} onClick={handleAuth} disabled={authLoading||!libsReady}>
              {authLoading?'⏳ Connexion...':'🔐 Connexion Google'}
            </button>
          )}
          <SettingsMenu userEmail={userEmail} isBoss={isBoss} onSwitch={handleSwitch} onEditCfg={()=>setShowCfg(true)} onReset={handleReset}/>
        </div>
      </div>

      {!authed ? (
        <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',flex:1,padding:'3rem 2rem',textAlign:'center'}}>
          <div style={{fontSize:'3rem',marginBottom:'0.75rem'}}>⚡</div>
          <div style={{fontFamily:'var(--font-head)',fontSize:'1.75rem',fontWeight:800,marginBottom:'0.2rem'}}>Saran Électrique</div>
          <div style={{color:'var(--muted)',fontSize:'0.9rem',marginBottom:'2.5rem'}}>Système de gestion du temps</div>
          <button className="btn-primary" style={{width:'auto',padding:'0.75rem 2.25rem',marginTop:0}} onClick={handleAuth} disabled={authLoading||!libsReady}>
            {authLoading?'⏳ Connexion en cours...':'🔐 Se connecter avec Google'}
          </button>
          {!libsReady&&cfg&&<div style={{color:'var(--muted)',fontSize:11,marginTop:'1rem'}}>⏳ Chargement des APIs...</div>}
        </div>
      ) : (
        <>
          {view==='pointage' && <WelcomeScreen emps={emps} sid={cfg.spreadsheetId} calendarIds={getCalendarIds()} notify={notify} onRefresh={onRefresh}/>}
          {view==='admin' && isBoss && <div className="content"><AdminView sid={cfg.spreadsheetId} calendarIds={getCalendarIds()} refreshKey={refreshKey} notify={notify}/></div>}
        </>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
