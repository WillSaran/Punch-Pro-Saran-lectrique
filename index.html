<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PunchPro">
<meta name="theme-color" content="#0d1117">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<title>PunchPro — Saran Électrique</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAIQBlBnZ_sjsDDu6uJS7jJA6M2zAKSETE&libraries=places" async defer></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--bg2:#161b22;--bg3:#1c2333;--bg4:#21262d;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#e6edf3;--muted:#7d8590;
  --accent:#2f81f7;--accent2:#6e40c9;
  --success:#3fb950;--warning:#d29922;--danger:#f85149;
  --font-head:'Syne',sans-serif;--font-body:'DM Sans',sans-serif;
  --topbar-h:50px;
}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:14px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased}
#root{min-height:100vh}
button{font-family:var(--font-body)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.88);display:flex;align-items:center;justify-content:center;z-index:1000;padding:1rem;overflow-y:auto}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:16px;padding:1.75rem;max-width:500px;width:100%}
.modal-title{font-family:var(--font-head);font-size:1.4rem;font-weight:800;margin-bottom:0.2rem;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.modal-sub{color:var(--muted);font-size:12px;margin-bottom:1.25rem}
.fg{margin-bottom:0.85rem}
.fg label{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:0.3rem}
.fg input,.fg select,.fg textarea{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:0.55rem 0.75rem;color:var(--text);font-family:var(--font-body);font-size:13px;outline:none;transition:border-color 0.2s}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--accent)}
.fg small{display:block;margin-top:0.28rem;font-size:11px;color:var(--muted)}
.btn-p{width:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:8px;padding:0.7rem;color:#fff;font-family:var(--font-head);font-size:14px;font-weight:700;cursor:pointer;transition:opacity 0.2s;margin-top:0.4rem;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn-p:hover{opacity:0.88}.btn-p:disabled{opacity:0.4;cursor:not-allowed}
.btn-s{background:transparent;border:1px solid var(--border2);border-radius:8px;padding:0.5rem 0.9rem;color:var(--text);font-size:12px;cursor:pointer;transition:background 0.2s;white-space:nowrap;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn-s:hover{background:var(--bg3)}
.app-wrap{min-height:100vh;display:flex;flex-direction:column}
/* ── TOPBAR ─────────────────────────────────────────────────────────── */
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 1rem;height:var(--topbar-h);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{font-family:var(--font-head);font-size:0.85rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap;overflow:visible;max-width:none}
.topbar-left{display:flex;align-items:center;gap:0.4rem;min-width:0;flex:1}
.topbar-right{display:flex;align-items:center;gap:0.4rem;flex-shrink:0}
.back-btn{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:0.28rem 0.65rem;color:var(--muted);cursor:pointer;font-size:12px;transition:all 0.2s}
.back-btn:hover{color:var(--text);border-color:var(--border2)}
.nav-tabs{display:flex;background:var(--bg3);border-radius:8px;padding:2px;border:1px solid var(--border)}
.nav-tab{padding:0.26rem 0.7rem;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--muted);transition:all 0.2s;white-space:nowrap;position:relative}
.nav-tab.active{background:var(--accent);color:#fff}
.nav-tab.admin.active{background:linear-gradient(135deg,#b7860b,var(--warning));color:#000}
.nav-badge{position:absolute;top:-5px;right:-5px;background:var(--danger);color:#fff;border-radius:10px;font-size:9px;font-weight:700;padding:1px 5px;min-width:16px;text-align:center}
.online-badge{display:flex;align-items:center;gap:4px;background:rgba(63,185,80,0.1);border:1px solid rgba(63,185,80,0.2);border-radius:20px;padding:0.2rem 0.55rem;font-size:11px;color:var(--success)}
.online-dot{width:5px;height:5px;border-radius:50%;background:var(--success);box-shadow:0 0 4px var(--success)}
.settings-wrap{position:relative}
.settings-btn{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:0.28rem 0.6rem;color:var(--muted);cursor:pointer;font-size:13px;transition:all 0.2s}
.settings-btn:hover{border-color:var(--border2);color:var(--text)}
.settings-menu{position:absolute;top:calc(100% + 6px);right:0;background:var(--bg2);border:1px solid var(--border2);border-radius:12px;padding:0.4rem;min-width:230px;box-shadow:0 8px 32px rgba(0,0,0,0.6);z-index:200}
.si{display:flex;align-items:center;gap:0.55rem;padding:0.45rem 0.6rem;border-radius:6px;cursor:pointer;font-size:12px;color:var(--text);transition:background 0.15s;white-space:nowrap;border:none;background:transparent;width:100%;text-align:left}
.si:hover{background:var(--bg3)}.si.danger:hover{background:rgba(248,81,73,0.1);color:var(--danger)}
.si .ico{font-size:13px;width:16px;text-align:center}
.sdiv{height:1px;background:var(--border);margin:0.28rem 0}
.ssec{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;padding:0.28rem 0.6rem 0.12rem}
.acct-card{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:0.5rem 0.6rem;margin:0.28rem 0}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:0.4rem 0.6rem}
.toggle{width:34px;height:18px;border-radius:9px;background:var(--bg3);border:1px solid var(--border2);position:relative;cursor:pointer;transition:background 0.2s}
.toggle.on{background:var(--accent)}
.toggle-knob{width:12px;height:12px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;transition:left 0.2s}
.toggle.on .toggle-knob{left:18px}
.content{flex:1;padding:1.1rem;max-width:1080px;margin:0 auto;width:100%}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:1.1rem}
.card-title{font-family:var(--font-head);font-size:0.92rem;font-weight:700;margin-bottom:0.75rem}
.csec{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.09em;color:var(--muted);margin-bottom:0.5rem}
.welcome{min-height:calc(100vh - var(--topbar-h));display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:1.25rem 1rem;text-align:center;overflow-y:auto}
.w-time{font-family:var(--font-head);font-size:3rem;font-weight:800;letter-spacing:-2px;line-height:1;margin-top:0.5rem}
.w-date{font-size:12px;color:var(--muted);margin:0.25rem 0 1.5rem}
.emp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:0.45rem;max-width:600px;width:100%}
.emp-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:0.85rem 0.5rem;cursor:pointer;transition:all 0.18s;text-align:center;-webkit-tap-highlight-color:transparent}
.emp-card:active{transform:scale(0.96)}
.emp-card:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,0.35)}
.emp-av-lg{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;margin:0 auto 0.4rem}
.mode-wrap{max-width:360px;width:100%;text-align:left}
.mode-btn{display:flex;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:1rem 1.1rem;cursor:pointer;transition:all 0.18s;width:100%;margin-bottom:0.45rem;-webkit-tap-highlight-color:transparent}
.mode-btn:hover,.mode-btn:active{border-color:var(--accent);background:rgba(47,129,247,0.06)}
.mode-icon{font-size:1.5rem;flex-shrink:0}
.mode-title{font-family:var(--font-head);font-weight:700;font-size:0.88rem}
.mode-desc{font-size:11px;color:var(--muted);margin-top:2px}
.job-wrap{max-width:520px;width:100%;text-align:left}
.job-btn{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:0.65rem 0.85rem;cursor:pointer;transition:all 0.18s;width:100%;margin-bottom:0.32rem;-webkit-tap-highlight-color:transparent}
.job-btn:active{transform:scale(0.98)}
.job-color-bar{width:4px;min-height:34px;border-radius:2px;flex-shrink:0;align-self:stretch}
.dur-wrap{max-width:380px;width:100%;text-align:left}
.dur-section{background:var(--bg3);border-radius:10px;padding:0.8rem;margin-bottom:0.6rem}
.dur-row{display:flex;align-items:center;justify-content:center;gap:0.65rem;margin-top:0.4rem}
.dur-btn{width:36px;height:36px;border-radius:8px;background:var(--bg2);border:1px solid var(--border);color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.dur-btn:active{transform:scale(0.9);border-color:var(--accent)}
.dur-val{font-family:var(--font-head);font-size:1.6rem;font-weight:800;color:var(--accent);min-width:44px;text-align:center}
.travel-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:0.35rem;margin-top:0.4rem}
.travel-opt{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:0.45rem;cursor:pointer;text-align:center;transition:all 0.15s;-webkit-tap-highlight-color:transparent}
.travel-opt:active{transform:scale(0.94)}
.travel-opt.sel{border-color:var(--accent);background:rgba(47,129,247,0.12)}
.travel-opt .tv{font-family:var(--font-head);font-size:0.95rem;font-weight:800;color:var(--accent)}
.travel-opt .tl{font-size:9px;color:var(--muted)}
.teammate-list{display:flex;flex-wrap:wrap;gap:0.4rem;margin-top:0.4rem}
.teammate-chip{display:flex;align-items:center;gap:5px;padding:0.3rem 0.65rem;border-radius:20px;border:1px solid var(--border);cursor:pointer;font-size:12px;transition:all 0.15s;-webkit-tap-highlight-color:transparent}
.files-wrap{margin-bottom:0.6rem}
.file-list{display:flex;flex-direction:column;gap:0.35rem;margin-bottom:0.45rem}
.file-item{display:flex;align-items:center;gap:8px;background:var(--bg3);border-radius:8px;padding:0.4rem 0.65rem}
.file-add-row{display:flex;gap:0.4rem}
.file-zone{flex:1;border:1px dashed var(--border2);border-radius:8px;padding:0.6rem;text-align:center;cursor:pointer;transition:all 0.2s;-webkit-tap-highlight-color:transparent}
.file-zone:active{border-color:var(--accent);background:rgba(47,129,247,0.05)}
.pin-wrap{background:var(--bg2);border:1px solid var(--border2);border-radius:14px;padding:1.1rem;max-width:300px;width:100%}
.pin-display{background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:0.6rem 1rem;text-align:center;font-family:var(--font-head);font-size:1.6rem;letter-spacing:0.5rem;margin-bottom:0.75rem;min-height:50px;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0.38rem}
.pin-key{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:0.75rem;font-family:var(--font-head);font-size:1.1rem;font-weight:700;color:var(--text);cursor:pointer;text-align:center;transition:all 0.12s;user-select:none;-webkit-tap-highlight-color:transparent}
.pin-key:active{transform:scale(0.92);background:var(--bg4)}
.pin-key.del{color:var(--danger)}.pin-key.zero{grid-column:2}
.punch-result{padding:1.1rem;border-radius:14px;text-align:center;max-width:320px;width:100%;animation:popIn 0.25s ease}
.punch-result.ok{background:rgba(63,185,80,0.07);border:1px solid rgba(63,185,80,0.3)}
.punch-result.err{background:rgba(248,81,73,0.07);border:1px solid rgba(248,81,73,0.25)}
@keyframes popIn{from{transform:scale(0.92);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes pulse{0%,100%{opacity:0.3;transform:scale(0.8);}50%{opacity:1;transform:scale(1.2);}}
.pbadge{display:inline-block;padding:0.25rem 0.75rem;border-radius:20px;font-size:11px;font-weight:700;margin:0.28rem 0.15rem}
.pbadge.in{background:rgba(63,185,80,0.18);color:var(--success)}
.pbadge.out{background:rgba(248,81,73,0.14);color:var(--danger)}
.pbadge.confirm{background:rgba(110,64,201,0.18);color:#a78bfa}
.pbadge.travel{background:rgba(210,153,34,0.18);color:var(--warning)}
.punch-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0.28rem;margin-top:0.65rem}
.ps{background:var(--bg3);border-radius:8px;padding:0.4rem;text-align:center}
.ps .v{font-family:var(--font-head);font-size:0.85rem;font-weight:800;color:var(--accent)}
.ps .l{font-size:9px;color:var(--muted);text-transform:uppercase;margin-top:1px}
.hist-line{background:var(--bg3);border-radius:10px;padding:0.7rem 0.85rem;margin-bottom:0.4rem;border-left:3px solid var(--border2)}
.hist-line.has-ot{border-left-color:var(--warning)}
.hist-header{display:flex;align-items:flex-start;justify-content:space-between;gap:0.5rem}
.hist-actions{display:flex;gap:0.35rem;margin-top:0.5rem;flex-wrap:wrap}
.hist-edit-form{background:var(--bg2);border-radius:8px;padding:0.75rem;margin-top:0.5rem;border:1px solid var(--border2)}
.emp-av{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:9px;color:#fff;flex-shrink:0}
.job-item{padding:0.6rem 0.75rem;background:var(--bg3);border-radius:8px;margin-bottom:0.32rem;border-left:3px solid var(--accent)}
.achip{display:inline-flex;align-items:center;gap:3px;padding:2px 6px;border-radius:8px;font-size:10px;font-weight:600;margin-top:4px;margin-right:3px}
.status-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:0.4rem}
.semp{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:0.5rem 0.65rem;display:flex;align-items:center;gap:0.4rem}
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0.5rem}
@media(min-width:500px){.stats-grid{grid-template-columns:repeat(4,1fr)}}
.stat-box{background:var(--bg3);border-radius:8px;padding:0.7rem;text-align:center}
.stat-box .val{font-family:var(--font-head);font-size:1.2rem;font-weight:800;color:var(--accent)}
.stat-box .lbl{font-size:10px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:0.05em}
.htable{width:100%;border-collapse:collapse;font-size:12px}
.htable th{text-align:left;padding:0.38rem 0.55rem;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:0.07em;border-bottom:1px solid var(--border)}
.htable td{padding:0.42rem 0.55rem;border-bottom:1px solid var(--border);vertical-align:middle}
.htable tr:last-child td{border-bottom:none}
.badge{display:inline-block;padding:2px 6px;border-radius:7px;font-size:10px;font-weight:600}
.badge-in{background:rgba(63,185,80,0.15);color:var(--success)}
.badge-out{background:rgba(248,81,73,0.12);color:var(--danger)}
.badge-pend{background:rgba(210,153,34,0.15);color:var(--warning)}
.badge-conf{background:rgba(110,64,201,0.15);color:#a78bfa}
.tabs{display:flex;gap:0.18rem;margin-bottom:0.75rem;background:var(--bg3);border-radius:8px;padding:3px;border:1px solid var(--border);width:fit-content;flex-wrap:wrap}
.tab{padding:0.28rem 0.72rem;border-radius:6px;font-size:11px;font-weight:500;cursor:pointer;border:none;background:transparent;color:var(--muted);transition:all 0.2s}
.tab.active{background:var(--accent);color:#fff}
.bank-row{display:flex;align-items:center;justify-content:space-between;padding:0.55rem 0.65rem;background:var(--bg3);border-radius:8px;margin-bottom:0.32rem;border:1px solid var(--border);gap:0.45rem;flex-wrap:wrap}
.btn-sm{padding:0.2rem 0.55rem;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;border:none;transition:opacity 0.2s}
.btn-sm:hover{opacity:0.8}
.btn-approve{background:rgba(63,185,80,0.18);color:var(--success)}
.btn-deny{background:rgba(248,81,73,0.14);color:var(--danger)}
.admin-grid{display:grid;grid-template-columns:1fr;gap:1rem}
@media(min-width:700px){.admin-grid{grid-template-columns:1fr 1fr}}
.full-w{grid-column:1/-1}
.emp-row{display:flex;align-items:center;padding:0.5rem 0.6rem;background:var(--bg3);border-radius:8px;margin-bottom:0.28rem;gap:0.4rem}
.btn-icon{background:transparent;border:1px solid var(--border);border-radius:6px;padding:3px 6px;color:var(--muted);cursor:pointer;font-size:11px;transition:all 0.2s}
.btn-icon:hover{border-color:var(--danger);color:var(--danger)}
.btn-icon.edit:hover{border-color:var(--accent);color:var(--accent)}
.add-form{background:var(--bg3);border-radius:8px;padding:0.75rem;margin-top:0.55rem;border:1px solid var(--border2)}
.add-form input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:0.4rem 0.55rem;color:var(--text);font-family:var(--font-body);font-size:12px;outline:none;margin-bottom:0.4rem}
.add-form input:focus{border-color:var(--accent)}
.fl{display:block;font-size:10px;color:var(--muted);margin-bottom:3px}
.color-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.cswatch{width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform 0.12s}
.cswatch:hover{transform:scale(1.25)}
.wbar-wrap{margin-bottom:0.72rem}
.wbar-label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:3px;align-items:center}
.wbar{height:5px;background:var(--bg3);border-radius:3px;overflow:hidden}
.wbar-fill{height:100%;border-radius:3px;transition:width 0.5s ease}
.wbar-fill.ot{background:linear-gradient(90deg,var(--warning),var(--danger)) !important}
.notif{position:fixed;top:1rem;right:1rem;background:var(--bg2);border:1px solid var(--border2);border-radius:8px;padding:0.55rem 0.9rem;font-size:12px;z-index:999;max-width:280px;box-shadow:0 4px 20px rgba(0,0,0,0.5);animation:slideIn 0.3s ease;cursor:pointer}
.notif.success{border-color:rgba(63,185,80,0.4)}.notif.warn{border-color:rgba(210,153,34,0.4)}.notif.err{border-color:rgba(248,81,73,0.4)}
@keyframes slideIn{from{transform:translateX(18px);opacity:0}to{transform:translateX(0);opacity:1}}
.scroll-area{overflow-y:auto}
.scroll-area::-webkit-scrollbar{width:3px}
.scroll-area::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.note-input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:0.48rem 0.65rem;color:var(--text);font-family:var(--font-body);font-size:12px;outline:none;resize:none}
.note-input:focus{border-color:var(--accent)}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.75rem}
.msg-card{background:var(--bg3);border-radius:8px;padding:0.65rem 0.75rem;margin-bottom:0.38rem;border-left:3px solid var(--warning)}
.msg-card.read{border-left-color:var(--border);opacity:0.6}
/* TIME INPUT */
.time-input-wrap{display:flex;align-items:center;gap:0.5rem;background:var(--bg3);border-radius:10px;padding:0.85rem;margin-bottom:0.6rem}

function getWeek(d){
  const dt=new Date(d);dt.setHours(0,0,0,0);dt.setDate(dt.getDate()+3-(dt.getDay()+6)%7);
  const w1=new Date(dt.getFullYear(),0,4);
  return dt.getFullYear()+'-S'+String(1+Math.round(((dt-w1)/86400000-3+(w1.getDay()+6)%7)/7)).padStart(2,'0');
}
function getMois(d){const dt=new Date(d);return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');}
function localDateStr(d){const dt=d||new Date();return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');}
function parseDriveFolders(raw){
  if(!raw)return[];
  return raw.split(/[\n,]+/).map(s=>s.trim()).filter(Boolean).map(s=>{
    const idx=s.indexOf(':');if(idx<0)return null;
    const name=s.slice(0,idx).trim();const id=s.slice(idx+1).trim();
    return(name&&id)?{name,id}:null;
  }).filter(Boolean);
}
function calcH(pts){
  let t=0,last=null;
  for(const p of pts){
    if(p.type==='in')last=new Date(p.datetime);
    else if(p.type==='out'&&last){t+=(new Date(p.datetime)-last)/3600000;last=null;}
    else if(p.type==='confirm')t+=p.heures||0;
  }
  return Math.round(t*10)/10;
}
function combinePts(pts){
  const lines=[];const processed=new Set();
  const sorted=[...pts].sort((a,b)=>new Date(a.datetime)-new Date(b.datetime));
  for(const p of sorted){
    if(processed.has(p.row))continue;
    if(p.type==='confirm'){
      processed.add(p.row);
      const h=Math.round((p.heures||0)*4)/4;
      const ot=Math.max(0,Math.round((h-8)*4)/4);
      lines.push({date:p.date,type:'confirm',job:p.job,jobColor:p.jobColor,heures:h,deplacement:p.deplacement,note:p.note,fichiersURL:p.fichiersURL,coequipiers:p.coequipiers,inRow:p.row,outRow:null,semaine:p.semaine,nom:p.nom,ot});
    }else if(p.type==='in'){
      processed.add(p.row);
      const matchOut=sorted.find(o=>o.type==='out'&&o.nom===p.nom&&!processed.has(o.row)&&new Date(o.datetime)>new Date(p.datetime));
      let h=0,ot=0;
      if(matchOut){
        processed.add(matchOut.row);
        h=Math.round((new Date(matchOut.datetime)-new Date(p.datetime))/3600000*4)/4;
        ot=Math.max(0,Math.round((h-8)*4)/4);
      }
      lines.push({date:p.date,type:'pair',heure:p.heure,heureOut:matchOut?matchOut.heure:'',job:matchOut?matchOut.job:p.job,jobColor:matchOut?matchOut.jobColor:p.jobColor,heures:matchOut?h:null,deplacement:matchOut?matchOut.deplacement:p.deplacement,note:matchOut?matchOut.note:p.note,fichiersURL:matchOut?matchOut.fichiersURL:p.fichiersURL,coequipiers:matchOut?matchOut.coequipiers:p.coequipiers,inRow:p.row,outRow:matchOut?matchOut.row:null,semaine:p.semaine,nom:p.nom,ot});
    }
  }
  return lines.sort((a,b)=>new Date(b.date)-new Date(a.date));
}
function rgba(hex,a){
  try{const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return 'rgba('+r+','+g+','+b+','+(a||0.15)+')';}
  catch{return 'rgba(47,129,247,'+(a||0.15)+')';}
}
function colorDist(c1,c2){
  try{const r1=parseInt(c1.slice(1,3),16),g1=parseInt(c1.slice(3,5),16),b1=parseInt(c1.slice(5,7),16),r2=parseInt(c2.slice(1,3),16),g2=parseInt(c2.slice(3,5),16),b2=parseInt(c2.slice(5,7),16);return Math.sqrt((r1-r2)**2+(g1-g2)**2+(b1-b2)**2);}
  catch{return 999;}
}
function useClock(){

async function getCalendarJobs(calendarIds){
  const now=new Date();
  const start=new Date(now);start.setDate(start.getDate()-3); // punch: 3 jours passés
  const end=new Date(now);end.setDate(end.getDate()+14);
  const all=[];
  for(const calId of (calendarIds||['primary'])){
    try{
      const res=await gapi.client.calendar.events.list({calendarId:calId,timeMin:start.toISOString(),timeMax:end.toISOString(),singleEvents:true,orderBy:'startTime',maxResults:50});
      (res.result.items||[]).forEach(e=>{
        if(!all.find(x=>x.id===e.id))all.push({id:e.id,title:e.summary||'Sans titre',start:e.start.dateTime||e.start.date,location:e.location||'',description:e.description||'',gcalColor:GCAL_COLORS[e.colorId||'']||'#2f81f7'});
      });
    }catch(e){console.error(e);}
  }
  return all.sort((a,b)=>new Date(a.start)-new Date(b.start));
}

function hexToGcalColorId(hex){
  const gcal={'1':'#7986cb','2':'#33b679','3':'#8e24aa','4':'#e67c73','5':'#f6c026','6':'#f5511d','7':'#039be5','8':'#616161','9':'#3f51b5','10':'#0b8043','11':'#d50000'};
  let best='7',bestDist=99999;
  for(const [id,h] of Object.entries(gcal)){
    try{const r1=parseInt(hex.slice(1,3),16),g1=parseInt(hex.slice(3,5),16),b1=parseInt(hex.slice(5,7),16),r2=parseInt(h.slice(1,3),16),g2=parseInt(h.slice(3,5),16),b2=parseInt(h.slice(5,7),16);const d=Math.sqrt((r1-r2)**2+(g1-g2)**2+(b1-b2)**2);if(d<bestDist){bestDist=d;best=id;}}catch{}
  }
  return best;
}
async function createCalendarEvent(calId,title,date,empColor,location){
  try{
    const s=new Date(date+'T07:00:00'),e=new Date(date+'T17:00:00');
    const resource={summary:title,start:{dateTime:s.toISOString()},end:{dateTime:e.toISOString()}};
    if(empColor)resource.colorId=hexToGcalColorId(empColor);
    if(location)resource.location=location;
    return (await gapi.client.calendar.events.insert({calendarId:calId||'primary',resource})).result;
  }catch(e){console.error(e);return null;}
}
async function attachFileToCalendarEvent(calendarId,eventId,fileId,fileName,mimeType){
  if(!calendarId||!eventId||!fileId)return false;
  try{
    const token=gapi.client.getToken();
    if(!token||!token.access_token)return false;
    const calUrl='https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(calendarId)+'/events/'+encodeURIComponent(eventId);
    const evtRes=await fetch(calUrl,{headers:{'Authorization':'Bearer '+token.access_token}});
    const evt=await evtRes.json();
    const existing=evt.attachments||[];
    const newAtt={fileId,title:fileName||fileId,mimeType:mimeType||'application/octet-stream',fileUrl:'https://drive.google.com/file/d/'+fileId+'/view'};
    await fetch(calUrl+'?supportsAttachments=true',{method:'PATCH',headers:{'Authorization':'Bearer '+token.access_token,'Content-Type':'application/json'},body:JSON.stringify({attachments:[...existing,newAtt]})});
    return true;
  }catch(e){console.error(e);return false;}
}
async function findCalendarEventByTitle(calendarIds,title){
  const now=new Date();
  const start=new Date(now);start.setDate(start.getDate()-2);
  const end=new Date(now);end.setDate(end.getDate()+2);
  for(const calId of (calendarIds||['primary'])){
    try{
      const res=await gapi.client.calendar.events.list({calendarId:calId,timeMin:start.toISOString(),timeMax:end.toISOString(),singleEvents:true,q:title,maxResults:5});
      const match=(res.result.items||[]).find(e=>(e.summary||'').toLowerCase()===title.toLowerCase());
      if(match)return{calendarId:calId,eventId:match.id};
    }catch(e){console.error(e);}
  }
  return null;
}

async function ensureStructure(sid){
  try{
    const res=await gapi.client.sheets.spreadsheets.get({spreadsheetId:sid});
    const ex=res.result.sheets.map(s=>s.properties.title);
    const needed=['Employés','Pointages','HeuresEnBanque','Messages','Projets'];
    const reqs=needed.filter(n=>!ex.includes(n)).map(n=>({addSheet:{properties:{title:n}}}));
    if(reqs.length)await gapi.client.sheets.spreadsheets.batchUpdate({spreadsheetId:sid,resource:{requests:reqs}});
    const headers={
      'Employés':[['Nom','PIN','Statut','HeuresBanque','Couleur','Code','Email','Telephone']],
      'Pointages':[['Employé','Type','DateTime','DateStr','HeureStr','Semaine','Mois','Job','CouleurJob','DéplacementMin','HeuresConfirmées','Note','FichiersURL','Coéquipiers']],
      'HeuresEnBanque':[['Employé','Semaine','HeuresSupp','Statut','DateDemande']],
      'Projets':[['Adresse','Titre','PO','Statut','AdresseOverrides']],
      'Messages':[['De','Action','Détails','DateTime','Lu']]
    };
    for(const [sheet,h] of Object.entries(headers)){
      await gapi.client.sheets.spreadsheets.values.update({
        spreadsheetId:sid,range:sheet+'!A1',valueInputOption:'RAW',resource:{values:h}
      });
    }
  }catch(e){console.error(e);}
}

// Lire les projets depuis Sheets → {projData, addrOverrides}
async function getProjetsFromSheets(sid){
  try{
    const res=await gapi.client.sheets.spreadsheets.values.get({spreadsheetId:sid,range:'Projets!A2:E'});
    const rows=res.result.values||[];
    const projData={};
    const addrOverrides={};
    rows.forEach(r=>{
      const adresse=(r[0]||'').trim().toLowerCase();
      if(!adresse)return;
      projData[adresse]={titre:r[1]||'',po:r[2]||'',statut:r[3]||'en-cours'};
      // AdresseOverrides est un JSON stringifié dans la colonne E
      if(r[4]){try{const ov=JSON.parse(r[4]);Object.assign(addrOverrides,ov);}catch{}}
    });
    return{projData,addrOverrides};
  }catch(e){console.error('getProjets:',e);return{projData:{},addrOverrides:{}};}
}

// Sauvegarder tous les projets dans Sheets (réécriture complète)
async function saveProjetsToSheets(sid,projData,addrOverrides){
  try{
    // Regrouper les addrOverrides par adresse de projet
    // On stocke l'objet addrOverrides complet dans la première ligne comme JSON dans col E
    const rows=Object.entries(projData).map(([adresse,d])=>[
      adresse, d.titre||'', d.po||'', d.statut||'en-cours', ''
    ]);
    // Stocker addrOverrides dans la première ligne col E
    if(rows.length>0)rows[0][4]=JSON.stringify(addrOverrides||{});
    else rows.push(['__overrides__','','','',JSON.stringify(addrOverrides||{})]);
    // Effacer et réécrire
    await gapi.client.sheets.spreadsheets.values.clear({spreadsheetId:sid,range:'Projets!A2:E'});
    if(rows.length>0){
      await gapi.client.sheets.spreadsheets.values.update({
        spreadsheetId:sid,range:'Projets!A2',valueInputOption:'RAW',resource:{values:rows}
      });
    }
  }catch(e){console.error('saveProjets:',e);}
}
async function withTokenCheck(fn){
  try{
    return await fn();
  }catch(e){
    // Si erreur 401, token expiré
    if(e?.status===401||e?.result?.error?.code===401){
      console.warn('API 401 — token expiré');
      if(tokenClient)tokenClient.requestAccessToken({prompt:''});
      // Réessayer après 2 secondes
      await new Promise(r=>setTimeout(r,2000));
      return await fn();
    }
    throw e;
  }
}

async function getPointages(sid,filter){
  const res=await withTokenCheck(()=>gapi.client.sheets.spreadsheets.values.get({spreadsheetId:sid,range:'Pointages!A2:N'}));
  let rows=(res.result.values||[]).map((r,i)=>({
    nom:r[0],type:r[1],datetime:r[2],date:r[3],heure:r[4],semaine:r[5],mois:r[6],
    job:r[7]||'',jobColor:r[8]||'',deplacement:parseFloat(r[9])||0,
    heures:parseFloat(r[10])||0,note:r[11]||'',
    fichiersURL:(r[12]||'').split(' | ').filter(Boolean),
    coequipiers:(r[13]||'').split(', ').filter(Boolean),
    row:i+2
  }));
  if(filter&&filter.nom){
    const nom=filter.nom;
    rows=rows.filter(r=>
      r.nom===nom ||
      // Include punch IN rows where this employee is a coequipier
      (r.type==='in'&&r.coequipiers&&r.coequipiers.includes(nom))
    );
  }
  if(filter&&filter.semaine)rows=rows.filter(r=>r.semaine===filter.semaine);
  if(filter&&filter.mois)rows=rows.filter(r=>r.mois===filter.mois);
  if(filter&&filter.date)rows=rows.filter(r=>r.date===filter.date);
  return rows;
}

async function updatePointageFichiers(sid,row,urls){
  await gapi.client.sheets.spreadsheets.values.update({
    spreadsheetId:sid,range:'Pointages!M'+row,valueInputOption:'RAW',
    resource:{values:[[(urls||[]).join(' | ')]]}
  });
}
async function deletePointageRow(sid,row){
  const r=await gapi.client.sheets.spreadsheets.get({spreadsheetId:sid});
  const sh=r.result.sheets.find(s=>s.properties.title==='Pointages');
  await gapi.client.sheets.spreadsheets.batchUpdate({spreadsheetId:sid,resource:{requests:[{deleteDimension:{range:{sheetId:sh?sh.properties.sheetId:0,dimension:'ROWS',startIndex:row-1,endIndex:row}}}]}});
}
async function getHeuresBanque(sid){
  try{
    const res=await gapi.client.sheets.spreadsheets.values.get({spreadsheetId:sid,range:'HeuresEnBanque!A2:E'});
    return (res.result.values||[]).map((r,i)=>({nom:r[0],semaine:r[1],heures:parseFloat(r[2])||0,statut:r[3]||'pending',date:r[4],row:i+2}));
  }catch{return[];}
}
async function addHeuresBanque(sid,nom,semaine,heures){
  await gapi.client.sheets.spreadsheets.values.append({spreadsheetId:sid,range:'HeuresEnBanque!A1',valueInputOption:'RAW',insertDataOption:'INSERT_ROWS',resource:{values:[[nom,semaine,heures,'pending',localDateStr()]]}});
}
async function updateBanqueStatus(sid,row,statut){
  await gapi.client.sheets.spreadsheets.values.update({spreadsheetId:sid,range:'HeuresEnBanque!D'+row,valueInputOption:'RAW',resource:{values:[[statut]]}});
}
async function addMessage(sid,de,action,details){
  await gapi.client.sheets.spreadsheets.values.append({spreadsheetId:sid,range:'Messages!A1',valueInputOption:'RAW',insertDataOption:'INSERT_ROWS',resource:{values:[[de,action,details,new Date().toISOString(),'non']]}});
}
async function getMessages(sid){
  try{
    const res=await gapi.client.sheets.spreadsheets.values.get({spreadsheetId:sid,range:'Messages!A2:E'});
    return (res.result.values||[]).map((r,i)=>({de:r[0],action:r[1],details:r[2],datetime:r[3],lu:r[4]==='oui',row:i+2})).reverse();

async function markMessageRead(sid,row){
  await gapi.client.sheets.spreadsheets.values.update({spreadsheetId:sid,range:'Messages!E'+row,valueInputOption:'RAW',resource:{values:[['oui']]}});
}

// ── DRIVE ────────────────────────────────────────────────────────────────────
// Upload vers un dossier Drive spécifique, retourne {id, webViewLink, name}
async function uploadToDrive(file, empName, jobName, folderId){
  try{
    const token=gapi.client.getToken();
    if(!token||!token.access_token){console.error('No access token');return{url:'',id:''};}
    // Utiliser le nom du fichier tel quel — déjà renommé par DriveUploader
    const fname=file.name;

    async function tryUpload(parentId){
      const m={name:fname,mimeType:file.type||'application/octet-stream'};
      if(parentId)m.parents=[parentId];
      const form=new FormData();
      form.append('metadata',new Blob([JSON.stringify(m)],{type:'application/json'}));
      form.append('file',file);
      // supportsAllDrives=true requis pour les Shared Drives
      const url='https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink,name&supportsAllDrives=true';
      const res=await fetch(url,{method:'POST',headers:{'Authorization':'Bearer '+token.access_token},body:form});
      const data=await res.json();
      console.log('Drive upload ('+(parentId||'root')+'):',res.status,data.id||data.error?.message);
      return{ok:res.ok&&!!data.id,data,status:res.status};
    }

    let result=await tryUpload(folderId);

    // Si dossier échoue, fallback sur Mon Drive
    if(!result.ok){
      console.warn('Shared Drive failed, trying My Drive...');
      result=await tryUpload(null);
    }

    if(!result.ok||!result.data.id){
      return{url:'',id:'',error:'Upload échoué ('+result.status+')'};
    }

    const data=result.data;
    // Rendre le fichier lisible publiquement (supportsAllDrives requis aussi)
    try{
      await fetch('https://www.googleapis.com/drive/v3/files/'+data.id+'/permissions?supportsAllDrives=true',
        {method:'POST',headers:{'Authorization':'Bearer '+token.access_token,'Content-Type':'application/json'},
        body:JSON.stringify({role:'reader',type:'anyone'})});
    }catch(e){console.warn('Permission set failed:',e);}

    return{url:data.webViewLink||('https://drive.google.com/file/d/'+data.id+'/view'),id:data.id,name:fname};
  }catch(e){console.error('uploadToDrive:',e);return{url:'',id:''};}}

function Notif({msg,type,onClose}){
  useEffect(()=>{const t=setTimeout(onClose,4500);return()=>clearTimeout(t);},[]);
  return <div className={'notif '+type} onClick={onClose}>{msg}</div>;
}

function DriveUploader({empName,jobName,jobLocation,calendarIds,calEventTitle,folders,onUploaded,notify}){
  // mode = 'AP' | 'OT' | {folder} | null
  const [mode,setMode]=useState(null);
  const [titleInput,setTitleInput]=useState('');
  const [adresseInput,setAdresseInput]=useState(jobLocation||'');
  const [pieceInput,setPieceInput]=useState('');
  const [uploading,setUploading]=useState(false);
  // pendingFile: photo/fichier pris avant de remplir les infos
  const [pendingFile,setPendingFile]=useState(null);
  const fileRef=useRef();const camRef=useRef();
  const PAD_ID='1CI-OuXIuiSKUksL7BUyGAN__tRPxbklB';

  // Met à jour adresseInput si jobLocation change (ex: après création d'un job)
  useEffect(()=>{
    if(jobLocation)setAdresseInput(jobLocation);
  },[jobLocation]);

  const visibleFolders=(folders||[]).filter(f=>!['PAD SERVICE À TRAITER','REF FACTURE','REF OT'].includes(f.name));
  const isDocMode=mode==='AP'||mode==='OT';
  const selFolder=(mode&&typeof mode==='object')?mode:null;
  const isPlanEncastre=selFolder&&selFolder.name==='PLAN ENCASTRÉS';
  const isCompteurHQ=selFolder&&selFolder.name==='COMPTEUR HQ';
  const needsAddress=isPlanEncastre||isCompteurHQ;

  function selectMode(val){
    setMode(prev=>prev===val?null:val);
    setTitleInput('');
    if(typeof val==='object'&&(val.name==='COMPTEUR HQ'||val.name==='PLAN ENCASTRÉS')){
      // Auto-fill address from job location
      setAdresseInput(jobLocation||'');
    }
  }

  function buildFileName(f){
    const ext=f.name.includes('.')?'.'+f.name.split('.').pop():'';
    const clean=s=>s.replace(/[^a-zA-Z0-9\u00C0-\u024F\-_ ]/g,'').trim();
    const evtTitle=calEventTitle?'_'+clean(calEventTitle):'';
    if(isDocMode){
      const num=titleInput.trim()||'sans-numero';
      return mode+'_'+clean(num)+evtTitle+ext;
    }
    if(needsAddress){
      const addr=clean(adresseInput.trim()||jobLocation||'sans-adresse');
      const piece=isPlanEncastre&&pieceInput.trim()?'_'+clean(pieceInput.trim()):'';
      const suffix=isPlanEncastre?'_PLANENC':'_COMPTEURHQ';
      return addr+piece+suffix+ext;
    }
    const t=titleInput.trim()||f.name.replace(/\.[^.]+$/,'');
    return clean(t)+evtTitle+ext;
  }

  async function doUpload(f){
    const folderId=isDocMode?PAD_ID:(selFolder?selFolder.id:null);
    if(!isDocMode&&!selFolder){notify("Choisis un type ou un dossier!",'warn');return;}
    const finalName=buildFileName(f);
    setUploading(true);notify('⏳ Upload...','warn');
    const renamed=new File([f],finalName,{type:f.type});
    const result=await uploadToDrive(renamed,empName,finalName.replace(/\.[^.]+$/,''),folderId);
    setUploading(false);
    if(!result.url||!result.id){notify('Erreur: '+(result.error||'Vérifiez permissions Drive'),'err');return;}
    let calAttached=false;
    if(calEventTitle&&calendarIds&&result.id){
      const evtRef=await findCalendarEventByTitle(calendarIds,calEventTitle);
      if(evtRef)calAttached=await attachFileToCalendarEvent(evtRef.calendarId,evtRef.eventId,result.id,finalName,f.type);
    }
    onUploaded(result.url+'|'+finalName);
    const dossierLabel=isDocMode?'PAD SERVICE':(selFolder?selFolder.name:'Drive');
    notify('📎 ['+dossierLabel+'] '+finalName+(calAttached?' · 📅':''),'success');
    setPendingFile(null);
    setTitleInput('');
  }

  // Quand un fichier est choisi — le stocker et demander les infos
  function handleFilePicked(f){
    if(!f)return;
    if(!isDocMode&&!selFolder){notify("Choisis un type ou un dossier d'abord!",'warn');return;}
    // Si c'est un dossier normal sans infos requises → upload direct
    if(selFolder&&!needsAddress){
      setPendingFile(f);
      return;
    }
    // Sinon stocker et montrer le formulaire de confirmation
    setPendingFile(f);
  }

  const ready=isDocMode||(selFolder&&(!needsAddress||(adresseInput.trim()||jobLocation)));
  const showConfirmForm=pendingFile&&(
    isDocMode||
    (selFolder&&!needsAddress)||
    (needsAddress&&(adresseInput.trim()||jobLocation))
  );

  return(
    <div>
      {/* AP / OT */}
      <div style={{marginBottom:'0.5rem'}}>
        <div className="csec" style={{marginBottom:'0.35rem'}}>Type de document</div>
        <div style={{display:'flex',gap:'0.4rem',flexWrap:'wrap'}}>
          {['AP','OT'].map(t=>(
            <div key={t} onClick={()=>selectMode(t)} style={{padding:'0.3rem 0.75rem',borderRadius:8,fontSize:11,cursor:'pointer',touchAction:'manipulation',
              fontWeight:mode===t?700:400,
              background:mode===t?(t==='AP'?'rgba(63,185,80,0.15)':'rgba(210,153,34,0.15)'):'var(--bg3)',
              border:'1px solid '+(mode===t?(t==='AP'?'var(--success)':'var(--warning)'):'var(--border)'),
              color:mode===t?(t==='AP'?'var(--success)':'var(--warning)'):'var(--muted)'}}>
              {t==='AP'?'📋 Appel de service':'🔧 Ordre de travail'}
            </div>
          ))}
        </div>
        {isDocMode&&<div style={{fontSize:10,color:'var(--muted)',marginTop:3}}>→ PAD SERVICE À TRAITER</div>}
      </div>

      {/* Dossiers Drive */}
      {visibleFolders.length>0&&(
        <div style={{marginBottom:'0.5rem'}}>
          <div className="csec" style={{marginBottom:'0.35rem'}}>Dossier Drive</div>
          <div style={{display:'flex',gap:'0.35rem',flexWrap:'wrap'}}>
            {visibleFolders.map(f=>(
              <div key={f.id} onClick={()=>selectMode(f)} style={{padding:'0.25rem 0.6rem',borderRadius:8,fontSize:11,cursor:'pointer',touchAction:'manipulation',
                fontWeight:selFolder?.id===f.id?700:400,
                background:selFolder?.id===f.id?'rgba(47,129,247,0.15)':'var(--bg3)',
                border:'1px solid '+(selFolder?.id===f.id?'var(--accent)':'var(--border)'),
                color:selFolder?.id===f.id?'var(--accent)':'var(--muted)'}}>
                {f.name}
              </div>
            ))}
          </div>
          {needsAddress&&(
            <div style={{display:'flex',flexDirection:'column',gap:'0.3rem',marginTop:'0.35rem'}}>
              <AddressInput value={adresseInput} onChange={setAdresseInput}
                placeholder={isCompteurHQ?'Adresse du compteur...':'Adresse / Lieu...'}
                style={{marginBottom:'0.3rem'}}/>
              {isPlanEncastre&&(
                <input value={pieceInput} onChange={e=>setPieceInput(e.target.value)}
                  placeholder="Pièce (optionnel, ex: Sous-sol)"
                  style={{width:'100%',fontSize:11}}/>
              )}
            </div>
          )}
        </div>
      )}

      {/* Formulaire de confirmation APRÈS avoir pris le fichier/photo */}
      {pendingFile?(
        <div style={{background:'var(--bg3)',borderRadius:10,padding:'0.65rem',border:'1px solid var(--accent)',marginBottom:'0.35rem'}}>
          <div style={{fontSize:11,color:'var(--muted)',marginBottom:'0.4rem'}}>
            📷 <strong style={{color:'var(--text)'}}>{pendingFile.name}</strong> prêt
          </div>
          {/* Champ numéro/titre si AP, OT ou dossier normal */}
          {(isDocMode||selFolder)&&!needsAddress&&(
            <div style={{marginBottom:'0.4rem'}}>
              {isDocMode?(
                <div style={{display:'flex',alignItems:'center',gap:6}}>
                  <span style={{fontSize:12,fontWeight:800,color:mode==='AP'?'var(--success)':'var(--warning)',flexShrink:0}}>{mode}_</span>
                  <input value={titleInput} onChange={e=>setTitleInput(e.target.value)}
                    placeholder="Numéro du document..."
                    autoFocus
                    style={{flex:1,fontSize:11}}/>
                </div>
              ):(
                <input value={titleInput} onChange={e=>setTitleInput(e.target.value)}
                  placeholder="Titre du fichier (optionnel)"
                  autoFocus
                  style={{width:'100%',fontSize:11}}/>
              )}
            </div>
          )}
          {/* Aperçu du nom final */}
          <div style={{fontSize:10,color:'var(--muted)',marginBottom:'0.5rem'}}>
            Nom final: <strong style={{color:'var(--text)'}}>{buildFileName(pendingFile)}</strong>
          </div>
          <div style={{display:'flex',gap:'0.4rem'}}>
            <button className="btn-p" style={{flex:1,marginTop:0,fontSize:12}} disabled={uploading}
              onClick={()=>doUpload(pendingFile)}>
              {uploading?'⏳ Upload...':'✓ Confirmer et envoyer'}
            </button>
            <button className="btn-s" style={{fontSize:11}} onClick={()=>setPendingFile(null)}>✕</button>
          </div>
        </div>
      ):(
        /* Boutons pour choisir fichier/photo */
        <div>
          {!mode&&<div style={{fontSize:10,color:'var(--warning)',marginBottom:'0.35rem'}}>⬆️ Sélectionne un type ou un dossier d'abord</div>}
          <div className="file-add-row">
            <div className="file-zone" style={!mode?{opacity:0.4,cursor:'not-allowed'}:{}}
              onClick={()=>{if(mode)fileRef.current?.click();}}>
              <div>{uploading?'⏳':'📎'}</div>
              <div style={{fontSize:10,color:'var(--muted)'}}>{isDocMode?mode:'Fichier'}</div>
              <input ref={fileRef} type="file" accept="image/*,application/pdf,.doc,.docx" style={{display:'none'}}
                onChange={e=>{if(e.target.files[0])handleFilePicked(e.target.files[0]);e.target.value='';}}/>
            </div>
            <div className="file-zone" style={!mode?{opacity:0.4,cursor:'not-allowed'}:{}}
              onClick={()=>{if(mode)camRef.current?.click();}}>
              <div>{uploading?'⏳':'📷'}</div>
              <div style={{fontSize:10,color:'var(--muted)'}}>Photo</div>
              <input ref={camRef} type="file" accept="image/*" capture="environment" style={{display:'none'}}
                onChange={e=>{if(e.target.files[0])handleFilePicked(e.target.files[0]);e.target.value='';}}/>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}





function PinPad({empName,empCouleur,empCode,label,onSubmit,onCancel}){
  const [pin,setPin]=useState('');
  const keys=['1','2','3','4','5','6','7','8','9','←','0','✓'];
  const handle=k=>{
    if(k==='←')setPin(p=>p.slice(0,-1));
    else if(k==='✓'){if(pin.length===4){onSubmit(pin);setPin('');}}
    else if(pin.length<4){const next=pin+k;setPin(next);if(next.length===4){onSubmit(next);setPin('');}}
  };
  return(
    <div className="pin-wrap">
      <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:10,marginBottom:'0.75rem'}}>
        <div className="emp-av" style={{background:empCouleur,width:34,height:34,fontSize:11}}>{empCode}</div>
        <div><div style={{fontFamily:'var(--font-head)',fontWeight:700,fontSize:'0.9rem'}}>{empName}</div>{label&&<div style={{fontSize:11,color:'var(--muted)'}}>{label}</div>}</div>
      </div>
      <div className="pin-display">{pin?'●'.repeat(pin.length):<span style={{color:'var(--muted)',fontSize:'0.75rem'}}>Entrez votre PIN (4 chiffres)</span>}</div>
      <div style={{display:'flex',justifyContent:'center',gap:8,marginBottom:'0.5rem'}}>
        {[0,1,2,3].map(i=>(<div key={i} style={{width:12,height:12,borderRadius:'50%',background:i<pin.length?'var(--accent)':'var(--border2)',transition:'background 0.15s'}}></div>))}
      </div>
      <div className="pin-grid">
        {keys.map((k,i)=>(
          <div key={i} className={'pin-key'+(k==='←'?' del':'')+(k==='0'?' zero':'')}
            style={k==='✓'?{background:'linear-gradient(135deg,var(--accent),var(--accent2))',color:'#fff',border:'none',opacity:pin.length===4?1:0.4}:{}}
            onClick={()=>handle(k)}>{k}</div>
        ))}
      </div>
      {onCancel&&<button style={{background:'none',border:'none',color:'var(--muted)',fontSize:11,cursor:'pointer',marginTop:'0.55rem',textAlign:'center',width:'100%',textDecoration:'underline'}} onClick={onCancel}>← Retour</button>}
    </div>
  );
}

function PunchOutScreen({emp,allEmps,pts:ptsProp,sid,onConfirm,onBack,notify,folders,calendarIds,calJobs}){
  const [selJobData,setSelJobData]=useState(null);
  const [timeOut,setTimeOut]=useState(nowTimeStr());
  const [diner,setDiner]=useState(false);
  const [deplacement,setDeplacement]=useState(0);
  const [note,setNote]=useState('');
  const [fichiersURL,setFichiersURL]=useState([]);
  const [coeqHeures,setCoeqHeures]=useState({});
  const [showCalJobs,setShowCalJobs]=useState(false);
  const pts=ptsProp||[];
  const travelOpts=[0,15,30,45,60,90];

  const allIns=pts.filter(p=>p.type==='in');
  const allOuts=pts.filter(p=>p.type==='out');
  const now=new Date();
  const openJobs=allIns.filter(pin=>{
    const inDt=new Date(pin.datetime);
    // Only consider punch INs from the last 24 hours
    if(now-inDt>86400000)return false;
    const empNom=emp.nom;
    const hasOut=allOuts.some(po=>{
      if(po.nom!==empNom)return false;
      if((po.job||'')!==(pin.job||''))return false;
      const outDt=new Date(po.datetime);
      return outDt>inDt;
    });
    return !hasOut;
  });
  const jobOptions=[...new Map(openJobs.map(p=>[(p.job||'__')+p.heure,{job:p.job||'',jobColor:p.jobColor||'#2f81f7',heure:p.heure,datetime:p.datetime,date:p.date,coequipiers:p.coequipiers||[],nom:p.nom}])).values()].sort((a,b)=>new Date(b.datetime)-new Date(a.datetime));

  function calcH(){
    if(!selJobData||!selJobData.datetime)return 0;
    const inTime=new Date(selJobData.datetime);
    const parts=timeOut.split(':');const hh=parseInt(parts[0])||0;const mm=parseInt(parts[1])||0;
    const outTime=new Date();outTime.setHours(hh,mm,0,0);
    let h=Math.max(0,(outTime-inTime)/3600000);
    if(diner)h=Math.max(0,h-0.5);
    return Math.round(h*4)/4;
  }
  const totalH=calcH();const otH=Math.max(0,Math.round((totalH-8)*100)/100);
  // Build full coequipier list: excludes current employee, includes original puncher if different
  const baseCoeqs=(selJobData&&selJobData.coequipiers||[]).filter(n=>n!==emp.nom);
  const origPuncher=(selJobData&&selJobData.nom&&selJobData.nom!==emp.nom)?selJobData.nom:null;
  const coeqs=origPuncher&&!baseCoeqs.includes(origPuncher)?[...baseCoeqs,origPuncher]:baseCoeqs;
  const coeqEmps=(allEmps||[]).filter(e=>coeqs.includes(e.nom));

  function confirm(){onConfirm({customTime:timeOut,job:selJobData?selJobData.job:'',jobColor:selJobData?selJobData.jobColor:'',heures:totalH,deplacement,note,fichiersURL:fichiersURL.map(r=>r.split('|')[0]),coequipiers:coeqs,coeqHeures:Object.fromEntries(coeqEmps.map(e=>[e.nom,coeqHeures[e.nom]!==undefined?coeqHeures[e.nom]:totalH]))});}

// Convertit minutes en affichage quarts (ex: 465 → "7h45")
function minsToQuart(mins){const h=Math.floor(mins/60);const m=mins%60;return h+'h'+(m>0?String(m).padStart(2,'0'):'');}
// Snap aux quarts d'heure
function snapToQuart(mins){return Math.round(mins/15)*15;}
// Formater heures en quarts (ex: 7.75 → "7h45", 8.5 → "8h30")
function hToQuart(h){const totalMins=Math.round(h*60/15)*15;return minsToQuart(totalMins);}

// Picker heure — roulette heures + ±15min pour minutes
function TimePicker({label,value,onChange,color}){
  function timeToMins(t){const[h,m]=(t||'00:00').split(':').map(Number);return h*60+m;}
  function minsToTime(mins){return String(Math.floor(mins/60)).padStart(2,'0')+':'+String(mins%60).padStart(2,'0');}
  const totalMins=timeToMins(value);
  const h=Math.floor(totalMins/60);
  const m=totalMins%60;
  const col=color||'var(--accent)';
  function setH(newH){onChange(minsToTime(((newH%24)+24)%24*60+m));}
  function addMins(delta){onChange(minsToTime(h*60+((m+delta+60)%60)));}
  function handleWheelH(e){e.preventDefault();setH(h+(e.deltaY>0?-1:1));}
  return(
    <div style={{textAlign:'center',marginBottom:'0.5rem'}}>
      <div style={{fontSize:10,color:'var(--muted)',marginBottom:6,textTransform:'uppercase',letterSpacing:'0.04em'}}>{label}</div>
      <div style={{background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:12,padding:'0.35rem 0.65rem',display:'inline-flex',alignItems:'center',gap:'0.45rem'}}>
        <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:3}}>
          <button className="dur-btn" style={{width:34,height:28,fontSize:15,touchAction:'manipulation'}} onClick={()=>setH(h+1)}>+</button>
          <div onWheel={handleWheelH} style={{fontFamily:'var(--font-head)',fontWeight:800,fontSize:'1.9rem',color:col,lineHeight:1,minWidth:44,textAlign:'center',cursor:'ns-resize',userSelect:'none'}} title="Scroll pour changer">{String(h).padStart(2,'0')}</div>
          <button className="dur-btn" style={{width:34,height:28,fontSize:15,touchAction:'manipulation'}} onClick={()=>setH(h-1)}>−</button>
        </div>
        <div style={{fontFamily:'var(--font-head)',fontWeight:800,fontSize:'1.6rem',color:'var(--muted)',alignSelf:'center'}}>h</div>
        <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:3}}>
          <button className="dur-btn" style={{width:34,height:28,fontSize:15,touchAction:'manipulation'}} onClick={()=>addMins(15)}>+</button>
          <div style={{fontFamily:'var(--font-head)',fontWeight:800,fontSize:'1.9rem',color:col,lineHeight:1,minWidth:44,textAlign:'center'}}>{String(m).padStart(2,'0')}</div>
          <button className="dur-btn" style={{width:34,height:28,fontSize:15,touchAction:'manipulation'}} onClick={()=>addMins(-15)}>−</button>
        </div>
      </div>
    </div>
  );
}

const CODES_CONTRACTEURS=['PAY','CRS','ASC','GGP','SAR'];

function getCodeContracteur(titre){
  if(!titre)return 'PARTICULIER';
  const prefix=(titre.trim().slice(0,3)).toUpperCase();
  return CODES_CONTRACTEURS.includes(prefix)?prefix:'PARTICULIER';
}

// Group calendar jobs + pointages into projects by code + address
function buildProjets(calJobs,pts){
  const map={};
  // From calendar jobs
  for(const job of calJobs){
    const code=getCodeContracteur(job.title);
    const adresse=(job.location||'').trim();
    const key=code+'||'+(adresse||job.title);
    if(!map[key]){
      map[key]={
        key,code,adresse,
        nom:code==='PARTICULIER'?(adresse||job.title):(code+' — '+(adresse||job.title)),
        jobs:[],po:'',dateDebut:job.start?job.start.slice(0,10):'',
        couleur:job.gcalColor||'#2f81f7'
      };
    }
    if(!map[key].jobs.includes(job.title))map[key].jobs.push(job.title);
    if(job.start&&job.start<(map[key].dateDebut||'9999'))map[key].dateDebut=job.start.slice(0,10);
  }
  // Also from pointages (jobs punched that may not be in calendar)
  for(const p of pts){
    if(!p.job)continue;
    const code=getCodeContracteur(p.job);
    // Try to match existing project by job name
    let matched=false;
    for(const k of Object.keys(map)){
      if(map[k].jobs.includes(p.job)){matched=true;break;}
    }
    if(!matched){
      const key=code+'||'+p.job;
      if(!map[key]){map[key]={key,code,adresse:p.job,nom:code==='PARTICULIER'?p.job:(code+' — '+p.job),jobs:[p.job],po:'',dateDebut:p.date||'',couleur:p.jobColor||'#2f81f7'};}
    }
  }
  return Object.values(map).sort((a,b)=>a.nom.localeCompare(b.nom));
}

async function savePO(sid,projKey,po,existingPOs){
  // Store PO numbers in a simple key-value in Projets sheet
  // Find if row exists
  try{
    const res=await gapi.client.sheets.spreadsheets.values.get({spreadsheetId:sid,range:'Projets!A2:B'});
    const rows=res.result.values||[];
    const idx=rows.findIndex(r=>r[0]===projKey);
    if(idx>=0){
      await gapi.client.sheets.spreadsheets.values.update({spreadsheetId:sid,range:'Projets!B'+(idx+2),valueInputOption:'RAW',resource:{values:[[po]]}});
    }else{
      await gapi.client.sheets.spreadsheets.values.append({spreadsheetId:sid,range:'Projets!A1',valueInputOption:'RAW',insertDataOption:'INSERT_ROWS',resource:{values:[[projKey,po]]}});
    }
  }catch(e){console.error(e);}
}

async function getPOs(sid){
  try{
    const res=await gapi.client.sheets.spreadsheets.values.get({spreadsheetId:sid,range:'Projets!A2:B'});
    const map={};
    for(const r of (res.result.values||[]))if(r[0])map[r[0]]=r[1]||'';
    return map;
  }catch{return{};}
}

function ProjDetail({p,projPts,calJobs,statuts,calendarIds,notify,projData,saveProjData,addrOverrides,saveAddrOverrides,onBack,allProjets}){

  const [editPO,setEditPO]=useState('');
  const [editTitre,setEditTitre]=useState('');
  const [editStatut,setEditStatut]=useState('en-cours');
  const [editEvtAddr,setEditEvtAddr]=useState(null);
  const [editEvtAddrVal,setEditEvtAddrVal]=useState('');
  const [showMerge,setShowMerge]=useState(false);
  const [mergeTarget,setMergeTarget]=useState('');
  const [customMergeAddr,setCustomMergeAddr]=useState('');

  const today=new Date();
  // Sous-préfixes pour trier les événements à l'intérieur d'un projet
  const SUB_PREFIXES=['ROUGH','FINITION','SERV'];
  function getSubPrefixOrder(title){
    const t=(title||'').toUpperCase();
    const idx=SUB_PREFIXES.findIndex(sp=>t.includes(sp));
    return idx>=0?idx:SUB_PREFIXES.length;
  }
  function sortJobs(arr){
    return [...arr].sort((a,b)=>{
      const oa=getSubPrefixOrder(a.title),ob=getSubPrefixOrder(b.title);
      if(oa!==ob)return oa-ob;
      return new Date(a.start)-new Date(b.start);
    });
  }
  const sortedJobs=sortJobs((p.jobs||[]));
  const passedJobs=sortedJobs.filter(j=>new Date(j.start)<today&&new Date(j.start).toDateString()!==today.toDateString());
  const todayJobs=sortedJobs.filter(j=>new Date(j.start).toDateString()===today.toDateString());
  const futureJobs=sortedJobs.filter(j=>new Date(j.start)>today&&new Date(j.start).toDateString()!==today.toDateString());

    const u={...projData,[editKey]:{...(projData[editKey]||{}),po:editPO,titre:editTitre,statut:editStatut}};

  }

    if(!editEvtAddrVal.trim()){notify('Entrez une adresse','warn');return;}
    const newAddr=editEvtAddrVal.trim();
    // 1. Sauvegarder localement en priorité — mise à jour immédiate de l'UI
    const current=addrOverrides||{};
    const updated={...current,[j.id]:newAddr};
    saveAddrOverrides(updated);
    // 2. Essayer de mettre à jour dans Google Calendar
    let calUpdated=false;
    const errors=[];
    for(const calId of (calendarIds||['primary'])){
      try{
        await gapi.client.calendar.events.patch({
          calendarId:calId,
          eventId:j.id,
          resource:{location:newAddr}
        });
        calUpdated=true;
        break;
      }catch(e){
        errors.push(calId+': '+(e.result?.error?.message||e.message||'erreur'));
      }
    }
    if(calUpdated){
      notify('✅ Adresse mise à jour dans l\'agenda!','success');
    }else{
      console.warn('Calendar patch failed:',errors);
      notify('✅ Adresse sauvegardée localement. (Agenda: '+errors[0]+')','success');

          calCount++;break;
        }catch(e){continue;}
      }
    }
    saveAddrOverrides(updatedOverrides);
    notify('✅ '+p.jobs.length+' événements fusionnés'+(calCount>0?' ('+calCount+' dans l\'agenda)':'')+'!','success');

            <option value="">— Choisir un projet —</option>
            {(allProjets||[]).filter(pr=>pr.key!==p.key).map(pr=>(
              <option key={pr.key} value={pr.adresse}>{pr.titre} ({pr.adresse.slice(0,30)})</option>

      {todayJobs.length>0&&(<div style={{marginBottom:'0.6rem'}}><div style={{fontSize:10,fontWeight:700,color:'var(--success)',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:'0.35rem'}}>Aujourd'hui</div>{todayJobs.map((j,i)=><EventCard key={i} j={j} isPast={false} projPts={projPts} editEvtAddr={editEvtAddr} setEditEvtAddr={setEditEvtAddr} editEvtAddrVal={editEvtAddrVal} setEditEvtAddrVal={setEditEvtAddrVal} saveEvtAddress={saveEvtAddress} pAdresse={p.adresse}/>)}</div>)}

function ProjectsView({sid,pts,emps,calJobs,isAdmin,notify,calendarIds}){
  const PREFIXES=['PAY','CRS','ASC','GGP','SAR'];
  const STORAGE_KEY='punchpro_projets_v3'; // gardé pour migration
  const [projData,setProjData]=useState({});
  const [addrOverrides,setAddrOverrides]=useState({});
  const [loadingProj,setLoadingProj]=useState(true);
  const [selProj,setSelProj]=useState(null);
  const [editKey,setEditKey]=useState(null);
  const [editPO,setEditPO]=useState('');
  const [editTitre,setEditTitre]=useState('');
  const [editStatut,setEditStatut]=useState('en-cours');
  const [showClosed,setShowClosed]=useState(false);
  const [filterPrefix,setFilterPrefix]=useState(null);
  const [search,setSearch]=useState('');

  // Charger depuis Sheets, avec migration automatique depuis localStorage
  useEffect(()=>{
    if(!sid)return;
    setLoadingProj(true);
    getProjetsFromSheets(sid).then(({projData:pd,addrOverrides:ao})=>{
      if(Object.keys(pd).length===0){
        try{
          const local=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
          const localAddr=JSON.parse(localStorage.getItem('punchpro_addr_overrides')||'{}');
          if(Object.keys(local).length>0){
            setProjData(local);setAddrOverrides(localAddr);
            saveProjetsToSheets(sid,local,localAddr);
            console.log('Migration localStorage→Sheets effectuée');
          }
        }catch{}
      }else{setProjData(pd);setAddrOverrides(ao);}
      setLoadingProj(false);
    });
  },[sid]);

  function saveProjData(d){
    setProjData(d);
    saveProjetsToSheets(sid,d,addrOverrides);
    localStorage.setItem(STORAGE_KEY,JSON.stringify(d));
  }
  function saveAddrOverrides(d){
    setAddrOverrides(d);
    saveProjetsToSheets(sid,projData,d);
    localStorage.setItem('punchpro_addr_overrides',JSON.stringify(d));
  }
  function getPrefix(t){const u=(t||'').toUpperCase();for(const p of PREFIXES)if(u.startsWith(p))return p;return 'PARTICULIER';}

  const memoResult=useMemo(()=>{
    const map={};
    (calJobs||[]).forEach(j=>{
      // Use override address if available, else use event location
      const addr=(addrOverrides[j.id]||j.location||'').trim();
      if(!addr)return;
      const key=addr.toLowerCase();
      if(!map[key])map[key]={key,adresse:addr,premierTitre:j.title,jobs:[],heures:0,personnes:new Set()};
      map[key].jobs.push(j);
    });
    (pts||[]).forEach(p=>{
      if(!p.job)return;
      const cj=(calJobs||[]).find(j=>j.title===p.job);
      if(!cj||!cj.location)return;
      const key=(cj.location||'').trim().toLowerCase();
      if(!map[key])return;
      if(p.type==='out'||p.type==='confirm'){map[key].heures+=parseFloat(p.heures)||0;if(p.nom)map[key].personnes.add(p.nom);}
    });
    // Événements SANS adresse — regroupés par préfixe
    const noAddrMap={};
    (calJobs||[]).forEach(j=>{
      if((j.location||'').trim())return; // a une adresse, skip
      const prefix=getPrefix(j.title);
      if(!noAddrMap[prefix])noAddrMap[prefix]=[];
      noAddrMap[prefix].push(j);
    });

    return{
      projets: Object.values(map).map(p=>{
        const saved=projData[p.key]||{};
        const titre=saved.titre||p.premierTitre||p.adresse;
        return{...p,personnes:[...p.personnes],po:saved.po||'',titre,statut:saved.statut||'en-cours',prefix:getPrefix(titre)};
      }).sort((a,b)=>{const o={'en-cours':0,'a-venir':1,ferme:2};return(o[a.statut]||0)-(o[b.statut]||0)||(a.titre.localeCompare(b.titre));}),

    };

  }


  // ── LISTE DES PROJETS ──
  const fermesFiltered=filterPrefix?fermes.filter(p=>p.prefix===filterPrefix):fermes;

      {showClosed&&(

        return(<>
          {enCours.length>0&&<div style={{marginBottom:'0.25rem'}}><div style={{fontSize:10,fontWeight:700,color:'var(--success)',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:'0.4rem'}}>🟢 En cours ({enCours.length})</div>{enCours.map(p=><ProjCard key={p.key} p={p} {...cardProps}/>)}</div>}
          {aVenir.length>0&&<div style={{marginBottom:'0.25rem'}}>{enCours.length>0&&<div style={{borderTop:'1px solid var(--border)',margin:'0.5rem 0'}}/>}<div style={{fontSize:10,fontWeight:700,color:'var(--accent)',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:'0.4rem'}}>🔵 À venir ({aVenir.length})</div>{aVenir.map(p=><ProjCard key={p.key} p={p} {...cardProps}/>)}</div>}
          {autres.length>0&&<div>{(enCours.length>0||aVenir.length>0)&&<div style={{borderTop:'1px solid var(--border)',margin:'0.5rem 0'}}/>}<div style={{fontSize:10,fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:'0.4rem'}}>Autres</div>{autres.map(p=><ProjCard key={p.key} p={p} {...cardProps}/>)}</div>}
          {actifs.length===0&&<div style={{background:'var(--bg3)',borderRadius:10,padding:'1.5rem',textAlign:'center',color:'var(--muted)',fontSize:12}}>Aucun projet actif trouvé.</div>}

      {/* Événements SANS adresse — affichés en bas de la catégorie filtrée */}

            </div>
            {noAddrEvents.map((j,i)=>(
              <div key={i} style={{background:'var(--bg2)',borderRadius:8,padding:'0.55rem 0.75rem',marginBottom:'0.35rem',border:'1px solid var(--border)',borderLeft:'4px solid '+(j.gcalColor||'#666'),opacity:0.8}}>

                              try{await gapi.client.calendar.events.patch({calendarId:calId,eventId:j.id,resource:{location:addAddrVal.trim()}});break;}

                      </div>

                      + Adresse
                    </button>
                  )}

              </div>
            ))}
          </div>
        );
      })()}

  );
}




// ── JOB SELECTOR ─────────────────────────────────────────────────────────────
function JobSelector({jobs,emp,onSelect,onCreateJob,onSkip}){
  const [showCreate,setShowCreate]=useState(false);
  const [newJobTitle,setNewJobTitle]=useState('');
  const [newJobDate,setNewJobDate]=useState(new Date().toISOString().split('T')[0]);
  const [newJobAddress,setNewJobAddress]=useState('');
  const [showAll,setShowAll]=useState(false); // false = aujourd'hui seulement
  const today=localDateStr();

  function matches(job){
    const txt=(job.title+' '+(job.description||'')).toLowerCase();
    return txt.includes((emp.code||'').toLowerCase())||txt.includes((emp.nom||'').toLowerCase());
  }
  function colorMatch(job){return colorDist(job.gcalColor,emp.couleur)<90;}

  // Filtrer: aujourd'hui par défaut, ou tout si showAll
  const todayJobs=jobs.filter(j=>(j.start||'').slice(0,10)===today);
  const baseJobs=showAll?jobs:todayJobs;

  const sorted=[...baseJobs].sort((a,b)=>{
    const acm=colorMatch(a),bcm=colorMatch(b);
    const am=matches(a),bm=matches(b);
    if(acm&&!bcm)return -1; if(!acm&&bcm)return 1;
    if(am&&!bm)return -1; if(!am&&bm)return 1;
    return new Date(a.start)-new Date(b.start);
  });

  return(
    <div className="job-wrap">
      <div className="section-head">
        <div style={{fontFamily:'var(--font-head)',fontWeight:700,fontSize:'0.92rem'}}>
          {showAll?'Agenda complet':'Jobs aujourd\'hui'}
          <span style={{fontSize:10,color:'var(--muted)',fontWeight:400,marginLeft:6}}>{sorted.length} job{sorted.length!==1?'s':''}</span>
        </div>
        <div style={{display:'flex',gap:'0.35rem',flexWrap:'wrap'}}>
          <button className="btn-s" style={{fontSize:11,padding:'0.22rem 0.6rem',borderColor:showAll?'var(--accent)':'var(--border2)',color:showAll?'var(--accent)':'var(--muted)'}}
            onClick={()=>setShowAll(s=>!s)}>
            {showAll?'📅 Aujourd\'hui':'📋 Tout l\'agenda'}
          </button>
          <button className="btn-s" style={{fontSize:11,padding:'0.22rem 0.6rem'}} onClick={()=>setShowCreate(!showCreate)}>+ Créer</button>
          <button className="btn-s" style={{fontSize:11,padding:'0.22rem 0.6rem'}} onClick={onSkip}>Sans job</button>
        </div>
      </div>
      {showCreate&&(
        <div style={{background:'var(--bg3)',borderRadius:10,padding:'0.75rem',marginBottom:'0.65rem',border:'1px solid var(--border2)'}}>
          <div className="fg" style={{marginBottom:'0.4rem'}}><label>Nom du job</label><input placeholder="Ex: Chantier St-Laurent" value={newJobTitle} onChange={e=>setNewJobTitle(e.target.value)}/></div>
          <div className="fg" style={{marginBottom:'0.4rem'}}><label>Adresse (optionnel)</label><AddressInput value={newJobAddress} onChange={setNewJobAddress} placeholder="Ex: 123 rue Principale, Montréal"/></div>
          <div className="fg" style={{marginBottom:'0.55rem'}}><label>Date</label><input type="date" value={newJobDate} onChange={e=>setNewJobDate(e.target.value)}/></div>
          <button className="btn-p" style={{marginTop:0}} disabled={!newJobTitle} onClick={()=>onCreateJob({title:newJobTitle,date:newJobDate,location:newJobAddress})}>Créer dans l'agenda</button>
        </div>
      )}
      {!showAll&&todayJobs.length===0&&(
        <div style={{background:'rgba(210,153,34,0.1)',borderRadius:8,padding:'0.5rem 0.75rem',marginBottom:'0.5rem',fontSize:11,color:'var(--warning)'}}>
          Aucune job aujourd'hui — <span style={{cursor:'pointer',textDecoration:'underline'}} onClick={()=>setShowAll(true)}>voir tout l'agenda</span>
        </div>
      )}
      <div style={{overflowY:'auto',maxHeight:'calc(100vh - 280px)'}}>
        {sorted.map(job=>{
          const isToday=(job.start||'').slice(0,10)===today;
          const isMatch=matches(job);
          const isCMatch=!isMatch&&colorMatch(job);
          return(
            <div key={job.id} className="job-btn"
              style={{borderColor:isMatch?emp.couleur:'var(--border)',borderWidth:isMatch?2:1,borderLeftWidth:4,borderLeftColor:job.gcalColor,background:isMatch?rgba(emp.couleur,0.06):'var(--bg2)'}}
              onClick={()=>onSelect(job.title,job.gcalColor)}>
              <div className="job-color-bar" style={{background:job.gcalColor}}></div>
              <div style={{flex:1}}>
                <div style={{fontSize:13,fontWeight:600,display:'flex',alignItems:'center',gap:5,flexWrap:'wrap'}}>
                  {job.title}
                  {isMatch&&<span style={{background:rgba(emp.couleur,0.25),color:emp.couleur,fontSize:9,padding:'1px 4px',borderRadius:4,fontWeight:700}}>{'👤'+emp.code}</span>}
                  {isCMatch&&<span style={{background:rgba(job.gcalColor,0.2),color:job.gcalColor,fontSize:9,padding:'1px 4px',borderRadius:4}}>●</span>}
                </div>
                <div style={{fontSize:11,color:'var(--muted)',marginTop:1}}>{new Date(job.start).toLocaleDateString('fr-CA',{weekday:'short',month:'short',day:'numeric'})}{job.location?' · '+job.location:''}</div>
              </div>
              {isToday&&<span style={{background:'rgba(63,185,80,0.15)',color:'var(--success)',fontSize:9,padding:'1px 5px',borderRadius:5,fontWeight:700,flexShrink:0}}>Auj.</span>}
            </div>
          );
        })}
        {sorted.length===0&&showAll&&<div style={{color:'var(--muted)',textAlign:'center',padding:'1.5rem',fontSize:13}}>Aucun job dans l'agenda</div>}
      </div>
    </div>
  );
}

// ── EMPLOYEE HISTORY ──────────────────────────────────────────────────────────
function EmployeeHistory({emp,sid,notify,folders,calendarIds}){
  const [pts,setPts]=useState([]);
  const [tab,setTab]=useState('semaine');
  const [loading,setLoading]=useState(true);
  const [sending,setSending]=useState(false);
  const [editLine,setEditLine]=useState(null);
  const [editData,setEditData]=useState({});
  const [expandedDate,setExpandedDate]=useState(null);

  const today=localDateStr();
  const curWeek=getWeek(new Date());
  const curMois=getMois(new Date());

  useEffect(()=>{load();},[]);
  async function load(){setLoading(true);const p=await getPointages(sid,{nom:emp.nom});setPts(p);setLoading(false);}

  function getFiltered(){
    if(tab==='today')return pts.filter(p=>p.date===today);
    if(tab==='semaine')return pts.filter(p=>p.semaine===curWeek);
    if(tab==='mois')return pts.filter(p=>p.mois===curMois);
    return pts;
  }

  const allLines=combinePts(getFiltered());
  const totalH=Math.round(allLines.reduce((s,l)=>s+(l.heures||0),0)*4)/4;
  const totalDep=Math.round(allLines.reduce((s,l)=>s+(l.deplacement||0),0));
  const totalOT=Math.round(Math.max(0,allLines.reduce((s,l)=>s+(l.ot||0),0))*4)/4;

  // ── VUE SEMAINE — grouper par jour ──
  function buildSemaineView(lignes){
    const parDate={};
    lignes.forEach(l=>{
      if(!parDate[l.date])parDate[l.date]={date:l.date,jobs:[],heures:0,deplacement:0,ouvert:false};
      const d=parDate[l.date];
      if(l.job&&l.job!=='—'&&!d.jobs.includes(l.job))d.jobs.push(l.job);
      d.heures+=l.heures||0;
      d.deplacement+=l.deplacement||0;
      if(!l.heureOut&&l.type!=='confirm')d.ouvert=true;
    });
    return Object.values(parDate).sort((a,b)=>a.date.localeCompare(b.date));
  }

  const joursView=buildSemaineView(allLines);

  // ── ENVOYER COURRIEL RÉSUMÉ SEMAINE ──
  async function confirmerSemaine(){
    setSending(true);
    notify('⏳ Envoi du résumé...','warn');
    try{
      const token=gapi.client.getToken();
      if(!token?.access_token){notify('Pas de token Google','err');setSending(false);return;}

      const banqueEmp=emp.heuresBanque||0;
      const lignesSem=allLines.filter(l=>l.semaine===curWeek||pts.find(p=>p.row===l.inRow&&p.semaine===curWeek));

      // Construire le corps du courriel — une journée par bloc, une job par ligne
      const joursStr=joursView.map(j=>{
        const d=new Date(j.date+'T12:00:00');
        const jourLabel=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'][d.getDay()];
        const moisLabel=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'][d.getMonth()];
        const dateLabel=jourLabel+' '+d.getDate()+' '+moisLabel;
        const h=Math.round(j.heures*4)/4;
        const deplStr=j.deplacement>0?'  (déplacement: '+j.deplacement+' min)':'';
        // En-tête de la journée
        let bloc='── '+dateLabel+' ──────────────────────\n';
        // Une ligne par job
        if(j.jobs.length>0){
          j.jobs.forEach(job=>{
            // Trouver les heures de cette job spécifique
            const jobLines=allLines.filter(l=>l.date===j.date&&l.job===job);
            const jobH=Math.round(jobLines.reduce((s,l)=>s+(l.heures||0),0)*4)/4;
            const jobNote=jobLines.map(l=>l.note).filter(Boolean).join(', ');
            bloc+='   • '+job+(jobH>0?'   →   '+hToQuart(jobH):'')+(jobNote?'   ('+jobNote+')':'')+'\n';
          });
        }else{
          bloc+='   • (aucune job enregistrée)\n';
        }
        bloc+='   Total : '+(j.ouvert?'⏳ en cours':hToQuart(h))+deplStr;
        return bloc;
      }).join('\n\n');

      const suppStr=totalOT>0?'\nHeures supplémentaires : '+hToQuart(totalOT):'';
      const banqueStr='\nBanque d\'heures actuelle : '+hToQuart(banqueEmp);

      const body=`Bonjour,

${emp.nom} confirme sa semaine ${curWeek}.

═══════════════════════════════════
DÉTAIL DE LA SEMAINE
═══════════════════════════════════

${joursStr}

═══════════════════════════════════
RÉSUMÉ
═══════════════════════════════════
Total heures : ${hToQuart(totalH)}${suppStr}${banqueStr}${totalDep>0?'\nDéplacement total : '+totalDep+' min':''}

Envoyé depuis PunchPro — Saran Électrique`;

      // Encoder le courriel en base64
      const to='info@saranelectrique.com';
      const subject='Résumé semaine '+curWeek+' — '+emp.nom;
      const message='To: '+to+'\r\nSubject: '+subject+'\r\nContent-Type: text/plain; charset=utf-8\r\n\r\n'+body;
      // Encoder correctement en UTF-8 avec TextEncoder (supporte les accents)
      const encoder=new TextEncoder();
      const bytes=encoder.encode(message);
      let binary='';
      bytes.forEach(b=>binary+=String.fromCharCode(b));
      const encoded=btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');

      const res=await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/send',{
        method:'POST',
        headers:{'Authorization':'Bearer '+token.access_token,'Content-Type':'application/json'},
        body:JSON.stringify({raw:encoded})
      });

      if(res.ok){
        notify('✅ Résumé envoyé à info@saranelectrique.com!','success');
      }else{
        const err=await res.json();
        notify('Erreur envoi: '+(err?.error?.message||res.status),'err');
      }
    }catch(e){
      notify('Erreur: '+e.message,'err');
    }
    setSending(false);
  }
