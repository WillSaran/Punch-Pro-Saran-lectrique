<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PunchPro — Saran Électrique</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--bg2:#161b22;--bg3:#1c2333;--bg4:#21262d;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#e6edf3;--muted:#7d8590;
  --accent:#2f81f7;--accent2:#6e40c9;
  --success:#3fb950;--warning:#d29922;--danger:#f85149;
  --font-head:'Syne',sans-serif;--font-body:'DM Sans',sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:14px;line-height:1.6;min-height:100vh}
#root{min-height:100vh}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:1000;padding:1rem;overflow-y:auto}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:16px;padding:2rem;max-width:520px;width:100%}
.modal-title{font-family:var(--font-head);font-size:1.5rem;font-weight:800;margin-bottom:0.25rem;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.modal-sub{color:var(--muted);font-size:12px;margin-bottom:1.5rem}
.fg{margin-bottom:1rem}
.fg label{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:0.35rem}
.fg input,.fg select,.fg textarea{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:0.6rem 0.8rem;color:var(--text);font-family:var(--font-body);font-size:13px;outline:none;transition:border-color 0.2s}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--accent)}
.fg small{display:block;margin-top:0.3rem;font-size:11px;color:var(--muted)}
.fg textarea{resize:vertical;min-height:60px}
.btn-p{width:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:8px;padding:0.7rem;color:#fff;font-family:var(--font-head);font-size:14px;font-weight:700;cursor:pointer;transition:opacity 0.2s;margin-top:0.5rem}
.btn-p:hover{opacity:0.88}.btn-p:disabled{opacity:0.4;cursor:not-allowed}
.btn-s{background:transparent;border:1px solid var(--border2);border-radius:8px;padding:0.55rem 1rem;color:var(--text);font-size:12px;cursor:pointer;transition:background 0.2s}
.btn-s:hover{background:var(--bg3)}
.app-wrap{min-height:100vh;display:flex;flex-direction:column}
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:0.55rem 1.25rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{font-family:var(--font-head);font-size:1rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.topbar-right{display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap}
.nav-tabs{display:flex;background:var(--bg3);border-radius:8px;padding:3px;border:1px solid var(--border)}
.nav-tab{padding:0.28rem 0.8rem;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--muted);transition:all 0.2s;white-space:nowrap}
.nav-tab.active{background:var(--accent);color:#fff}
.nav-tab.admin.active{background:linear-gradient(135deg,#b7860b,var(--warning));color:#000}
.online-badge{display:flex;align-items:center;gap:5px;background:rgba(63,185,80,0.1);border:1px solid rgba(63,185,80,0.2);border-radius:20px;padding:0.22rem 0.6rem;font-size:11px;color:var(--success)}
.online-dot{width:6px;height:6px;border-radius:50%;background:var(--success);box-shadow:0 0 4px var(--success)}
.settings-wrap{position:relative}
.settings-btn{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:0.32rem 0.65rem;color:var(--muted);cursor:pointer;font-size:13px;transition:all 0.2s}
.settings-btn:hover{border-color:var(--border2);color:var(--text)}
.settings-menu{position:absolute;top:calc(100% + 6px);right:0;background:var(--bg2);border:1px solid var(--border2);border-radius:12px;padding:0.4rem;min-width:240px;box-shadow:0 8px 32px rgba(0,0,0,0.6);z-index:200}
.si{display:flex;align-items:center;gap:0.6rem;padding:0.5rem 0.65rem;border-radius:6px;cursor:pointer;font-size:12px;color:var(--text);transition:background 0.15s;white-space:nowrap;border:none;background:transparent;width:100%;text-align:left}
.si:hover{background:var(--bg3)}.si.danger:hover{background:rgba(248,81,73,0.1);color:var(--danger)}
.si .ico{font-size:13px;width:16px;text-align:center}
.sdiv{height:1px;background:var(--border);margin:0.3rem 0}
.ssec{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;padding:0.3rem 0.65rem 0.15rem}
.acct-card{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:0.55rem 0.65rem;margin:0.3rem 0}
.content{flex:1;padding:1.25rem;max-width:1080px;margin:0 auto;width:100%}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:1.25rem}
.card-title{font-family:var(--font-head);font-size:0.95rem;font-weight:700;margin-bottom:0.85rem}
.csec{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.09em;color:var(--muted);margin-bottom:0.65rem}

/* WELCOME */
.welcome{min-height:calc(100vh - 50px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem;text-align:center}
.w-time{font-family:var(--font-head);font-size:3.5rem;font-weight:800;letter-spacing:-3px;line-height:1}
.w-date{font-size:12px;color:var(--muted);margin:0.3rem 0 2rem}
.w-hint{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);margin-bottom:1rem}
.emp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:0.5rem;max-width:660px;width:100%}
.emp-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:1rem 0.6rem;cursor:pointer;transition:all 0.18s;text-align:center}
.emp-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,0.35)}
.emp-av-lg{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff;margin:0 auto 0.45rem}

/* JOB SELECTION */
.job-sel-wrap{max-width:560px;width:100%}
.job-sel-title{font-family:var(--font-head);font-size:1rem;font-weight:700;margin-bottom:1rem;text-align:left}
.job-btn{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:0.75rem 1rem;cursor:pointer;transition:all 0.18s;text-align:left;width:100%;margin-bottom:0.4rem}
.job-btn:hover{border-color:var(--border2);transform:translateX(3px)}
.job-btn.selected{border-width:2px}
.job-color-bar{width:4px;height:36px;border-radius:2px;flex-shrink:0}
.job-info{flex:1}
.job-name{font-size:13px;font-weight:600}
.job-meta{font-size:11px;color:var(--muted);margin-top:1px}
.job-badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:8px}

/* PIN */
.pin-wrap{background:var(--bg2);border:1px solid var(--border2);border-radius:14px;padding:1.25rem;max-width:290px;width:100%}
.pin-display{background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:0.65rem 1.25rem;text-align:center;font-family:var(--font-head);font-size:1.7rem;letter-spacing:0.5rem;margin-bottom:0.85rem;min-height:52px;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0.4rem}
.pin-key{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:0.8rem;font-family:var(--font-head);font-size:1.1rem;font-weight:700;color:var(--text);cursor:pointer;text-align:center;transition:all 0.12s;user-select:none}
.pin-key:hover{background:var(--bg4);border-color:var(--accent);color:var(--accent)}
.pin-key:active{transform:scale(0.94)}
.pin-key.del{color:var(--danger)}.pin-key.zero{grid-column:2}
.pin-back{background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer;margin-top:0.6rem;text-align:center;width:100%;text-decoration:underline;padding:0}
.pin-back:hover{color:var(--text)}

/* TRAVEL & NOTE */
.travel-wrap{background:var(--bg2);border:1px solid var(--border2);border-radius:14px;padding:1.25rem;max-width:340px;width:100%}
.travel-title{font-family:var(--font-head);font-size:0.95rem;font-weight:700;margin-bottom:1rem;text-align:center}
.travel-options{display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;margin-bottom:1rem}
.travel-opt{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:0.65rem;cursor:pointer;text-align:center;transition:all 0.15s}
.travel-opt:hover{border-color:var(--border2)}
.travel-opt.sel{border-width:2px;border-color:var(--accent);background:rgba(47,129,247,0.1)}
.travel-opt .tv{font-family:var(--font-head);font-size:1.1rem;font-weight:800;color:var(--accent)}
.travel-opt .tl{font-size:10px;color:var(--muted);margin-top:2px}
.note-input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:0.55rem 0.75rem;color:var(--text);font-family:var(--font-body);font-size:12px;outline:none;resize:none;margin-bottom:0.75rem}
.note-input:focus{border-color:var(--accent)}

/* PUNCH RESULT */
.punch-result{padding:1.25rem;border-radius:14px;text-align:center;max-width:320px;width:100%;animation:popIn 0.25s ease}
.punch-result.ok{background:rgba(63,185,80,0.07);border:1px solid rgba(63,185,80,0.3)}
.punch-result.err{background:rgba(248,81,73,0.07);border:1px solid rgba(248,81,73,0.25)}
@keyframes popIn{from{transform:scale(0.92);opacity:0}to{transform:scale(1);opacity:1}}
.pbadge{display:inline-block;padding:0.28rem 0.85rem;border-radius:20px;font-size:11px;font-weight:700;margin:0.4rem 0}
.pbadge.in{background:rgba(63,185,80,0.18);color:var(--success)}
.pbadge.out{background:rgba(248,81,73,0.14);color:var(--danger)}
.pbadge.travel{background:rgba(210,153,34,0.18);color:var(--warning)}
.punch-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0.35rem;margin-top:0.75rem}
.ps{background:var(--bg3);border-radius:8px;padding:0.5rem;text-align:center}
.ps .v{font-family:var(--font-head);font-size:0.95rem;font-weight:800;color:var(--accent)}
.ps .l{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;margin-top:1px}

/* COMMON */
.emp-av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:9px;color:#fff;flex-shrink:0}
.job-item{padding:0.65rem 0.8rem;background:var(--bg3);border-radius:8px;margin-bottom:0.35rem;border-left:3px solid var(--accent)}
.achip{display:inline-flex;align-items:center;gap:3px;padding:2px 6px;border-radius:8px;font-size:10px;font-weight:600;margin-top:4px;margin-right:3px}
.status-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:0.45rem}
.semp{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:0.55rem 0.7rem;display:flex;align-items:center;gap:0.45rem}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0.55rem}
.stat-box{background:var(--bg3);border-radius:8px;padding:0.8rem;text-align:center}
.stat-box .val{font-family:var(--font-head);font-size:1.3rem;font-weight:800;color:var(--accent)}
.stat-box .lbl{font-size:10px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:0.06em}
.htable{width:100%;border-collapse:collapse;font-size:12px}
.htable th{text-align:left;padding:0.4rem 0.6rem;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:0.07em;border-bottom:1px solid var(--border)}
.htable td{padding:0.45rem 0.6rem;border-bottom:1px solid var(--border);vertical-align:middle}
.htable tr:last-child td{border-bottom:none}
.badge{display:inline-block;padding:2px 6px;border-radius:7px;font-size:10px;font-weight:600}
.badge-in{background:rgba(63,185,80,0.15);color:var(--success)}
.badge-out{background:rgba(248,81,73,0.12);color:var(--danger)}
.badge-pend{background:rgba(210,153,34,0.15);color:var(--warning)}
.badge-travel{background:rgba(210,153,34,0.15);color:var(--warning)}
.tabs{display:flex;gap:0.2rem;margin-bottom:0.85rem;background:var(--bg3);border-radius:8px;padding:3px;border:1px solid var(--border);width:fit-content;flex-wrap:wrap}
.tab{padding:0.32rem 0.8rem;border-radius:6px;font-size:11px;font-weight:500;cursor:pointer;border:none;background:transparent;color:var(--muted);transition:all 0.2s}
.tab.active{background:var(--accent);color:#fff}
.bank-row{display:flex;align-items:center;justify-content:space-between;padding:0.6rem 0.7rem;background:var(--bg3);border-radius:8px;margin-bottom:0.35rem;border:1px solid var(--border);gap:0.5rem;flex-wrap:wrap}
.btn-sm{padding:0.22rem 0.6rem;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;border:none;transition:opacity 0.2s}
.btn-sm:hover{opacity:0.8}
.btn-approve{background:rgba(63,185,80,0.18);color:var(--success)}
.btn-deny{background:rgba(248,81,73,0.14);color:var(--danger)}
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem}
@media(max-width:760px){.admin-grid{grid-template-columns:1fr}}
.full-w{grid-column:1/-1}
.emp-row{display:flex;align-items:center;padding:0.55rem 0.65rem;background:var(--bg3);border-radius:8px;margin-bottom:0.3rem;gap:0.45rem}
.btn-icon{background:transparent;border:1px solid var(--border);border-radius:6px;padding:3px 6px;color:var(--muted);cursor:pointer;font-size:11px;transition:all 0.2s;margin-left:auto}
.btn-icon:hover{border-color:var(--danger);color:var(--danger)}
.add-form{background:var(--bg3);border-radius:8px;padding:0.8rem;margin-top:0.6rem;border:1px solid var(--border2)}
.add-row{display:grid;grid-template-columns:2fr 1fr 1fr;gap:0.4rem;margin-bottom:0.6rem}
.add-form input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:0.42rem 0.6rem;color:var(--text);font-family:var(--font-body);font-size:12px;outline:none}
.add-form input:focus{border-color:var(--accent)}
.fl{display:block;font-size:10px;color:var(--muted);margin-bottom:3px}
.color-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.cswatch{width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform 0.12s}
.cswatch:hover{transform:scale(1.25)}
.wbar-wrap{margin-bottom:0.8rem}
.wbar-label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:3px;align-items:center}
.wbar{height:5px;background:var(--bg3);border-radius:3px;overflow:hidden}
.wbar-fill{height:100%;border-radius:3px;transition:width 0.5s ease}
.wbar-fill.ot{background:linear-gradient(90deg,var(--warning),var(--danger)) !important}
.notif{position:fixed;top:1rem;right:1rem;background:var(--bg2);border:1px solid var(--border2);border-radius:8px;padding:0.6rem 1rem;font-size:12px;z-index:999;max-width:300px;box-shadow:0 4px 20px rgba(0,0,0,0.5);animation:slideIn 0.3s ease;cursor:pointer}
.notif.success{border-color:rgba(63,185,80,0.4)}.notif.warn{border-color:rgba(210,153,34,0.4)}.notif.err{border-color:rgba(248,81,73,0.4)}
@keyframes slideIn{from{transform:translateX(18px);opacity:0}to{transform:translateX(0);opacity:1}}
.scroll-area{max-height:250px;overflow-y:auto}
.scroll-area::-webkit-scrollbar{width:3px}
.scroll-area::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.create-job-form{background:var(--bg3);border:1px solid var(--border2);border-radius:10px;padding:1rem;margin-top:0.75rem;max-width:560px;width:100%}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const EMP_COLORS = ['#2f81f7','#6e40c9','#3fb950','#d29922','#f85149','#0ea5e9','#ec4899','#a855f7','#22c55e','#f97316'];
// Google Calendar color map
const GCAL_COLORS = {
  '1':'#a4bdfc','2':'#7ae7bf','3':'#dbadff','4':'#ff887c','5':'#fbd75b',
  '6':'#ffb878','7':'#46d6db','8':'#e1e1e1','9':'#5484ed','10':'#51b749','11':'#dc2127'
};
const SCOPES = 'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/calendar https://www.googleapis.com/auth/userinfo.email';
const DISCOVERY = ['https://sheets.googleapis.com/$discovery/rest?version=v4','https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest'];
const BOSS_EMAILS = ['info@saranelectrique.com'];
let tokenClient = null;

function loadScript(src) {
  return new Promise(res => { const s = document.createElement('script'); s.src = src; s.onload = res; document.head.appendChild(s); });
}
async function initLibs(cfg, onToken) {
  await loadScript('https://apis.google.com/js/api.js');
  await new Promise(res => gapi.load('client', res));
  await gapi.client.init({ apiKey: cfg.apiKey, discoveryDocs: DISCOVERY });
  await loadScript('https://accounts.google.com/gsi/client');
  tokenClient = google.accounts.oauth2.initTokenClient({ client_id: cfg.clientId, scope: SCOPES, callback: onToken });
}
async function getUserEmail() {
  try {
    const token = gapi.client.getToken();
    if (token?.access_token) {
      const r = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers: { 'Authorization': 'Bearer ' + token.access_token } });
      const d = await r.json();
      if (d.email) return d.email.toLowerCase().trim();
    }
  } catch(e) { console.error(e); }
  return '';
}

// ── SHEETS ────────────────────────────────────────────────────────────────────
async function ensureStructure(sid) {
  try {
    const res = await gapi.client.sheets.spreadsheets.get({ spreadsheetId: sid });
    const ex = res.result.sheets.map(s => s.properties.title);
    const needed = ['Employés','Pointages','HeuresEnBanque'];
    const reqs = needed.filter(n => !ex.includes(n)).map(n => ({ addSheet: { properties: { title: n } } }));
    if (reqs.length) await gapi.client.sheets.spreadsheets.batchUpdate({ spreadsheetId: sid, resource: { requests: reqs } });
    const headers = {
      'Employés': [['Nom','PIN','Statut','HeuresBanque','Couleur','Code']],
      'Pointages': [['Employé','Type','DateTime','DateStr','HeureStr','Semaine','Mois','Job','Déplacement','Note']],
      'HeuresEnBanque': [['Employé','Semaine','HeuresSupp','Statut','DateDemande']]
    };
    for (const [sheet, h] of Object.entries(headers)) {
      const chk = await gapi.client.sheets.spreadsheets.values.get({ spreadsheetId: sid, range: `${sheet}!A1` });
      if (!chk.result.values) await gapi.client.sheets.spreadsheets.values.update({ spreadsheetId: sid, range: `${sheet}!A1`, valueInputOption: 'RAW', resource: { values: h } });
    }
  } catch(e) { console.error(e); }
}
async function getEmployees(sid) {
  try {
    const res = await gapi.client.sheets.spreadsheets.values.get({ spreadsheetId: sid, range: 'Employés!A2:F' });
    return (res.result.values||[]).map((r,i) => ({ nom:r[0]||'', pin:r[1]||'', statut:r[2]||'out', heuresBanque:parseFloat(r[3])||0, couleur:r[4]||EMP_COLORS[i%EMP_COLORS.length], code:r[5]||(r[0]||'??').substring(0,2).toUpperCase(), row:i+2 }));
  } catch { return []; }
}
async function saveEmployee(sid, emp) {
  await gapi.client.sheets.spreadsheets.values.append({ spreadsheetId: sid, range: 'Employés!A:F', valueInputOption: 'RAW', resource: { values: [[emp.nom,emp.pin,'out',0,emp.couleur,emp.code]] } });
}
async function deleteEmployee(sid, row) {
  const r = await gapi.client.sheets.spreadsheets.get({ spreadsheetId: sid });
  const sh = r.result.sheets.find(s => s.properties.title==='Employés');
  await gapi.client.sheets.spreadsheets.batchUpdate({ spreadsheetId: sid, resource: { requests: [{ deleteDimension: { range: { sheetId: sh?sh.properties.sheetId:0, dimension:'ROWS', startIndex:row-1, endIndex:row } } }] } });
}
async function updateStatus(sid, row, statut) {

async function getPointages(sid, filter={}) {

    if (filter.mois) rows = rows.filter(r=>r.mois===filter.mois);

// ── CALENDAR ──────────────────────────────────────────────────────────────────
async function getCalendarJobs(calendarIds) {
  const now = new Date(), end = new Date(now);
  end.setDate(end.getDate()+14);
  const all = [];
  for (const calId of (calendarIds||['primary'])) {
    try {
      const res = await gapi.client.calendar.events.list({ calendarId:calId, timeMin:now.toISOString(), timeMax:end.toISOString(), singleEvents:true, orderBy:'startTime', maxResults:30 });
      (res.result.items||[]).forEach(e => {
        if (!all.find(x=>x.id===e.id)) all.push({
          id:e.id, title:e.summary||'Sans titre',
          start:e.start.dateTime||e.start.date,
          end:e.end.dateTime||e.end.date,
          location:e.location||'',
          description:e.description||'',
          colorId:e.colorId||'',
          gcalColor: e.colorId ? (GCAL_COLORS[e.colorId]||'#2f81f7') : '#2f81f7'
        });
      });
    } catch(e) { console.error('Calendar error:', e); }
  }
  return all.sort((a,b)=>new Date(a.start)-new Date(b.start));
}

async function createCalendarEvent(calendarId, title, date) {
  try {
    const start = new Date(date+'T07:00:00');
    const end = new Date(date+'T17:00:00');
    const res = await gapi.client.calendar.events.insert({
      calendarId: calendarId||'primary',
      resource: { summary:title, start:{ dateTime:start.toISOString() }, end:{ dateTime:end.toISOString() } }
    });
    return res.result;
  } catch(e) { console.error(e); return null; }
}

// ── UTILS ─────────────────────────────────────────────────────────────────────
function getWeek(d) {
  const date=new Date(d); date.setHours(0,0,0,0); date.setDate(date.getDate()+3-(date.getDay()+6)%7);
  const w1=new Date(date.getFullYear(),0,4);
  return `${date.getFullYear()}-S${String(1+Math.round(((date-w1)/86400000-3+(w1.getDay()+6)%7)/7)).padStart(2,'0')}`;
}
function calcH(pts) {
  let t=0,last=null;
  for (const p of pts) {
    if (p.type==='in') last=new Date(p.datetime);
    else if (p.type==='out'&&last) { t+=(new Date(p.datetime)-last)/3600000; last=null; }
  }
  return Math.round(t*10)/10;
}
function calcDeplacement(pts) {
  return Math.round(pts.filter(p=>p.type==='in').reduce((s,p)=>s+(p.deplacement||0),0)*10)/10;
}
function rgba(hex,a=0.15) {
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
function useClock() {
  const [now,setNow]=useState(new Date());
  useEffect(()=>{ const t=setInterval(()=>setNow(new Date()),1000); return()=>clearInterval(t); },[]);
  return now;
}
function colorDistance(c1,c2) {
  const r1=parseInt(c1.slice(1,3),16),g1=parseInt(c1.slice(3,5),16),b1=parseInt(c1.slice(5,7),16);
  const r2=parseInt(c2.slice(1,3),16),g2=parseInt(c2.slice(3,5),16),b2=parseInt(c2.slice(5,7),16);
  return Math.sqrt((r1-r2)**2+(g1-g2)**2+(b1-b2)**2);
}

function Notif({msg,type,onClose}) {

}

// ── PIN PAD ────────────────────────────────────────────────────────────────────
function PinPad({empName,empCouleur,empCode,onSubmit,onCancel}) {
  const [pin,setPin]=useState('');
  const keys=['1','2','3','4','5','6','7','8','9','←','0','✓'];
  const handle=k=>{
    if(k==='←') setPin(p=>p.slice(0,-1));
    else if(k==='✓'){if(pin.length>=4){onSubmit(pin);setPin('');}}
    else if(pin.length<6) setPin(p=>p+k);
  };
  return (
    <div className="pin-wrap">
      <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:10,marginBottom:'0.85rem'}}>
        <div className="emp-av" style={{background:empCouleur,width:36,height:36,fontSize:12}}>{empCode}</div>
        <div style={{fontFamily:'var(--font-head)',fontWeight:700,fontSize:'0.95rem'}}>{empName}</div>
      </div>
      <div className="pin-display">{pin?'●'.repeat(pin.length):<span style={{color:'var(--muted)',fontSize:'0.8rem'}}>Entrez votre PIN</span>}</div>
      <div className="pin-grid">
        {keys.map((k,i)=>(
          <div key={i} className={`pin-key${k==='←'?' del':''}${k==='0'?' zero':''}`}
            style={k==='✓'?{background:'linear-gradient(135deg,var(--accent),var(--accent2))',color:'#fff',border:'none'}:{}}
            onClick={()=>handle(k)}>{k}</div>
        ))}
      </div>
      <button className="pin-back" onClick={onCancel}>← Changer d'employé</button>
    </div>
  );
}

// ── WELCOME SCREEN ────────────────────────────────────────────────────────────
function WelcomeScreen({emps,sid,calendarIds,notify,onRefresh}) {
  const now = useClock();
  const [step,setStep]=useState('emps'); // emps | job | travel | pin | result
  const [selEmp,setSelEmp]=useState(null);
  const [selJob,setSelJob]=useState('');
  const [jobs,setJobs]=useState([]);
  const [result,setResult]=useState(null);
  const [deplacement,setDeplacement]=useState(0);
  const [note,setNote]=useState('');

  useEffect(()=>{ if(calendarIds?.length) getCalendarJobs(calendarIds).then(setJobs); },[calendarIds?.join(',')]);

  const pad=n=>String(n).padStart(2,'0');
  const days=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
  const months=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  const today=now.toLocaleDateString('fr-CA');
  const curWeek=getWeek(now);
  const curMois=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;

  function reset() { setStep('emps'); setSelEmp(null); setSelJob(''); setDeplacement(0); setNote(''); }

  function handleSelectEmp(emp) {
    setSelEmp(emp);
    // Si l'employé est déjà IN, aller directement au PIN pour OUT
    if(emp.statut==='in') setStep('pin');
    else setStep('job');
  }

  async function handleCreateJob(newJob) {
    const calId = calendarIds?.[0]||'primary';
    await createCalendarEvent(calId, newJob.title, newJob.date);
    setSelJob(newJob.title);
    setStep('travel');
    notify(`✅ Job "${newJob.title}" créé dans l'agenda!`,'success');
    getCalendarJobs(calendarIds).then(setJobs);
  }

  function handleJobSelect(jobTitle) { setSelJob(jobTitle); setStep('travel'); }
  function handleSkipJob() { setSelJob(''); setStep('travel'); }

  function handleTravelConfirm(dep,n) {
    setDeplacement(dep);
    setNote(n);
    setStep('pin');
  }

  async function handlePunch(pin) {
    const emp = emps.find(e=>e.nom===selEmp.nom);
    if(!emp||emp.pin!==pin) { setResult({err:true}); setTimeout(()=>{ setResult(null); setStep('pin'); },2000); return; }
    const type = emp.statut==='in'?'out':'in';
    // For OUT, no travel/job selection needed, use last known job
    const jobForPunch = type==='in' ? selJob : '';
    const depForPunch = type==='in' ? deplacement : 0;
    const noteForPunch = type==='in' ? note : note;
    await addPointage(sid, emp, type, jobForPunch, depForPunch, noteForPunch);
    await updateStatus(sid, emp.row, type);
    // Check heures en banque
    const curW=getWeek(new Date());
    const semPts=await getPointages(sid,{nom:emp.nom,semaine:curW});
    const total=calcH(semPts);
    if(type==='out'&&total>40){
      const extra=Math.round((total-40)*10)/10;
      const bq=await getHeuresBanque(sid);
      if(!bq.some(b=>b.nom===emp.nom&&b.semaine===curW)){
        await addHeuresBanque(sid,emp.nom,curW,extra);
        notify(`🏦 ${emp.nom} — ${extra}h en banque cette semaine!`,'warn');
      }
    }
    const allPts=await getPointages(sid,{nom:emp.nom});
    setResult({ok:true,nom:emp.nom,type,heure:now.toLocaleTimeString('fr-CA',{hour:'2-digit',minute:'2-digit'}),couleur:emp.couleur,code:emp.code,pts:allPts,job:jobForPunch,dep:depForPunch});
    setStep('result');
    onRefresh();
    setTimeout(()=>{ reset(); setResult(null); },7000);
  }

  const TimeHeader = () => (
    <>
      <div className="w-time">{pad(now.getHours())}:{pad(now.getMinutes())}</div>
      <div className="w-date">{days[now.getDay()]} {now.getDate()} {months[now.getMonth()]} {now.getFullYear()}</div>
    </>
  );

  if(step==='result'&&result?.ok) {
    const pts=result.pts||[];
    return (
      <div className="welcome">
        <div className="punch-result ok">
          <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:10,marginBottom:8}}>
            <div className="emp-av" style={{background:result.couleur,width:40,height:40,fontSize:13}}>{result.code}</div>
            <div style={{fontFamily:'var(--font-head)',fontSize:'1.1rem',fontWeight:800}}>{result.nom}</div>
          </div>
          <span className={`pbadge ${result.type}`}>{result.type==='in'?'✅ Punch IN':'🔴 Punch OUT'}</span>
          <div style={{fontFamily:'var(--font-head)',fontWeight:700,fontSize:'1.2rem',margin:'4px 0'}}>{result.heure}</div>
          {result.job&&<div style={{fontSize:11,color:'var(--muted)',marginBottom:4}}>📍 {result.job}</div>}
          {result.dep>0&&<span className="pbadge travel">🚗 {result.dep} min déplacement</span>}
          <div className="punch-stats">
            <div className="ps"><div className="v">{calcH(pts.filter(p=>p.date===today))}h</div><div className="l">Aujourd'hui</div></div>
            <div className="ps"><div className="v">{calcH(pts.filter(p=>p.semaine===curWeek))}h</div><div className="l">Semaine</div></div>
            <div className="ps"><div className="v">{calcDeplacement(pts.filter(p=>p.semaine===curWeek))}min</div><div className="l">Déplacements</div></div>
          </div>
        </div>
      </div>
    );
  }

  if(step==='result'&&result?.err) {
    return (
      <div className="welcome">
        <div className="punch-result err">
          <div style={{fontSize:'1.8rem',marginBottom:8}}>❌</div>
          <div style={{fontFamily:'var(--font-head)',fontWeight:700}}>PIN incorrect</div>
          <button className="pin-back" style={{marginTop:12}} onClick={reset}>← Retour</button>
        </div>
      </div>
    );
  }

  if(step==='pin') return (
    <div className="welcome">
      <TimeHeader/>
      <PinPad empName={selEmp?.nom} empCouleur={selEmp?.couleur} empCode={selEmp?.code} onSubmit={handlePunch} onCancel={reset}/>
    </div>
  );

  if(step==='travel') return (
    <div className="welcome">
      <TimeHeader/>
      <TravelSelector onConfirm={handleTravelConfirm} jobName={selJob}/>
    </div>
  );

  if(step==='job') return (
    <div className="welcome" style={{justifyContent:'flex-start',paddingTop:'2rem'}}>
      <TimeHeader/>
      <JobSelector jobs={jobs} emp={selEmp} onSelect={handleJobSelect} onCreateJob={handleCreateJob} onSkip={handleSkipJob}/>
    </div>
  );

  // Default: emp selection
  return (
    <div className="welcome">
      <TimeHeader/>
      {emps.length===0?(
        <div style={{color:'var(--muted)',textAlign:'center',maxWidth:340}}>
          <div style={{fontSize:'1.8rem',marginBottom:'0.65rem'}}>👷</div>
          <div style={{fontFamily:'var(--font-head)',fontWeight:700,marginBottom:'0.35rem'}}>Aucun employé configuré</div>
          <div style={{fontSize:13}}>Connectez-vous en tant qu'administrateur pour ajouter des employés.</div>
        </div>
      ):(
        <>
          <div className="w-hint">Sélectionnez votre nom</div>
          <div className="emp-grid">
            {emps.map(emp=>(
              <div key={emp.nom} className="emp-card" style={{borderColor:emp.statut==='in'?emp.couleur:'var(--border)',boxShadow:emp.statut==='in'?`0 0 0 1px ${emp.couleur}`:''}} onClick={()=>handleSelectEmp(emp)}>
                <div className="emp-av-lg" style={{background:emp.couleur}}>{emp.code}</div>
                <div style={{fontSize:12,fontWeight:600}}>{emp.nom}</div>
                <div style={{fontSize:10,color:emp.statut==='in'?emp.couleur:'var(--muted)',marginTop:2}}>{emp.statut==='in'?'● En cours':'○ Absent'}</div>
              </div>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

        <div className="fg"><label>OAuth 2.0 Client ID</label><input placeholder="123...apps.googleusercontent.com" value={cfg.clientId} onChange={e=>setCfg(p=>({...p,clientId:e.target.value}))}/></div>
        <div className="fg"><label>Google Spreadsheet ID</label><input placeholder="144Ub45GKP6bvMEd2Zda9JIhfwYpkKMNm" value={cfg.spreadsheetId} onChange={e=>setCfg(p=>({...p,spreadsheetId:e.target.value}))}/></div>
        <div className="fg"><label>Calendriers (séparés par des virgules)</label><input placeholder="saranelectrique@gmail.com, info@saranelectrique.com" value={cfg.calendarIds} onChange={e=>setCfg(p=>({...p,calendarIds:e.target.value}))}/><small>Les emails des comptes Google Agenda à afficher</small></div>
        <button className="btn-p" disabled={!ok} onClick={()=>ok&&onSave(cfg)}>Enregistrer →</button>
      </div>
    </div>
  );
}

// ── ADMIN VIEW ────────────────────────────────────────────────────────────────
function AdminView({sid,calendarIds,refreshKey,notify,onRefresh}) {
  const [tab,setTab]=useState('dashboard');
  const [emps,setEmps]=useState([]);
  const [pts,setPts]=useState([]);
  const [banque,setBanque]=useState([]);
  const [jobs,setJobs]=useState([]);
  const [loading,setLoading]=useState(true);
  const [showAdd,setShowAdd]=useState(false);
  const [newEmp,setNewEmp]=useState({nom:'',pin:'',code:'',couleur:EMP_COLORS[0]});
  const [selEmp,setSelEmp]=useState('');
  const [histTab,setHistTab]=useState('semaine');

  const today=new Date().toLocaleDateString('fr-CA');
  const curWeek=getWeek(new Date());
  const curMois=`${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}`;

  useEffect(()=>{
    setLoading(true);
    Promise.all([getEmployees(sid),getPointages(sid),getHeuresBanque(sid),getCalendarJobs(calendarIds)])
      .then(([e,p,b,j])=>{ setEmps(e);setPts(p);setBanque(b);setJobs(j);setLoading(false); });
  },[refreshKey]);

  const pending=banque.filter(b=>b.statut==='pending');
  const eMap=Object.fromEntries(emps.map(e=>[e.nom,e]));

  async function handleAdd() {
    if(!newEmp.nom||!newEmp.pin){notify('Remplis le nom et le PIN!','err');return;}
    try {
      const emp={...newEmp,code:newEmp.code||newEmp.nom.substring(0,2).toUpperCase()};
      notify('⏳ Sauvegarde...','warn');
      await saveEmployee(sid,emp);
      const updated=await getEmployees(sid);
      setEmps(updated);
      setNewEmp({nom:'',pin:'',code:'',couleur:EMP_COLORS[updated.length%EMP_COLORS.length]});
      setShowAdd(false);
      notify(`✅ ${emp.nom} ajouté!`,'success');
      onRefresh();
    } catch(e){notify('Erreur: '+e.message,'err');}
  }
  async function handleDel(emp){
    if(!confirm(`Supprimer ${emp.nom}?`))return;
    await deleteEmployee(sid,emp.row);
    notify('Supprimé','success');
    const updated=await getEmployees(sid);setEmps(updated);onRefresh();
  }
  async function handleBanque(b,statut){
    await updateBanqueStatus(sid,b.row,statut);
    notify(statut==='approved'?`✅ ${b.heures}h approuvées`:'Refusé','success');
    setBanque(await getHeuresBanque(sid));
  }

  function getHist(){
    let p=selEmp?pts.filter(x=>x.nom===selEmp):pts;
    if(histTab==='today')p=p.filter(x=>x.date===today);
    else if(histTab==='semaine')p=p.filter(x=>x.semaine===curWeek);
    else if(histTab==='mois')p=p.filter(x=>x.mois===curMois);
    return p.slice().reverse().slice(0,80);
  }

  // Heures par job
  function getJobStats(){
    const map={};
    const ins=pts.filter(p=>p.type==='in'&&p.job);
    const outs=pts.filter(p=>p.type==='out');
    for(const pin of ins){
      const matchOut=outs.find(po=>po.nom===pin.nom&&new Date(po.datetime)>new Date(pin.datetime));
      if(matchOut){
        const h=(new Date(matchOut.datetime)-new Date(pin.datetime))/3600000;
        if(!map[pin.job])map[pin.job]={job:pin.job,heures:0,deplacement:0,count:0};
        map[pin.job].heures+=h;
        map[pin.job].deplacement+=pin.deplacement||0;
        map[pin.job].count++;
      }
    }
    return Object.values(map).map(x=>({...x,heures:Math.round(x.heures*10)/10})).sort((a,b)=>b.heures-a.heures);
  }

  function getAssignees(job){
    const txt=(job.title+' '+job.description).toLowerCase();
    return emps.filter(e=>txt.includes(e.nom.toLowerCase())||txt.includes(e.code.toLowerCase()));
  }

  if(loading) return <div style={{textAlign:'center',color:'var(--muted)',padding:'3rem',fontSize:13}}>⏳ Chargement...</div>;

  const totalToday=Math.round(emps.reduce((s,e)=>s+calcH(pts.filter(p=>p.nom===e.nom&&p.date===today)),0)*10)/10;
  const totalWeek=Math.round(emps.reduce((s,e)=>s+calcH(pts.filter(p=>p.nom===e.nom&&p.semaine===curWeek)),0)*10)/10;
  const totalDep=Math.round(pts.filter(p=>p.semaine===curWeek&&p.type==='in').reduce((s,p)=>s+(p.deplacement||0),0));

  return (
    <div>
      <div className="tabs">
        {[['dashboard','📊 Dashboard'],['employes','👷 Employés'],['historique','📋 Historique'],['jobs-stats','📍 Par job'],['banque','🏦 Heures banque'],['agenda','📅 Agenda']].map(([k,l])=>(
          <div key={k} className={`tab${tab===k?' active':''}`} onClick={()=>setTab(k)}>
            {l}{k==='banque'&&pending.length>0?<span style={{background:'var(--warning)',color:'#000',borderRadius:8,padding:'0 5px',fontSize:10,marginLeft:3}}>{pending.length}</span>:null}
          </div>
        ))}
      </div>

      {tab==='dashboard'&&(
        <div className="admin-grid">
          <div className="card">
            <div className="csec">Aperçu du jour</div>
            <div className="stats-grid" style={{marginBottom:'1rem'}}>
              <div className="stat-box"><div className="val" style={{color:'var(--success)'}}>{emps.filter(e=>e.statut==='in').length}</div><div className="lbl">Sur place</div></div>
              <div className="stat-box"><div className="val">{totalToday}h</div><div className="lbl">Heures auj.</div></div>
              <div className="stat-box"><div className="val">{totalDep}min</div><div className="lbl">Dépl. sem.</div></div>
            </div>
            <div className="csec">Statut en temps réel</div>
            <div className="status-grid">
              {emps.map(emp=>(
                <div key={emp.nom} className="semp">
                  <div style={{width:8,height:8,borderRadius:'50%',background:emp.statut==='in'?emp.couleur:'var(--muted)',boxShadow:emp.statut==='in'?`0 0 4px ${emp.couleur}`:'none',flexShrink:0}}></div>
                  <div>
                    <div style={{fontSize:12,fontWeight:500,display:'flex',alignItems:'center',gap:4}}>
                      <span style={{background:rgba(emp.couleur,0.2),color:emp.couleur,borderRadius:4,padding:'0 4px',fontSize:9,fontWeight:700}}>{emp.code}</span>{emp.nom}
                    </div>
                    <div style={{fontSize:10,color:'var(--muted)'}}>{emp.statut==='in'?'✓ Présent':'Absent'}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>
          <div className="card">
            <div className="csec">Heures cette semaine</div>
            {emps.map(emp=>{
              const h=calcH(pts.filter(p=>p.nom===emp.nom&&p.semaine===curWeek));
              const dep=Math.round(pts.filter(p=>p.nom===emp.nom&&p.semaine===curWeek&&p.type==='in').reduce((s,p)=>s+(p.deplacement||0),0));
              return(
                <div key={emp.nom} className="wbar-wrap">
                  <div className="wbar-label">
                    <span style={{display:'flex',alignItems:'center',gap:7}}>
                      <span style={{width:8,height:8,borderRadius:'50%',background:emp.couleur,display:'inline-block'}}></span>
                      {emp.nom} <span style={{fontSize:9,background:rgba(emp.couleur,0.2),color:emp.couleur,padding:'0 4px',borderRadius:4}}>{emp.code}</span>
                    </span>
                    <span style={{color:h>40?'var(--warning)':'var(--muted)',display:'flex',gap:8}}>
                      <span>{h}h{h>40?` (+${Math.round((h-40)*10)/10}h)`:''}</span>
                      {dep>0&&<span style={{color:'var(--warning)'}}>🚗{dep}min</span>}
                    </span>
                  </div>
                  <div className="wbar"><div className={`wbar-fill${h>40?' ot':''}`} style={{width:`${Math.min(100,(h/40)*100)}%`,background:h>40?undefined:emp.couleur}}></div></div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {tab==='employes'&&(
        <div className="card" style={{maxWidth:560}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'0.85rem'}}>
            <div className="card-title" style={{marginBottom:0}}>Employés ({emps.length})</div>
            <button className="btn-s" onClick={()=>setShowAdd(!showAdd)}>+ Ajouter</button>
          </div>
          {showAdd&&(
            <div className="add-form">
              <div className="add-row">
                <div><span className="fl">Nom complet</span><input placeholder="Jean Tremblay" value={newEmp.nom} onChange={e=>setNewEmp(p=>({...p,nom:e.target.value}))}/></div>
                <div><span className="fl">Code</span><input placeholder="JT" maxLength={3} value={newEmp.code} onChange={e=>setNewEmp(p=>({...p,code:e.target.value.toUpperCase()}))}/></div>
                <div><span className="fl">PIN</span><input placeholder="1234" maxLength={6} value={newEmp.pin} onChange={e=>setNewEmp(p=>({...p,pin:e.target.value}))}/></div>
              </div>
              <div style={{marginBottom:'0.6rem'}}>
                <span className="fl">Couleur</span>
                <div className="color-row">{EMP_COLORS.map(c=><div key={c} className="cswatch" style={{background:c,border:`2px solid ${newEmp.couleur===c?'#fff':'transparent'}`}} onClick={()=>setNewEmp(p=>({...p,couleur:c}))}/>)}</div>
              </div>
              <button className="btn-p" style={{marginTop:0}} onClick={handleAdd}>✓ Sauvegarder l'employé</button>
            </div>
          )}
          <div style={{marginTop:'0.75rem'}}>
            {emps.map(emp=>(
              <div key={emp.nom} className="emp-row">
                <div className="emp-av" style={{background:emp.couleur}}>{emp.code}</div>
                <div style={{flex:1,marginLeft:'0.6rem'}}>
                  <div style={{fontSize:12,fontWeight:500}}>{emp.nom}</div>
                  <div style={{fontSize:10,color:'var(--muted)',fontFamily:'monospace'}}>PIN: {emp.pin} · Code: {emp.code}</div>
                </div>
                <span className={`badge ${emp.statut==='in'?'badge-in':'badge-out'}`}>{emp.statut==='in'?'Présent':'Absent'}</span>
                <button className="btn-icon" onClick={()=>handleDel(emp)}>✕</button>
              </div>
            ))}
            {emps.length===0&&<div style={{color:'var(--muted)',textAlign:'center',padding:'1.5rem',fontSize:13}}>Aucun employé — cliquez "+ Ajouter"</div>}
          </div>
        </div>
      )}

      {tab==='historique'&&(
        <div className="card">
          <div style={{display:'flex',gap:'0.65rem',alignItems:'center',flexWrap:'wrap',marginBottom:'0.85rem'}}>
            <select value={selEmp} onChange={e=>setSelEmp(e.target.value)} style={{background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:6,padding:'0.32rem 0.6rem',color:'var(--text)',fontSize:12}}>
              <option value="">Tous les employés</option>
              {emps.map(e=><option key={e.nom} value={e.nom}>{e.nom}</option>)}
            </select>
            <div className="tabs" style={{margin:0}}>
              {[['today',"Auj."],['semaine','Semaine'],['mois','Mois'],['all','Tout']].map(([k,l])=>(
                <div key={k} className={`tab${histTab===k?' active':''}`} onClick={()=>setHistTab(k)}>{l}</div>
              ))}
            </div>
          </div>
          <div className="scroll-area" style={{maxHeight:380}}>
            <table className="htable">
              <thead><tr><th>Employé</th><th>Type</th><th>Date</th><th>Heure</th><th>Job</th><th>Dépl.</th><th>Note</th></tr></thead>
              <tbody>
                {getHist().map((p,i)=>{
                  const emp=eMap[p.nom];
                  return(
                    <tr key={i}>
                      <td><div style={{display:'flex',alignItems:'center',gap:6}}>{emp&&<div className="emp-av" style={{background:emp.couleur,width:20,height:20,fontSize:8}}>{emp.code}</div>}{p.nom}</div></td>
                      <td><span className={`badge ${p.type==='in'?'badge-in':'badge-out'}`}>{p.type==='in'?'IN':'OUT'}</span></td>
                      <td>{p.date}</td><td>{p.heure}</td>
                      <td style={{fontSize:11,color:'var(--muted)',maxWidth:120,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.job||'—'}</td>
                      <td>{p.deplacement>0?<span className="badge badge-travel">🚗{p.deplacement}m</span>:'—'}</td>
                      <td style={{fontSize:11,color:'var(--muted)',maxWidth:100,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.note||'—'}</td>
                    </tr>
                  );
                })}
                {getHist().length===0&&<tr><td colSpan={7} style={{textAlign:'center',color:'var(--muted)',padding:'1rem'}}>Aucun pointage</td></tr>}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {tab==='jobs-stats'&&(
        <div className="card">
          <div className="card-title">Heures par job/chantier</div>
          <table className="htable">
            <thead><tr><th>Job</th><th>Heures totales</th><th>Déplacements</th><th>Nb punchages</th></tr></thead>
            <tbody>
              {getJobStats().map((j,i)=>(
                <tr key={i}>
                  <td style={{fontWeight:500}}>{j.job}</td>
                  <td><strong>{j.heures}h</strong></td>
                  <td>{j.deplacement>0?`🚗 ${j.deplacement} min`:'—'}</td>
                  <td>{j.count}</td>
                </tr>
              ))}
              {getJobStats().length===0&&<tr><td colSpan={4} style={{textAlign:'center',color:'var(--muted)',padding:'1rem'}}>Aucune donnée par job encore</td></tr>}
            </tbody>
          </table>
        </div>
      )}

      {tab==='banque'&&(
        <div>
          {pending.length>0&&(
            <div className="card" style={{marginBottom:'0.85rem',borderColor:'rgba(210,153,34,0.3)'}}>
              <div className="card-title">⚠️ Demandes en attente ({pending.length})</div>
              {pending.map(b=>{
                const emp=eMap[b.nom];
                return(
                  <div key={b.row} className="bank-row">
                    <div style={{display:'flex',alignItems:'center',gap:8}}>
                      {emp&&<div className="emp-av" style={{background:emp.couleur}}>{emp.code}</div>}
                      <div><div style={{fontWeight:500,fontSize:12}}>{b.nom}</div><div style={{fontSize:11,color:'var(--muted)'}}>Sem. {b.semaine}</div></div>
                    </div>
                    <div style={{fontFamily:'var(--font-head)',fontWeight:700,color:'var(--warning)'}}>+{b.heures}h</div>
                    <div style={{display:'flex',gap:5}}>
                      <button className="btn-sm btn-approve" onClick={()=>handleBanque(b,'approved')}>✓ Approuver</button>
                      <button className="btn-sm btn-deny" onClick={()=>handleBanque(b,'denied')}>✕</button>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
          <div className="card">
            <div className="card-title">Historique heures en banque</div>
            <table className="htable">
              <thead><tr><th>Employé</th><th>Semaine</th><th>Heures</th><th>Statut</th><th>Date</th></tr></thead>
              <tbody>
                {banque.map((b,i)=>(
                  <tr key={i}>
                    <td>{b.nom}</td><td>{b.semaine}</td><td>+{b.heures}h</td>
                    <td><span className={`badge ${b.statut==='approved'?'badge-in':b.statut==='pending'?'badge-pend':'badge-out'}`}>{b.statut==='approved'?'Approuvé':b.statut==='pending'?'En attente':'Refusé'}</span></td>
                    <td>{b.date}</td>
                  </tr>
                ))}
                {banque.length===0&&<tr><td colSpan={5} style={{textAlign:'center',color:'var(--muted)',padding:'1rem'}}>Aucune heure en banque</td></tr>}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {tab==='agenda'&&(
        <div className="card">
          <div className="card-title">Agenda — 14 prochains jours</div>
          <div style={{fontSize:11,color:'var(--muted)',marginBottom:'0.85rem'}}>Les employés sont détectés si leur nom ou code apparaît dans le titre ou la description.</div>
          {jobs.length===0?<div style={{color:'var(--muted)',fontSize:13}}>Aucun événement.</div>:
          jobs.map(j=>{
            const ass=getAssignees(j);
            return(
              <div key={j.id} className="job-item" style={{borderLeftColor:j.gcalColor}}>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <div style={{width:10,height:10,borderRadius:'50%',background:j.gcalColor,flexShrink:0}}></div>
                  <div style={{fontWeight:600,fontSize:13}}>{j.title}</div>
                </div>
                <div style={{fontSize:11,color:'var(--muted)',marginTop:2,marginLeft:18}}>{new Date(j.start).toLocaleDateString('fr-CA',{weekday:'long',month:'long',day:'numeric'})} {j.location?`· ${j.location}`:''}</div>
                {ass.length>0&&<div style={{marginTop:5,marginLeft:18}}>{ass.map(a=><span key={a.nom} className="achip" style={{background:rgba(a.couleur,0.2),color:a.couleur}}><span style={{width:6,height:6,borderRadius:'50%',background:a.couleur,display:'inline-block'}}></span>{a.nom}</span>)}</div>}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ── MAIN APP ──────────────────────────────────────────────────────────────────
function App() {
  const [cfg,setCfg]=useState(()=>{try{return JSON.parse(localStorage.getItem('pp_cfg')||'null');}catch{return null;}});
  const [showCfg,setShowCfg]=useState(!cfg);
  const [authed,setAuthed]=useState(false);
  const [userEmail,setUserEmail]=useState('');
  const [isBoss,setIsBoss]=useState(false);
  const [view,setView]=useState('punch');
  const [emps,setEmps]=useState([]);
  const [refreshKey,setRefreshKey]=useState(0);
  const [notif,setNotif]=useState(null);
  const [authLoading,setAuthLoading]=useState(false);
  const [libsReady,setLibsReady]=useState(false);

  function notify(msg,type='success'){setNotif({msg,type,id:Date.now()});}
  function onRefresh(){setRefreshKey(k=>k+1);}

  function getCalendarIds(){
    if(!cfg?.calendarIds)return['primary'];
    const ids=cfg.calendarIds.split(',').map(e=>e.trim()).filter(Boolean);
    return ids.length?ids:['primary'];
  }

  async function onToken(resp){
    if(resp.error){setAuthLoading(false);notify('Erreur Google: '+resp.error,'err');return;}
    let email='';
    try{
      const token=gapi.client.getToken();
      if(token?.access_token){
        const r=await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{'Authorization':'Bearer '+token.access_token}});
        const d=await r.json();
        email=(d.email||'').toLowerCase().trim();
      }
    }catch(e){console.error(e);}
    console.log('Email:', email);
    const boss=BOSS_EMAILS.includes(email);
    console.log('Boss:', boss);
    setUserEmail(email||'connecté');
    setIsBoss(boss);
    setView('punch');
    let cur;try{cur=JSON.parse(localStorage.getItem('pp_cfg')||'null');}catch{cur=cfg;}
    await ensureStructure(cur.spreadsheetId);
    setEmps(await getEmployees(cur.spreadsheetId));
    setAuthed(true);
    setAuthLoading(false);
    notify(`✅ ${email}${boss?' 👑 Administrateur':''}`, 'success');
    onRefresh();
  }

  async function loadLibs(config){
    try{await initLibs(config,onToken);setLibsReady(true);}
    catch(e){console.error(e);notify('Erreur APIs Google','err');}
  }

  useEffect(()=>{if(cfg)loadLibs(cfg);},[cfg]);
  useEffect(()=>{if(authed&&cfg)getEmployees(cfg.spreadsheetId).then(setEmps);},[refreshKey,authed]);

  function handleAuth(){
    if(!libsReady){notify('APIs en chargement, réessaie dans 2s...','warn');return;}
    setAuthLoading(true);
    tokenClient.requestAccessToken({prompt:'select_account'});
  }
  function handleSaveCfg(config){
    localStorage.setItem('pp_cfg',JSON.stringify(config));
    setCfg(config);setShowCfg(false);setAuthed(false);setLibsReady(false);tokenClient=null;
    loadLibs(config);
  }
  function handleSwitch(){
    setAuthed(false);setUserEmail('');setIsBoss(false);setAuthLoading(true);
    tokenClient.requestAccessToken({prompt:'select_account'});
  }
  function handleReset(){
    if(!confirm('Réinitialiser?'))return;
    localStorage.removeItem('pp_cfg');
    setCfg(null);setAuthed(false);setShowCfg(true);setLibsReady(false);tokenClient=null;
  }

  return (
    <div className="app-wrap">
      {showCfg&&<ConfigModal initial={cfg} onSave={handleSaveCfg}/>}
      {notif&&<Notif key={notif.id} msg={notif.msg} type={notif.type} onClose={()=>setNotif(null)}/>}
      <div className="topbar">
        <div className="logo">⚡ Saran Électrique</div>
        <div className="topbar-right">
          {authed?(
            <>
              <div className="online-badge"><div className="online-dot"></div>{userEmail.split('@')[0]}</div>
              <div className="nav-tabs">
                <div className={`nav-tab${view==='punch'?' active':''}`} onClick={()=>setView('punch')}>Punch</div>
                {isBoss&&<div className={`nav-tab admin${view==='admin'?' active':''}`} onClick={()=>setView('admin')}>Administration</div>}
              </div>
              <button className="btn-s" style={{fontSize:11,padding:'0.25rem 0.5rem'}} onClick={onRefresh}>↻</button>
            </>
          ):(
            <button className="btn-p" style={{width:'auto',padding:'0.4rem 1rem',fontSize:12,marginTop:0}} onClick={handleAuth} disabled={authLoading||!libsReady}>
              {authLoading?'⏳ Connexion...':'🔐 Connexion Google'}
            </button>
          )}
          <SettingsMenu userEmail={userEmail} isBoss={isBoss} onSwitch={handleSwitch} onEditCfg={()=>setShowCfg(true)} onReset={handleReset}/>
        </div>
      </div>
      {!authed?(
        <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',flex:1,padding:'3rem 2rem',textAlign:'center'}}>
          <div style={{fontSize:'3rem',marginBottom:'0.65rem'}}>⚡</div>
          <div style={{fontFamily:'var(--font-head)',fontSize:'1.6rem',fontWeight:800,marginBottom:'0.2rem'}}>Saran Électrique</div>
          <div style={{color:'var(--muted)',fontSize:'0.85rem',marginBottom:'2rem'}}>Système de gestion du temps</div>
          <button className="btn-p" style={{width:'auto',padding:'0.7rem 2rem',marginTop:0}} onClick={handleAuth} disabled={authLoading||!libsReady}>
            {authLoading?'⏳ Connexion...':'🔐 Se connecter avec Google'}
          </button>
          {!libsReady&&cfg&&<div style={{color:'var(--muted)',fontSize:11,marginTop:'0.85rem'}}>⏳ Chargement APIs...</div>}
        </div>
      ):(
        <>
          {view==='punch'&&<WelcomeScreen emps={emps} sid={cfg.spreadsheetId} calendarIds={getCalendarIds()} notify={notify} onRefresh={onRefresh}/>}
          {view==='admin'&&isBoss&&<div className="content"><AdminView sid={cfg.spreadsheetId} calendarIds={getCalendarIds()} refreshKey={refreshKey} notify={notify} onRefresh={onRefresh}/></div>}
        </>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
