function ProjectsView({sid,pts,emps,calJobs,isAdmin,notify,calendarIds,onRefresh}){
  const PREFIXES=JOB_PREFIXES; // source unique, partagée avec l'onglet "Par job"
  const STORAGE_KEY='punchpro_projets_v3'; // gardé pour migration
  const [projData,setProjData]=useState({});
  const [addrOverrides,setAddrOverrides]=useState({});
  const [loadingProj,setLoadingProj]=useState(true);
  const [selProj,setSelProj]=useState(null);
  const [editKey,setEditKey]=useState(null);
  const [editPO,setEditPO]=useState('');
  const [editTitre,setEditTitre]=useState('');
  const [editStatut,setEditStatut]=useState('en-cours');
  const [showClosed,setShowClosed]=useState(false);
  const [filterPrefix,setFilterPrefix]=useState('PARTICULIER');
  const [search,setSearch]=useState('');

  // Charger depuis Sheets, avec migration automatique depuis localStorage
  useEffect(()=>{
    if(!sid)return;
    setLoadingProj(true);
    getProjetsFromSheets(sid).then(({projData:pd,addrOverrides:ao})=>{
      if(Object.keys(pd).length===0){
        try{
          const local=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
          const localAddr=JSON.parse(localStorage.getItem('punchpro_addr_overrides')||'{}');
          if(Object.keys(local).length>0){
            setProjData(local);setAddrOverrides(localAddr);
            saveProjetsToSheets(sid,local,localAddr);
            console.log('Migration localStorage→Sheets effectuée');
          }
        }catch{}
      }else{setProjData(pd);setAddrOverrides(ao);}
      setLoadingProj(false);
    });
  },[sid]);

  function saveProjData(d){
    setProjData(d);
    saveProjetsToSheets(sid,d,addrOverrides);
    localStorage.setItem(STORAGE_KEY,JSON.stringify(d));
  }
  function saveAddrOverrides(d){
    setAddrOverrides(d);
    saveProjetsToSheets(sid,projData,d);
    localStorage.setItem('punchpro_addr_overrides',JSON.stringify(d));
  }
  function getPrefix(t){return getJobPrefix(t);}

  const memoResult=useMemo(()=>{
    // Étape 1 — regrouper tous les jobs par adresse brute
    const parAdresse={};
    (calJobs||[]).forEach(j=>{
      const addr=(addrOverrides[j.id]||j.location||'').trim();
      if(!addr)return;
      const key=addr.toLowerCase();
      if(!parAdresse[key])parAdresse[key]={adresse:addr,jobs:[]};
      parAdresse[key].jobs.push(j);
    });

    // Étape 2 — pour chaque adresse, déterminer si une fermeture antérieure doit séparer
    // les événements en plusieurs "générations" de projet (nouveau projet après fermeture)
    const map={};
    Object.entries(parAdresse).forEach(([baseKey,{adresse,jobs}])=>{
      jobs.sort((a,b)=>new Date(a.start)-new Date(b.start));

      // Construire la chaîne de générations en suivant les fermetures successives
      let genIdx=0;
      let currentKey=baseKey;
      let currentJobs=[];
      const flush=()=>{
        if(currentJobs.length===0)return;
        map[currentKey]={key:currentKey,adresse,premierTitre:currentJobs[0].title,jobs:[...currentJobs],heures:0,personnes:new Set()};
      };

      jobs.forEach(j=>{
        const saved=projData[currentKey];
        const dateFermeture=saved?.dateFermeture;
        const estFerme=saved?.statut==='ferme'&&dateFermeture;
        if(estFerme&&new Date(j.start)>new Date(dateFermeture)){
          // Cet événement arrive après la fermeture → nouvelle génération de projet
          flush();
          genIdx++;
          currentKey=baseKey+'#gen'+genIdx;
          currentJobs=[j];
        }else{
          currentJobs.push(j);
        }
      });
      flush();
    });

    // Étape 3 — associer les heures pointées à la bonne génération via le job exact
    (pts||[]).forEach(p=>{
      if(!p.job)return;
      const cj=(calJobs||[]).find(j=>j.title===p.job);
      if(!cj||!cj.location)return;
      // Trouver la génération qui contient ce job précis
      const target=Object.values(map).find(m=>m.jobs.some(j=>j.id===cj.id));
      if(!target)return;
      if(p.type==='out'||p.type==='confirm'){target.heures+=safeFloat(p.heures);if(p.nom)target.personnes.add(p.nom);}
    });

    // Événements SANS adresse — regroupés par préfixe
    const noAddrMap={};
    (calJobs||[]).forEach(j=>{
      if((j.location||'').trim())return; // a une adresse, skip
      const prefix=getPrefix(j.title);
      if(!noAddrMap[prefix])noAddrMap[prefix]=[];
      noAddrMap[prefix].push(j);
    });

    return{
      projets: Object.values(map).map(p=>{
        const saved=projData[p.key]||{};
        const titre=saved.titre||p.premierTitre||p.adresse;
        // Génération suivante d'un projet déjà fermé démarre "en-cours" par défaut (pas hérité)
        const statut=saved.statut||'en-cours';
        return{...p,personnes:[...p.personnes],po:saved.po||'',titre,statut,prefix:getPrefix(titre)};
      }).sort((a,b)=>{const o={'en-cours':0,'a-venir':1,ferme:2};return(o[a.statut]||0)-(o[b.statut]||0)||(a.titre.localeCompare(b.titre));}),
      noAddrMap
    };
  },[calJobs,pts,projData,addrOverrides]);

  const projets=memoResult?.projets||[];
  const noAddrMap=memoResult?.noAddrMap||{};
  const [addAddrJob,setAddAddrJob]=useState(null); // job sans adresse en cours d'édition
  const [confirmCloseNoAddr,setConfirmCloseNoAddr]=useState(null); // id du job sans adresse en attente de confirmation de fermeture
  const [addAddrVal,setAddAddrVal]=useState('');
  const statuts={'en-cours':{label:'En cours',color:'var(--success)',bg:'rgba(63,185,80,0.1)'},'a-venir':{label:'À venir',color:'var(--accent)',bg:'rgba(255,122,26,0.1)'},ferme:{label:'Fermé',color:'var(--muted)',bg:'var(--bg3)'}};

  let actifs=projets.filter(p=>p.statut!=='ferme');
  if(filterPrefix)actifs=actifs.filter(p=>p.prefix===filterPrefix);
  if(search)actifs=actifs.filter(p=>(p.titre+p.adresse+p.po).toLowerCase().includes(search.toLowerCase()));
  const fermes=projets.filter(p=>p.statut==='ferme');
  const prefixCounts={};
  projets.filter(p=>p.statut!=='ferme').forEach(p=>{prefixCounts[p.prefix]=(prefixCounts[p.prefix]||0)+1;});

  function startEdit(p,e){e&&e.stopPropagation();setEditKey(p.key);setEditPO(p.po);setEditTitre(p.titre);setEditStatut(p.statut);}
  function saveEdit(){
    const ancien=projData[editKey]||{};
    const fermePourLaPremiereFois=editStatut==='ferme'&&ancien.statut!=='ferme';
    const reouvert=editStatut!=='ferme'&&ancien.statut==='ferme';
    const u={...projData,[editKey]:{
      ...ancien,po:editPO,titre:editTitre,statut:editStatut,
      dateFermeture:fermePourLaPremiereFois?new Date().toISOString():(reouvert?null:ancien.dateFermeture)
    }};
    saveProjData(u);setEditKey(null);
  }

  // ── VUE DÉTAIL PROJET ──
  if(selProj){
    const projFound=projets.find(x=>x.key===selProj)||null;
    if(!projFound)return null;
    return <ProjDetail p={projFound} projPts={(pts||[]).filter(p2=>{const cj=(calJobs||[]).find(j=>j.title===p2.job);return cj&&(addrOverrides[cj.id]||cj.location||'').trim().toLowerCase()===selProj;})} calJobs={calJobs} statuts={statuts} calendarIds={calendarIds} notify={notify} projData={projData} saveProjData={saveProjData} addrOverrides={addrOverrides} saveAddrOverrides={saveAddrOverrides} onBack={()=>setSelProj(null)} allProjets={projets} isAdmin={isAdmin}/>;
  }


  // ── LISTE DES PROJETS ──
  const fermesFiltered=filterPrefix?fermes.filter(p=>p.prefix===filterPrefix):fermes;
  const displayList=showClosed?fermesFiltered:actifs;
  return(
    <div style={{maxWidth:isAdmin?960:620,width:'100%'}}>
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:'0.6rem',flexWrap:'wrap'}}>
        <div style={{fontFamily:'var(--font-head)',fontWeight:700,fontSize:'0.95rem',flex:1}}>
          Projets <span style={{fontSize:11,color:'var(--muted)',fontWeight:400}}>({showClosed?fermes.length:actifs.length})</span>
        </div>
        {onRefresh&&(
          <button className="btn-s" style={{fontSize:11,padding:'0.22rem 0.6rem',flexShrink:0}}
            onClick={()=>{onRefresh();notify&&notify('🔄 Actualisation...','success');}}>
            ↻ Actualiser
          </button>
        )}
        <div style={{display:'flex',gap:'0.3rem',flexWrap:'wrap'}}>
          <div onClick={()=>{setShowClosed(false);setFilterPrefix(null);}} style={{padding:'0.22rem 0.65rem',borderRadius:8,fontSize:11,cursor:'pointer',touchAction:'manipulation',fontWeight:!showClosed?700:400,background:!showClosed?'rgba(255,122,26,0.15)':'var(--bg3)',border:'1px solid '+(!showClosed?'var(--accent)':'var(--border)'),color:!showClosed?'var(--accent)':'var(--muted)'}}>Actifs</div>
          <div onClick={()=>setShowClosed(true)} style={{padding:'0.22rem 0.65rem',borderRadius:8,fontSize:11,cursor:'pointer',touchAction:'manipulation',fontWeight:showClosed?700:400,background:showClosed?'rgba(100,100,100,0.15)':'var(--bg3)',border:'1px solid '+(showClosed?'var(--muted)':'var(--border)'),color:'var(--muted)'}}>
            Fermés {fermes.length>0&&'('+fermes.length+')'}
          </div>
        </div>
      </div>
      {!showClosed&&(
        <div style={{display:'flex',gap:'0.3rem',flexWrap:'wrap',marginBottom:'0.5rem'}}>
          {['PARTICULIER',...PREFIXES].map(p=>{
            const count=prefixCounts[p]||0;
            if(count===0)return null;
            return(<div key={p} onClick={()=>setFilterPrefix(filterPrefix===p?null:p)} style={{padding:'0.2rem 0.6rem',borderRadius:8,fontSize:11,cursor:'pointer',touchAction:'manipulation',fontWeight:filterPrefix===p?700:400,background:filterPrefix===p?'rgba(255,122,26,0.15)':'var(--bg3)',border:'1px solid '+(filterPrefix===p?'var(--accent)':'var(--border)'),color:filterPrefix===p?'var(--accent)':'var(--muted)'}}>
              {p} <span style={{fontSize:9,opacity:0.7}}>{count}</span>
            </div>);
          })}
        </div>
      )}
      {!showClosed&&(<input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Rechercher..." style={{width:'100%',marginBottom:'0.5rem',fontSize:12}}/>)}
      {showClosed&&(
        <div style={{display:'flex',gap:'0.3rem',flexWrap:'wrap',marginBottom:'0.5rem'}}>
          {['PARTICULIER',...PREFIXES].map(pfx=>{
            const count=fermes.filter(x=>x.prefix===pfx).length;
            if(count===0)return null;
            return(<div key={pfx} onClick={()=>setFilterPrefix(filterPrefix===pfx?null:pfx)} style={{padding:'0.2rem 0.6rem',borderRadius:8,fontSize:11,cursor:'pointer',touchAction:'manipulation',fontWeight:filterPrefix===pfx?700:400,background:filterPrefix===pfx?'rgba(100,100,100,0.15)':'var(--bg3)',border:'1px solid '+(filterPrefix===pfx?'var(--muted)':'var(--border)'),color:'var(--muted)'}}>
              {pfx} <span style={{fontSize:9,opacity:0.7}}>{count}</span>
            </div>);
          })}
        </div>
      )}
      {displayList.length===0&&!showClosed&&projets.length===0&&(<div style={{background:'var(--bg3)',borderRadius:10,padding:'1.5rem',textAlign:'center',color:'var(--muted)',fontSize:12}}>Ajoutez des adresses dans vos événements Google Agenda.</div>)}
      {showClosed&&fermesFiltered.length===0&&(<div style={{background:'var(--bg3)',borderRadius:10,padding:'1.5rem',textAlign:'center',color:'var(--muted)',fontSize:12}}>Aucun projet fermé.</div>)}
      {showClosed&&fermesFiltered.map(p=>{
        const s=statuts[p.statut]||statuts['en-cours'];
        const isEditing=editKey===p.key;
        return(
          <div key={p.key} style={{background:'var(--bg2)',borderRadius:12,padding:'0.75rem 0.85rem',marginBottom:'0.5rem',border:'1px solid var(--border)',borderLeft:'4px solid '+s.color,cursor:'pointer'}} onClick={()=>!isEditing&&setSelProj(p.key)}>
            {isEditing?(
              <div onClick={e=>e.stopPropagation()}>
                <div style={{marginBottom:'0.4rem'}}><span style={{fontSize:10,color:'var(--muted)'}}>Titre</span><input value={editTitre} onChange={e=>setEditTitre(e.target.value)} style={{width:'100%',fontSize:12,marginTop:3}}/></div>
                <div style={{marginBottom:'0.4rem'}}><span style={{fontSize:10,color:'var(--muted)'}}>PO</span><input value={editPO} onChange={e=>setEditPO(e.target.value)} style={{width:'100%',fontSize:12,marginTop:3}}/></div>
                <div style={{fontSize:10,color:'var(--muted)',marginBottom:8}}>📍 {p.adresse}</div>
                <div style={{display:'flex',gap:'0.35rem',marginBottom:'0.5rem'}}>{Object.entries(statuts).map(([k,v])=>(<div key={k} onClick={e=>{e.stopPropagation();setEditStatut(k);}} style={{padding:'0.2rem 0.6rem',borderRadius:6,fontSize:11,cursor:'pointer',touchAction:'manipulation',fontWeight:editStatut===k?700:400,background:editStatut===k?v.bg:'var(--bg3)',border:'1px solid '+(editStatut===k?v.color:'var(--border)'),color:editStatut===k?v.color:'var(--muted)'}}>{v.label}</div>))}</div>
                <div style={{display:'flex',gap:'0.4rem'}}><button className="btn-p" style={{flex:1,marginTop:0,fontSize:12}} onClick={e=>{e.stopPropagation();saveEdit();}}>✓ Sauvegarder</button><button className="btn-s" style={{fontSize:11}} onClick={e=>{e.stopPropagation();setEditKey(null);}}>Annuler</button></div>
              </div>
            ):(
              <div>
                <div style={{display:'flex',alignItems:'flex-start',gap:8,marginBottom:4}}>
                  <div style={{flex:1,minWidth:0}}><div style={{fontWeight:700,fontSize:13,marginBottom:2}}>{p.titre}</div><div style={{fontSize:10,color:'var(--muted)'}}>📍 {p.adresse}</div>{p.po&&<div style={{fontSize:11,color:'var(--accent)',fontWeight:600,marginTop:2}}>PO: {p.po}</div>}</div>
                  <div style={{display:'flex',gap:4,flexShrink:0,alignItems:'center'}}><div style={{padding:'0.18rem 0.5rem',borderRadius:6,fontSize:10,fontWeight:700,background:s.bg,color:s.color,border:'1px solid '+s.color}}>{s.label}</div><button className="btn-s" style={{fontSize:10,padding:'0.18rem 0.5rem'}} onClick={e=>startEdit(p,e)}>✏️</button></div>
                </div>
                <div style={{display:'flex',gap:10,fontSize:11,color:'var(--muted)',flexWrap:'wrap',marginTop:4}}><span>🗓 {p.jobs.length} événements</span>{p.heures>0&&<span>⏱ {hToQuart(p.heures)}</span>}</div>
                <div style={{fontSize:10,color:'var(--muted)',marginTop:5,textAlign:'right'}}>Appuyer pour détails →</div>
              </div>
            )}
          </div>
        );
      })}
      {!showClosed&&(()=>{
        const enCours=actifs.filter(p=>p.statut==='en-cours');
        const aVenir=actifs.filter(p=>p.statut==='a-venir');
        const autres=actifs.filter(p=>p.statut!=='en-cours'&&p.statut!=='a-venir');
        const cardProps={statuts,editKey,editPO,setEditPO,editTitre,setEditTitre,editStatut,setEditStatut,setEditKey,saveEdit,startEdit,setSelProj,saveProjData,projData};
        return(<>
          {enCours.length>0&&<div style={{marginBottom:'0.25rem'}}><div style={{fontSize:10,fontWeight:700,color:'var(--success)',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:'0.4rem'}}>🟢 En cours ({enCours.length})</div>{enCours.map(p=><ProjCard key={p.key} p={p} {...cardProps}/>)}</div>}
          {aVenir.length>0&&<div style={{marginBottom:'0.25rem'}}>{enCours.length>0&&<div style={{borderTop:'1px solid var(--border)',margin:'0.5rem 0'}}/>}<div style={{fontSize:10,fontWeight:700,color:'var(--accent)',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:'0.4rem'}}>🔵 À venir ({aVenir.length})</div>{aVenir.map(p=><ProjCard key={p.key} p={p} {...cardProps}/>)}</div>}
          {autres.length>0&&<div>{(enCours.length>0||aVenir.length>0)&&<div style={{borderTop:'1px solid var(--border)',margin:'0.5rem 0'}}/>}<div style={{fontSize:10,fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:'0.4rem'}}>Autres</div>{autres.map(p=><ProjCard key={p.key} p={p} {...cardProps}/>)}</div>}
          {actifs.length===0&&<div style={{background:'var(--bg3)',borderRadius:10,padding:'1.5rem',textAlign:'center',color:'var(--muted)',fontSize:12}}>Aucun projet actif trouvé.</div>}
        </>);
      })()}

      {/* Événements SANS adresse — section séparée, groupés par mois, avec statut "Projet en cours" */}
      {!showClosed&&(()=>{
        const prefixKey=filterPrefix||'TOUS';
        // Rassembler tous les events sans adresse selon le filtre
        let noAddrEvents=[];
        if(filterPrefix){
          noAddrEvents=noAddrMap[filterPrefix]||[];
        }else{
          noAddrEvents=Object.values(noAddrMap).flat();
        }
        // Retirer les événements marqués "ignore" (supprimés de la liste par l'utilisateur)
        noAddrEvents=noAddrEvents.filter(j=>(projData['noaddr:'+j.id]||{}).statut!=='ignore');
        if(noAddrEvents.length===0)return null;

        // Grouper par mois (basé sur le premier événement de chaque groupe trié chronologiquement)
        const moisFr=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
        const sorted=[...noAddrEvents].sort((a,b)=>new Date(a.start)-new Date(b.start));
        const parMois={};
        sorted.forEach(j=>{
          const d=new Date(j.start);
          const moisKey=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
          if(!parMois[moisKey])parMois[moisKey]=[];
          parMois[moisKey].push(j);
        });

        // Séparer ceux marqués "en cours" (stockés dans projData sous clé 'noaddr:'+id)
        const estEnCours=j=>(projData['noaddr:'+j.id]||{}).statut==='en-cours';
        const enCoursEvents=sorted.filter(estEnCours);

        return(
          <div style={{marginTop:'0.75rem'}}>
            {/* Section "Projets en cours" sans adresse — séparée, en premier */}
            {enCoursEvents.length>0&&(
              <div style={{marginBottom:'0.75rem'}}>
                <div style={{fontSize:10,fontWeight:700,color:'var(--success)',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:'0.4rem'}}>
                  🟢 Projets en cours sans adresse ({enCoursEvents.length})
                </div>
                {enCoursEvents.map((j,i)=><NoAddrCard key={'ec'+i} j={j} estEnCours={estEnCours} projData={projData} saveProjData={saveProjData}
                  confirmCloseNoAddr={confirmCloseNoAddr} setConfirmCloseNoAddr={setConfirmCloseNoAddr}
                  addAddrJob={addAddrJob} setAddAddrJob={setAddAddrJob} addAddrVal={addAddrVal} setAddAddrVal={setAddAddrVal}
                  addrOverrides={addrOverrides} saveAddrOverrides={saveAddrOverrides} calendarIds={calendarIds} notify={notify}/>)}
              </div>
            )}

            <div style={{fontSize:10,fontWeight:700,color:'var(--warning)',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:'0.4rem'}}>
              ⚠️ Événements sans adresse ({noAddrEvents.length}) — non associés à un projet
            </div>
            {Object.entries(parMois).map(([moisKey,events])=>{
              const [an,m]=moisKey.split('-');
              const eventsRestants=events.filter(j=>!estEnCours(j));
              if(eventsRestants.length===0)return null;
              return(
                <div key={moisKey} style={{marginBottom:'0.6rem'}}>
                  <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:'0.3rem'}}>
                    <div style={{fontSize:10,fontWeight:700,color:'var(--muted)'}}>{moisFr[parseInt(m)-1]} {an}</div>
                    <div style={{flex:1,height:1,background:'var(--border)'}}></div>
                  </div>
                  {eventsRestants.map((j,i)=><NoAddrCard key={moisKey+i} j={j} estEnCours={estEnCours} projData={projData} saveProjData={saveProjData}
                    confirmCloseNoAddr={confirmCloseNoAddr} setConfirmCloseNoAddr={setConfirmCloseNoAddr}
                    addAddrJob={addAddrJob} setAddAddrJob={setAddAddrJob} addAddrVal={addAddrVal} setAddAddrVal={setAddAddrVal}
                    addrOverrides={addrOverrides} saveAddrOverrides={saveAddrOverrides} calendarIds={calendarIds} notify={notify}/>)}
                </div>
              );
            })}
          </div>
        );
      })()}
    </div>
  );
}

// Carte d'un événement sans adresse — composant top-level stable (évite la perte de focus
// du champ de saisie d'adresse qui se produisait quand ce composant était redéfini à chaque rendu)
function NoAddrCard({j,estEnCours,projData,saveProjData,confirmCloseNoAddr,setConfirmCloseNoAddr,addAddrJob,setAddAddrJob,addAddrVal,setAddAddrVal,addrOverrides,saveAddrOverrides,calendarIds,notify}){
  const enCours=estEnCours(j);
  const [confirmDelete,setConfirmDelete]=useState(false);
  const [editingTitre,setEditingTitre]=useState(false);
  const titreActuel=(projData['noaddr:'+j.id]||{}).titre||j.title;
  const [titreVal,setTitreVal]=useState(titreActuel);

  function saveTitre(){
    const t=titreVal.trim();
    if(!t){notify('Le titre ne peut pas être vide','warn');return;}
    const next={...projData,['noaddr:'+j.id]:{...(projData['noaddr:'+j.id]||{}),titre:t}};
    saveProjData(next);
    setEditingTitre(false);
    notify('✅ Titre modifié','success');
  }

  return(
    <div style={{background:'var(--bg2)',borderRadius:8,padding:'0.55rem 0.75rem',marginBottom:'0.35rem',border:'1px solid var(--border)',borderLeft:'4px solid '+(j.gcalColor||'#666'),opacity:enCours?1:0.8}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:8}}>
        <div style={{flex:1,minWidth:0}}>
          {editingTitre?(
            <div style={{marginBottom:4}}>
              <input value={titreVal} onChange={e=>setTitreVal(e.target.value)} autoFocus
                style={{width:'100%',fontSize:12,fontWeight:600,padding:'0.3rem 0.5rem',background:'var(--bg3)',border:'1px solid var(--accent)',borderRadius:6,color:'var(--text)'}}
                onKeyDown={e=>{if(e.key==='Enter')saveTitre();if(e.key==='Escape'){setTitreVal(titreActuel);setEditingTitre(false);}}}/>
              <div style={{display:'flex',gap:5,marginTop:4}}>
                <button className="btn-sm" style={{background:'var(--accent)',color:'white',border:'none'}} onClick={saveTitre}>✓ Sauver</button>
                <button className="btn-sm" style={{background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--muted)'}} onClick={()=>{setTitreVal(titreActuel);setEditingTitre(false);}}>Annuler</button>
              </div>
            </div>
          ):(
            <div style={{display:'flex',alignItems:'center',gap:6}}>
              <div style={{fontWeight:600,fontSize:12}}>{titreActuel}</div>
              <button onClick={()=>{setTitreVal(titreActuel);setEditingTitre(true);}}
                style={{background:'none',border:'none',color:'var(--muted)',cursor:'pointer',fontSize:11,padding:'1px 3px',flexShrink:0}}>✏️</button>
            </div>
          )}
          <div style={{fontSize:10,color:'var(--muted)',marginTop:1}}>{new Date(j.start).toLocaleDateString('fr-CA',{weekday:'short',month:'short',day:'numeric'})}</div>
          {confirmCloseNoAddr===j.id&&(
            <div style={{marginTop:'0.4rem',background:'rgba(248,81,73,0.08)',borderRadius:6,padding:'0.4rem 0.5rem'}}>
              <div style={{fontSize:10,color:'var(--danger)',marginBottom:5}}>Fermer ce projet en cours?</div>
              <div style={{display:'flex',gap:6}}>
                <button className="btn-sm btn-deny" onClick={()=>{
                  const next={...projData,['noaddr:'+j.id]:{...(projData['noaddr:'+j.id]||{}),statut:'ferme'}};
                  saveProjData(next);
                  setConfirmCloseNoAddr(null);
                  notify('Projet fermé','success');
                }}>Oui, fermer</button>
                <button className="btn-sm" style={{background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--muted)'}} onClick={()=>setConfirmCloseNoAddr(null)}>Annuler</button>
              </div>
            </div>
          )}
          {confirmDelete&&(
            <div style={{marginTop:'0.4rem',background:'rgba(248,81,73,0.08)',borderRadius:6,padding:'0.4rem 0.5rem'}}>
              <div style={{fontSize:10,color:'var(--danger)',marginBottom:5}}>Retirer cet événement de la liste?</div>
              <div style={{display:'flex',gap:6}}>
                <button className="btn-sm btn-deny" onClick={()=>{
                  const next={...projData,['noaddr:'+j.id]:{...(projData['noaddr:'+j.id]||{}),statut:'ignore'}};
                  saveProjData(next);
                  setConfirmDelete(false);
                  notify('Événement retiré','success');
                }}>Oui, retirer</button>
                <button className="btn-sm" style={{background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--muted)'}} onClick={()=>setConfirmDelete(false)}>Annuler</button>
              </div>
            </div>
          )}
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:5,alignItems:'flex-end',flexShrink:0}}>
          {enCours?(
            <div onClick={()=>setConfirmCloseNoAddr(j.id)}
              style={{padding:'0.18rem 0.5rem',borderRadius:6,fontSize:10,fontWeight:700,background:'rgba(63,185,80,0.1)',color:'var(--success)',border:'1px solid var(--success)',cursor:'pointer',touchAction:'manipulation',whiteSpace:'nowrap'}}>
              🟢 En cours
            </div>
          ):(
            <button className="btn-s" style={{fontSize:10,padding:'0.18rem 0.5rem',whiteSpace:'nowrap'}}
              onClick={()=>{
                const next={...projData,['noaddr:'+j.id]:{...(projData['noaddr:'+j.id]||{}),statut:'en-cours'}};
                saveProjData(next);
                notify('✅ Marqué comme projet en cours','success');
              }}>
              ▶ Projet en cours
            </button>
          )}
          {addAddrJob===j.id?(
            <div style={{marginTop:'0.2rem'}}>
              <AddressInput value={addAddrVal} onChange={setAddAddrVal} placeholder="Entrer l'adresse..." style={{marginBottom:'0.35rem'}}/>
              <div style={{display:'flex',gap:'0.35rem'}}>
                <button className="btn-p" style={{flex:1,marginTop:0,fontSize:11}}
                  onClick={()=>{
                    if(!addAddrVal.trim()){notify('Entrez une adresse','warn');return;}
                    const adresseFinale=addAddrVal.trim();
                    // 1) Sauvegarder immédiatement (synchrone côté state) — l'UI se met à jour tout de suite
                    //    et l'événement rejoint automatiquement tout projet existant à la même adresse
                    const next={...addrOverrides,[j.id]:adresseFinale};
                    saveAddrOverrides(next);
                    // 2) S'assurer que ce projet (ou la génération courante à cette adresse) est "En cours"
                    //    sauf s'il existe déjà un statut explicite pour cette adresse précise
                    const key=adresseFinale.toLowerCase();
                    if(!projData[key]){
                      const nextProj={...projData,[key]:{statut:'en-cours'}};
                      saveProjData(nextProj);
                    }
                    // Fermer le formulaire et notifier tout de suite — ne pas attendre Calendar
                    setAddAddrJob(null);setAddAddrVal('');
                    notify('✅ Adresse ajoutée — le projet apparaît dans "En cours"','success');
                    // 3) Synchroniser vers Google Calendar en arrière-plan (ne bloque plus l'UI)
                    (async()=>{
                      for(const calId of (calendarIds||['primary'])){
                        try{await gapi.client.calendar.events.patch({calendarId:calId,eventId:j.id,resource:{location:adresseFinale}});break;}
                        catch(e){continue;}
                      }
                    })();
                  }}>✓ Confirmer</button>
                <button className="btn-s" style={{fontSize:11}} onClick={()=>{setAddAddrJob(null);setAddAddrVal('');}}>Annuler</button>
              </div>
            </div>
          ):(
            <button className="btn-s" style={{fontSize:10,padding:'0.2rem 0.5rem',whiteSpace:'nowrap'}}
              onClick={()=>{setAddAddrJob(j.id);setAddAddrVal('');}}>
              + Adresse
            </button>
          )}
          <button className="btn-s" style={{fontSize:10,padding:'0.18rem 0.5rem',whiteSpace:'nowrap',color:'var(--danger)',borderColor:'rgba(248,81,73,0.3)'}}
            onClick={()=>setConfirmDelete(true)}>
            🗑️ Retirer
          </button>
        </div>
      </div>
    </div>
  );
}




// ── JOB SELECTOR ─────────────────────────────────────────────────────────────
// ── FORMULAIRE "CRÉER UN JOB" (partagé Punch IN/Confirmer + Agenda) ────────
// Extrait de JobSelector pour être réutilisable ailleurs (ex: cliquer un
// jour dans l'Agenda et créer un job directement pour cette date).
function CreateJobForm({jobs,allEmps,sid,onCreateJob,initialDate}){
  const [newJobAssignedEmp,setNewJobAssignedEmp]=useState(null); // employé principal — détermine la couleur de l'événement
  const [newJobSecondEmp,setNewJobSecondEmp]=useState(null); // compagnon/apprenti optionnel — initiales seulement, pas de couleur
  const [newJobContractor,setNewJobContractor]=useState('PARTICULIER');
  const [newJobContractorNom,setNewJobContractorNom]=useState('');
  const [newJobPhases,setNewJobPhases]=useState([]); // multi-select, VIDE par défaut — rien n'est présélectionné, l'utilisateur choisit; permet aussi d'en ajouter plus d'un pour créer une job par phase (ex: Rough + Finition) au besoin
  const [newJobPhaseAutre,setNewJobPhaseAutre]=useState('');
  const [phaseDates,setPhaseDates]=useState({}); // date par phase quand plus d'une est sélectionnée — sinon newJobDate partagé
  const [phaseDriveFiles,setPhaseDriveFiles]=useState({}); // fichiers Drive SPÉCIFIQUES à une phase (en plus des fichiers partagés)
  const [newJobStreet,setNewJobStreet]=useState('');
  const [newJobRest,setNewJobRest]=useState('');
  const [newJobKnownAddr,setNewJobKnownAddr]=useState('');
  const [newJobDate,setNewJobDate]=useState(initialDate||new Date().toISOString().split('T')[0]);
  const [newJobAddress,setNewJobAddress]=useState('');
  const [newJobDriveFiles,setNewJobDriveFiles]=useState([]); // fichiers Drive déjà existants à attacher
  const [newJobDescription,setNewJobDescription]=useState(''); // description libre optionnelle, en plus des initiales auto-ajoutées
  const [projData,setProjData]=useState({});
  const [submitting,setSubmitting]=useState(false);

  useEffect(()=>{
    if(initialDate)setNewJobDate(initialDate);
  },[initialDate]);

  // Vrais titres de projets (édités dans l'onglet Projets), pour ne pas se
  // fier au simple titre du dernier événement calendrier à cette adresse.
  useEffect(()=>{
    if(!sid)return;
    getProjetsFromSheets(sid).then(({projData:pd})=>setProjData(pd||{})).catch(()=>{});
  },[sid]);

  function toggleAssignedEmp(nom){
    setNewJobAssignedEmp(prev=>prev===nom?null:nom);
    if(newJobSecondEmp===nom)setNewJobSecondEmp(null); // ne peut pas être principal ET second en même temps
  }
  function toggleSecondEmp(nom){setNewJobSecondEmp(prev=>prev===nom?null:nom);}
  function togglePhase(ph){
    setNewJobPhases(prev=>{
      if(prev.includes(ph)){
        const next=prev.filter(p=>p!==ph);
        return next.length?next:prev; // garder au moins une phase sélectionnée
      }
      return [...prev,ph];
    });
  }
  const assignedEmpObj=(allEmps||[]).find(e=>e.nom===newJobAssignedEmp)||null;
  const secondEmpObj=(allEmps||[]).find(e=>e.nom===newJobSecondEmp)||null;

  const prefix1Txt=newJobContractor==='PARTICULIER'?newJobContractorNom.trim():newJobContractor;
  function phaseLabel(ph){return ph==='AUTRE'?newJobPhaseAutre.trim():JOB_PHASE_LABELS[ph];}
  function titleForPhase(ph){
    // Le code de l'employé PRINCIPAL n'est plus mis dans le titre — sa
    // couleur (sur l'événement) suffit à l'identifier. Seul le 2e employé
    // (compagnon/apprenti) garde son code en texte, puisqu'il n'a pas sa
    // propre couleur sur l'événement.
    return [prefix1Txt,phaseLabel(ph),newJobStreet.trim(),newJobRest.trim(),secondEmpObj?secondEmpObj.code:'']
      .filter(Boolean).join(' - ');
  }
  // Aperçu : un titre par phase sélectionnée (ex: Rough + Finition = 2 jobs créées)
  const previewTitles=newJobPhases.map(ph=>titleForPhase(ph)).filter(Boolean);
  const newJobTitle=previewTitles[0]||''; // utilisé pour le bouton disabled + rétrocompatibilité

  // Projets déjà connus — seulement les vrais "projets" (adresse qui revient
  // sur PLUSIEURS jobs), filtrés sur le contracteur choisi ci-dessus, avec
  // le VRAI titre curé (Projets sheet) plutôt que le titre brut du dernier
  // événement calendrier.
  const knownProjects=useMemo(()=>{
    const map={};
    (jobs||[]).forEach(j=>{
      const loc=(j.location||'').trim();
      if(!loc)return;
      const key=loc.toLowerCase();
      if(!map[key])map[key]={adresse:loc,titre:j.title,count:0,last:j.start};
      map[key].count++;
      if(new Date(j.start)>new Date(map[key].last)){map[key].last=j.start;map[key].titre=j.title;}
    });
    return Object.values(map)
      .map(k=>({...k,titre:(projData[k.adresse.toLowerCase()]&&projData[k.adresse.toLowerCase()].titre)||k.titre}))
      .filter(k=>k.count>1&&getJobPrefix(k.titre)===newJobContractor)
      .sort((a,b)=>b.count-a.count);
  },[jobs,newJobContractor,projData]);

  return(
    <div style={{background:'var(--bg3)',borderRadius:10,padding:'0.75rem',marginBottom:'0.65rem',border:'1px solid var(--border2)'}}>
      <div className="fg" style={{marginBottom:'0.55rem'}}>
        <label style={{color:'var(--accent)'}}>Contracteur</label>
        <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:'0.4rem'}}>
          {[...JOB_PREFIXES,'PARTICULIER'].map(c=>(
            <div key={c} onClick={()=>setNewJobContractor(c)} style={{padding:'0.25rem 0.55rem',borderRadius:7,fontSize:11,fontWeight:700,cursor:'pointer',background:newJobContractor===c?'var(--accent)':'var(--bg2)',color:newJobContractor===c?'#fff':'var(--muted)',border:'1px solid '+(newJobContractor===c?'var(--accent)':'var(--border)')}}>{c==='PARTICULIER'?'PARTICULIER':c}</div>
          ))}
        </div>
        {newJobContractor==='PARTICULIER'&&(
          <input placeholder="Nom du particulier" value={newJobContractorNom} onChange={e=>setNewJobContractorNom(e.target.value)} style={{marginBottom:'0.2rem'}}/>
        )}
      </div>
      <div className="fg" style={{marginBottom:'0.55rem'}}>
        <label style={{color:'var(--accent2)'}}>Type de travail</label>
        <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:'0.4rem'}}>
          {JOB_PHASES.map(ph=>{const sel=newJobPhases.includes(ph);return(
            <div key={ph} onClick={()=>togglePhase(ph)} style={{padding:'0.25rem 0.55rem',borderRadius:7,fontSize:11,fontWeight:700,cursor:'pointer',background:sel?'var(--accent2)':'var(--bg2)',color:sel?'#fff':'var(--muted)',border:'1px solid '+(sel?'var(--accent2)':'var(--border)')}}>{JOB_PHASE_LABELS[ph]}</div>
          );})}
        </div>
        <div style={{fontSize:10,color:'var(--muted)',marginBottom:'0.3rem'}}>Un seul type par défaut. Clique sur un 2e (ex: Finition) seulement si tu veux le faire EN MÊME TEMPS — ça crée une job séparée par type choisi, avec les mêmes fichiers Drive attachés à chacune.</div>
        {newJobPhases.includes('AUTRE')&&(
          <input placeholder="Préciser (ex: Câblage, Inspection...)" value={newJobPhaseAutre} onChange={e=>setNewJobPhaseAutre(e.target.value)} style={{marginBottom:'0.2rem'}}/>
        )}
      </div>
      <div className="fg" style={{marginBottom:'0.5rem'}}>
        <label>Nom de la rue</label>
        <input placeholder="Ex: RUE PRINCIPALE" value={newJobStreet} onChange={e=>setNewJobStreet(e.target.value.toUpperCase())}/>
      </div>
      <div className="fg" style={{marginBottom:'0.5rem'}}>
        <label>Info de la job</label>
        <input placeholder="Ex: 2E ÉTAGE, CUISINE..." value={newJobRest} onChange={e=>setNewJobRest(e.target.value.toUpperCase())}/>
      </div>
      {previewTitles.length>0&&(
        <div style={{marginBottom:'0.5rem',display:'flex',flexDirection:'column',gap:6}}>
          {newJobPhases.map(ph=>{
            const t=titleForPhase(ph);
            if(!t)return null;
            const specFiles=phaseDriveFiles[ph]||[];
            return(
              <div key={ph} style={{background:'var(--bg2)',border:'1px solid var(--border2)',borderRadius:8,padding:'0.5rem 0.7rem'}}>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <div style={{flex:1,fontFamily:'var(--font-head)',fontWeight:700,fontSize:13,color:'var(--text)'}}>{t}</div>
                  {newJobPhases.length>1&&(
                    <div style={{width:'auto',overflow:'hidden',borderRadius:6,boxSizing:'border-box',flexShrink:0}}>
                      <input type="date" value={phaseDates[ph]||newJobDate} onChange={e=>setPhaseDates(prev=>({...prev,[ph]:e.target.value}))}
                        style={{color:'var(--text)',background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:6,padding:'0.3rem 0.5rem',fontSize:11,colorScheme:'dark',cursor:'pointer',boxSizing:'border-box'}}/>
                    </div>
                  )}
                </div>
                {newJobPhases.length>1&&(
                  <div style={{marginTop:6}}>
                    <span onClick={()=>openDrivePicker(files=>setPhaseDriveFiles(prev=>({...prev,[ph]:[...(prev[ph]||[]),...files]})))}
                      style={{fontSize:10,color:'var(--accent)',cursor:'pointer',textDecoration:'underline'}}>
                      📎 Fichier spécifique à {phaseLabel(ph)}
                    </span>
                    {specFiles.length>0&&(
                      <div style={{marginTop:4,display:'flex',flexDirection:'column',gap:3}}>
                        {specFiles.map((f,i)=>(
                          <div key={f.id+i} style={{display:'flex',alignItems:'center',gap:6,background:'var(--bg3)',borderRadius:6,padding:'0.2rem 0.5rem'}}>
                            <span style={{flex:1,fontSize:10,color:'var(--text)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>📄 {f.name}</span>
                            <span onClick={()=>setPhaseDriveFiles(prev=>({...prev,[ph]:prev[ph].filter((_,j)=>j!==i)}))} style={{cursor:'pointer',color:'var(--danger)',fontSize:11,flexShrink:0}}>✕</span>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
      {(allEmps||[]).length>0&&(
        <div className="fg" style={{marginBottom:'0.6rem'}}>
          <label>Employé (couleur de l'événement)</label>
          <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:2}}>
            {/* Pastille de COULEUR PURE seulement — pas d'initiales ici. Sa
                couleur suffit à l'identifier (jobAssignees s'en sert
                indépendamment du texte) ; le nom complet sert de repère
                lisible à côté, plutôt que ses initiales. */}
            {allEmps.map(t=>{const sel=newJobAssignedEmp===t.nom;return(
              <div key={t.nom} onClick={()=>toggleAssignedEmp(t.nom)}
                style={{display:'flex',alignItems:'center',gap:6,padding:'0.22rem 0.6rem 0.22rem 0.22rem',borderRadius:20,cursor:'pointer',
                  background:sel?rgba(t.couleur,0.18):'var(--bg2)',border:'1px solid '+(sel?t.couleur:'var(--border)')}}>
                <div style={{background:t.couleur,width:20,height:20,borderRadius:'50%',flexShrink:0}}/>
                <span style={{fontSize:11,fontWeight:sel?700:500,color:sel?t.couleur:'var(--muted)'}}>{t.nom}</span>
              </div>
            );})}
          </div>
          <div style={{fontSize:10,color:'var(--muted)'}}>Celui qui a la job (ex: le compagnon avec le camion) — sa couleur devient celle de l'événement.</div>
        </div>
      )}
      {assignedEmpObj&&(allEmps||[]).length>1&&(
        <div className="fg" style={{marginBottom:'0.6rem'}}>
          <label>Avec qui? (optionnel — initiales ajoutées au titre)</label>
          <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:2}}>
            {allEmps.filter(t=>t.nom!==newJobAssignedEmp).map(t=>{const sel=newJobSecondEmp===t.nom;return(
              <div key={t.nom} onClick={()=>toggleSecondEmp(t.nom)}
                style={{display:'flex',alignItems:'center',gap:5,padding:'0.22rem 0.5rem 0.22rem 0.22rem',borderRadius:20,cursor:'pointer',
                  background:sel?rgba(t.couleur,0.18):'var(--bg2)',border:'1px solid '+(sel?t.couleur:'var(--border)')}}>
                <div className="emp-av" style={{background:t.couleur,width:20,height:20,fontSize:8,flexShrink:0}}>{t.code}</div>
                <span style={{fontSize:11,fontWeight:sel?700:500,color:sel?t.couleur:'var(--muted)'}}>{t.code}</span>
              </div>
            );})}
          </div>
          <div style={{fontSize:10,color:'var(--muted)'}}>Ex: un compagnon avec un apprenti — l'initiale s'ajoute à la fin du titre, sans changer la couleur.</div>
        </div>
      )}
      {knownProjects.length>0&&(
        <div className="fg" style={{marginBottom:'0.5rem'}}>
          <label>Projet</label>
          {/* Liste de cartes cliquables au lieu d'un <select> natif — plus
              facile à parcourir au doigt (le select natif force à défiler
              une longue liste peu lisible, surtout sur mobile). Déjà
              filtrée par le contracteur choisi plus haut. */}
          <div style={{display:'flex',flexDirection:'column',gap:5,maxHeight:220,overflowY:'auto',border:'1px solid var(--border)',borderRadius:8,padding:5,background:'var(--bg2)'}}>
            <div onClick={()=>{setNewJobKnownAddr('');}}
              style={{padding:'0.4rem 0.6rem',borderRadius:7,cursor:'pointer',touchAction:'manipulation',
                background:!newJobKnownAddr?'rgba(255,122,26,0.15)':'transparent',
                border:'1px solid '+(!newJobKnownAddr?'var(--accent)':'transparent'),
                fontSize:12,fontWeight:!newJobKnownAddr?700:500,color:!newJobKnownAddr?'var(--accent)':'var(--muted)'}}>
              — Nouveau projet —
            </div>
            {knownProjects.map(k=>{const sel=newJobKnownAddr===k.adresse;return(
              <div key={k.adresse} onClick={()=>{
                  setNewJobKnownAddr(k.adresse);
                  setNewJobAddress(k.adresse);setNewJobStreet(parseCivicStreet(k.adresse));
                }}
                style={{padding:'0.4rem 0.6rem',borderRadius:7,cursor:'pointer',touchAction:'manipulation',
                  background:sel?'rgba(255,122,26,0.15)':'transparent',
                  border:'1px solid '+(sel?'var(--accent)':'transparent')}}>
                <div style={{fontSize:12,fontWeight:sel?700:600,color:sel?'var(--accent)':'var(--text)'}}>{k.titre}</div>
                <div style={{fontSize:10,color:'var(--muted)',marginTop:1}}>{k.adresse}</div>
              </div>
            );})}
          </div>
        </div>
      )}
      <div className="fg" style={{marginBottom:'0.4rem'}}><label>Adresse (optionnel)</label><AddressInput value={newJobAddress} onChange={setNewJobAddress} placeholder="Ex: 123 rue Principale, Montréal"/></div>
      <div className="fg" style={{marginBottom:'0.5rem'}}>
        <label>Description (optionnel)</label>
        <textarea value={newJobDescription} onChange={e=>setNewJobDescription(e.target.value)} placeholder="Détails, instructions, notes pour cette job..." rows={3}
          style={{width:'100%',background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:8,padding:'0.55rem 0.75rem',color:'var(--text)',fontSize:13,fontFamily:'inherit',resize:'vertical',boxSizing:'border-box'}}/>
      </div>
      <div className="fg" style={{marginBottom:'0.5rem'}}>
        <label>Fichiers Drive{newJobPhases.length>1?' (partagés — toutes les phases)':' (optionnel)'}</label>
        <button className="btn-s" style={{width:'100%',fontSize:12}} type="button"
          onClick={()=>openDrivePicker(files=>setNewJobDriveFiles(prev=>[...prev,...files]))}>
          📎 Ajouter depuis Drive
        </button>
        {newJobDriveFiles.length>0&&(
          <div style={{marginTop:6,display:'flex',flexDirection:'column',gap:4}}>
            {newJobDriveFiles.map((f,i)=>(
              <div key={f.id+i} style={{display:'flex',alignItems:'center',gap:6,background:'var(--bg2)',borderRadius:6,padding:'0.3rem 0.55rem'}}>
                <span style={{flex:1,fontSize:11,color:'var(--text)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>📄 {f.name}</span>
                <span onClick={()=>setNewJobDriveFiles(prev=>prev.filter((_,j)=>j!==i))} style={{cursor:'pointer',color:'var(--danger)',fontSize:12,flexShrink:0}}>✕</span>
              </div>
            ))}
          </div>
        )}
      </div>
      <div className="fg" style={{marginBottom:'0.55rem'}}>
        <label>Date</label>
        <div style={{width:'100%',overflow:'hidden',borderRadius:8,boxSizing:'border-box'}}>
          <input type="date" value={newJobDate} onChange={e=>setNewJobDate(e.target.value)}
            style={{color:'var(--text)',background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:8,padding:'0.55rem 0.75rem',width:'100%',maxWidth:'100%',minWidth:0,fontSize:13,colorScheme:'dark',cursor:'pointer',minHeight:38,boxSizing:'border-box',display:'block'}}/>
        </div>
      </div>
      <button className="btn-p" style={{marginTop:0}} disabled={!newJobTitle||submitting} onClick={async()=>{
        setSubmitting(true);
        try{
          for(const ph of newJobPhases){
            const title=titleForPhase(ph);
            if(!title)continue;
            const driveFiles=[...newJobDriveFiles,...(phaseDriveFiles[ph]||[])];
            await onCreateJob({title,date:phaseDates[ph]||newJobDate,location:newJobAddress,primaryEmpNom:newJobAssignedEmp,secondEmpNom:newJobSecondEmp,driveFiles,description:newJobDescription});
          }
        }finally{setSubmitting(false);}
      }}>{submitting?'⏳ Création...':'Créer dans l\'agenda'+(newJobPhases.length>1?' ('+newJobPhases.length+' jobs)':'')}</button>
    </div>
  );
}


function JobSelector({jobs,emp,onSelect,onCreateJob,onSkip,mode,allEmps,sid}){
  const [showCreate,setShowCreate]=useState(false);
  const [showAll,setShowAll]=useState(false); // false = aujourd'hui seulement
  const [scope,setScope]=useState('mine'); // 'mine' | 'team'
  const [viewMonth,setViewMonth]=useState(()=>{const d=new Date();d.setDate(1);d.setHours(0,0,0,0);return d;});
  const [selDate,setSelDate]=useState(localDateStr());
  const today=localDateStr();

  function matches(job){
    return isJobForEmployee(job,emp,allEmps);
  }
  function colorMatch(job){return colorDist(job.gcalColor,emp.couleur)<90;}

  // Filtrer: aujourd'hui par défaut, ou tout si showAll
  const todayJobs=jobs.filter(j=>j.start&&jobCouvreDate(j,today));
  const baseJobs=showAll?jobs:todayJobs;
  const scopedJobs=baseJobs.filter(j=>{
    if(scope==='mine')return matches(j);
    if(scope==='team')return !matches(j);
    return true;
  });

  const sorted=[...scopedJobs].sort((a,b)=>{
    const acm=colorMatch(a),bcm=colorMatch(b);
    const am=matches(a),bm=matches(b);
    if(acm&&!bcm)return -1; if(!acm&&bcm)return 1;
    if(am&&!bm)return -1; if(!am&&bm)return 1;
    return new Date(a.start)-new Date(b.start);
  });

  // Indexer TOUS les jobs (pas juste ceux du filtre courant) sur chaque jour
  // couvert — pour la vue calendrier de "Tout l'agenda". IMPORTANT: on
  // n'indexe pas scopedJobs ici, sinon un jour dont l'unique job est filtré
  // par le scope courant (mine/team) apparaît comme complètement vide sur le
  // calendrier, sans aucun indice qu'il faut changer de filtre pour la voir.
  const parDateAll=useMemo(()=>{
    const map={};
    baseJobs.forEach(j=>{
      if(!j.start)return;
      const startStr=localDateStr(new Date(j.start));
      let endStr=startStr;
      if(j.end){
        const isAllDay=j.allDay!==undefined?j.allDay:!String(j.start).includes('T');
        let endD=new Date(j.end);
        if(isAllDay)endD=new Date(endD.getTime()-1);
        endStr=localDateStr(endD);
      }
      let cur=new Date(startStr+'T12:00:00');
      const endD2=new Date(endStr+'T12:00:00');
      let guard=0;
      while(cur<=endD2&&guard<120){
        const dStr=localDateStr(cur);
        if(!map[dStr])map[dStr]=[];
        map[dStr].push(j);
        cur=new Date(cur.getTime()+86400000);
        guard++;
      }
    });
    return map;
  },[baseJobs]);
  const parDate=parDateAll; // dots du calendrier = TOUTE l'activité, indépendamment du filtre mine/team

  const joursFr=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
  const moisFrLong=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  const cYear=viewMonth.getFullYear(),cMonth=viewMonth.getMonth();
  const firstOfMonth=new Date(cYear,cMonth,1);
  const firstWeekday=firstOfMonth.getDay();
  const daysInMonth=new Date(cYear,cMonth+1,0).getDate();
  const monthCells=[];
  for(let i=0;i<firstWeekday;i++)monthCells.push(null);
  for(let d=1;d<=daysInMonth;d++)monthCells.push(new Date(cYear,cMonth,d));
  while(monthCells.length%7!==0)monthCells.push(null);
  function prevMonth(){const d=new Date(viewMonth);d.setMonth(d.getMonth()-1);setViewMonth(d);}
  function nextMonth(){const d=new Date(viewMonth);d.setMonth(d.getMonth()+1);setViewMonth(d);}
  function goTodayCal(){const d=new Date();d.setDate(1);d.setHours(0,0,0,0);setViewMonth(d);setSelDate(today);}
  const selDayJobsAll=(parDate[selDate]||[]).slice().sort((a,b)=>new Date(a.start)-new Date(b.start));
  const selDayJobs=selDayJobsAll.filter(j=>{
    if(scope==='mine')return matches(j);
    if(scope==='team')return !matches(j);
    return true;
  });

  return(
    <div className="job-wrap">
      <div className="section-head">
        <div style={{fontFamily:'var(--font-head)',fontWeight:700,fontSize:'0.92rem'}}>
          {showAll?'Agenda complet':'Jobs aujourd\'hui'}
          <span style={{fontSize:10,color:'var(--muted)',fontWeight:400,marginLeft:6}}>{sorted.length} job{sorted.length!==1?'s':''}</span>
        </div>
        <div style={{display:'flex',gap:'0.35rem',flexWrap:'wrap'}}>
          <button className="btn-s" style={{fontSize:11,padding:'0.22rem 0.6rem',borderColor:showAll?'var(--accent)':'var(--border2)',color:showAll?'var(--accent)':'var(--muted)'}}
            onClick={()=>setShowAll(s=>!s)}>
            {showAll?'📅 Aujourd\'hui':'📋 Tout l\'agenda'}
          </button>
          <button className="btn-s" style={{fontSize:11,padding:'0.22rem 0.6rem'}} onClick={()=>setShowCreate(!showCreate)}>+ Créer</button>
          {mode==='out'&&<button className="btn-s" style={{fontSize:11,padding:'0.22rem 0.6rem'}} onClick={onSkip}>Sans job</button>}
        </div>
      </div>

      {/* Filtre portée : mes jobs / toute l'équipe / les deux */}
      <div style={{display:'flex',gap:6,marginBottom:'0.6rem'}}>
        {[['mine','👤 Mes jobs'],['team','🏗️ Toute l\'équipe']].map(([k,lbl])=>(
          <button key={k} onClick={()=>setScope(k)} className="btn-s" style={{
            fontSize:10,padding:'0.3rem 0.55rem',flex:1,
            background:scope===k?'var(--accent)':'var(--bg3)',
            color:scope===k?'#fff':'var(--text)',fontWeight:scope===k?700:500
          }}>{lbl}</button>
        ))}
      </div>

      {showCreate&&(
        <CreateJobForm jobs={jobs} allEmps={allEmps} sid={sid} onCreateJob={onCreateJob}/>
      )}
      {!showAll&&todayJobs.length===0&&(
        <div style={{background:'rgba(210,153,34,0.1)',borderRadius:8,padding:'0.5rem 0.75rem',marginBottom:'0.5rem',fontSize:11,color:'var(--warning)'}}>
          Aucune job aujourd'hui — <span style={{cursor:'pointer',textDecoration:'underline'}} onClick={()=>setShowAll(true)}>voir tout l'agenda</span>
        </div>
      )}

      {showAll?(
        <div>
          {/* Navigation mois */}
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'0.6rem'}}>
            <button className="btn-s" style={{fontSize:13,padding:'0.3rem 0.65rem'}} onClick={prevMonth}>◀</button>
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <div style={{fontFamily:'var(--font-head)',fontWeight:700,fontSize:13,textTransform:'capitalize'}}>{moisFrLong[cMonth]} {cYear}</div>
              <button className="btn-s" style={{fontSize:10,padding:'0.2rem 0.5rem'}} onClick={goTodayCal}>Aujourd'hui</button>
            </div>
            <button className="btn-s" style={{fontSize:13,padding:'0.3rem 0.65rem'}} onClick={nextMonth}>▶</button>
          </div>

          {/* Grille calendrier */}
          <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:4,marginBottom:'0.85rem'}}>
            {joursFr.map(j=>(
              <div key={j} style={{textAlign:'center',fontSize:9,color:'var(--muted)',fontWeight:700,textTransform:'uppercase',paddingBottom:2}}>{j}</div>
            ))}
            {monthCells.map((d,i)=>{
              if(!d)return <div key={i}/>;
              const dStr=localDateStr(d);
              const dayJobs=parDate[dStr]||[];
              const dayMine=dayJobs.filter(j=>matches(j));
              const dayOther=dayJobs.filter(j=>!matches(j));
              const isToday=dStr===today;
              const isSelected=dStr===selDate;
              return(
                <div key={i} onClick={()=>setSelDate(dStr)} style={{
                  aspectRatio:'1',borderRadius:8,cursor:'pointer',touchAction:'manipulation',
                  display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:3,
                  background:isSelected?'var(--accent)':isToday?'rgba(255,122,26,0.15)':'var(--bg3)',
                  border:isToday&&!isSelected?'1px solid var(--accent)':'1px solid transparent',
                  transition:'background 0.15s'
                }}>
                  <div style={{fontSize:12,fontWeight:isToday||isSelected?800:500,color:isSelected?'#fff':'var(--text)'}}>{d.getDate()}</div>
                  {(dayMine.length>0||dayOther.length>0)&&(
                    <div style={{display:'flex',gap:3}}>
                      {dayMine.length>0&&<span style={{width:5,height:5,borderRadius:'50%',background:isSelected?'#fff':(emp?.couleur||'var(--accent)')}}/>}
                      {dayOther.length>0&&<span style={{width:5,height:5,borderRadius:'50%',background:isSelected?'#fff':'var(--muted)'}}/>}
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          {/* Détail du jour sélectionné */}
          <div style={{borderTop:'1px solid var(--border)',paddingTop:'0.65rem'}}>
            <div style={{fontFamily:'var(--font-head)',fontWeight:700,fontSize:12,marginBottom:'0.5rem',textTransform:'capitalize',color:selDate===today?'var(--accent)':'var(--text)'}}>
              {selDate===today?"Aujourd'hui — ":''}{new Date(selDate+'T12:00:00').toLocaleDateString('fr-CA',{weekday:'long',day:'numeric',month:'long'})}
            </div>
            {selDayJobs.length===0?(
              <div style={{color:'var(--muted)',fontSize:12,padding:'0.5rem 0 1rem'}}>
                {selDayJobsAll.length===0?'Aucun job ce jour-là.':(
                  scope==='mine'
                    ?"Il y a "+selDayJobsAll.length+" job(s) ce jour-là, mais assignée(s) à d'autres — essaie \"Toute l'équipe\" ci-dessus."
                    :"Il y a "+selDayJobsAll.length+" job(s) ce jour-là, mais assignée(s) à toi — essaie \"Mes jobs\" ci-dessus."
                )}
              </div>
            ):(
              selDayJobs.map(job=>{
                const isMatch=matches(job);
                return(
                  <div key={job.id} className="job-btn"
                    style={{borderColor:isMatch?emp.couleur:'var(--border)',borderWidth:isMatch?2:1,borderLeftWidth:4,borderLeftColor:job.gcalColor,background:isMatch?rgba(emp.couleur,0.06):'var(--bg2)'}}
                    onClick={()=>onSelect(job.title,job.gcalColor)}>
                    <div className="job-color-bar" style={{background:job.gcalColor}}></div>
                    <div style={{flex:1}}>
                      <div style={{fontSize:13,fontWeight:600,display:'flex',alignItems:'center',gap:5,flexWrap:'wrap'}}>
                        {job.title}
                        {isMatch&&<span style={{background:rgba(emp.couleur,0.25),color:emp.couleur,fontSize:9,padding:'1px 4px',borderRadius:4,fontWeight:700}}>{'👤'+emp.code}</span>}
                      </div>
                      <div style={{fontSize:11,color:'var(--muted)',marginTop:1}}>
                        {new Date(job.start).toLocaleTimeString('fr-CA',{hour:'2-digit',minute:'2-digit'})}
                        {job.location?' · '+job.location:''}
                      </div>
                    </div>
                  </div>
                );
              })
            )}
          </div>
        </div>
      ):(
        <div>
          {sorted.map(job=>{
            const isToday=job.start&&localDateStr(new Date(job.start))===today;
            const isMatch=matches(job);
            const isCMatch=!isMatch&&colorMatch(job);
            return(
              <div key={job.id} className="job-btn"
                style={{borderColor:isMatch?emp.couleur:'var(--border)',borderWidth:isMatch?2:1,borderLeftWidth:4,borderLeftColor:job.gcalColor,background:isMatch?rgba(emp.couleur,0.06):'var(--bg2)'}}
                onClick={()=>onSelect(job.title,job.gcalColor)}>
                <div className="job-color-bar" style={{background:job.gcalColor}}></div>
                <div style={{flex:1}}>
                  <div style={{fontSize:13,fontWeight:600,display:'flex',alignItems:'center',gap:5,flexWrap:'wrap'}}>
                    {job.title}
                    {isMatch&&<span style={{background:rgba(emp.couleur,0.25),color:emp.couleur,fontSize:9,padding:'1px 4px',borderRadius:4,fontWeight:700}}>{'👤'+emp.code}</span>}
                    {isCMatch&&<span style={{background:rgba(job.gcalColor,0.2),color:job.gcalColor,fontSize:9,padding:'1px 4px',borderRadius:4}}>●</span>}
                  </div>
                  <div style={{fontSize:11,color:'var(--muted)',marginTop:1}}>{new Date(job.start).toLocaleDateString('fr-CA',{weekday:'short',month:'short',day:'numeric'})}{job.location?' · '+job.location:''}</div>
                </div>
                {isToday&&<span style={{background:'rgba(63,185,80,0.15)',color:'var(--success)',fontSize:9,padding:'1px 5px',borderRadius:5,fontWeight:700,flexShrink:0}}>Auj.</span>}
              </div>
            );
          })}
          {sorted.length===0&&(
            <div style={{color:'var(--muted)',textAlign:'center',padding:'1.5rem',fontSize:13}}>
              Aucune job aujourd'hui
              {baseJobs.length>0&&(
                <div style={{fontSize:10,marginTop:6,opacity:0.7}}>
                  ({baseJobs.length} job{baseJobs.length!==1?'s':''} aujourd'hui au total, mais {scope==='mine'?'aucune à ton nom':'toutes à ton nom'} — essaie l'autre filtre ci-dessus)
                </div>
              )}
              {jobs.length===0&&(
                <div style={{fontSize:10,marginTop:6,opacity:0.7}}>
                  (0 job chargé depuis l'agenda Google en ce moment — problème de chargement, pas de filtre)
                </div>
              )}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ── EMPLOYEE HISTORY ──────────────────────────────────────────────────────────
// ── APPEL DE SERVICE ─────────────────────────────────────────────────────────
function AppelDeService({emp,job,adresse,onClose,notify}){
  const [loading,setLoading]=useState(true);
  const [numero,setNumero]=useState('...');
  const [nomClient,setNomClient]=useState('');
  const [telClient,setTelClient]=useState('');
  const [courrielClient,setCourrielClient]=useState('');
  const [sa01,setSa01]=useState(0); // heures compagnon
  const [sa02,setSa02]=useState(0); // heures apprenti
  const [type,setType]=useState('');
  const [prixForfaitaire,setPrixForfaitaire]=useState('');
  const [deplacement,setDeplacement]=useState(false);
  const [quincaillerie,setQuincaillerie]=useState(false);
  const [remarques,setRemarques]=useState('');
  const [materiaux,setMateriaux]=useState({}); // {code_option: {qty,unite,desc}}
  const [expandedCat,setExpandedCat]=useState(null);
  const [stockPerso,setStockPerso]=useState([]);
  const [newItemCode,setNewItemCode]=useState('');
  const [newItemDesc,setNewItemDesc]=useState('');
  const [newItemQty,setNewItemQty]=useState(1);
  const [saving,setSaving]=useState(false);
  const [tab,setTab]=useState('form'); // 'form' | 'materiaux'

  useEffect(()=>{
    (async()=>{
      const {label}=await getProchainNumeroAppel();
      setNumero(label);
      const perso=await getStockPersonnalise();
      setStockPerso(perso);
      setLoading(false);
    })();
  },[]);

  function setQty(key,desc,unite,delta){
    setMateriaux(prev=>{
      const cur=prev[key]?.qty||0;
      const next=Math.max(0,roundedQtyAdd(cur,delta));
      if(next===0){const u={...prev};delete u[key];return u;}
      return {...prev,[key]:{qty:next,unite,desc}};
    });
  }
  function setQtyDirect(key,desc,unite,val){
    const q=parseInt(val)||0;
    setMateriaux(prev=>{
      if(q<=0){const u={...prev};delete u[key];return u;}
      return {...prev,[key]:{qty:q,unite,desc}};
    });
  }

  const totalItems=Object.values(materiaux).reduce((s,v)=>s+v.qty,0);

  async function soumettre(){
    setSaving(true);
    try{
      const numero=await sauvegarderAppelDeService({
        employe:emp.nom,job,adresse,nomClient,telClient,courrielClient,
        sa01,sa02,type,prixForfaitaire,deplacement,quincaillerie,
        materiaux,remarques
      });
      notify('✅ Appel '+numero+' soumis!','success');
      onClose();
    }catch(e){notify('Erreur: '+e.message,'err');}
    setSaving(false);
  }

  async function commander(){
    setSaving(true);
    try{
      const token=gapi.client.getToken()?.access_token;
      if(!token){notify('Pas de token Google','err');setSaving(false);return;}
      const ok=await envoyerCommandeCourriel({employe:emp.nom,job,adresse,materiaux,remarques},token);
      if(ok)notify('✅ Commande envoyée à info@saranelectrique.com!','success');
      else notify('Erreur envoi courriel','err');
    }catch(e){notify('Erreur: '+e.message,'err');}
    setSaving(false);
  }

  async function ajouterItem(){
    if(!newItemCode.trim())return;
    const key=newItemCode.trim();
    const desc=newItemDesc.trim()||key;
    setMateriaux(prev=>({...prev,[key]:{qty:newItemQty,unite:'un',desc}}));
    // Mémoriser dans Stock personnalisé
    const exists=stockPerso.find(s=>s.code===key);
    if(!exists){
      await ajouterStockPersonnalise(key,desc,'un',emp.nom);
      setStockPerso(p=>[...p,{code:key,desc,unite:'un'}]);
    }
    setNewItemCode('');setNewItemDesc('');setNewItemQty(1);
  }

  if(loading)return(<div style={{textAlign:'center',padding:'3rem',color:'var(--muted)'}}>⏳ Chargement...</div>);

  // Tous les items avec quantité > 0
  const selectedItems=Object.entries(materiaux).filter(([,v])=>v.qty>0);

  return(
    <div style={{maxWidth:560,width:'100%'}}>
      {/* En-tête */}
      <div style={{background:'linear-gradient(135deg,#1a237e,#283593)',borderRadius:12,padding:'0.75rem 1rem',marginBottom:'0.75rem'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
          <div>
            <div style={{fontSize:11,color:'rgba(255,255,255,0.7)',marginBottom:2}}>APPEL DE SERVICE</div>
            <div style={{fontFamily:'var(--font-head)',fontWeight:800,fontSize:'1.4rem',color:'#ffffff'}}>{numero}</div>
          </div>
          <button onClick={onClose} style={{background:'rgba(255,255,255,0.15)',border:'none',borderRadius:8,padding:'0.3rem 0.6rem',color:'white',cursor:'pointer',fontSize:12}}>← Retour</button>
        </div>
        {job&&<div style={{fontSize:11,color:'rgba(255,255,255,0.85)',marginTop:6,fontWeight:500}}>{job}</div>}
        {adresse&&<div style={{fontSize:10,color:'rgba(255,255,255,0.7)',marginTop:2}}>📍 {adresse}</div>}
      </div>

      {/* Onglets */}
      <div className="tabs" style={{marginBottom:'0.6rem'}}>
        <div className={'tab'+(tab==='form'?' active':'')} onClick={()=>setTab('form')}>Infos</div>
        <div className={'tab'+(tab==='materiaux'?' active':'')} onClick={()=>setTab('materiaux')}>
          Matériaux {totalItems>0&&<span style={{background:'var(--accent)',color:'white',borderRadius:10,fontSize:9,padding:'1px 5px',marginLeft:4}}>{totalItems}</span>}
        </div>
      </div>

      {tab==='form'&&(
        <div>
          {/* Info client */}
          <div style={{background:'var(--bg3)',borderRadius:10,padding:'0.75rem',marginBottom:'0.6rem'}}>
            <div className="csec" style={{marginBottom:'0.5rem'}}>Client</div>
            <div className="fg" style={{marginBottom:'0.35rem'}}><label>Nom</label><input value={nomClient} onChange={e=>setNomClient(e.target.value)} placeholder="Nom du client"/></div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0.35rem'}}>
              <div className="fg" style={{marginBottom:0}}><label>Téléphone</label><input value={telClient} onChange={e=>setTelClient(e.target.value)} placeholder="(xxx) xxx-xxxx" type="tel"/></div>
              <div className="fg" style={{marginBottom:0}}><label>Courriel</label><input value={courrielClient} onChange={e=>setCourrielClient(e.target.value)} placeholder="@" type="email"/></div>
            </div>
          </div>

          {/* Heures */}
          <div style={{background:'var(--bg3)',borderRadius:10,padding:'0.75rem',marginBottom:'0.6rem'}}>
            <div className="csec" style={{marginBottom:'0.5rem'}}>Heures</div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0.75rem'}}>
              {[['sa01','SA01 — Compagnon',sa01,setSa01],['sa02','SA02 — Apprenti',sa02,setSa02]].map(([id,label,val,setVal])=>(
                <div key={id} style={{textAlign:'center'}}>
                  <div style={{fontSize:10,color:'var(--muted)',marginBottom:6}}>{label}</div>
                  <div style={{display:'grid',gridTemplateColumns:'30px 70px 30px',alignItems:'center',justifyContent:'center',gap:8,margin:'0 auto',width:'fit-content'}}>
                    <button className="dur-btn" style={{width:30,height:30,fontSize:16}} onClick={()=>setVal(v=>Math.max(0,Math.round((v-0.25)*4)/4))}>−</button>
                    <div style={{fontFamily:'var(--font-head)',fontWeight:800,fontSize:'1.3rem',color:'var(--accent)',textAlign:'center'}}>{hToQuart(val)}</div>
                    <button className="dur-btn" style={{width:30,height:30,fontSize:16}} onClick={()=>setVal(v=>Math.round((v+0.25)*4)/4)}>+</button>
                  </div>
                </div>
              ))}
            </div>
          </div>

          {/* Type */}
          <div style={{background:'var(--bg3)',borderRadius:10,padding:'0.75rem',marginBottom:'0.6rem'}}>
            <div className="csec" style={{marginBottom:'0.5rem'}}>Type de travail</div>
            <div style={{display:'flex',gap:'0.4rem',flexWrap:'wrap'}}>
              {['À facturer','Ordre de travail','Prix forfaitaire'].map(t=>(
                <div key={t} onClick={()=>setType(type===t?'':t)}
                  style={{padding:'0.3rem 0.7rem',borderRadius:8,fontSize:11,cursor:'pointer',touchAction:'manipulation',
                    fontWeight:type===t?700:400,
                    background:type===t?'rgba(255,122,26,0.15)':'var(--bg4)',
                    border:'1px solid '+(type===t?'var(--accent)':'var(--border)'),
                    color:type===t?'var(--accent)':'var(--muted)'}}>
                  {t}
                </div>
              ))}
            </div>
            <div style={{display:'flex',gap:'0.4rem',marginTop:'0.4rem',flexWrap:'wrap'}}>
              {[['deplacement','🚗 Déplacement',deplacement,setDeplacement],['quincaillerie','🔧 Quincaillerie',quincaillerie,setQuincaillerie]].map(([id,label,val,setVal])=>(
                <div key={id} onClick={()=>setVal(v=>!v)}
                  style={{padding:'0.3rem 0.7rem',borderRadius:8,fontSize:11,cursor:'pointer',touchAction:'manipulation',
                    fontWeight:val?700:400,
                    background:val?'rgba(255,122,26,0.15)':'var(--bg4)',
                    border:'1px solid '+(val?'var(--accent)':'var(--border)'),
                    color:val?'var(--accent)':'var(--muted)'}}>
                  {label}
                </div>
              ))}
            </div>
            {type==='Prix forfaitaire'&&(
              <div className="fg" style={{marginTop:'0.4rem',marginBottom:0}}>
                <label>Montant ($)</label>
                <input value={prixForfaitaire} onChange={e=>setPrixForfaitaire(e.target.value)} placeholder="ex: 450.00" type="number"/>
              </div>
            )}
          </div>

          {/* Remarques */}
          <div className="fg" style={{marginBottom:'0.6rem'}}><label>Remarques</label><textarea className="note-input" rows={3} value={remarques} onChange={e=>setRemarques(e.target.value)} placeholder="Notes, instructions spéciales..."/></div>
        </div>
      )}

      {tab==='materiaux'&&(
        <div>
          {/* Liste des catégories */}
          {Object.entries(CATALOGUE).map(([cat,items])=>{
            const catQty=items.reduce((s,item)=>{
              const keys=item.options?item.options.map(o=>item.code+'|'+o):[item.code];
              return s+keys.reduce((ss,k)=>ss+(materiaux[k]?.qty||0),0);
            },0);
            const isOpen=expandedCat===cat;
            return(
              <div key={cat} style={{marginBottom:'0.4rem',border:'1px solid var(--border)',borderRadius:10,overflow:'hidden'}}>
                {/* Header catégorie */}
                <div onClick={()=>setExpandedCat(isOpen?null:cat)}
                  style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0.5rem 0.75rem',background:'var(--bg3)',cursor:'pointer',touchAction:'manipulation'}}>
                  <span style={{fontWeight:600,fontSize:12}}>{cat}</span>
                  <div style={{display:'flex',alignItems:'center',gap:8}}>
                    {catQty>0&&<span style={{background:'var(--accent)',color:'white',borderRadius:10,fontSize:9,padding:'1px 6px',fontWeight:700}}>{catQty}</span>}
                    <span style={{color:'var(--muted)',fontSize:11}}>{isOpen?'▼':'▶'}</span>
                  </div>
                </div>
                {/* Items de la catégorie */}
                {isOpen&&(
                  <div style={{background:'var(--bg2)'}}>
                    {items.map((item,ii)=>{
                      // Items avec options (taille ou modèle)
                      if(item.options||item.sizes){
                        const opts=item.options||item.sizes;
                        return(
                          <div key={ii} style={{borderTop:'1px solid var(--border)',padding:'0.5rem 0.75rem'}}>
                            <div style={{fontSize:11,fontWeight:600,color:'var(--text)',marginBottom:6}}>{item.code} — {item.desc}</div>
                            {opts.map(opt=>{
                              const key=item.code+'|'+opt;
                              const qty=materiaux[key]?.qty||0;
                              return(
                                <div key={opt} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0.2rem 0',borderBottom:'1px solid var(--border)'}}>
                                  <span style={{fontSize:11,color:'var(--muted)',flex:1}}>{opt}</span>
                                  <div style={{display:'flex',alignItems:'center',gap:6}}>
                                    <button className="dur-btn" style={{width:26,height:26,fontSize:13}} onClick={()=>setQty(key,item.desc+' '+opt,item.unite,-1)}>−</button>
                                    <div style={{fontFamily:'var(--font-head)',fontWeight:700,fontSize:'1rem',color:qty>0?'var(--accent)':'var(--muted)',minWidth:28,textAlign:'center'}}>{qty||'—'}</div>
                                    <button className="dur-btn" style={{width:26,height:26,fontSize:13}} onClick={()=>setQty(key,item.desc+' '+opt,item.unite,1)}>+</button>
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        );
                      }
                      // Item simple
                      const key=item.code;
                      const qty=materiaux[key]?.qty||0;
                      return(
                        <div key={ii} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0.4rem 0.75rem',borderTop:'1px solid var(--border)'}}>
                          <div style={{flex:1}}>
                            <div style={{fontSize:11,fontWeight:500,color:'var(--text)'}}>{item.code}</div>
                            <div style={{fontSize:10,color:'var(--muted)'}}>{item.desc}</div>
                          </div>
                          <div style={{display:'flex',alignItems:'center',gap:6}}>
                            <button className="dur-btn" style={{width:28,height:28,fontSize:14}} onClick={()=>setQty(key,item.desc,item.unite,-1)}>−</button>
                            <div style={{fontFamily:'var(--font-head)',fontWeight:700,fontSize:'1.1rem',color:qty>0?'var(--accent)':'var(--muted)',minWidth:32,textAlign:'center'}}>{qty||'—'}</div>
                            <button className="dur-btn" style={{width:28,height:28,fontSize:14}} onClick={()=>setQty(key,item.desc,item.unite,1)}>+</button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            );
          })}

          {/* Stock personnalisé mémorisé */}
          {stockPerso.length>0&&(
            <div style={{marginBottom:'0.4rem',border:'1px solid var(--border)',borderRadius:10,overflow:'hidden'}}>
              <div onClick={()=>setExpandedCat(expandedCat==='_perso'?null:'_perso')}
                style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0.5rem 0.75rem',background:'var(--bg3)',cursor:'pointer'}}>
                <span style={{fontWeight:600,fontSize:12}}>⭐ Stock personnalisé</span>
                <span style={{color:'var(--muted)',fontSize:11}}>{expandedCat==='_perso'?'▼':'▶'}</span>
              </div>
              {expandedCat==='_perso'&&(
                <div style={{background:'var(--bg2)'}}>
                  {stockPerso.map((item,ii)=>{
                    const qty=materiaux[item.code]?.qty||0;
                    return(
                      <div key={ii} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0.4rem 0.75rem',borderTop:'1px solid var(--border)'}}>
                        <div style={{flex:1}}>
                          <div style={{fontSize:11,fontWeight:500}}>{item.code}</div>
                          <div style={{fontSize:10,color:'var(--muted)'}}>{item.desc}</div>
                        </div>
                        <div style={{display:'flex',alignItems:'center',gap:6}}>
                          <button className="dur-btn" style={{width:28,height:28,fontSize:14}} onClick={()=>setQty(item.code,item.desc,item.unite,-1)}>−</button>
                          <div style={{fontFamily:'var(--font-head)',fontWeight:700,fontSize:'1.1rem',color:qty>0?'var(--accent)':'var(--muted)',minWidth:32,textAlign:'center'}}>{qty||'—'}</div>
                          <button className="dur-btn" style={{width:28,height:28,fontSize:14}} onClick={()=>setQty(item.code,item.desc,item.unite,1)}>+</button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          {/* Ajouter item libre */}
          <div style={{background:'var(--bg3)',borderRadius:10,padding:'0.75rem',border:'1px dashed var(--border)'}}>
            <div className="csec" style={{marginBottom:'0.5rem'}}>➕ Autre matériau</div>
            <div className="fg" style={{marginBottom:'0.35rem'}}><label>Code / Nom</label><input value={newItemCode} onChange={e=>setNewItemCode(e.target.value)} placeholder="ex: GFTR-BK"/></div>
            <div className="fg" style={{marginBottom:'0.35rem'}}><label>Description</label><input value={newItemDesc} onChange={e=>setNewItemDesc(e.target.value)} placeholder="ex: GFI 15A noir"/></div>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:'0.35rem'}}>
              <label style={{fontSize:10,color:'var(--muted)',flexShrink:0}}>Quantité</label>
              <button className="dur-btn" style={{width:28,height:28,fontSize:14}} onClick={()=>setNewItemQty(q=>Math.max(1,q-1))}>−</button>
              <div style={{fontFamily:'var(--font-head)',fontWeight:700,fontSize:'1.1rem',color:'var(--accent)',minWidth:32,textAlign:'center'}}>{newItemQty}</div>
              <button className="dur-btn" style={{width:28,height:28,fontSize:14}} onClick={()=>setNewItemQty(q=>q+1)}>+</button>
            </div>
            <button className="btn-s" style={{width:'100%',fontSize:11}} onClick={ajouterItem} disabled={!newItemCode.trim()}>
              ➕ Ajouter et mémoriser
            </button>
          </div>

          {/* Résumé sélection */}
          {selectedItems.length>0&&(
            <div style={{marginTop:'0.6rem',background:'var(--bg3)',borderRadius:10,padding:'0.75rem'}}>
              <div className="csec" style={{marginBottom:'0.4rem'}}>Résumé ({selectedItems.length} items)</div>
              {selectedItems.map(([k,v])=>(
                <div key={k} style={{display:'flex',justifyContent:'space-between',fontSize:11,padding:'0.15rem 0',borderBottom:'1px solid var(--border)'}}>
                  <span style={{color:'var(--text)'}}>{v.desc||k}</span>
                  <span style={{color:'var(--accent)',fontWeight:700,minWidth:40,textAlign:'right'}}>×{v.qty}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {/* Boutons d'action */}
      <div style={{display:'flex',flexDirection:'column',gap:'0.4rem',marginTop:'0.75rem'}}>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0.4rem'}}>
          <button className="btn-s" style={{fontSize:12}} disabled={saving||totalItems===0} onClick={commander}>
            {saving?'⏳':'📦'} Commander
          </button>
          <button className="btn-p" style={{marginTop:0,fontSize:12}} disabled={saving} onClick={soumettre}>
            {saving?'⏳ Sauvegarde...':'✅ Soumettre '+numero}
          </button>
        </div>
        <button className="btn-s" style={{fontSize:11,opacity:0.7}} onClick={onClose}>
          💾 Fermer sans soumettre
        </button>
      </div>
    </div>
  );
}

    <div style={{display:'flex',alignItems:'flex-start',gap:8,padding:'0.5rem 0.75rem 0.5rem 2.5rem'}}>
