          {line.jobColor&&<div style={{width:7,height:7,borderRadius:'50%',background:line.jobColor,flexShrink:0}}></div>}
          <span style={{fontSize:12,fontWeight:600,color:'var(--text)'}}>{line.job||'—'}</span>
          {line.heures>0&&<span style={{fontSize:11,color:'var(--success)',fontWeight:700,marginLeft:'auto'}}>{hToQuart(line.heures)}</span>}
        </div>
        {(line.heure||line.heureOut)&&<div style={{fontSize:10,color:'var(--muted)'}}>🕐 {line.heure||'—'}{line.heureOut?' → '+line.heureOut:''}</div>}
        {line.deplacement>0&&<div style={{fontSize:10,color:'var(--muted)'}}>🚗 {line.deplacement} min</div>}
        {line.coequipiers&&line.coequipiers.length>0&&<div style={{fontSize:10,color:'var(--muted)'}}>👥 {line.coequipiers.join(', ')}</div>}
        {line.note&&<div style={{fontSize:10,color:'var(--muted)',fontStyle:'italic',marginTop:2}}>"{line.note}"</div>}

          <div style={{marginTop:3,display:'flex',flexDirection:'column',gap:3}}>
            {line.fichiersURL.map((raw,fi)=>{
              const url=raw.split('|')[0];
              const nom=raw.includes('|')?raw.split('|')[1]:'Voir fichier Drive';
              const icon=nom.startsWith('OT_')?'🔧':nom.startsWith('AP_')?'📋':'📎';
              return(<a key={fi} href={url} target="_blank" rel="noreferrer"
                style={{fontSize:10,color:'var(--accent)',background:'rgba(255,122,26,0.1)',borderRadius:4,padding:'2px 7px',textDecoration:'none',display:'inline-flex',alignItems:'center',gap:4}}>

function EmployeeHistory({emp,sid,notify,folders,calendarIds}){
  const [pts,setPts]=useState([]);
  const [agendaJobs,setAgendaJobs]=useState([]); // jobs de l'agenda — pour choisir plutôt qu'écrire à la main
  const [showAgendaPicker,setShowAgendaPicker]=useState(false);
  const [tab,setTab]=useState('semaine');
  const [loading,setLoading]=useState(true);
  const [sending,setSending]=useState(false);
  const [expandedDate,setExpandedDate]=useState(null);
  const [confirmDeleteKey,setConfirmDeleteKey]=useState(null);
  const [showAddForm,setShowAddForm]=useState(false);
  const [newEntry,setNewEntry]=useState({date:localDateStr(),job:'',heures:8,deplacement:0,note:''});
  // Edit: on stocke la CLÉ (date:li) et la LIGNE complète séparément
  const [editKey,setEditKey]=useState(null);
  const [editLine,setEditLine]=useState(null);
  const [editData,setEditData]=useState({});

  const today=localDateStr();
  const curWeek=getWeek(new Date());
  const curMois=getMois(new Date());
  const [selectedWeek,setSelectedWeek]=useState(curWeek);

  // Calculer la semaine précédente/suivante depuis un label ex: "2026-S23"
  function offsetWeek(weekLabel,delta){
    try{
      const[yr,sw]=weekLabel.split('-S');
      const year=parseInt(yr); const week=parseInt(sw)+delta;
      // Trouver le lundi de cette semaine-numéro
      const jan1=new Date(year,0,1);
      const dayOfWeek=jan1.getDay()||7;
      const monday=new Date(jan1);
      monday.setDate(jan1.getDate()+(week-1)*7-(dayOfWeek-1));
      return getWeek(monday);
    }catch(e){return weekLabel;}
  }

  // Toutes les semaines disponibles dans les pointages (triées)
  const allWeeks=[...new Set(pts.map(p=>p.semaine).filter(Boolean))].sort();
  const selectedWeekIdx=allWeeks.indexOf(selectedWeek);
  const hasPrevWeek=selectedWeekIdx>0;
  const hasNextWeek=selectedWeekIdx<allWeeks.length-1;

  useEffect(()=>{load();},[]);
  // Jobs de l'agenda — pour pouvoir CHOISIR une job existante plutôt que de
  // toujours l'écrire à la main dans "Nouvelle entrée".
  useEffect(()=>{
    if(!calendarIds||!calendarIds.length)return;
    getAllCalendarJobs(calendarIds).then(setAgendaJobs).catch(()=>{});
  },[calendarIds?calendarIds.join(','):'']);
  async function load(){
    setLoading(true);
    const p=await getPointages(sid,{nom:emp.nom});
    // getPointages inclut aussi les lignes "in" d'un collègue qui a puncher
    // pour cet employé (tagué comme coéquipier) — utile ailleurs pour la
    // logique de punch-out du poinçonneur original, mais ici ça crée une
    // ligne fantôme "juste un punch in" en double de la vraie ligne
    // 'confirm' (avec les heures) déjà enregistrée au nom de cet employé.
    // On ne garde que ce qui lui appartient réellement.
    setPts(p.filter(r=>r.nom===emp.nom));
    setLoading(false);
  }

  function getFiltered(){
    if(tab==='today')return pts.filter(p=>p.date===today);
    if(tab==='semaine')return pts.filter(p=>p.semaine===selectedWeek);
    if(tab==='mois')return pts.filter(p=>p.mois===curMois);
    return pts;
  }

  const allLines=combinePts(getFiltered());
  const totalH=Math.round(allLines.reduce((s,l)=>s+(l.heures||0),0)*4)/4;
  const totalDep=Math.round(allLines.reduce((s,l)=>s+(l.deplacement||0),0));
  // OT = heures au-delà de 40h/semaine (pas par journée)
  const totalOT=Math.round(Math.max(0,totalH-40)*4)/4;

  // Vue semaine — grouper par jour
  const joursView=(()=>{
    const map={};
    allLines.forEach(l=>{
      if(!map[l.date])map[l.date]={date:l.date,jobs:[],heures:0,deplacement:0,ouvert:false};
      const d=map[l.date];
      if(l.job&&l.job!=='—'&&!d.jobs.includes(l.job))d.jobs.push(l.job);
      d.heures+=l.heures||0;
      d.deplacement+=l.deplacement||0;
      if(!l.heureOut&&l.type!=='confirm')d.ouvert=true;
    });
    return Object.values(map).sort((a,b)=>a.date.localeCompare(b.date));
  })();

  function openEdit(key,line){
    setEditKey(key);
    setEditLine(line);
    setEditData({date:line.date,job:line.job||'',heures:line.heures||0,deplacement:line.deplacement||0,note:line.note||''});
    // Garder la journée ouverte
    setExpandedDate(line.date);
  }
  function closeEdit(){setEditKey(null);setEditLine(null);}

  async function saveEdit(){
    if(!editLine)return;
    try{
      const row=editLine.outRow||editLine.inRow;
      if(row){
        await updatePointageData(sid,row,{
          ...editData,
          type:editLine.type,
          fichiersURL:editLine.fichiersURL,
          coequipiers:editLine.coequipiers
        });
      }
      await addMessage(sid,emp.nom,'Modification',editLine.date+' — '+editData.job+', '+hToQuart(editData.heures));
      notify('✅ Modifié','success');
      closeEdit();await load();
    }catch(e){notify('Erreur: '+e.message,'err');}
  }

  async function handleDelete(line){
    try{
      if(line.outRow)await deletePointageRow(sid,line.outRow);
      if(line.inRow)await deletePointageRow(sid,line.inRow);
      await addMessage(sid,emp.nom,'Suppression',line.date+' — '+(line.job||'—'));
      notify('Supprimé','success');await load();
    }catch(e){notify('Erreur: '+e.message,'err');}
  }

  // Courriel résumé semaine
  async function confirmerSemaine(){
    setSending(true);
    notify('⏳ Envoi...','warn');
    try{
      const token=gapi.client.getToken();
      if(!token?.access_token){notify('Pas de token','err');setSending(false);return;}
      const banque=emp.heuresBanque||0;
      const joursStr=joursView.map(j=>{
        const d=new Date(j.date+'T12:00:00');
        const jours=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
        const mois=['janvier','fevrier','mars','avril','mai','juin','juillet','aout','septembre','octobre','novembre','decembre'];
        const label=jours[d.getDay()]+' '+d.getDate()+' '+mois[d.getMonth()];
        const h=Math.round(j.heures*4)/4;
        const dayLines=allLines.filter(l=>l.date===j.date);
        let bloc='-- '+label+' --\n';
        dayLines.forEach(l=>{if(l.job)bloc+='  * '+l.job+(l.heures>0?'  '+hToQuart(l.heures):'')+'\n';});
        bloc+='  Total: '+(j.ouvert?'en cours':hToQuart(h))+(j.deplacement>0?'  ('+j.deplacement+' min)':'');
        return bloc;
      }).join('\n\n');
      const body='Bonjour,\n\n'+emp.nom+' confirme sa semaine '+selectedWeek+'.\n\n'+
        '=== DETAIL ===\n\n'+joursStr+'\n\n'+
        '=== RESUME ===\n'+
        'Total heures: '+hToQuart(totalH)+'\n'+
        (totalOT>0?'Heures supp: '+hToQuart(totalOT)+'\n':'')+
        'Banque: '+hToQuart(banque)+'\n'+
        (totalDep>0?'Deplacement total: '+totalDep+' min\n':'')+
        '\nEnvoye depuis PunchPro - Saran Electrique';
      const to='info@saranelectrique.com';
      const subject='Semaine '+selectedWeek+' - '+emp.nom;
      const msgHeader='To: '+to+'\r\nSubject: '+subject+'\r\nContent-Type: text/plain; charset=UTF-8\r\nContent-Transfer-Encoding: base64\r\n\r\n';
      const bodyBytes=new TextEncoder().encode(body);
      let b64='';
      for(let i=0;i<bodyBytes.length;i+=57){
        const chunk=bodyBytes.slice(i,i+57);
        let bin='';chunk.forEach(b=>bin+=String.fromCharCode(b));
        b64+=btoa(bin)+'\r\n';
      }
      const fullMsg=msgHeader+b64;
      // Encode safely - header is ASCII, full message safe for latin1 btoa
      const fullBytes2=new Uint8Array(fullMsg.length);
      for(let i=0;i<fullMsg.length;i++) fullBytes2[i]=fullMsg.charCodeAt(i)&0xff;
      let fullBin2='';fullBytes2.forEach(b=>fullBin2+=String.fromCharCode(b));
      const encoded=btoa(fullBin2).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
      const res=await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/send',{
        method:'POST',
        headers:{'Authorization':'Bearer '+token.access_token,'Content-Type':'application/json'},
        body:JSON.stringify({raw:encoded})
      });
      if(res.ok){notify('✅ Courriel envoyé!','success');}
      else{const err=await res.json();notify('Erreur: '+(err?.error?.message||res.status),'err');}
    }catch(e){notify('Erreur: '+e.message,'err');}
    setSending(false);
  }

  // Composant carte de ligne (jour détail)


  return(
    <div style={{maxWidth:560,width:'100%',textAlign:'left'}}>
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:'0.75rem'}}>
        <div className="emp-av" style={{background:emp.couleur,width:36,height:36,fontSize:12}}>{emp.code}</div>
        <div style={{flex:1}}>
          <div style={{fontFamily:'var(--font-head)',fontWeight:700,fontSize:'1rem'}}>{emp.nom}</div>
          <div style={{fontSize:11,color:'var(--muted)'}}>Banque : <strong style={{color:'var(--accent)'}}>{hToQuart(emp.heuresBanque||0)}</strong></div>
        </div>
      </div>
      {/* Navigation semaine */}
      {tab==='semaine'&&(
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',background:'var(--bg3)',borderRadius:8,padding:'0.35rem 0.6rem',marginBottom:'0.6rem'}}>
          <button className="btn-sm" style={{background:'var(--bg2)',border:'1px solid var(--border)',color:hasPrevWeek?'var(--text)':'var(--muted)',padding:'0.2rem 0.6rem',fontSize:13,touchAction:'manipulation'}}
            disabled={!hasPrevWeek} onClick={()=>setSelectedWeek(allWeeks[selectedWeekIdx-1])}>
            ← Préc.
          </button>
          <div style={{textAlign:'center'}}>
            <div style={{fontSize:12,fontWeight:700,color:'var(--text)'}}>{weekRangeLabel(selectedWeek).label}</div>
            {selectedWeek===curWeek&&<div style={{fontSize:9,color:'var(--accent)'}}>Semaine en cours</div>}
          </div>
          <button className="btn-sm" style={{background:'var(--bg2)',border:'1px solid var(--border)',color:hasNextWeek?'var(--text)':'var(--muted)',padding:'0.2rem 0.6rem',fontSize:13,touchAction:'manipulation'}}
            disabled={!hasNextWeek} onClick={()=>setSelectedWeek(allWeeks[selectedWeekIdx+1])}>
            Suiv. →
          </button>
        </div>
      )}
      <div className="stats-grid" style={{marginBottom:'0.75rem'}}>
        <div className="stat-box"><div className="val">{hToQuart(totalH)}</div><div className="lbl">Heures</div></div>
        <div className="stat-box"><div className="val" style={{color:totalOT>0?'var(--warning)':'var(--muted)'}}>{totalOT>0?hToQuart(totalOT):'—'}</div><div className="lbl">OT</div></div>
        <div className="stat-box"><div className="val">{totalDep>0?totalDep+'m':'—'}</div><div className="lbl">Dépl.</div></div>
        <div className="stat-box"><div className="val">{joursView.length}</div><div className="lbl">Jours</div></div>
      </div>
      <div className="tabs" style={{marginBottom:'0.6rem'}}>
        {[['today',"Auj."],['semaine','Semaine'],['mois','Mois'],['all','Tout']].map(([k,l])=>(
          <div key={k} className={'tab'+(tab===k?' active':'')} onClick={()=>setTab(k)}>{l}</div>
        ))}
      </div>
      {loading?<div style={{color:'var(--muted)',textAlign:'center',padding:'2rem'}}>⏳</div>:(

// ── WELCOME SCREEN ────────────────────────────────────────────────────────────
// ── ADDRESS INPUT with Google Places autocomplete ────────────────────────────
function AddressInput({value,onChange,placeholder,style}){
  const [suggestions,setSuggestions]=useState([]);
  const [showSugg,setShowSugg]=useState(false);
  const debounceRef=useRef(null);
  const wrapRef=useRef(null);
  const mouseDownRef=useRef(false);

  useEffect(()=>{
    const handler=e=>{if(wrapRef.current&&!wrapRef.current.contains(e.target))setShowSugg(false);};
    document.addEventListener('mousedown',handler);
    return()=>document.removeEventListener('mousedown',handler);
  },[]);

  async function fetchSuggestions(text){
    if(!text||text.length<3){setSuggestions([]);setShowSugg(false);return;}
    if(!window.google?.maps?.importLibrary)return;
    try{
      const {AutocompleteSuggestion}=await window.google.maps.importLibrary('places');
      const {suggestions:results}=await AutocompleteSuggestion.fetchAutocompleteSuggestions({
        input:text,includedRegionCodes:['ca'],includedPrimaryTypes:['street_address','premise','route']
      });
      if(results&&results.length>0){
        setSuggestions(results.map(r=>r.placePrediction?.text?.text).filter(Boolean));
        setShowSugg(true);
      }else{setSuggestions([]);setShowSugg(false);}
    }catch(e){console.error('Erreur autocomplete adresse:',e);setSuggestions([]);setShowSugg(false);}
  }

  function handleChange(e){
    const v=e.target.value;onChange(v);
    clearTimeout(debounceRef.current);
    debounceRef.current=setTimeout(()=>fetchSuggestions(v),300);
  }

  function handleBlur(){
    setTimeout(()=>{if(!mouseDownRef.current)setShowSugg(false);mouseDownRef.current=false;},200);
  }

  return(
    <div ref={wrapRef} style={{position:'relative',width:'100%',...(style||{})}}>
      <input value={value} onChange={handleChange} onBlur={handleBlur}
        onFocus={()=>suggestions.length>0&&setShowSugg(true)}
        placeholder={placeholder||'Adresse...'} style={{width:'100%'}}/>
      {showSugg&&suggestions.length>0&&(
        <div style={{position:'absolute',top:'calc(100% + 2px)',left:0,right:0,zIndex:9999,
          background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:8,
          boxShadow:'0 6px 20px rgba(0,0,0,0.5)',maxHeight:200,overflowY:'auto'}}>
          {suggestions.map((s,i)=>(
            <div key={i}
              onMouseDown={e=>{e.preventDefault();mouseDownRef.current=true;onChange(s);setSuggestions([]);setShowSugg(false);}}
              style={{padding:'0.45rem 0.75rem',fontSize:12,cursor:'pointer',
                borderBottom:i<suggestions.length-1?'1px solid var(--border)':'none',
                color:'var(--text)',background:'transparent'}}
              onMouseEnter={e=>e.currentTarget.style.background='var(--bg3)'}
              onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
              📍 {s}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function AgendaEmp({jobs,emp,notify,onBack,calendarIds,sid,allEmps,onJobsRefresh,onPickJob,initialViewMode,lockViewMode,initialScope}){
  const [commandeJob,setCommandeJob]=useState(null);
  const [viewMonth,setViewMonth]=useState(()=>{const d=new Date();d.setDate(1);d.setHours(0,0,0,0);return d;});
  const [selDate,setSelDate]=useState(localDateStr());
  const [scope,setScope]=useState(initialScope||'mine'); // 'mine' | 'team' — "team" montre aussi mes jobs en premier (voir dayDetailBlock)
  const [showCreateHere,setShowCreateHere]=useState(false);
  const [viewMode,setViewMode]=useState(initialViewMode||'mois'); // 'mois' | 'semaine'
  const [expandedJobs,setExpandedJobs]=useState(()=>new Set());
  const desktopMode=useDesktopMode();
  const today=localDateStr();

  function toggleExpanded(key){
    setExpandedJobs(prev=>{
      const next=new Set(prev);
      if(next.has(key))next.delete(key);else next.add(key);
      return next;
    });
  }

  async function handleCreateJobHere(nj){
    const calId=calendarIds&&calendarIds[0]||'primary';
    const{gcalColor:autoColor,description}=buildJobEventFields(nj,allEmps);
    const gcalColor=autoColor||(emp?emp.couleur:'#ff7a1a');
    const created=await createCalendarEvent(calId,nj.title,nj.date,gcalColor,nj.location||'',description);
    if(created&&created.id&&(nj.driveFiles||[]).length>0){
      for(const f of nj.driveFiles)await attachFileToCalendarEvent(calId,created.id,f.id,f.name,f.mimeType);
    }
    notify('✅ Job "'+nj.title+'" créé!','success');
    setShowCreateHere(false);
    if(onJobsRefresh)onJobsRefresh();
  }

  // Vérifier si une job est assignée à l'employé connecté — même logique
  // partagée (texte + repli couleur) que partout ailleurs dans l'app.
  function isAssignedToMe(job){
    if(!emp||!emp.nom)return true;
    return isJobForEmployee(job,emp,allEmps);
  }

  // Indexer chaque job sur TOUS les jours qu'il couvre (utile pour les événements
  // multi-jours) — clé = date locale YYYY-MM-DD
  const parDate=useMemo(()=>{
    const map={};
    (jobs||[]).forEach(j=>{
      if(!j.start)return;
      const startStr=localDateStr(new Date(j.start));
      let endStr=startStr;
      if(j.end){
        const isAllDay=j.allDay!==undefined?j.allDay:!String(j.start).includes('T');
        let endD=new Date(j.end);
        if(isAllDay)endD=new Date(endD.getTime()-1);
        endStr=localDateStr(endD);
      }
      let cur=new Date(startStr+'T12:00:00');
      const endD2=new Date(endStr+'T12:00:00');
      let guard=0;
      while(cur<=endD2&&guard<120){
        const dStr=localDateStr(cur);
        if(!map[dStr])map[dStr]={mine:[],other:[]};
        if(isAssignedToMe(j))map[dStr].mine.push(j);else map[dStr].other.push(j);
        cur=new Date(cur.getTime()+86400000);
        guard++;
      }
    });
    return map;
  },[jobs,emp?.nom]);

  const joursFr=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
  const moisFrLong=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

  const year=viewMonth.getFullYear(), month=viewMonth.getMonth();
  const firstOfMonth=new Date(year,month,1);
  const firstWeekday=firstOfMonth.getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const cells=[];
  for(let i=0;i<firstWeekday;i++)cells.push(null);
  for(let d=1;d<=daysInMonth;d++)cells.push(new Date(year,month,d));
  while(cells.length%7!==0)cells.push(null);

  function prevMonth(){const d=new Date(viewMonth);d.setMonth(d.getMonth()-1);setViewMonth(d);}
  function nextMonth(){const d=new Date(viewMonth);d.setMonth(d.getMonth()+1);setViewMonth(d);}
  function goToday(){const d=new Date();d.setDate(1);d.setHours(0,0,0,0);setViewMonth(d);setSelDate(today);}

  // Navigation semaine : déplace selDate et resynchronise viewMonth pour la vue mois
  function shiftSelDate(deltaDays){
    const d=new Date(selDate+'T12:00:00');
    d.setDate(d.getDate()+deltaDays);
    setSelDate(localDateStr(d));
    const vm=new Date(d);vm.setDate(1);vm.setHours(0,0,0,0);
    setViewMonth(vm);
  }
  function prevWeek(){shiftSelDate(-7);}
  function nextWeek(){shiftSelDate(7);}

  // Les 5 jours ouvrables (Lun→Ven) de la semaine contenant selDate — pas de
  // samedi/dimanche dans la vue Semaine.
  const weekDays=useMemo(()=>{
    const d=new Date(selDate+'T12:00:00');
    const dow=(d.getDay()+6)%7; // 0=Lun...6=Dim
    const monday=new Date(d);monday.setDate(d.getDate()-dow);
    const out=[];
    for(let i=0;i<5;i++){const dd=new Date(monday);dd.setDate(monday.getDate()+i);out.push(dd);}
    return out;
  },[selDate]);

  if(commandeJob)return(
    <div style={{width:'100%'}}>
      <CommandeRapide
        job={commandeJob.title} adresse={commandeJob.location||''}
        emp={emp} notify={notify}
        onClose={()=>setCommandeJob(null)}/>
    </div>
  );

  // Carte d'une job — repliée, on ne voit que le titre; cliquer dessus déplie
  // l'adresse, l'heure, la description complète et tous les fichiers attachés.
  function jobCard(j,i,keyPrefix,isMine,dStr){
    const key=dStr+'_'+keyPrefix+'_'+(j.id||i);
    const isOpen=expandedJobs.has(key);
    // Repère de diagnostic (discret) sur les jobs "autres équipes" : montre
    // le résultat RÉEL de jobAssignees() (pas juste la couleur seule), avec
    // la source (texte ou couleur) — pour voir directement si un match
    // texte "vole" la job à un autre employé avant même que le repli
    // couleur ait la chance de s'appliquer. N'affecte rien, purement visuel.
    let debugTag=null;
    if(!isMine&&allEmps&&allEmps.length){
      const txt=j.title+' '+(j.description||'');
      const textMatches=allEmps.filter(e=>mentionsEmployee(txt,e));
      if(textMatches.length>0){
        debugTag='📝'+textMatches.map(e=>e.code).join(',');
      }else if(j.gcalColor){
        let best=null,bestDist=Infinity;
        allEmps.forEach(e=>{if(!e.couleur)return;const d=colorDist(j.gcalColor,e.couleur);if(d<bestDist){bestDist=d;best=e;}});
        if(best)debugTag='🎨≈'+best.code;
      }
    }
    return(
      <div key={keyPrefix+i} style={{background:isMine?'var(--bg3)':'var(--bg2)',borderRadius:9,
        marginBottom:'0.35rem',borderLeft:'3px solid '+(isMine?(emp?.couleur||j.gcalColor||'var(--accent)'):(j.gcalColor||'var(--muted)')),
        opacity:isMine?1:0.9,overflow:'hidden'}}>
        <div onClick={()=>toggleExpanded(key)} style={{padding:'0.5rem 0.65rem',cursor:'pointer',touchAction:'manipulation',
          display:'flex',alignItems:'center',gap:8}}>
          <div style={{flex:1,minWidth:0,display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
            {isMine&&emp&&<span style={{fontSize:9,fontWeight:700,color:'white',background:emp.couleur,borderRadius:4,padding:'1px 5px',flexShrink:0}}>{emp.code}</span>}
            <div style={{fontWeight:600,fontSize:12,color:'var(--text)'}}>{j.title}</div>
            {debugTag&&<span style={{fontSize:8,color:'var(--muted)',opacity:0.7}} title="Qui l'algorithme pense être assigné, et pourquoi (📝=texte, 🎨=couleur)">{debugTag}</span>}
            <span style={{fontSize:9,color:'var(--muted)'}}>{isOpen?'▾':'▸'}</span>
          </div>
          <div style={{display:'flex',gap:4,flexShrink:0}} onClick={e=>e.stopPropagation()}>
            {onPickJob&&(
              <button onClick={()=>onPickJob(j)}
                style={{background:'rgba(255,122,26,0.15)',border:'1px solid rgba(255,122,26,0.4)',
                  color:'var(--accent)',borderRadius:8,padding:'0.3rem 0.55rem',fontSize:11,fontWeight:700,
                  cursor:'pointer',touchAction:'manipulation',whiteSpace:'nowrap'}}>
                ✓ Choisir
              </button>
            )}
            {isMine&&emp&&!onPickJob&&(
              <button onClick={()=>setCommandeJob(j)}
                style={{background:'rgba(230,81,0,0.12)',border:'1px solid rgba(230,81,0,0.3)',
                  color:'#f57c00',borderRadius:8,padding:'0.3rem 0.55rem',fontSize:11,fontWeight:600,
                  cursor:'pointer',touchAction:'manipulation',whiteSpace:'nowrap'}}>
                📦 Commander
              </button>
            )}
          </div>
        </div>
        {isOpen&&(
          <div style={{padding:'0 0.65rem 0.6rem'}}>
            {j.location&&<a href={mapsUrl(j.location)} target="_blank" rel="noopener noreferrer" onClick={e=>e.stopPropagation()}
              style={{fontSize:10,color:'var(--accent)',marginTop:2,display:'block',textDecoration:'none'}}>📍 {j.location}</a>}
            <div style={{fontSize:10,color:'var(--muted)',marginTop:2}}>
              🕐 {new Date(j.start).toLocaleTimeString('fr-CA',{hour:'2-digit',minute:'2-digit'})}
              {j.end&&' → '+new Date(j.end).toLocaleTimeString('fr-CA',{hour:'2-digit',minute:'2-digit'})}
            </div>
            {j.description&&<div style={{fontSize:10,color:'var(--muted)',marginTop:3,fontStyle:'italic',
              whiteSpace:'pre-wrap',wordBreak:'break-word'}}>{j.description}</div>}
            {(j.attachments||[]).length>0&&(
              <div style={{marginTop:4,display:'flex',flexDirection:'column',gap:2}}>
                {j.attachments.map((a,ai)=>(
                  <a key={ai} href={a.url} target="_blank" rel="noopener noreferrer" style={{fontSize:10,color:'var(--accent)',
                    textDecoration:'none',display:'flex',alignItems:'center',gap:4,wordBreak:'break-all'}}>
                    📎 {a.title}
                  </a>
                ))}
              </div>
            )}
          </div>
        )}
      </div>
    );
  }

  // Bloc "détail du jour" (utilisé en vue mois et semaine) : titre, +Créer, liste des jobs
  function dayDetailBlock(dStr,showCreateBtn){
    const info=parDate[dStr]||{mine:[],other:[]};
    // "Mes jobs" restent toujours visibles, même en scope "Toute l'équipe" —
    // elles apparaissent en PREMIER (priorité), suivies du reste de l'équipe.
    // Seul le scope "mine" masque le reste de l'équipe.
    const vm=info.mine;
    const vo=scope!=='mine'?info.other:[];
    const dObj=new Date(dStr+'T12:00:00');
    return(
      <div key={'dd'+dStr}>
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:'0.5rem'}}>
          <div style={{fontFamily:'var(--font-head)',fontWeight:700,fontSize:12,textTransform:'capitalize',color:dStr===today?'var(--accent)':'var(--text)',flex:1}}>
            {dStr===today?"Aujourd'hui — ":''}{dObj.toLocaleDateString('fr-CA',{weekday:'long',day:'numeric',month:'long'})}
          </div>
          {showCreateBtn&&(
            <button className="btn-s" style={{fontSize:11,padding:'0.22rem 0.6rem',flexShrink:0}} onClick={()=>setShowCreateHere(s=>!s)}>
              {showCreateHere?'✕ Fermer':'+ Créer un job'}
            </button>
          )}
        </div>

        {showCreateBtn&&showCreateHere&&(
          <CreateJobForm jobs={jobs} allEmps={allEmps} sid={sid} onCreateJob={handleCreateJobHere} initialDate={dStr}/>
        )}

        {vm.length===0&&vo.length===0?(
          <div style={{color:'var(--muted)',fontSize:12,padding:'0.5rem 0 1rem'}}>
            {(info.mine.length+info.other.length)>0?(
              // "Mes jobs" sont toujours incluses (voir vm ci-dessus) — ce
              // message ne peut donc plus survenir qu'en scope "mine" avec
              // des jobs assignées uniquement à d'autres ce jour-là.
              "Il y a bien "+(info.mine.length+info.other.length)+" job(s) ce jour-là, mais assignée(s) à d'autres — rien pour \"mes jobs\"."
            ):"Aucun événement ce jour-là."}
          </div>
        ):(
          <>
            {vm.map((j,i)=>jobCard(j,i,'mine',true,dStr))}
            {vo.length>0&&(
              <>
                <div style={{display:'flex',alignItems:'center',gap:8,margin:'0.5rem 0 0.3rem',paddingLeft:2}}>
                  <div style={{fontSize:9,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'0.05em',fontWeight:600}}>Autres équipes</div>
                  <div style={{flex:1,height:1,background:'var(--border)'}}></div>
                </div>
                {vo.map((j,i)=>jobCard(j,i,'other',false,dStr))}
              </>
            )}
          </>
        )}
      </div>
    );
  }

  const calendarGrid=(
    <div>
      {/* Navigation mois */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'0.6rem'}}>
        <button className="btn-s" style={{fontSize:13,padding:'0.3rem 0.65rem'}} onClick={prevMonth}>◀</button>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <div style={{fontFamily:'var(--font-head)',fontWeight:700,fontSize:13,textTransform:'capitalize'}}>{moisFrLong[month]} {year}</div>
          <button className="btn-s" style={{fontSize:10,padding:'0.2rem 0.5rem'}} onClick={goToday}>Aujourd'hui</button>
        </div>
        <button className="btn-s" style={{fontSize:13,padding:'0.3rem 0.65rem'}} onClick={nextMonth}>▶</button>
      </div>

      {/* Grille calendrier */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:4,marginBottom:'0.85rem'}}>
        {joursFr.map(j=>(
          <div key={j} style={{textAlign:'center',fontSize:9,color:'var(--muted)',fontWeight:700,textTransform:'uppercase',paddingBottom:2}}>{j}</div>
        ))}
        {cells.map((d,i)=>{
          if(!d)return <div key={i}/>;
          const dStr=localDateStr(d);
          const info=parDate[dStr];
          const hasMine=info&&info.mine.length>0;
          const hasOther=scope!=='mine'&&info&&info.other.length>0;
          const isToday=dStr===today;
          const isSelected=dStr===selDate;
          return(
            <div key={i} onClick={()=>setSelDate(dStr)} style={{
              aspectRatio:'1',borderRadius:8,cursor:'pointer',touchAction:'manipulation',
              display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:3,
              background:isSelected?'var(--accent)':isToday?'rgba(255,122,26,0.15)':'var(--bg3)',
              border:isToday&&!isSelected?'1px solid var(--accent)':'1px solid transparent',
              transition:'background 0.15s'
            }}>
              <div style={{fontSize:12,fontWeight:isToday||isSelected?800:500,color:isSelected?'#fff':'var(--text)'}}>{d.getDate()}</div>
              {(hasMine||hasOther)&&(
                <div style={{display:'flex',gap:3}}>
                  {hasMine&&<span style={{width:5,height:5,borderRadius:'50%',background:isSelected?'#fff':(emp?.couleur||'var(--accent)')}}/>}
                  {hasOther&&<span style={{width:5,height:5,borderRadius:'50%',background:isSelected?'#fff':'var(--muted)'}}/>}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );

  const dayDetailSection=(
    <div style={{borderTop:desktopMode?'none':'1px solid var(--border)',paddingTop:desktopMode?0:'0.65rem'}}>
      {dayDetailBlock(selDate,true)}
    </div>
  );

  return(
    <div style={{width:'100%',maxWidth:desktopMode?1100:640}}>
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:'0.75rem'}}>
        {onBack&&<button className="btn-s" style={{fontSize:11,padding:'0.25rem 0.6rem'}} onClick={onBack}>← Retour</button>}
        <div style={{fontFamily:'var(--font-head)',fontWeight:700,fontSize:'1rem'}}>📅 Agenda — {emp?.nom||'Équipe'}</div>
      </div>

      {/* Sélecteur de vue : mois / semaine — masqué quand le contexte
          appelant a déjà décidé du mode (ex: onglet "Cette semaine" =
          toujours semaine, onglet "Agenda" = toujours mois) */}
      {!lockViewMode&&(
        <div style={{display:'flex',gap:6,marginBottom:'0.6rem'}}>
          {[['mois','📆 Mois'],['semaine','🗓️ Semaine']].map(([k,lbl])=>(
            <button key={k} onClick={()=>setViewMode(k)} className="btn-s" style={{
              fontSize:10,padding:'0.3rem 0.55rem',flex:1,
              background:viewMode===k?'var(--accent)':'var(--bg3)',
              color:viewMode===k?'#fff':'var(--text)',fontWeight:viewMode===k?700:500
            }}>{lbl}</button>
          ))}
        </div>
      )}

      {/* Filtre portée : mes jobs / toute l'équipe */}
      <div style={{display:'flex',gap:6,marginBottom:'0.65rem'}}>
        {[['mine','👤 Mes jobs'],['team','🏗️ Toute l\'équipe']].map(([k,lbl])=>(
          <button key={k} onClick={()=>setScope(k)} className="btn-s" style={{
            fontSize:10,padding:'0.3rem 0.55rem',flex:1,
            background:scope===k?'var(--accent)':'var(--bg3)',
            color:scope===k?'#fff':'var(--text)',fontWeight:scope===k?700:500
          }}>{lbl}</button>
        ))}
      </div>

      {viewMode==='mois'&&(
        desktopMode?(
          <div style={{display:'flex',gap:'1.25rem',alignItems:'flex-start'}}>
            <div style={{flex:'1 1 50%',minWidth:0}}>{calendarGrid}</div>
            <div style={{flex:'1 1 50%',minWidth:0,borderLeft:'1px solid var(--border)',paddingLeft:'1.25rem'}}>{dayDetailSection}</div>
          </div>
        ):(
          <>{calendarGrid}{dayDetailSection}</>
        )
      )}

      {viewMode==='semaine'&&(
        <div>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'0.7rem'}}>
            <button className="btn-s" style={{fontSize:13,padding:'0.3rem 0.65rem'}} onClick={prevWeek}>◀</button>
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <div style={{fontFamily:'var(--font-head)',fontWeight:700,fontSize:13,textTransform:'capitalize'}}>
                {weekDays[0].toLocaleDateString('fr-CA',{day:'numeric',month:'short'})} – {weekDays[weekDays.length-1].toLocaleDateString('fr-CA',{day:'numeric',month:'short'})}
              </div>
              <button className="btn-s" style={{fontSize:10,padding:'0.2rem 0.5rem'}} onClick={goToday}>Aujourd'hui</button>
            </div>
            <button className="btn-s" style={{fontSize:13,padding:'0.3rem 0.65rem'}} onClick={nextWeek}>▶</button>
          </div>
          <div style={{display:'grid',gridTemplateColumns:desktopMode?'repeat(5,1fr)':'1fr',gap:'0.6rem'}}>
            {weekDays.map((d,wi)=>{
              const dStr=localDateStr(d);
              const isToday=dStr===today;
              return(
                <div key={wi} style={{background:'var(--bg2)',borderRadius:10,padding:'0.6rem',
                  border:isToday?'1px solid var(--accent)':'1px solid var(--border)'}}>
                  <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'0.4rem'}}>
                    <div style={{fontFamily:'var(--font-head)',fontWeight:700,fontSize:11,textTransform:'capitalize',color:isToday?'var(--accent)':'var(--text)'}}>
                      {joursFr[d.getDay()]} {d.getDate()}
                    </div>
                    <button className="btn-s" style={{fontSize:9,padding:'0.15rem 0.4rem'}} onClick={()=>{setSelDate(dStr);setViewMode('mois');}}>Voir</button>
                  </div>
                  {dayDetailBlock(dStr,false)}
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}



// ── COMMANDE RAPIDE ──────────────────────────────────────────────────────────
// ── CONVERTISSEUR PIEDS ↔ MÈTRES ───────────────────────────────────────────────
function ConvertisseurPiedsMetres(){
  const [pieds,setPieds]=useState('');
  const [metres,setMetres]=useState('');
  const [lastEdited,setLastEdited]=useState(null);

  function onPiedsChange(v){
    setPieds(v);setLastEdited('pieds');
    const n=parseFloat(v.replace(',','.'));
    if(!isNaN(n))setMetres((n*0.3048).toFixed(2).replace('.',','));
    else setMetres('');
  }
  function onMetresChange(v){
    setMetres(v);setLastEdited('metres');
    const n=parseFloat(v.replace(',','.'));
    if(!isNaN(n))setPieds((n/0.3048).toFixed(2).replace('.',','));
    else setPieds('');
  }

  return(
    <div style={{background:'var(--bg3)',borderRadius:12,padding:'0.75rem 0.85rem',marginBottom:'0.75rem',border:'1px solid var(--border)'}}>
      <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:'0.6rem'}}>
        <span style={{fontSize:14}}>📏</span>
        <div style={{fontFamily:'var(--font-head)',fontWeight:700,fontSize:12,textTransform:'uppercase',letterSpacing:'0.04em'}}>Convertisseur pieds ↔ mètres</div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr auto 1fr',alignItems:'center',gap:8}}>
        <div>
          <label style={{fontSize:9,color:'var(--muted)',textTransform:'uppercase',display:'block',marginBottom:3}}>Pieds</label>
          <input
            value={pieds}
            onChange={e=>onPiedsChange(e.target.value)}
            placeholder="0"
            inputMode="decimal"
            style={{width:'100%',background:lastEdited==='pieds'?'rgba(255,122,26,0.1)':'var(--bg2)',border:'1px solid '+(lastEdited==='pieds'?'var(--accent)':'var(--border)'),borderRadius:8,padding:'0.55rem 0.6rem',color:'var(--text)',fontSize:16,fontFamily:'var(--font-head)',fontWeight:700,textAlign:'center'}}/>
        </div>
        <div style={{fontSize:16,color:'var(--muted)',marginTop:14}}>=</div>
        <div>
          <label style={{fontSize:9,color:'var(--muted)',textTransform:'uppercase',display:'block',marginBottom:3}}>Mètres</label>
          <input
            value={metres}
            onChange={e=>onMetresChange(e.target.value)}
            placeholder="0"
            inputMode="decimal"
            style={{width:'100%',background:lastEdited==='metres'?'rgba(255,122,26,0.1)':'var(--bg2)',border:'1px solid '+(lastEdited==='metres'?'var(--accent)':'var(--border)'),borderRadius:8,padding:'0.55rem 0.6rem',color:'var(--text)',fontSize:16,fontFamily:'var(--font-head)',fontWeight:700,textAlign:'center'}}/>
        </div>
      </div>
    </div>
  );
}

// ── STOCK DES CAMIONS ───────────────────────────────────────────────────────
function StockCamionBloc({camionId,camionNom,emp,notify}){
  const [texte,setTexte]=useState('');
  const [loading,setLoading]=useState(true);
  const [showAddItem,setShowAddItem]=useState(false);
  const [searchCatalogue,setSearchCatalogue]=useState('');
  const [expandedCat,setExpandedCat]=useState(null);
  const [newQty,setNewQty]=useState(1);
  const [selectedItem,setSelectedItem]=useState(null); // {desc, cat} — item en cours d'ajustement de quantité
  const [showCustomItem,setShowCustomItem]=useState(false);
  const [customDesc,setCustomDesc]=useState('');
  const [customQty,setCustomQty]=useState(1);
  const [sending,setSending]=useState(false);
  const [saveStatus,setSaveStatus]=useState(''); // '', 'saving', 'saved'
  const saveTimer=useRef(null);
  const skipNextSave=useRef(true); // évite d'écraser Sheets au premier chargement

  // Charger depuis Sheets au montage
  useEffect(()=>{
    (async()=>{
      try{
        const t=await getStockCamion(camionId);
        skipNextSave.current=true;
        setTexte(t);
      }catch(e){
        console.error(e);
        notify('⚠️ '+camionNom+' : impossible de charger le stock — ce compte Google a-t-il accès au Sheet Stock ?','err');
      }
      setLoading(false);
    })();
  },[camionId]);

  function onTexteChange(v){
    setTexte(v);
    skipNextSave.current=false;
    if(saveTimer.current)clearTimeout(saveTimer.current);
    setSaveStatus('saving');
    saveTimer.current=setTimeout(async()=>{
      try{
        await setStockCamion(camionId,v);
        setSaveStatus('saved');
        setTimeout(()=>setSaveStatus(''),1500);
      }catch(e){setSaveStatus('');notify('Erreur sauvegarde: '+e.message,'err');}
    },800);
  }

  // Sauvegarde manuelle immédiate (n'attend pas le délai de 800ms de l'autosave)
  async function saveNow(){
    if(saveTimer.current)clearTimeout(saveTimer.current);
    setSaveStatus('saving');
    try{
      await setStockCamion(camionId,texte);
      setSaveStatus('saved');
      notify('✅ Liste '+camionNom+' sauvegardée','success');
      setTimeout(()=>setSaveStatus(''),1500);
    }catch(e){setSaveStatus('');notify('Erreur sauvegarde: '+e.message,'err');}
  }

  // Catalogue groupé par catégorie (même source que Appel de service)
  const catalogueParCategorie=Object.entries(CATALOGUE).map(([cat,items])=>({
    cat,
    items: items.flatMap(item=>{
      if(item.options||item.sizes){
        return (item.options||item.sizes).map(opt=>({desc:item.code+' — '+item.desc+' ('+opt+')'}));
      }
      return [{desc:item.code+' — '+item.desc}];
    })
  }));
  const searchActive=searchCatalogue.trim().length>0;
  const catalogueFiltre=catalogueParCategorie.map(({cat,items})=>({
    cat,
    items: searchActive ? items.filter(it=>it.desc.toLowerCase().includes(searchCatalogue.toLowerCase())) : items
  })).filter(({items})=>!searchActive||items.length>0);

  function ajouterItemDuCatalogue(item){
    const ligne=newQty+'x '+item.desc;
    const next=texte.trim()?texte.replace(/\n+$/,'')+'\n'+ligne:ligne;
    setTexte(next);
    onTexteChange(next);
    setNewQty(1);setSearchCatalogue('');setSelectedItem(null);
  }

  // Item libre — pas besoin qu'il soit dans le catalogue prédéfini
  function ajouterItemCustom(){
    if(!customDesc.trim()){notify('Écris le nom de l\'item!','warn');return;}
    const ligne=customQty+'x '+customDesc.trim();
    const next=texte.trim()?texte.replace(/\n+$/,'')+'\n'+ligne:ligne;
    setTexte(next);
    onTexteChange(next);
    setCustomDesc('');setCustomQty(1);setShowCustomItem(false);
  }

  function encodeEmailSafe(to,subject,body){
    const safeSub=subject.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x20-\x7E]/g,'?');
    const hdr='To: '+to+'\r\nSubject: '+safeSub+'\r\nContent-Type: text/plain; charset=UTF-8\r\nContent-Transfer-Encoding: base64\r\n\r\n';
    const bodyBytes=new TextEncoder().encode(body);
    let b64='';
    for(let i=0;i<bodyBytes.length;i+=57){
      const chunk=bodyBytes.slice(i,i+57);
      let bin='';chunk.forEach(b=>bin+=String.fromCharCode(b));
      b64+=btoa(bin)+'\r\n';
    }
    const full=hdr+b64;
    const fullBytes=new Uint8Array(full.length);
    for(let i=0;i<full.length;i++) fullBytes[i]=full.charCodeAt(i)&0xff;
    let fullBin='';fullBytes.forEach(b=>fullBin+=String.fromCharCode(b));
    return btoa(fullBin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  }

  async function envoyerCommande(){
    if(!texte.trim()){notify('Liste vide','err');return;}
    setSending(true);
    try{
      const token=gapi.client.getToken()?.access_token;
      if(!token){notify('Pas de token Google','err');setSending(false);return;}
      const body='Bonjour,\n\n'+(emp?.nom||'Un employe')+' demande une commande pour '+camionNom+' :\n\n'+
        texte.trim()+'\n\n'+
        'Date : '+localDateStr()+'\nEnvoye depuis PunchPro - Saran Electrique';
      const encoded=encodeEmailSafe('info@saranelectrique.com',camionNom+' - Commande de stock',body);
      const res=await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/send',{
        method:'POST',
        headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},
        body:JSON.stringify({raw:encoded})
      });
      if(res.ok){
        notify('✅ Commande '+camionNom+' envoyée!','success');
        setTexte('');
        await setStockCamion(camionId,'');
      }else{
        const e=await res.json();notify('Erreur: '+(e?.error?.message||res.status),'err');
      }
    }catch(e){notify('Erreur: '+e.message,'err');}
    setSending(false);
  }

  return(
    <div style={{background:'var(--bg3)',borderRadius:12,padding:'0.7rem 0.85rem',marginBottom:'0.6rem',border:'1px solid var(--border)'}}>

          <div style={{fontFamily:'var(--font-head)',fontWeight:700,fontSize:13}}>{camionNom}</div>
        </div>
        {saveStatus==='saving'&&<span style={{fontSize:9,color:'var(--muted)'}}>⏳ sauvegarde...</span>}
        {saveStatus==='saved'&&<span style={{fontSize:9,color:'var(--success)'}}>✓ synchronisé</span>}
      </div>

      {loading?(
        <div style={{textAlign:'center',padding:'1rem',color:'var(--muted)',fontSize:12}}>⏳ Chargement...</div>
      ):(
        <textarea
          value={texte}
          onChange={e=>onTexteChange(e.target.value)}
          placeholder={'Écris ici ce qui manque...\nex:\n10x prises Decora blanches\n2x breakers 20A\n1 rouleau NMD90 14/2'}
          rows={6}
          style={{width:'100%',background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:8,padding:'0.6rem 0.7rem',color:'var(--text)',fontSize:13,lineHeight:1.6,fontFamily:'var(--font-body)',resize:'vertical'}}/>
      )}

      {!showAddItem?(
        <div style={{display:'flex',gap:6,marginTop:'0.5rem',flexWrap:'wrap'}}>
          <button className="btn-s" style={{flex:1,fontSize:11}} onClick={()=>setShowAddItem(true)}>➕ Ajouter un item</button>
          <button className="btn-s" style={{flex:1,fontSize:11}} disabled={saveStatus==='saving'} onClick={saveNow}>💾 Sauvegarder</button>
          <button className="btn-p" style={{marginTop:0,flex:1,fontSize:11}} disabled={sending||!texte.trim()} onClick={envoyerCommande}>
            {sending?'⏳':'📧'} Envoyer ma commande
          </button>
        </div>
      ):(
        <div style={{background:'var(--bg2)',borderRadius:8,padding:'0.5rem',marginTop:'0.5rem'}}>
          <div style={{display:'flex',gap:6,marginBottom:'0.4rem',alignItems:'center'}}>
            <input value={searchCatalogue} onChange={e=>setSearchCatalogue(e.target.value)} placeholder="🔍 Chercher dans le catalogue..."
              style={{flex:1,background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:6,padding:'0.4rem 0.55rem',color:'var(--text)',fontSize:12}}/>
            <button title="Item pas dans le catalogue — l'écrire directement" onClick={()=>setShowCustomItem(s=>!s)}
              style={{flexShrink:0,width:30,height:30,borderRadius:6,border:'1px solid '+(showCustomItem?'var(--accent)':'var(--border)'),
                background:showCustomItem?'rgba(255,122,26,0.15)':'var(--bg3)',color:showCustomItem?'var(--accent)':'var(--muted)',
                fontSize:16,fontWeight:700,cursor:'pointer',touchAction:'manipulation',display:'flex',alignItems:'center',justifyContent:'center'}}>
              +
            </button>
          </div>
          {showCustomItem&&(
            <div style={{background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:8,padding:'0.5rem',marginBottom:'0.4rem'}}>
              <div style={{fontSize:10,color:'var(--muted)',marginBottom:5}}>Item hors catalogue — écris-le directement</div>
              <input value={customDesc} onChange={e=>setCustomDesc(e.target.value)} placeholder="Ex: boîte électrique 4x4 avec couvercle blanc"
                style={{width:'100%',background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:6,padding:'0.4rem 0.55rem',color:'var(--text)',fontSize:12,marginBottom:'0.4rem',boxSizing:'border-box'}}/>
              <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
                <label style={{fontSize:9,color:'var(--muted)',flexShrink:0}}>Qté</label>
                <button className="dur-btn" style={{width:26,height:26,fontSize:13,flexShrink:0}} onClick={()=>setCustomQty(q=>Math.max(1,q-1))}>−</button>
                <div style={{fontFamily:'var(--font-head)',fontWeight:700,fontSize:13,color:'var(--accent)',minWidth:32,textAlign:'center'}}>{customQty}</div>
                <button className="dur-btn" style={{width:28,height:26,fontSize:11}} onClick={()=>setCustomQty(q=>q+1)}>+1</button>
                <button className="dur-btn" style={{width:32,height:26,fontSize:11}} onClick={()=>setCustomQty(q=>q+10)}>+10</button>
                <button className="btn-p" style={{marginTop:0,flex:1,fontSize:11,minWidth:100}} onClick={ajouterItemCustom}>✓ Ajouter {customQty}x</button>
              </div>
            </div>
          )}
          <div style={{maxHeight:260,overflowY:'auto',marginBottom:'0.4rem',border:'1px solid var(--border)',borderRadius:6}}>
            {catalogueFiltre.length===0?(
              <div style={{padding:'0.6rem',fontSize:11,color:'var(--muted)',textAlign:'center'}}>Aucun résultat.</div>
            ):catalogueFiltre.map(({cat,items})=>{
              const isOpen=searchActive||expandedCat===cat;
              return(
                <div key={cat} style={{borderBottom:'1px solid var(--border)'}}>
                  <div onClick={()=>setExpandedCat(expandedCat===cat?null:cat)}
                    style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0.4rem 0.55rem',
                      background:'var(--bg3)',cursor:'pointer',touchAction:'manipulation'}}>
                    <span style={{fontWeight:600,fontSize:11}}>{cat}</span>
                    <div style={{display:'flex',alignItems:'center',gap:6}}>
                      <span style={{fontSize:9,color:'var(--muted)'}}>{items.length}</span>
                      <span style={{color:'var(--muted)',fontSize:10}}>{isOpen?'▼':'▶'}</span>
                    </div>
                  </div>
                  {isOpen&&items.map((it,i)=>{
                    const isSelected=selectedItem&&selectedItem.desc===it.desc&&selectedItem.cat===cat;
                    const isFils=cat==='Fils';
                    return(
                      <div key={i}>
                        <div onClick={()=>{
                            if(isSelected){setSelectedItem(null);}
                            else{setSelectedItem({desc:it.desc,cat});setNewQty(1);}
                          }}

                            background:isSelected?'rgba(255,122,26,0.08)':'transparent',
                            display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                          <span>{it.desc}</span>
                          <span style={{color:'var(--muted)',fontSize:10}}>{isSelected?'▼':''}</span>
                        </div>
                        {isSelected&&(
                          <div style={{padding:'0.5rem 0.6rem',background:'var(--bg2)',borderTop:'1px solid var(--border)'}}>
                            <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:'0.4rem',flexWrap:'wrap'}}>
                              <label style={{fontSize:9,color:'var(--muted)',flexShrink:0}}>Qté</label>
                              <button className="dur-btn" style={{width:26,height:26,fontSize:13,flexShrink:0}} onClick={()=>setNewQty(q=>Math.max(1,q-1))}>−</button>
                              <div style={{fontFamily:'var(--font-head)',fontWeight:700,fontSize:13,color:'var(--accent)',minWidth:32,textAlign:'center'}}>{newQty}</div>
                              <button className="dur-btn" style={{width:28,height:26,fontSize:11}} onClick={()=>setNewQty(q=>q+1)}>+1</button>
                              <button className="dur-btn" style={{width:32,height:26,fontSize:11}} onClick={()=>setNewQty(q=>q+10)}>+10</button>
                              {isFils&&<button className="dur-btn" style={{width:32,height:26,fontSize:10,color:'var(--warning)'}} onClick={()=>setNewQty(q=>q+50)}>+50</button>}
                            </div>
                            <div style={{display:'flex',gap:6}}>
                              <button className="btn-p" style={{marginTop:0,flex:1,fontSize:11}} onClick={()=>ajouterItemDuCatalogue(it)}>✓ Ajouter {newQty}x</button>
                              <button className="btn-s" style={{fontSize:11}} onClick={()=>setSelectedItem(null)}>Annuler</button>
                            </div>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              );
            })}
          </div>
          <button className="btn-s" style={{width:'100%',fontSize:11}} onClick={()=>{setShowAddItem(false);setSearchCatalogue('');setExpandedCat(null);setSelectedItem(null);setShowCustomItem(false);setCustomDesc('');setCustomQty(1);}}>Fermer</button>
        </div>
      )}
    </div>
  );
}
