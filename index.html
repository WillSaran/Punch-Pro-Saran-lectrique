const CODES_CONTRACTEURS=['PAY','CRS','ASC','GGP','SAR'];

function getCodeContracteur(titre){
  if(!titre)return 'PARTICULIER';
  const prefix=(titre.trim().slice(0,3)).toUpperCase();
  return CODES_CONTRACTEURS.includes(prefix)?prefix:'PARTICULIER';
}

// Group calendar jobs + pointages into projects by code + address
function buildProjets(calJobs,pts){
  const map={};
  // From calendar jobs
  for(const job of calJobs){
    const code=getCodeContracteur(job.title);
    const adresse=(job.location||'').trim();
    const key=code+'||'+(adresse||job.title);
    if(!map[key]){
      map[key]={
        key,code,adresse,
        nom:code==='PARTICULIER'?(adresse||job.title):(code+' — '+(adresse||job.title)),
        jobs:[],po:'',dateDebut:job.start?localDateStr(new Date(job.start)):'',
        couleur:job.gcalColor||'#ff7a1a'
      };
    }
    if(!map[key].jobs.includes(job.title))map[key].jobs.push(job.title);
    if(job.start&&localDateStr(new Date(job.start))<(map[key].dateDebut||'9999'))map[key].dateDebut=localDateStr(new Date(job.start));
  }
  // Also from pointages (jobs punched that may not be in calendar)
  for(const p of pts){
    if(!p.job)continue;
    const code=getCodeContracteur(p.job);
    // Try to match existing project by job name
    let matched=false;
    for(const k of Object.keys(map)){
      if(map[k].jobs.includes(p.job)){matched=true;break;}
    }
    if(!matched){
      const key=code+'||'+p.job;
      if(!map[key]){map[key]={key,code,adresse:p.job,nom:code==='PARTICULIER'?p.job:(code+' — '+p.job),jobs:[p.job],po:'',dateDebut:p.date||'',couleur:p.jobColor||'#ff7a1a'};}
    }
  }
  return Object.values(map).sort((a,b)=>a.nom.localeCompare(b.nom));
}

async function savePO(sid,projKey,po,existingPOs){
  // Store PO numbers in a simple key-value in Projets sheet
  // Find if row exists
  try{
    const res=await gapi.client.sheets.spreadsheets.values.get({spreadsheetId:sid,range:'Projets!A2:B'});
    const rows=res.result.values||[];
    const idx=rows.findIndex(r=>r[0]===projKey);
    if(idx>=0){
      await gapi.client.sheets.spreadsheets.values.update({spreadsheetId:sid,range:'Projets!B'+(idx+2),valueInputOption:'RAW',resource:{values:[[po]]}});
    }else{
      await gapi.client.sheets.spreadsheets.values.append({spreadsheetId:sid,range:'Projets!A1',valueInputOption:'RAW',insertDataOption:'INSERT_ROWS',resource:{values:[[projKey,po]]}});
    }
  }catch(e){console.error(e);}
}

async function getPOs(sid){
  try{
    const res=await gapi.client.sheets.spreadsheets.values.get({spreadsheetId:sid,range:'Projets!A2:B'});
    const map={};
    for(const r of (res.result.values||[]))if(r[0])map[r[0]]=r[1]||'';
    return map;
  }catch{return{};}
}

function ProjDetail({p,projPts,calJobs,statuts,calendarIds,notify,projData,saveProjData,addrOverrides,saveAddrOverrides,onBack,allProjets,isAdmin}){
  const [editKey,setEditKey]=useState(null);
  const [editPO,setEditPO]=useState('');
  const [editTitre,setEditTitre]=useState('');
  const [editStatut,setEditStatut]=useState('en-cours');
  const [editEvtAddr,setEditEvtAddr]=useState(null);
  const [editEvtAddrVal,setEditEvtAddrVal]=useState('');
  const [showMerge,setShowMerge]=useState(false);
  const [mergeTarget,setMergeTarget]=useState('');
  const [customMergeAddr,setCustomMergeAddr]=useState('');
  const [mergeFilterCat,setMergeFilterCat]=useState(null);
  const [mergeSearch,setMergeSearch]=useState('');
  const [showFiles,setShowFiles]=useState(true); // ouvert par défaut — l'utilisateur peut le refermer au besoin

  const today=new Date();
  // Sous-préfixes pour trier les événements à l'intérieur d'un projet
  const SUB_PREFIXES=['ROUGH','FINITION','SERV'];
  function getSubPrefixOrder(title){
    const t=(title||'').toUpperCase();
    const idx=SUB_PREFIXES.findIndex(sp=>t.includes(sp));
    return idx>=0?idx:SUB_PREFIXES.length;
  }
  function sortJobs(arr){
    return [...arr].sort((a,b)=>{
      const oa=getSubPrefixOrder(a.title),ob=getSubPrefixOrder(b.title);
      if(oa!==ob)return oa-ob;
      return new Date(a.start)-new Date(b.start);
    });
  }
  const sortedJobs=sortJobs((p.jobs||[]));
  const passedJobs=sortedJobs.filter(j=>new Date(j.start)<today&&new Date(j.start).toDateString()!==today.toDateString());
  const todayJobs=sortedJobs.filter(j=>new Date(j.start).toDateString()===today.toDateString());
  const futureJobs=sortedJobs.filter(j=>new Date(j.start)>today&&new Date(j.start).toDateString()!==today.toDateString());
  const s=statuts[p.statut]||statuts['en-cours'];

  function saveEdit(){
    const u={...projData,[editKey]:{...(projData[editKey]||{}),po:editPO,titre:editTitre,statut:editStatut}};
    saveProjData(u);setEditKey(null);
  }

  function saveEvtAddress(j){
    if(!editEvtAddrVal.trim()){notify('Entrez une adresse','warn');return;}
    const newAddr=editEvtAddrVal.trim();
    // 1. Sauvegarder localement en priorité — mise à jour immédiate de l'UI, ferme le formulaire tout de suite
    const current=addrOverrides||{};
    const updated={...current,[j.id]:newAddr};
    saveAddrOverrides(updated);
    notify('✅ Adresse mise à jour!','success');
    setEditEvtAddr(null);setEditEvtAddrVal('');
    // 2. Synchroniser vers Google Calendar en arrière-plan (ne bloque plus l'UI)
    (async()=>{
      for(const calId of (calendarIds||['primary'])){
        try{
          await gapi.client.calendar.events.patch({calendarId:calId,eventId:j.id,resource:{location:newAddr}});
          return;
        }catch(e){continue;}
      }
      console.warn('Calendar patch failed pour',j.id);
    })();
  }

  async function mergeIntoProject(newAddr){
    if(!newAddr||!newAddr.trim()){notify('Choisissez un projet ou entrez une adresse','warn');return;}
    const current=addrOverrides||{};
    const updatedOverrides={...current};
    let calCount=0;
    for(const j of (p.jobs||[])){
      updatedOverrides[j.id]=newAddr;
      for(const calId of (calendarIds||['primary'])){
        try{
          await gapi.client.calendar.events.patch({calendarId:calId,eventId:j.id,resource:{location:newAddr}});
          calCount++;break;
        }catch(e){continue;}
      }
    }
    saveAddrOverrides(updatedOverrides);
    notify('✅ '+p.jobs.length+' événements fusionnés'+(calCount>0?' ('+calCount+' dans l\'agenda)':'')+'!','success');
    setShowMerge(false);setMergeTarget('');setCustomMergeAddr('');
  }


  return(
    <div style={{maxWidth:isAdmin?960:620,width:'100%'}}>
      <div style={{display:'flex',gap:'0.4rem',alignItems:'center',marginBottom:'0.75rem'}}>
        <button className="btn-s" style={{fontSize:11}} onClick={onBack}>← Retour</button>
        <button className="btn-s" style={{fontSize:11,marginLeft:'auto'}} onClick={()=>setShowMerge(x=>!x)}>🔀 Fusionner</button>
      </div>
      {showMerge&&(
        <div style={{background:'rgba(210,153,34,0.1)',border:'1px solid var(--warning)',borderRadius:10,padding:'0.65rem',marginBottom:'0.75rem'}}>
          <div style={{fontSize:12,fontWeight:600,color:'var(--warning)',marginBottom:'0.5rem'}}>🔀 Fusionner avec un projet existant</div>
          <div style={{fontSize:11,color:'var(--muted)',marginBottom:'0.5rem'}}>
            Tous les {p.jobs.length} événements prendront l'adresse du projet choisi.
          </div>
          {(()=>{
            const candidats=(allProjets||[]).filter(pr=>pr.key!==p.key);
            const categories=[...new Set(candidats.map(pr=>pr.prefix))].sort((a,b)=>a==='PARTICULIER'?-1:b==='PARTICULIER'?1:a.localeCompare(b));

                          fontWeight:mergeFilterCat===cat?700:400,
                          background:mergeFilterCat===cat?'rgba(210,153,34,0.2)':'var(--bg3)',
                          border:'1px solid '+(mergeFilterCat===cat?'var(--warning)':'var(--border)'),
                          color:mergeFilterCat===cat?'var(--warning)':'var(--muted)'}}>
                        {cat}
                      </div>
                    ))}
                  </div>
                )}
                <input value={mergeSearch} onChange={e=>setMergeSearch(e.target.value)} placeholder="🔍 Chercher un projet..."
                  style={{width:'100%',marginBottom:'0.4rem',padding:'0.4rem 0.55rem',borderRadius:8,background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text)',fontSize:12}}/>
                <select value={mergeTarget} onChange={e=>setMergeTarget(e.target.value)}
                  style={{width:'100%',marginBottom:'0.4rem',padding:'0.4rem',borderRadius:8,background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text)',fontSize:12}}>
                  <option value="">— Choisir un projet ({filtres.length}) —</option>
                  {filtres.map(pr=>(
                    <option key={pr.key} value={pr.adresse}>{pr.titre} ({pr.adresse.slice(0,30)})</option>
                  ))}
                  <option value="__custom__">✏️ Entrer une adresse manuellement...</option>
                </select>
              </>
            );
          })()}
          {mergeTarget==='__custom__'&&(
            <AddressInput value={customMergeAddr} onChange={setCustomMergeAddr} placeholder="Adresse du projet de destination..." style={{marginBottom:'0.4rem'}}/>
          )}
          <div style={{display:'flex',gap:'0.4rem'}}>
            <button className="btn-p" style={{flex:1,marginTop:0,fontSize:12}}
              onClick={()=>mergeIntoProject(mergeTarget==='__custom__'?customMergeAddr:mergeTarget)}>
              ✓ Fusionner ({p.jobs.length} événements)
            </button>
            <button className="btn-s" style={{fontSize:11}} onClick={()=>{setShowMerge(false);setMergeTarget('');setCustomMergeAddr('');setMergeFilterCat(null);setMergeSearch('');}}>Annuler</button>
          </div>
        </div>
      )}
      {/* Info projet */}
      <div style={{background:'var(--bg2)',borderRadius:12,padding:'0.85rem',marginBottom:'0.75rem',border:'1px solid var(--border)',borderLeft:'4px solid '+s.color}}>
        {editKey===p.key?(
          <div>
            <div style={{marginBottom:'0.4rem'}}><span style={{fontSize:10,color:'var(--muted)'}}>Titre</span><input value={editTitre} onChange={e=>setEditTitre(e.target.value)} style={{width:'100%',fontSize:12,marginTop:3}}/></div>
            <div style={{marginBottom:'0.4rem'}}><span style={{fontSize:10,color:'var(--muted)'}}>PO</span><input value={editPO} onChange={e=>setEditPO(e.target.value)} placeholder="Ex: PO-2025-001" style={{width:'100%',fontSize:12,marginTop:3}}/></div>

            <div style={{display:'flex',gap:'0.35rem',marginBottom:'0.5rem'}}>
              {Object.entries(statuts).map(([k,v])=>(

              </div>

                <button className="btn-s" style={{fontSize:10,padding:'0.18rem 0.5rem'}} onClick={()=>{setEditKey(p.key);setEditPO(p.po);setEditTitre(p.titre);setEditStatut(p.statut);}}>✏️</button>
              </div>
            </div>
            <div style={{display:'flex',gap:12,fontSize:11,color:'var(--muted)',marginTop:8,flexWrap:'wrap'}}>
              <span>🗓 {p.jobs.length} événements</span>

            </div>
          </div>
        )}
      </div>
      {passedJobs.length>0&&(<div style={{marginBottom:'0.6rem'}}><div style={{fontSize:10,fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:'0.35rem'}}>Passées ({passedJobs.length})</div>{passedJobs.map((j,i)=><EventCard key={i} j={j} isPast={true} projPts={projPts} editEvtAddr={editEvtAddr} setEditEvtAddr={setEditEvtAddr} editEvtAddrVal={editEvtAddrVal} setEditEvtAddrVal={setEditEvtAddrVal} saveEvtAddress={saveEvtAddress} pAdresse={p.adresse}/>)}</div>)}
      {todayJobs.length>0&&(<div style={{marginBottom:'0.6rem'}}><div style={{fontSize:10,fontWeight:700,color:'var(--success)',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:'0.35rem'}}>Aujourd'hui</div>{todayJobs.map((j,i)=><EventCard key={i} j={j} isPast={false} projPts={projPts} editEvtAddr={editEvtAddr} setEditEvtAddr={setEditEvtAddr} editEvtAddrVal={editEvtAddrVal} setEditEvtAddrVal={setEditEvtAddrVal} saveEvtAddress={saveEvtAddress} pAdresse={p.adresse}/>)}</div>)}
      {futureJobs.length>0&&(<div><div style={{fontSize:10,fontWeight:700,color:'var(--accent)',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:'0.35rem'}}>À venir ({futureJobs.length})</div>{futureJobs.map((j,i)=><EventCard key={i} j={j} isPast={false} projPts={projPts} editEvtAddr={editEvtAddr} setEditEvtAddr={setEditEvtAddr} editEvtAddrVal={editEvtAddrVal} setEditEvtAddrVal={setEditEvtAddrVal} saveEvtAddress={saveEvtAddress} pAdresse={p.adresse}/>)}</div>)}
      {p.jobs.length===0&&<div style={{color:'var(--muted)',textAlign:'center',padding:'1rem',fontSize:12}}>Aucun événement pour ce projet.</div>}
      {(()=>{
        // Fichiers du projet : ceux attachés aux pointages (fichiersURL) + ceux
        // attachés directement sur les événements Google Agenda (attachments).
        const punchFiles=[];
        (projPts||[]).forEach(p2=>{
          (p2.fichiersURL||[]).forEach(raw=>{
            if(!raw)return;
            const url=raw.split('|')[0];
            const nom=raw.includes('|')?raw.split('|')[1]:'Fichier';
            punchFiles.push({url,nom,source:'punch',who:p2.nom,date:p2.date});
          });
        });
        const calFiles=[];
        (p.jobs||[]).forEach(j=>{
          (j.attachments||[]).forEach(a=>{
            if(!a.url)return;
            calFiles.push({url:a.url,nom:a.title||'Fichier',source:'calendrier',who:j.title,date:j.start?localDateStr(new Date(j.start)):''});
          });
        });
        const allFiles=[...punchFiles,...calFiles];
        return(
          <div style={{marginTop:'0.75rem',borderTop:'1px solid var(--border)',paddingTop:'0.65rem'}}>
            <div onClick={()=>setShowFiles(s=>!s)} style={{display:'flex',alignItems:'center',gap:6,cursor:'pointer',touchAction:'manipulation'}}>
              <div style={{fontSize:10,fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'0.05em'}}>📎 Fichiers ({allFiles.length})</div>
              <span style={{fontSize:9,color:'var(--muted)'}}>{showFiles?'▲':'▼'}</span>
            </div>
            {showFiles&&(
              allFiles.length===0?(
                <div style={{color:'var(--muted)',fontSize:11,padding:'0.5rem 0'}}>Aucun fichier trouvé pour ce projet.</div>
              ):(
                <div style={{marginTop:'0.4rem'}}>
                  {allFiles.map((f,i)=>{
                    const isOT=f.nom.startsWith('OT_');
                    const isAP=f.nom.startsWith('AP_');
                    const icon=isOT?'🔧':isAP?'📋':f.source==='calendrier'?'📅':'📎';
                    return(
                      <a key={i} href={f.url} target="_blank" rel="noreferrer"
                        style={{display:'flex',alignItems:'center',gap:6,background:'var(--bg3)',borderRadius:6,padding:'0.3rem 0.55rem',marginBottom:3,textDecoration:'none',color:'var(--text)',fontSize:11}}>
                        <span>{icon}</span>
                        <span style={{flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{f.nom}</span>
                        <span style={{color:'var(--muted)',fontSize:10,flexShrink:0}}>{f.who}{f.date?' · '+f.date:''}</span>
                      </a>
                    );
                  })}
                </div>
              )
            )}
          </div>
        );
      })()}
    </div>
  );
}
