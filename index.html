          {bloc('🟠 En traitement — appel de service fait, facture à venir',enTraitement,'var(--warning)')}
        </div>
      )}
    </div>
  );
}

function AdminView({sid,calendarIds,refreshKey,notify,onRefresh,allowedTabs}){
  const [tab,setTab]=useState('dashboard');
  useEffect(()=>{
    if(allowedTabs&&!allowedTabs.includes(tab))setTab(allowedTabs[0]||'dashboard');
  },[allowedTabs?allowedTabs.join(','):'']);
  const [emps,setEmps]=useState([]);
  const [pts,setPts]=useState([]);
  const [banque,setBanque]=useState([]);
  const [jobs,setJobs]=useState([]);
  const [allJobs,setAllJobs]=useState([]); // fenêtre large (-180/+90j), pour le regroupement par Projets
  const [msgs,setMsgs]=useState([]);
  const [loading,setLoading]=useState(true);
  const [jobsFilterPrefix,setJobsFilterPrefix]=useState(null); // null = Tous, pour l'onglet "Par job"
  const [expandedEmpWeek,setExpandedEmpWeek]=useState(null); // nom de l'employé dont le détail hebdo est ouvert
  const [selEmp,setSelEmp]=useState('');
  const [histTab,setHistTab]=useState('semaine');
  const [parJobView,setParJobView]=useState('parjob'); // 'parjob' | 'historique' | 'factures' — sous-vues fusionnées de l'onglet "Par job"
  const [selectedJobForAppel,setSelectedJobForAppel]=useState(null); // job sélectionnée pour appel de service

  const today=localDateStr();
  const curWeek=getWeek(new Date());
  const curMois=getMois(new Date());

  useEffect(()=>{
    setLoading(true);
    Promise.all([getEmployees(sid),getPointages(sid,{}),getHeuresBanque(sid),getCalendarJobs(calendarIds),getAllCalendarJobs(calendarIds),getMessages(sid)])
      .then(([e,p,b,j,aj,m])=>{setEmps(e);setPts(p);setBanque(b);setJobs(j);setAllJobs(aj);setMsgs(m);setLoading(false);});
  },[refreshKey]);
  function refreshAgendaJobs(){
    getCalendarJobs(calendarIds).then(setJobs);
    getAllCalendarJobs(calendarIds).then(setAllJobs);
  }

  const eMap=Object.fromEntries(emps.map(e=>[e.nom,e]));

  function getHist(){
    let p=selEmp?pts.filter(x=>x.nom===selEmp):pts;
    if(histTab==='today')p=p.filter(x=>x.date===today);
    else if(histTab==='semaine')p=p.filter(x=>x.semaine===curWeek);
    else if(histTab==='mois')p=p.filter(x=>x.mois===curMois);
    const empNames=[...new Set(p.map(x=>x.nom))];
    const lines=[];
    for(const nom of empNames){
      const combined=combinePts(p.filter(x=>x.nom===nom));
      combined.forEach(l=>lines.push({...l,nom}));
    }
    return lines.sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,80);
  }

  // Compte les punchages (même filtre que getHist, mais sur TOUS les pointages,
  // pas seulement les 80 affichés) — Confirmer une job vs In/Out par employé.
  function getPunchStats(){
    let p=selEmp?pts.filter(x=>x.nom===selEmp):pts;
    if(histTab==='today')p=p.filter(x=>x.date===today);
    else if(histTab==='semaine')p=p.filter(x=>x.semaine===curWeek);
    else if(histTab==='mois')p=p.filter(x=>x.mois===curMois);
    const confirmCount=p.filter(x=>x.type==='confirm').length;
    const byEmp={};
    p.forEach(x=>{
      if(x.type==='in'||x.type==='out'){
        if(!byEmp[x.nom])byEmp[x.nom]={emp:eMap[x.nom]||null,nom:x.nom,count:0};
        byEmp[x.nom].count++;
      }
    });
    return{confirmCount,byEmp:Object.values(byEmp).sort((a,b)=>b.count-a.count)};
  }

  function getJobStats(){
    const map={};
    for(const p of pts){
      if(!p.job||(p.type!=='in'&&p.type!=='confirm'))continue;
      if(!map[p.job])map[p.job]={job:p.job,color:p.jobColor||'#ff7a1a',heures:0,deplacement:0,count:0,confirmCount:0,inOutCount:0,fichiers:[],lastDate:p.datetime||p.date||null};
      if(p.type==='confirm'){map[p.job].heures+=p.heures||0;map[p.job].confirmCount++;}
      else{
        // NOUVEAU — même correctif que pour le punch-out: on ne considère que les
        // OUT du MÊME employé ET de la MÊME job, on prend le plus proche (pas le
        // premier trouvé), et on ignore les écarts >24h (mauvais appariement ou
        // oubli de punch-out jamais fermé) pour éviter des heures aberrantes.
        const candidatsOut=pts.filter(o=>o.nom===p.nom&&o.type==='out'&&(o.job||'')===(p.job||'')&&new Date(o.datetime)>new Date(p.datetime));
        const matchOut=candidatsOut.sort((a,b)=>new Date(a.datetime)-new Date(b.datetime))[0];
        if(matchOut){
          const h=(new Date(matchOut.datetime)-new Date(p.datetime))/3600000;
          if(h>0&&h<24)map[p.job].heures+=Math.round(h*10)/10;
        }
        map[p.job].inOutCount++;
      }
      map[p.job].deplacement+=p.deplacement||0;map[p.job].count++;
      if(p.fichiersURL)p.fichiersURL.forEach(u=>map[p.job].fichiers.push(u));
      // Garder la date la plus récente d'activité sur cette job (pour trier "Par job" par récence)
      const pDate=p.datetime||p.date;
      if(pDate&&(!map[p.job].lastDate||new Date(pDate)>new Date(map[p.job].lastDate)))map[p.job].lastDate=pDate;
    }
    return Object.values(map).map(x=>({...x,heures:Math.round(x.heures*10)/10,prefix:getJobPrefix(x.job)})).sort((a,b)=>new Date(b.lastDate||0)-new Date(a.lastDate||0));
  }

  // Assignés d'une job — logique partagée (jobAssignees), standard partout.

    // Run all post-auth calls in parallel for speed
    const [empsData,,msgsData]=await Promise.allSettled([
      getEmployees(cur.spreadsheetId),
      ensureStructure(cur.spreadsheetId),
      boss?getMessages(cur.spreadsheetId):Promise.resolve([])
    ]);
    if(empsData.status==='fulfilled')setEmps(empsData.value||[]);
    if(boss&&msgsData.status==='fulfilled')setUnreadCount((msgsData.value||[]).filter(x=>!x.lu).length);
    setAuthed(true);setAuthLoading(false);
    notify('✅ '+email+(boss?' 👑 Admin':''),'success');
    onRefresh();
  }

  async function loadLibs(config){
    try{
      await initLibs(config,onToken);
      setLibsReady(true);
      const savedToken=sessionStorage.getItem('_oauth_token');
      if(savedToken){
        sessionStorage.removeItem('_oauth_token');
        gapi.client.setToken({access_token:savedToken});
        onToken({access_token:savedToken});
      } else {
      }
    }
    catch(e){
      console.error(e);
      notify('Erreur APIs Google','err');
    }
  }

  useEffect(()=>{if(cfg)loadLibs(cfg);},[cfg]);
  useEffect(()=>{
    if(authed&&cfg){
      getEmployees(cfg.spreadsheetId).then(e=>{
        setEmps(e);
        setRedirectLoading(false); // employees loaded — safe to show app
      });
    }
  },[refreshKey,authed]);

  // Refresh OAuth token — toutes les 45 min ET quand l'app revient au premier plan
  useEffect(()=>{
    if(!authed||!tokenClient)return;

    function refreshToken(){
      try{
        tokenClient.requestAccessToken({prompt:''});
        console.log('Token refreshed silently');
      }catch(e){console.log('Token refresh skipped:',e);}
    }

    // Timer régulier toutes les 45 min
    const interval=setInterval(refreshToken, 45*60*1000);

    // Vérifier quand l'app revient au premier plan (tab visible, app ouverte)
    function onVisible(){
      if(document.visibilityState==='visible'){
        const token=gapi.client.getToken();
        // Si plus de token ou token qui date de plus de 50 min, rafraîchir
        if(!token||!token.access_token){
          refreshToken();
        }
      }
    }
    document.addEventListener('visibilitychange', onVisible);

    return()=>{clearInterval(interval);document.removeEventListener('visibilitychange',onVisible);};
  },[authed]);

  // Intercepter les erreurs 401 des appels API — reforcer auth si nécessaire
  useEffect(()=>{
    if(!authed)return;
    const origFetch=window.fetch;
    window.fetch=async function(...args){
      const res=await origFetch(...args);
      if(res.status===401){
        console.warn('401 detected — token expired, refreshing...');
        if(tokenClient)tokenClient.requestAccessToken({prompt:''});
      }
      return res;
    };
    return()=>{window.fetch=origFetch;};
  },[authed]);

  function handleAuth(){
    if(!libsReady){notify('APIs en chargement...','warn');return;}
    if(isIOS()||isPWA()){
      doRedirectAuth(cfg.clientId);
    }else{
      setAuthLoading(true);
      setTimeout(()=>setAuthLoading(false),120000);
      try{tokenClient.requestAccessToken({prompt:'select_account'});}
      catch(e){setAuthLoading(false);notify('Erreur connexion','err');}
    }
  }
  function handleSaveCfg(config){
    localStorage.setItem('pp_cfg',JSON.stringify(config));
    setCfg(config);setShowCfg(false);setAuthed(false);setLibsReady(false);tokenClient=null;loadLibs(config);
  }
  function handleSwitch(){
    setAuthed(false);setUserEmail('');setIsBoss(false);setAuthLoading(true);setMenuAction(null);
    tokenClient.requestAccessToken({prompt:'select_account'});
  }
  function handleReset(){
    if(!confirm('Réinitialiser?'))return;
    localStorage.removeItem('pp_cfg');setCfg(null);setAuthed(false);setShowCfg(true);setLibsReady(false);tokenClient=null;setMenuAction(null);
  }

  return(
    <div className="app-wrap">
      {updateAvailable&&(
        <div style={{flexShrink:0,zIndex:9998,background:'var(--accent)',color:'#fff',padding:'0.5rem 0.9rem',display:'flex',alignItems:'center',justifyContent:'center',gap:10,fontSize:12,fontWeight:600}}>
          <span>🔄 Une nouvelle version de PunchPro est disponible</span>
          <button style={{background:'#fff',color:'var(--accent)',border:'none',borderRadius:6,padding:'0.25rem 0.7rem',fontSize:12,fontWeight:700,cursor:'pointer',touchAction:'manipulation'}} onClick={()=>window.location.reload()}>
            Actualiser
          </button>
        </div>
      )}
      {showCfg&&<ConfigScreen cfg={cfg||DEFAULT_CFG} sid={(cfg||DEFAULT_CFG).spreadsheetId} notify={notify} onRefresh={onRefresh} onClose={()=>setShowCfg(false)}/>}
      {notif&&<Notif key={notif.id} msg={notif.msg} type={notif.type} onClose={()=>setNotif(null)}/>}

      {/* Sidebar overlay */}
      {showSidebar&&<div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.5)',zIndex:200,touchAction:'manipulation'}} onClick={()=>setShowSidebar(false)}></div>}
      {/* Sidebar panel */}
      <div style={{position:'fixed',top:0,left:0,width:240,height:'100vh',background:'var(--bg2)',borderRight:'1px solid var(--border)',zIndex:201,transform:showSidebar?'translateX(0)':'translateX(-100%)',transition:'transform 0.25s ease',display:'flex',flexDirection:'column',padding:'1rem'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1.25rem'}}>
          <div style={{fontFamily:'var(--font-head)',fontWeight:700,fontSize:'0.9rem'}}>Menu</div>
          <button style={{background:'none',border:'none',color:'var(--muted)',fontSize:18,cursor:'pointer',touchAction:'manipulation'}} onClick={()=>setShowSidebar(false)}>✕</button>
        </div>
        {authed&&(
          <>
            <div style={{background:'var(--bg3)',borderRadius:8,padding:'0.6rem 0.75rem',marginBottom:'1rem'}}>
              <div style={{fontSize:11,color:'var(--muted)',marginBottom:2}}>Connecté</div>
              <div style={{fontSize:12,fontWeight:600,wordBreak:'break-all'}}>{userEmail}</div>
            </div>
            <button className="btn-s" style={{width:'100%',marginBottom:'0.5rem',touchAction:'manipulation'}} onClick={()=>{onRefresh();setShowSidebar(false);}}>↻ Rafraîchir</button>
            <button className="btn-s" style={{width:'100%',marginBottom:'0.5rem',touchAction:'manipulation',
              background:desktopMode?'var(--accent)':'var(--bg3)',color:desktopMode?'#fff':'var(--text)'}}
              onClick={()=>setDesktopModePref(!desktopMode)}>
              {desktopMode?'🖥️ Mode bureau: ON':'🖥️ Mode bureau: OFF'}
            </button>
            <button className="btn-s" style={{width:'100%',marginBottom:'0.5rem',touchAction:'manipulation',
              background:lightTheme?'var(--accent)':'var(--bg3)',color:lightTheme?'#fff':'var(--text)'}}
              onClick={()=>setThemePref(!lightTheme)}>
              {lightTheme?'☀️ Mode clair':'🌙 Mode sombre'}
            </button>
            <button className="btn-s" style={{width:'100%',marginTop:'auto',color:'var(--danger)',borderColor:'var(--danger)',touchAction:'manipulation'}} onClick={()=>{handleReset();setShowSidebar(false);}}>↩ Déconnexion</button>
          </>
        )}
        <div style={{fontSize:9,color:'var(--muted)',fontFamily:'monospace',marginTop:'auto',paddingTop:'0.5rem'}}>{APP_VERSION}</div>
      </div>

      {/* Écran de chargement complet pendant le redirect OAuth */}
      {redirectLoading&&(
        <div style={{position:'fixed',inset:0,background:'var(--bg)',zIndex:9999,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:'1.5rem'}}>
          <img src="logo.png" alt="" style={{width:120,opacity:0.9}} onError={e=>e.target.style.display='none'}/>
          <div style={{textAlign:'center'}}>
            <div style={{fontFamily:'var(--font-head)',fontWeight:800,fontSize:'1.2rem',marginBottom:'0.5rem'}}>Connexion en cours...</div>
            <div style={{color:'var(--muted)',fontSize:13}}>Veuillez patienter</div>
          </div>
          <div style={{display:'flex',gap:6}}>
            {[0,1,2].map(i=>(
              <div key={i} style={{width:8,height:8,borderRadius:'50%',background:'var(--accent)',animation:'pulse 1.2s ease-in-out '+(i*0.2)+'s infinite'}}/>
            ))}
          </div>
        </div>
      )}

      {/* Minimal topbar */}
      <div className="topbar">
        <div className="topbar-left">
          {navBack
            ?<button className="back-btn" onClick={navBack} style={{touchAction:'manipulation'}}>← Retour</button>
            :<div style={{display:'flex',alignItems:'center',gap:6,minWidth:0}}>
              <img src="logo.png" alt="" style={{width:30,height:30,objectFit:'contain',flexShrink:0,borderRadius:8,background:'#000',padding:2}} onError={e=>e.target.style.display='none'}/>
              <div className="logo">Saran Électrique</div>
              <span style={{fontSize:8,color:'var(--muted)',fontFamily:'monospace',flexShrink:0}}>{APP_VERSION}</span>
            </div>
          }
        </div>
        <div className="topbar-right">
          {!authed&&(
            <button onClick={handleAuth} disabled={authLoading||!libsReady}
              style={{background:'#fff',border:'none',borderRadius:8,padding:'0.3rem',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',width:34,height:34,flexShrink:0,touchAction:'manipulation',opacity:authLoading?0.5:1}}>
              {authLoading
                ?<span style={{fontSize:14}}>⏳</span>
                :<svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/><path fill="none" d="M0 0h48v48H0z"/></svg>
              }
            </button>
          )}
          {menuAction&&view==='punch'&&(
            <button style={{background:'none',border:'1px solid var(--border)',borderRadius:8,padding:'0.3rem 0.7rem',color:'var(--text)',cursor:'pointer',fontSize:12,fontWeight:600,touchAction:'manipulation',display:'flex',alignItems:'center',gap:5,height:34,flexShrink:0}} onClick={menuAction}>
              🏠 Menu
            </button>
          )}
          <button style={{background:'none',border:'1px solid var(--border)',borderRadius:8,padding:'0.3rem 0.6rem',color:'var(--text)',cursor:'pointer',fontSize:16,touchAction:'manipulation',display:'flex',alignItems:'center',justifyContent:'center',width:34,height:34,flexShrink:0}} onClick={()=>setShowSidebar(true)}>
            ☰
          </button>
        </div>
      </div>
      {!authed?(
        <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',flex:1,padding:'2.5rem 1.5rem',textAlign:'center',position:'relative',overflow:'hidden'}}>
          <div style={{position:'absolute',inset:0,backgroundImage:"url('bg-logo.png')",backgroundRepeat:'no-repeat',backgroundPosition:'center center',backgroundSize:'85%',opacity:0.25,pointerEvents:'none'}}></div>
          <img src="logo.png" alt="Saran Électrique" style={{width:160,height:'auto',objectFit:'contain',marginBottom:'1.25rem',position:'relative',zIndex:1}} onError={e=>e.target.style.display='none'}/>
          <div style={{fontFamily:'var(--font-head)',fontSize:'1.4rem',fontWeight:800,marginBottom:'0.25rem',position:'relative',zIndex:1}}>Saran Électrique</div>
          <div style={{color:'var(--muted)',fontSize:'0.85rem',marginBottom:'2rem',position:'relative',zIndex:1}}>Système de gestion du temps</div>
          <button className="btn-p" style={{width:'auto',padding:'0.75rem 2rem',marginTop:0,position:'relative',zIndex:1,fontSize:'0.95rem'}} onClick={handleAuth} disabled={authLoading||!libsReady||returningFromRedirect}>
            {authLoading||returningFromRedirect?'⏳ Connexion en cours...':'🔐 Se connecter avec Google'}
          </button>
          {(authLoading||returningFromRedirect)&&(
            <div style={{background:'rgba(255,122,26,0.1)',border:'1px solid var(--accent)',borderRadius:10,padding:'0.75rem 1rem',marginTop:'0.75rem',position:'relative',zIndex:1,maxWidth:280}}>
              <div style={{fontSize:13,fontWeight:600,color:'var(--accent)',marginBottom:4}}>⏳ Connexion en cours...</div>
              <div style={{fontSize:11,color:'var(--muted)'}}>Veuillez patienter quelques secondes. Ne réappuyez pas sur le bouton.</div>
            </div>
          )}
          {!libsReady&&!returningFromRedirect&&!authLoading&&<div style={{color:'var(--muted)',fontSize:11,marginTop:'0.75rem',position:'relative',zIndex:1}}>⏳ Chargement des APIs...</div>}
        </div>
      ):(
        <>
          {!forceAdmin&&<WelcomeScreen emps={emps} sid={cfg.spreadsheetId} calendarIds={calendarIdsMemo} notify={notify} onRefresh={onRefresh} setNavBack={setNavBack} setMenuAction={setMenuAction} folders={foldersMemo} refreshKey={refreshKey} cfg={cfg}/>}
          {forceAdmin&&<div className="content"><AdminView sid={cfg.spreadsheetId} calendarIds={calendarIdsMemo} refreshKey={refreshKey} notify={notify} onRefresh={onRefresh}/></div>}
        </>
      )}
    </div>
  );
}

// Service worker minimal — permet d'afficher des notifications locales
// (alerte "punch out oublié") et rend l'app installable comme PWA.
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW non enregistré:',e));
  });
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
